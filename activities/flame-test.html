<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flame Test &amp; Line Spectra Lab</title>
<style>
:root{--bg:#070a12;--panel:#0f1522;--panel2:#161e30;--line:#26314b;--text:#eef3ff;--muted:#a9b6d3;--accent:#ffd166;--ok:#3ddc84;--bad:#ff8080;--focus:#7cc4ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.4}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:#0b101b;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:1.25rem;margin:0;white-space:nowrap}
.mswitch{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;border:2px solid var(--line);background:var(--panel);font-weight:700;font-size:1.05rem;user-select:none;touch-action:manipulation}
.mswitch .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .25s ease}
.mswitch[aria-checked="true"] .knob{transform:translateX(100%)}
.mswitch span{position:relative;z-index:1;padding:7px 18px;text-align:center;white-space:nowrap;transition:color .25s}
.mswitch[aria-checked="false"] .m-l,.mswitch[aria-checked="true"] .m-r{color:#1b1300}
.mswitch[aria-checked="false"] .m-r,.mswitch[aria-checked="true"] .m-l{color:var(--muted)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog span{font-weight:700}
.bar{width:150px;height:12px;background:#222c42;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ddc84,#ffd166);transition:width .4s}
main{max-width:1400px;margin:0 auto;padding:12px;display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ph h2{font-size:1.05rem;margin:0;color:var(--accent);letter-spacing:.02em}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:12px}
canvas{display:block;width:100%;border-radius:10px}
#benchCv,#bohrCv{height:330px;touch-action:manipulation}
#specCv{height:226px;touch-action:pan-y;cursor:crosshair}
#specCv.ref{height:300px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row+.row{margin-top:8px}
.lbl{font-weight:700;color:var(--muted);min-width:96px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;min-width:74px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);line-height:1.15}
.chip b{font-size:1.05rem}
.chip small{font-size:.75rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:#2a2a1c}
.chip.unk{border-style:dashed}
.chip.solved{border-color:var(--ok);border-style:solid}
.chip.solved small{color:var(--ok)}
.btn{padding:7px 14px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);font-weight:700}
.btn[aria-pressed="true"]{background:#2441b8;border-color:#6d8bff}
.btn.primary{background:var(--accent);color:#1b1300;border-color:var(--accent)}
.btn.warn{border-color:#c0504d}
select.sel{padding:6px 8px;border-radius:8px;background:#0e1525;border:1px solid var(--line)}
.obs{margin:6px 2px 0;color:var(--muted);min-height:2.6em}
.obs b{color:var(--text)}
.cvwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:#0b1222f0;border:1px solid #3a4a70;border-radius:8px;padding:6px 9px;font-size:.88rem;max-width:310px;z-index:3}
.tip[hidden]{display:none}
.legend{margin:6px 2px 0;color:var(--muted);font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ucard{background:var(--panel2);border:2px dashed var(--line);border-radius:12px;padding:10px}
.ucard.solved{border:2px solid var(--ok)}
.ucard.cur{box-shadow:0 0 0 2px var(--accent) inset}
.ucard h3{margin:0 0 6px;font-size:1.05rem;display:flex;justify-content:space-between;gap:6px}
.ucard h3 small{font-weight:400;color:var(--muted);font-size:.85rem}
.ucard .acts{display:flex;gap:8px;margin-top:6px}
.ucard select{width:100%;padding:7px;border-radius:8px;background:#0e1525;border:1px solid var(--line);margin-top:6px}
.ucard .q{font-size:.9rem;color:var(--muted)}
.fb{margin:6px 0 0;font-size:.92rem;min-height:1.2em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)} .fb.info{color:var(--accent)}
.done{display:none;margin:0 0 8px;padding:10px 12px;border-radius:10px;background:#123522;border:1px solid var(--ok);font-weight:700}
.done.show{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;max-width:760px;width:100%;max-height:96vh;overflow:auto}
.mbox h2{margin:0 0 8px;color:var(--accent);font-size:1.15rem}
.mbox canvas{width:100%;height:auto;background:#fff}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#cardMsg{color:var(--muted);margin:8px 0 0;min-height:1.2em}
body:has(#ct-bar.pos-tl) .top{padding-left:58px}
@media (max-width:820px){.grid{grid-template-columns:1fr}.prog{margin-left:0}}
@media (max-height:700px){#benchCv,#bohrCv{height:270px}.top{position:static;padding:6px 12px}.top h1{font-size:1.1rem}.mswitch span{padding:5px 14px}}
@media (max-width:520px){html,body{font-size:16px}.lbl{min-width:0;width:100%}#benchCv,#bohrCv{height:260px}.top h1{font-size:1.1rem}}
</style>
</head>
<body>
<header class="top">
  <h1>Flame Test &amp; Line Spectra Lab</h1>
  <button class="mswitch" id="modeSwitch" role="switch" aria-checked="false" aria-label="Mode: Lamp or Flame Test">
    <i class="knob" aria-hidden="true"></i><span class="m-l">💡 Lamp</span><span class="m-r">🔥 Flame Test</span>
  </button>
  <div class="prog">
    <span id="progText">Unknowns: 0 / 7</span>
    <div class="bar" aria-hidden="true"><i id="progBar"></i></div>
    <button class="btn primary" id="cardBtn" hidden>Score card</button>
  </div>
</header>

<main>
  <section class="panel" aria-label="Samples">
    <div class="row"><span class="lbl" id="knownLbl">Known salts</span><div class="chips" id="knownChips"></div></div>
    <div class="row"><span class="lbl">Unknowns</span><div class="chips" id="unkChips"></div></div>
  </section>

  <div class="grid">
    <section class="panel">
      <div class="ph"><h2 id="benchTitle">Bunsen Burner</h2><div class="ctrls" id="benchCtrls"></div></div>
      <canvas id="benchCv" aria-label="Light source"></canvas>
      <p class="obs" id="obsText" aria-live="polite"></p>
    </section>
    <section class="panel">
      <div class="ph"><h2>Inside the Atom</h2>
        <div class="ctrls">
          <button class="btn" id="pauseBtn" aria-pressed="false">Pause</button>
          <select class="sel" id="speedSel" aria-label="Animation speed">
            <option value="0.5">Slow</option><option value="1" selected>Normal</option><option value="2">Fast</option>
          </select>
        </div>
      </div>
      <canvas id="bohrCv" aria-label="Bohr model and energy levels"></canvas>
      <p class="obs" id="bohrText" aria-live="polite"></p>
    </section>
  </div>

  <section class="panel">
    <div class="ph"><h2>Spectroscope</h2>
      <div class="ctrls"><label for="refSel">Compare to</label><select class="sel" id="refSel"></select></div>
    </div>
    <div class="cvwrap"><canvas id="specCv" aria-label="Emission spectrum 380 to 780 nanometers with zoom strip"></canvas><div class="tip" id="tip" hidden></div></div>
    <p class="legend" id="legend"></p>
  </section>

  <section class="panel">
    <div class="done" id="doneBar"><span>✓ Lab complete — all 7 unknowns identified!</span><button class="btn primary" id="doneCardBtn">Open score card</button></div>
    <div class="ph"><h2 id="unkTitle">Identify the Unknowns</h2><button class="btn warn" id="newUnkBtn">New unknowns</button></div>
    <div class="cards" id="unkCards"></div>
  </section>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mbox">
    <h2 id="mTitle">Score Card</h2>
    <canvas id="cardCv" width="1000" height="640"></canvas>
    <div class="mbtns">
      <button class="btn primary" id="dlBtn">Download PNG</button>
      <button class="btn" id="copyBtn">Copy image</button>
      <button class="btn" id="mailBtn">Email via Gmail</button>
      <button class="btn" id="closeBtn">Close</button>
    </div>
    <p id="cardMsg"></p>
  </div>
</div>

<script>
(()=>{
'use strict';
/* ================= constants & helpers ================= */
const H=6.626e-34, C=3.00e8, EV=1.602e-19, LMIN=380, LMAX=780, ZOOMW=16;
const FONT='"Atkinson Hyperlegible", system-ui, sans-serif';
const URL_TXT='chemistryteacher.net/flame-test';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const mix=(c1,c2,t)=>[0,1,2].map(i=>Math.round(lerp(c1[i],c2[i],t)));
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sci(x,d=2){let e=Math.floor(Math.log10(Math.abs(x)));let m=x/Math.pow(10,e);if(+m.toFixed(d)>=10){m/=10;e++;}return m.toFixed(d)+' × 10'+String(e).split('').map(c=>SUP[c]).join('');}
const ephJ=l=>H*C/(l*1e-9);
const ephEV=l=>ephJ(l)/EV;
function wlRGB(l){let r=0,g=0,b=0;
  if(l<440){r=-(l-440)/60;b=1}else if(l<490){g=(l-440)/50;b=1}else if(l<510){g=1;b=-(l-510)/20}
  else if(l<580){r=(l-510)/70;g=1}else if(l<645){r=1;g=-(l-645)/65}else{r=1}
  let f=l<420?.3+.7*(l-380)/40:l>700?.3+.7*(780-l)/80:1;f=clamp(f,0,1);
  return [r,g,b].map(c=>Math.round(255*Math.pow(clamp(c*f,0,1),.8)));}
const rgbStr=(a,al=1)=>`rgba(${a[0]},${a[1]},${a[2]},${al})`;
function hexRGB(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function colorName(l){if(l<450)return'violet';if(l<485)return'blue';if(l<500)return'blue-green';if(l<565)return'green';if(l<588)return'yellow';if(l<595)return'yellow-orange';if(l<625)return'orange';if(l<700)return'red';return'deep red';}
function cobaltT(l){if(l<455)return .85;if(l<520)return .85-.83*(l-455)/65;if(l<635)return .02;if(l<700)return .02+.78*(l-635)/65;return .8;}
function bandI(b,l,fine){
  if(b.shade==='v'){if(l>b.c+1.2||l<b.c-b.w*7)return 0;
    let v=l<=b.c?Math.exp(-(b.c-l)/b.w):Math.exp(-Math.pow((l-b.c)/.18,2));
    if(fine)v*=.4+.6*Math.pow(Math.cos(Math.PI*(b.c-l)/.32),2);return b.i*v;}
  const d=(l-b.c)/b.w;return d>-4&&d<4?b.i*Math.exp(-.5*d*d):0;}
function planck(l,T){const x=0.014388/(l*1e-9*T);return 1/(Math.pow(l*1e-9,5)*(Math.exp(x)-1));}
const BB_MAX=planck(780,2800), bbNorm=l=>planck(l,2800)/BB_MAX;
function randn(){return (Math.random()+Math.random()+Math.random()-1.5)*1.4;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// soft round sprite cache (tinted), used for glows and flame particles
const spriteCache=new Map();
function sprite(rgb){const q=rgb.map(v=>clamp(Math.round(v/8)*8,0,255));const k=q.join(',');let c=spriteCache.get(k);if(c)return c;
  c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,`rgba(${k},1)`);gr.addColorStop(.3,`rgba(${k},.6)`);gr.addColorStop(.65,`rgba(${k},.18)`);gr.addColorStop(1,`rgba(${k},0)`);
  g.fillStyle=gr;g.fillRect(0,0,64,64);if(spriteCache.size>400)spriteCache.clear();spriteCache.set(k,c);return c;}
function glow(ctx,x,y,r,rgb,a){if(a<=0)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(sprite(rgb),x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}

/* ================= data =================
   Lamp lines: wavelengths (air) and relative intensities from the NIST Handbook of Basic Atomic Spectroscopic Data
   (strong-lines tables); displayed brightness = (I/Imax)^0.45 to mimic how the eye/a camera compresses bright lines.
   lo = energy (eV) of the LOWER level of the transition (0 = ground state); cas = what happens after:
   a number = a visible cascade photon (nm), a string = an invisible photon, '' = metastable level (no photon right away). */
const ELEM={H:{ie:13.598,sh:[1]},He:{ie:24.587,sh:[2]},Li:{ie:5.392,sh:[2,1]},Ne:{ie:21.565,sh:[2,8]},Na:{ie:5.139,sh:[2,8,1]},
  K:{ie:4.341,sh:[2,8,8,1]},Ca:{ie:6.113,sh:[2,8,8,2]},Cu:{ie:7.726,sh:[2,8,18,1]},Sr:{ie:5.695,sh:[2,8,18,8,2]},
  Ba:{ie:5.212,sh:[2,8,18,18,8,2]},Hg:{ie:10.438,sh:[2,8,18,32,18,2]},
  Ar:{ie:15.760,sh:[2,8,8]},'Ar+':{ie:27.630,sh:[2,8,7],ion:true,lab:'Ar⁺'},
  Xe:{ie:12.130,sh:[2,8,18,18,8]},'Xe+':{ie:20.975,sh:[2,8,18,18,7],ion:true,lab:'Xe⁺'},
  N2:{ie:15.581,sh:[2,5],dia:true,lab:'N₂'},'N2+':{ie:27.3,sh:[2,5],dia:true,ion:true,lab:'N₂⁺'}};
const labOf=el=>(ELEM[el]&&ELEM[el].lab)||el;
const Ln=(l,d,lo=0,cas=null,el)=>({l,d,lo,cas,el});
function nist(arr,el){const m=Math.max(...arr.map(a=>a[1]));return arr.map(([l,i,lo=0,cas=null,e])=>Ln(l,Math.pow(i/m,.45),lo,cas,e||el));}
const NE_RAW=[[453.8,100],[470.4,150],[470.9,120],[471.0,100],[471.2,150],[471.5,150],[475.3,50],[478.9,100],[479.0,50],[482.7,100],[488.5,100],
  [500.5,50],[503.8,50],[514.5,50],[533.1,60],[534.1,100],[534.3,60],[540.1,200],[556.3,50],[565.7,50],[571.9,50],[574.8,50],[576.4,70],
  [580.4,50],[582.0,50],[585.2,200],[587.3,50],[588.2,100],[594.5,50],[596.5,50],[597.5,50],[597.6,60],[603.0,100],[607.4,100],[609.6,30],
  [614.3,100],[616.4,100],[621.7,100],[626.6,100],[632.8,30],[633.4,100],[638.3,100],[640.2,200],[650.7,150],[659.9,100],[667.8,50],
  [692.9,1000],[702.4,300],[703.2,800],[705.9,100],[717.4,800],[724.5,800],[747.2,30],[748.9,300],[753.6,300],[754.4,130]]
  .map(([l,i])=>l<530?[l,i,18.6,'more drops (orange-red light, then UV)']:[l,i,16.7,'UV ≈ 74 nm']);
// Argon & xenon: neutral-atom (Ar I, Xe I) and singly-ionized (Ar II, Xe II) lines from the NIST Handbook tables.
// Lower-level energies for these are grouped approximately (Ar I 4s ≈ 11.6 eV, Ar⁺ 4s ≈ 16.9 eV, Xe I 6s ≈ 8.6 eV, Xe⁺ 6s ≈ 11.0 eV).
const AR1=(l,i)=>[l,i,11.6,'UV ≈ 105 nm','Ar'], AR2=(l,i)=>[l,i,16.9,'UV ≈ 72–93 nm','Ar+'];
const XE1=(l,i)=>[l,i,8.6,'UV ≈ 147 nm','Xe'], XE2=(l,i)=>[l,i,11.0,'UV ≈ 100 nm','Xe+'];
const AR_RAW=[AR1(415.9,11),AR1(419.8,6),AR1(420.1,11),AR1(425.9,6),AR1(427.2,4),AR1(430.0,3),AR1(433.4,3),AR1(451.1,3),AR1(667.7,3),AR1(675.3,4),
  AR1(687.1,4),AR1(696.5,300),AR1(703.0,4),AR1(706.7,300),AR1(714.7,30),AR1(727.3,60),AR1(737.2,6),AR1(738.4,300),AR1(750.4,600),AR1(751.5,400),
  AR1(763.5,700),AR1(772.4,700),
  AR2(404.3,50),AR2(407.2,70),AR2(410.4,50),AR2(413.2,100),AR2(427.8,200),AR2(433.1,70),AR2(434.8,250),AR2(437.1,70),AR2(438.0,50),AR2(440.1,70),
  AR2(442.6,130),AR2(443.0,50),AR2(448.2,70),AR2(454.5,130),AR2(457.9,130),AR2(459.0,130),AR2(461.0,200),AR2(465.8,130),AR2(472.7,200),
  AR2(473.6,100),AR2(476.5,250),AR2(480.6,200),AR2(484.8,50),AR2(488.0,250),AR2(496.5,70),AR2(617.2,50)];
const XE_RAW=[XE1(473.4,60),XE1(479.3,15),XE1(480.7,50),XE1(483.0,40),XE1(484.3,30),XE1(491.7,50),XE1(492.3,50),XE1(502.8,20),XE1(631.8,50),
  XE1(647.0,30),XE1(712.0,50),XE1(764.2,50),
  XE2(418.0,300),XE2(419.3,150),XE2(429.6,150),XE2(431.1,150),XE2(433.1,300),XE2(439.3,150),XE2(439.6,150),XE2(444.8,150),XE2(446.2,300),
  XE2(448.1,150),XE2(484.4,700),XE2(508.1,300),XE2(526.0,150),XE2(526.2,150),XE2(529.2,700),XE2(531.4,300),XE2(533.9,700),XE2(537.2,150),
  XE2(541.9,1000),XE2(543.9,250),XE2(547.3,300),XE2(553.1,200),XE2(566.8,200),XE2(572.7,150),XE2(575.1,150),XE2(594.6,150),XE2(597.6,700),
  XE2(603.6,300),XE2(605.1,700),XE2(609.4,200),XE2(609.8,500),XE2(619.4,150),XE2(627.1,150),XE2(635.6,200),XE2(659.5,300),XE2(680.6,300),
  XE2(694.2,250),XE2(699.1,700),XE2(716.5,150)];
// Nitrogen (N₂ molecule): band heads (nm) of the Second Positive System (C→B, violet/blue), First Positive System (B→A, red/orange)
// and N₂⁺ First Negative System; every band is sharp at its head and shaded toward the violet.
const NB=(c,i,sys)=>sys==='2'?{c,w:1.6,i,m:'N₂',shade:'v',lo:7.353,cas:662.4,el:'N2'}
  :sys==='1'?{c,w:2.2,i,m:'N₂',shade:'v',lo:6.169,cas:'',el:'N2'}:{c,w:1.2,i,m:'N₂⁺',shade:'v',lo:0,cas:null,el:'N2+'};
const N2_BANDS=[NB(380.5,1,'2'),NB(394.3,.35,'2'),NB(399.8,.7,'2'),NB(405.9,.55,'2'),NB(420.0,.35,'2'),NB(426.9,.4,'2'),NB(434.4,.35,'2'),
  NB(441.7,.15,'2'),NB(449.0,.2,'2'),NB(457.4,.2,'2'),NB(466.7,.12,'2'),NB(391.4,.85,'+'),NB(427.8,.45,'+'),
  ...[[580.4,.45],[585.4,.5],[590.6,.55],[595.9,.55],[601.4,.5],[606.9,.5],[612.7,.45],[618.7,.4],[625.3,.45],[632.3,.55],[639.5,.6],
     [646.9,.65],[654.5,.7],[662.4,.75],[670.5,.7],[678.9,.6],[687.5,.5],[705.9,.35],[716.5,.35],[727.3,.35],[738.7,.4],[750.4,.45],

/* ---------- Bohr model ---------- */
const BO={delay:[],tr:null,step:0,t:0,ang:0,rot:0,photons:[],hist:[],queue:null,idle:.3,emitT:0,geo:null,lat:[],cap:''};

function makeTransition(s,f){

    return {l:253.7,vis,phos:true,m:f.b.m,E:ephJ(253.7),eph,lo:0,up:eph,cas:null,el:'Hg',ie:ELEM.Hg.ie,mol:false,hm:false,nU:0,
      steps:[{d:.55,a:r0,b:rU},{d:.38,a:rU,b:rU},{d:.42,a:rU,b:r0,emit:'main'},{d:.8,a:r0,b:r0}],rgb:[175,160,240],col:'rgba(175,160,240,.95)'};}
  if(f.t==='band'){mol=true;m=f.b.m;lo=f.b.lo||0;cas=f.b.cas!=null?f.b.cas:null;el=f.b.el||elOf(s);

function emitPhoton(kind){

    setBohrText(BO.cap);return;}
  if(kind==='main'){

function bohrUpdate(dt){

    BO.photons.push({x:g.cx+Math.cos(d.a)*g.R*1.02,y:g.cy+Math.sin(d.a)*g.R*1.02,a:d.a,d:0,uv:false,col:rgbStr(c),rgb:c,l:d.l,lbl:d.l.toFixed(0)+' nm',age:0});
    S.pulses.push({l:d.l,age:0,a:1});return false;});
  if(!s||!on||S.paused)return;
  if(s.continuous){BO.emitT-=sp;if(BO.emitT<=0||BO.queue){BO.emitT=.2;
      const l=BO.queue?BO.queue.l:sampleBB();BO.queue=null;
      if(BO.lat.length){const p=BO.lat[Math.floor(Math.random()*BO.lat.length)],a=Math.random()*6.283,c=wlRGB(l);
        BO.photons.push({x:p.x,y:p.y,a,d:0,uv:false,col:rgbStr(c),rgb:c,l,lbl:l.toFixed(0)+' nm',age:0});S.pulses.push({l,age:0,a:1});}}

function sampleBB(){for(let i=0;i<60;i++){const l=LMIN+Math.random()*(LMAX-LMIN);if(Math.random()<bbNorm(l))return l;}return 700;}

function checkUnknown(u){
  if(!u.pick){u.msg='Choose an answer first.';u.cls='info';renderCards();return;}
  if(!u.viewed){u.msg=u.mode==='flame'?'Test it first — put it in the flame and look at the spectrum.':'Test it first — load the tube and look at the spectrum.';u.cls='info';renderCards();return;}
  if(u.mixture&&u.pick==='NaK'&&!u.cobaltSeen){u.msg='Good thinking — now prove it: look at Mixture M through the cobalt blue glass.';u.cls='info';renderCards();return;}
  u.tries++;
  if(u.pick===u.ans){u.solved=true;u.msg=u.mixture?'✓ Correct! The cobalt glass blocks sodium’s yellow, so potassium’s violet shows through.':'✓ Correct!';u.cls='ok';}
  else{u.cls='bad';
    if(u.mixture)u.msg=u.pick==='Na'?'Sodium’s yellow is so bright it can hide other colors. Look through the cobalt glass.':'Not quite. With the cobalt glass blocking the yellow, what color is left? Compare it with the known salts through the glass.';
    else{const key=[u.pick,u.ans].sort().join('|');u.msg='✗ '+(HINTS[key]||'Not a match. Use “Compare to” to line up its spectrum with each known.');}}
  save();renderCards();renderChips();renderProgress();
  if(S.unk.every(x=>x.solved)&&!S.doneAt){S.doneAt=Date.now();save();}
  if(S.unk.every(x=>x.solved)&&!S.shownDone){S.shownDone=true;save();openCard();}
}

  S.loopT=1;bohrReset();renderAll();});

/* ================= Score card ================= */
function drawCard(){
  const cv=$('cardCv'),ctx=cv.getContext('2d'),W=1000,rows=S.unk.length,Hh=300+rows*46;cv.width=W;cv.height=Hh;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,Hh);ctx.fillStyle='#0f1626';ctx.fillRect(0,0,W,118);
  for(let i=0;i<W;i++){ctx.fillStyle=rgbStr(wlRGB(LMIN+i/W*(LMAX-LMIN)));ctx.fillRect(i,118,1,10);}
  ctx.fillStyle='#fff';ctx.font='700 38px '+FONT;ctx.fillText('Flame Test & Line Spectra Lab',36,58);
  ctx.fillStyle='#ffd166';ctx.font='22px '+FONT;ctx.fillText(URL_TXT,36,96);
  ctx.fillStyle='#111';ctx.font='700 28px '+FONT;ctx.fillText('Score Card',36,172);
  const when=new Date(S.doneAt||Date.now());
  ctx.font='20px '+FONT;ctx.fillStyle='#333';ctx.fillText(when.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})+' · '+when.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}),36,204);
  const n=S.unk.filter(u=>u.solved).length,tot=S.unk.reduce((a,u)=>a+u.tries,0);
  ctx.fillStyle=n===7?'#127a3e':'#a33';ctx.font='700 30px '+FONT;ctx.textAlign='right';ctx.fillText(n===7?'LAB COMPLETE ✓':'In progress',W-36,172);
  ctx.fillStyle='#111';ctx.font='700 24px '+FONT;ctx.fillText(`Unknowns identified: ${n} / 7`,W-36,206);ctx.textAlign='left';
  ctx.strokeStyle='#ddd';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(36,226);ctx.lineTo(W-36,226);ctx.stroke();
  S.unk.forEach((u,i)=>{const y=262+i*46;ctx.fillStyle=u.solved?'#127a3e':'#a33';ctx.font='700 26px '+FONT;ctx.fillText(u.solved?'✓':'✗',40,y);
    ctx.fillStyle='#111';ctx.font='700 21px '+FONT;ctx.fillText((u.mode==='flame'?'Flame ':'Lamp ')+u.label,80,y);
    ctx.font='21px '+FONT;ctx.fillStyle='#333';ctx.fillText(u.solved?answerName(u)+(u.mixture?' (cobalt glass)':''):'not yet identified',300,y);
    ctx.textAlign='right';ctx.fillStyle='#666';ctx.font='18px '+FONT;ctx.fillText(u.tries+(u.tries===1?' check':' checks'),W-36,y);ctx.textAlign='left';});
  ctx.fillStyle='#666';ctx.font='18px '+FONT;ctx.fillText(`Total answer checks: ${tot}`,36,Hh-24);
  return cv;}
function openCard(){drawCard();$('cardMsg').textContent='';$('modal').hidden=false;$('dlBtn').focus();}
$('cardBtn').addEventListener('click',openCard);$('doneCardBtn').addEventListener('click',openCard);
$('closeBtn').addEventListener('click',()=>{$('modal').hidden=true;});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').hidden=true;});
$('dlBtn').addEventListener('click',()=>{const cv=drawCard();cv.toBlob(b=>{if(!b){$('cardMsg').textContent='Could not create the image.';return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='flame-test-score-card.png';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);$('cardMsg').textContent='Downloaded flame-test-score-card.png';},'image/png');});
$('copyBtn').addEventListener('click',async()=>{const cv=drawCard();
  try{if(!navigator.clipboard||!window.ClipboardItem)throw 0;
    await navigator.clipboard.write([new ClipboardItem({'image/png':new Promise(r=>cv.toBlob(r,'image/png'))})]);$('cardMsg').textContent='Image copied — paste it where you need it.';}
  catch(e){$('cardMsg').textContent='Copy isn’t supported on this device — use Download PNG instead.';}});
$('mailBtn').addEventListener('click',()=>{const n=S.unk.filter(u=>u.solved).length,when=new Date(S.doneAt||Date.now());
  const body=`Flame Test & Line Spectra Lab\n${URL_TXT}\n${when.toLocaleString()}\n\nUnknowns identified: ${n} / 7${n===7?' — LAB COMPLETE':''}\n`+
    S.unk.map(u=>`${u.solved?'✓':'✗'} ${u.mode==='flame'?'Flame':'Lamp'} ${u.label}: ${u.solved?answerName(u):'not yet identified'} (${u.tries} checks)`).join('\n')+
    '\n\n(Score card PNG attached.)';
  const url='https://mail.google.com/mail/?view=cm&fs=1&to=&su='+encodeURIComponent('Flame Test – Score Card')+'&body='+encodeURIComponent(body);
  window.open(url,'_blank','noopener');$('cardMsg').textContent='Gmail opened — attach the downloaded PNG before sending.';});

/* ================= main loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;
  sizeCanvas(benchCv);const bctx=benchCv.getContext('2d');const wasOn=energized();
  if(S.mode==='flame')drawFlameBench(bctx,benchCv._w,benchCv._h,dt,time);else drawLampBench(bctx,benchCv._w,benchCv._h,dt,time);
  if(!wasOn&&energized()){markViewed();setBohrText(defaultBohrText());}
  const s=cur();if(s&&s.unk&&s.unk.mixture&&S.mode==='flame'&&S.cobalt&&energized()&&!s.unk.cobaltSeen){s.unk.cobaltSeen=true;save();}
  bohrUpdate(dt);sizeCanvas(bohrCv);drawBohr(bohrCv.getContext('2d'),bohrCv._w,bohrCv._h);
  drawSpec(dt);
  requestAnimationFrame(frame);
}
if(!load())newUnknowns();
S.zoomC.lamp=strongestL(cur()&&S.mode==='lamp'?cur():sampleOf('lamp',S.sel.lamp));
renderAll();bohrReset();
requestAnimationFrame(frame);
})();
</script>
