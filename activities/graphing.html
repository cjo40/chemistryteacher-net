<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphing Like a Scientist: Data Tables &amp; Line Graphs</title>
<meta name="description" content="Interactive activity that teaches high school chemistry students how to make a line graph: data tables, independent vs dependent variables, uniform scales, choosing increments, plotting points, best-fit lines, and a free-form grapher for lab data.">
<style>
:root{--ink:#1d2731;--muted:#5b6875;--paper:#f6f8fa;--card:#fff;--line:#d5dde5;--acc:#1758b8;--acc2:#e8f0fb;--ok:#17723a;--okbg:#e5f5ea;--bad:#b3261e;--badbg:#fdecea;--hl:#f2a900;--hlbg:#fff4d6;--grid:#cfe2f3;--grid5:#8fb9de}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;min-height:40px}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover:not(:disabled){filter:brightness(1.08)}
button.sm{min-height:32px;padding:4px 10px;font-size:14px}
button.link{border:none;background:none;color:var(--acc);padding:2px 4px;min-height:0;text-decoration:underline}
input[type=text],input[type=number],input:not([type]),select{border:1px solid #aab6c2;border-radius:8px;padding:7px 9px;min-height:40px;background:#fff;max-width:100%}
input:focus,select:focus,button:focus-visible{outline:3px solid #8ab4f8;outline-offset:1px}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:18px;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.hide{display:none!important}

/* header */
#top{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 64px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap;min-height:58px}
#top .brand{font-weight:700;font-size:18px;white-space:nowrap}
#tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
#tabs button{border-radius:999px;font-weight:600;display:flex;gap:6px;align-items:center}
#tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#tabs button.locked{color:var(--muted);background:#eef1f4}
#tabs .st{font-size:13px;font-weight:700}
#btnSettings{font-size:15px}

/* sections */
main{padding:12px 14px 30px}
.sec{display:none}
.sec.on{display:block}
.done-banner{display:inline-block;background:var(--okbg);color:var(--ok);border:1px solid #9fd3b0;border-radius:999px;padding:3px 12px;font-weight:700;margin-bottom:8px}

/* work layout */
.work.on{display:grid;grid-template-columns:minmax(330px,430px) 1fr;gap:16px;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:calc(100vh - 92px);overflow:auto}
.gcol{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:70px}
svg.graph{display:block;width:100%;height:calc(100vh - 250px);min-height:340px;user-select:none;-webkit-user-select:none}
svg.graph.plotting{touch-action:none;cursor:crosshair}
.meters{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;padding:4px 6px}
.meter{display:flex;align-items:center;gap:6px}
.meter .bar{width:110px;height:10px;border-radius:5px;background:#e6ebf0;overflow:hidden;border:1px solid #c8d1da}
.meter .bar i{display:block;height:100%;background:var(--ok)}
.meter.low .bar i{background:var(--bad)}
.meter.low b{color:var(--bad)}
.eqbox{margin:4px 6px 0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fafcff;font-family:ui-monospace,Consolas,monospace;font-size:15px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:2px 4px 6px;position:relative;min-height:44px}
.tools label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;cursor:pointer}
.tools input[type=checkbox]{width:20px;height:20px}
.tools.off{opacity:.45;pointer-events:none}
.tools .tnote{font-size:13px;color:var(--muted)}
.pop{position:absolute;top:46px;left:4px;z-index:15;background:#fff;border:1px solid #9fb0c2;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:12px;width:min(360px,92vw)}
.pop .row{display:flex;gap:8px;align-items:center;margin:6px 0}
.pop .why{font-size:13px;color:var(--bad)}

/* cards & feedback */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.step-dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.step-dots button.sd{width:36px;height:36px;min-height:0;padding:0;border-radius:50%;font-size:14px;font-weight:700;background:#e9eef3;color:var(--muted);border:2px solid transparent}
.step-dots button.sd.cur{background:var(--acc);color:#fff}
.step-dots button.sd.dn{background:var(--okbg);color:var(--ok)}
.step-dots button.sd:not(:disabled):hover{border-color:var(--acc)}
.step-dots span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:#e9eef3;color:var(--muted)}
.step-dots span.cur{background:var(--acc);color:#fff}
.step-dots span.dn{background:var(--okbg);color:var(--ok)}
.q{font-weight:600;margin:8px 0}
.fb{margin:8px 0;padding:8px 10px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid #a7d8b6}
.fb.bad{display:block;background:var(--badbg);color:var(--bad);border:1px solid #f0b4ae}
.fb.info{display:block;background:var(--acc2);color:#123c78;border:1px solid #b8cdf0}
.fb b.tag{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin-right:4px}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:8px 0}
.row2 label{display:flex;flex-direction:column;font-size:14px;gap:3px;font-weight:600}
.row2 input{width:130px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.opts button.sel-ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opts button.sel-bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.helper{background:#f4f7fb;border:1px dashed #9fb3c8;border-radius:8px;padding:8px 10px;font-size:14px;margin:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chips span{background:#fff;border:1px solid #b9c7d6;border-radius:999px;padding:1px 8px;font-size:13px}
.why-link{font-size:14px}
.story{background:#fffbea;border:1px solid #efd88a;border-radius:8px;padding:8px 10px;margin:6px 0}

/* tables */
table.dt{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0}
table.dt th,table.dt td{border:1px solid #c5d0db;padding:3px 8px;text-align:center}
table.dt th{background:#eef3f8}
table.dt td.tap{cursor:pointer}
table.dt td.tap:hover{background:var(--hlbg)}
table.dt tr.next td{background:var(--hlbg);font-weight:700}
table.dt tr.pl td{color:var(--ok)}
table.dt td.pick{background:var(--okbg);font-weight:700}
table.dt th.tap{cursor:pointer}
table.dt th.tap:hover{background:var(--hlbg)}
table.dt input{width:100%;min-height:32px;padding:3px 6px;text-align:center}
.tblwrap{max-height:340px;overflow:auto;border-radius:6px}
.tblwrap.full{max-height:none;overflow:visible}
table.dt.compact td,table.dt.compact th{padding:1px 8px;font-size:14px;line-height:1.35}
#ordT td{padding:4px 6px!important;font-size:14px;line-height:1.3}
#ordT th{padding:2px 4px;font-size:13px}
#ordT td.hdl{font-size:16px;width:28px}
.notebook{max-height:180px;overflow:auto;background:#fffdf3;border:1px solid #e3d9a8;border-radius:8px;padding:6px 10px;font-size:14px;font-family:"Segoe Print","Bradley Hand",cursive,system-ui}
.notebook div{border-bottom:1px dashed #e8e0b8;padding:2px 0}

/* learn */
.learn-wrap{max-width:1180px;margin:0 auto}
.learn-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.learn-nav button{min-width:44px;font-weight:700}
.learn-nav button.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.learn-nav button.dn{background:var(--okbg);color:var(--ok);border-color:#9fd3b0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.pair figure{margin:0;border:2px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.pair figure.bad{border-color:#e9a39d}
.pair figure.good{border-color:#93cfa6}
.pair figcaption{font-weight:700;padding:0 4px 4px}
.pair figure.bad figcaption{color:var(--bad)}
.pair figure.good figcaption{color:var(--ok)}
svg.mini{display:block;width:100%;height:auto;max-height:340px}
.lead{font-size:17px;max-width:900px}
.callout{background:var(--acc2);border:1px solid #b8cdf0;border-radius:10px;padding:8px 12px;margin:8px 0;max-width:900px}
.numline{font-family:ui-monospace,Consolas,monospace;font-size:18px;letter-spacing:.5px}
.tails{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.tails div{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.tails b{display:block;font-size:30px;color:var(--acc);line-height:1}
.checklist label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.checklist input{width:22px;height:22px;flex:none;margin-top:1px}
.game-wrap{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:14px}
.found{list-style:none;padding:0;margin:6px 0}
.found li{padding:4px 0;color:var(--ok)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.ccard{border:3px solid var(--acc);border-radius:14px;padding:14px}
.ccard h2{color:var(--acc)}
.ccard table{border-collapse:collapse;width:100%;font-size:15px}
.ccard td{border-bottom:1px solid #e2e8ee;padding:3px 6px}
.ccard svg{width:100%;height:auto;max-height:260px;border:1px solid var(--line);border-radius:8px;margin-top:8px}

/* free form */
.ff-sec{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.ff-sec:first-child{border-top:none;margin-top:0;padding-top:0}
textarea{width:100%;min-height:80px;font:14px ui-monospace,Consolas,monospace;border:1px solid #aab6c2;border-radius:8px;padding:6px}
.ff-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ff-grid label{display:flex;flex-direction:column;font-size:14px;font-weight:600;gap:3px}
.ff-grid input{width:100%}
.del{color:var(--bad);border:none;background:none;min-height:0;padding:0 4px;font-size:18px}

/* SVG classes */
.gl{stroke:var(--grid);stroke-width:1}
.gl5{stroke:var(--grid5);stroke-width:1.2}
.ax{stroke:#1d2731;stroke-width:2.4}
.tk{fill:#1d2731}
.lbl{fill:#1d2731;font-weight:600}
.ph{fill:#98a4b0;font-style:italic;font-weight:400}
.ttl{fill:#1d2731;font-weight:700}
.pt{fill:#1d2731;stroke:#fff;stroke-width:1}
.pt.ok{fill:var(--ok)}
.pt.bad{fill:var(--bad)}
.pt.ghost{fill:none;stroke:#7d8b99;stroke-width:1.6;stroke-dasharray:3 2}
.ln{fill:none;stroke:#1758b8;stroke-width:2.2;stroke-linejoin:round}
.ln.bad{stroke:var(--bad)}
.fit{fill:none;stroke:#c2185b;stroke-width:2.4}
.barr{fill:#7fa7d9;stroke:#3f6fae}
.hlr{fill:rgba(242,169,0,.18);stroke:var(--hl);stroke-width:2;stroke-dasharray:6 4}
.mk-ok{fill:rgba(23,114,58,.12);stroke:var(--ok);stroke-width:3}
.reg{fill:transparent;cursor:pointer}
.reg:hover{fill:rgba(23,88,184,.08)}
.guide{stroke:#c62828;stroke-width:1.8;stroke-dasharray:7 5}
.guidet{fill:#c62828;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid #7fa0c6;background:#eef4fb;border-radius:999px;padding:8px 14px;font-weight:700;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;min-height:44px}
.chip.sel{background:#fff4d6;border-color:var(--hl)}
.chip.used{opacity:.35}
.chip.dragging{box-shadow:0 8px 20px rgba(0,0,0,.25);cursor:grabbing}
.slot{border:2px dashed #9fb3c8;border-radius:10px;min-height:54px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafcff;font-weight:700}
.slot small{font-weight:600;color:var(--muted)}
.slot.over{background:#fff4d6;border-color:var(--hl)}
.slot.filled{border-style:solid;border-color:#7fa0c6;background:#eef4fb}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
#ordT tr.drow{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
button.big{font-size:18px;padding:12px 22px}
table.dt td.hdl{width:40px;cursor:grab;touch-action:none;font-size:20px;color:#5b6875;user-select:none;-webkit-user-select:none;padding:0}
table.dt tr.drop-above td{box-shadow:inset 0 3px 0 var(--hl)}
table.dt tr.drop-below td{box-shadow:inset 0 -3px 0 var(--hl)}
table.dt tr.lift td{opacity:.35}
table.dt tr.oo td{background:#fdecea}
.rowghost{position:fixed;pointer-events:none;z-index:60;background:#fff;border:2px solid var(--acc);border-radius:8px;padding:6px 14px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.mv{min-height:32px;min-width:34px;padding:0 6px;font-size:13px}
.xh line{stroke:#c2185b;stroke-width:1.3;stroke-dasharray:5 4}
.xh circle{fill:rgba(194,24,91,.35);stroke:#c2185b;stroke-width:1.5}

#printArea{display:none}
@media (max-width:920px){
  .work.on{grid-template-columns:1fr}
  .gcol{position:static;order:-1}
  svg.graph{height:58vh}
  .side{max-height:none}
  .pair{grid-template-columns:1fr}
  .game-wrap{grid-template-columns:1fr}
  .tails{grid-template-columns:repeat(3,1fr)}
}
@media print{
  @page{size:landscape;margin:.35in}
  body.printing > *:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  #printArea svg{width:100%;height:auto}
}

/* always-visible scrollbars (ChromeOS hides overlay scrollbars) */
.side::-webkit-scrollbar,.tblwrap::-webkit-scrollbar,.notebook::-webkit-scrollbar{width:12px}
.side::-webkit-scrollbar-thumb,.tblwrap::-webkit-scrollbar-thumb,.notebook::-webkit-scrollbar-thumb{background:#aebbc8;border-radius:6px;border:3px solid #fff}
.side::-webkit-scrollbar-track,.tblwrap::-webkit-scrollbar-track,.notebook::-webkit-scrollbar-track{background:#eef2f6;border-radius:6px}

.bigq{font-size:18px;font-weight:700;background:#fff8e1;border:2px solid var(--hl);border-radius:12px;padding:8px 12px;margin:6px 0;line-height:1.3}
.bigq .kw{color:#b3261e;text-decoration:underline}
.bigq .sub{font-size:14px;font-weight:500;color:#4a5560;margin-top:4px}
.bigq .qn{color:var(--acc)}
.bigq .ans{display:flex;align-items:center;gap:8px;font-size:16px;margin-top:6px;flex-wrap:wrap}
.bigq .chips{margin-top:2px}
.bigq .ans input{width:110px;font-size:18px;font-weight:700}
.bigq .chips span{font-size:14px;font-weight:600}
ol.tasks{margin:4px 0 8px;padding-left:22px;font-size:14px;color:var(--muted)}
ol.tasks li.cur{color:var(--ink);font-weight:700}
ol.tasks li.dn{color:var(--ok)}
table.dt td.hlcol,table.dt th.hlcol{background:#fff4d6}
table.dt td.hlcol.tap:hover{background:#ffe7a3}

/* ===== Question / answer boxes (all parts) ===== */
.ask{border:3px solid #f2a900;background:#fffaeb;border-radius:14px;padding:0 0 10px;margin:10px 0;box-shadow:0 2px 0 #e9c46a}
.ask-tag{background:#f2a900;color:#3d2a00;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:4px 12px;border-radius:10px 10px 0 0}
.ask-q{font-size:19px;font-weight:800;line-height:1.3;padding:8px 12px 2px;color:#1d2731}
.ask-q .kw{color:#b3261e;text-decoration:underline}
.ask-sub{font-size:14px;color:#4a5560;padding:2px 12px}
.ask-a{margin:8px 10px 0;background:#fff;border:2px dashed #c9a227;border-radius:10px;padding:6px 10px 10px}
.ask-a.on-graph{border-color:#1758b8;background:#eef4fb}
.ask-al{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#8a6d00;margin-bottom:4px}
.ask-a.on-graph .ask-al{color:#1758b8;font-size:14px}
.ask .btns{padding:0 10px}
.ask > div[id]{padding:0 10px}
.ask .ans{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:4px 0;flex-wrap:wrap}
.ask .ans input{width:120px;font-size:18px;font-weight:700}
.ask .chips span{font-size:14px;font-weight:600}
.prev-ok{background:var(--okbg);color:var(--ok);border:1px solid #a7d8b6;border-radius:8px;padding:5px 10px;font-size:14px;margin:6px 0}
.story,.labstory{background:#f1f4f8;border:1px solid #cfd8e2;border-left:4px solid #8a9aab;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:15px}
.story b.lt{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#5b6875}

.ask-q .why-link{font-size:14px;font-weight:500}
.ask-data{padding:4px 10px 0}
.ask-data .story{margin:2px 0}
.story.small{font-size:13px;padding:4px 8px}
.gwrap{display:flex;gap:10px;align-items:flex-start}
.gwrap svg.graph{flex:1;min-width:0}
.gdata{flex:none;width:230px;max-height:calc(100vh - 250px);min-height:300px;overflow:auto;border:2px solid #8a9aab;border-radius:10px;background:#fff}
.gdata .gdh{background:#f1f4f8;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#5b6875;padding:4px 8px;border-bottom:1px solid #cfd8e2;position:sticky;top:0}
.gdata table.dt{margin:0}
.gdata table.dt th{position:sticky;top:24px}
.gdata.tapmode{border-color:#1758b8;box-shadow:0 0 0 3px #b8cdf0}
@media (max-width:920px){ .gwrap{flex-direction:column} .gdata{width:100%;max-height:230px;min-height:0} }
.gdata::-webkit-scrollbar{width:12px}
.gdata::-webkit-scrollbar-thumb{background:#aebbc8;border-radius:6px;border:3px solid #fff}
.gdata::-webkit-scrollbar-track{background:#eef2f6}
.incnote{display:block;font-size:14px;font-weight:600;color:#0f5229;background:#e5f5ea;border-radius:8px;padding:0 8px;margin-top:4px}
.incnote:empty{display:none}
.incnote.warn{color:#8a4b00;background:#fff1d6}

#tabs .pct{font-size:12px;font-weight:800;background:#e9eef3;color:#4a5560;border-radius:999px;padding:1px 7px}
#tabs button.on .pct{background:rgba(255,255,255,.25);color:#fff}
#tabs .pct.full{background:#17723a;color:#fff;font-size:13px}
#tabs button.tab-full:not(.on){border-color:#17723a;background:#e5f5ea;color:#0f5229}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2731;color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .5s}
.toast.out{opacity:0}
.cardmsg{font-size:14px;margin-top:6px;color:#0f5229}
.ask-q .qn{color:var(--acc)}

</style>
</head>
<body>
<header id="top">
  <div class="brand">Graphing Like a Scientist</div>
  <nav id="tabs" aria-label="Parts"></nav>
  <button id="btnSettings" title="Settings">⚙ Settings</button>
</header>
<main>
  <section id="sec-learn" class="sec"></section>
  <section id="sec-guided" class="sec work"><div class="side"></div><div class="gcol"></div></section>
  <section id="sec-you" class="sec work"><div class="side"></div><div class="gcol"></div></section>
  <section id="sec-free" class="sec work"><div class="side"></div><div class="gcol"></div></section>
</main>
<div id="modal" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"></div></div>
<div id="printArea"></div>

<script>
(function(){
'use strict';
/* ===== Scale grading (shared) ===== */
var EPS = 1e-9;
function isFriendly(inc){

/* ===== Plotting (tap to place, drag before release to adjust) ===== */
function enablePlotting(svg, opts){
  // opts.active() -> bool ; opts.place(dataX, dataY)
  var drag = null;
  function inside(p){ var g=svg._g; return g && p.x>=g.ml-8 && p.x<=g.ml+g.pw+8 && p.y>=g.mt-8 && p.y<=g.mt+g.ph+8; }
  function clampP(p){ var g=svg._g; return {x:Math.max(g.ml,Math.min(g.ml+g.pw,p.x)), y:Math.max(g.mt,Math.min(g.mt+g.ph,p.y))}; }
  function hair(p){
    var layer = svg.querySelector('.xh'); if(!layer) return;
    if(!p){ layer.innerHTML=''; return; }
    var g=svg._g;
    layer.innerHTML = '<line x1="'+p.x+'" y1="'+p.y+'" x2="'+p.x+'" y2="'+(g.mt+g.ph)+'"/><line x1="'+g.ml+'" y1="'+p.y+'" x2="'+p.x+'" y2="'+p.y+'"/>'+
      (drag?'<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(g.pr+2)+'"/>':'');
  }
  svg.addEventListener('pointerdown', function(e){
    if(!opts.active() || e.button>0) return;
    var p = svgPoint(svg,e); if(!inside(p)) return;
    e.preventDefault(); drag = clampP(p);
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    hair(drag);
  });
  svg.addEventListener('pointermove', function(e){
    if(!opts.active()){ return; }
    var p = svgPoint(svg,e);
    if(drag){ e.preventDefault(); drag = clampP(p); hair(drag); }
    else if(e.pointerType==='mouse'){ hair(inside(p)?clampP(p):null); }
  });
  function up(e){
    if(!drag) return;
    var p = drag; drag = null; hair(null);
    var m = mapper(svg._c, svg._g);
    opts.place(m.dx(p.x), m.dy(p.y));
  }
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', function(){ drag=null; hair(null); });
  svg.addEventListener('pointerleave', function(e){ if(!drag) hair(null); });
}
/* Match a placed point to an unplotted data point (within ½ box on both axes) */
var SNAP = 1; // a tap within 1 box (each direction) snaps onto the data point
function matchPoint(dx, dy, xs, ys, used, X, Y){
  var best=-1, bd=1e9;
  for(var i=0;i<xs.length;i++){
    if(used[i]) continue;
    var ex=Math.abs(dx-xs[i])/X.inc, ey=Math.abs(dy-ys[i])/Y.inc;
    if(ex<=SNAP+1e-9 && ey<=SNAP+1e-9){ var d=ex*ex+ey*ey; if(d<bd){bd=d;best=i;} }
  }
  return best;
}
function missHint(dx, dy, xs, ys, used, X, Y, xu, yu){
  // find unplotted point with closest x
  var bi=-1, bd=1e9;
  for(var i=0;i<xs.length;i++){ if(used[i]) continue; var d=Math.abs(dx-xs[i]); if(d<bd){bd=d;bi=i;} }
  if(bi<0) return 'All points are plotted.';
  if(Math.abs(dx-xs[bi])/X.inc<=SNAP) return 'The red dot is where you tapped. Your x is right ('+fmtNum(xs[bi])+(xu?' '+xu:'')+'), but go straight up to '+fmtNum(ys[bi])+(yu?' '+yu:'')+' on the y-axis.';
  return 'The red dot is where you tapped — not close to a data point. Find an x value from the table on the x-axis, then go straight up to its y value.';
}

/* ===== Curve fitting ===== */
var FITS = {
  lin:{name:'Linear (y = mx + b)'}, lin0:{name:'Linear through origin — force to zero (y = mx)'},
  quad:{name:'Quadratic (y = ax² + bx + c)'}, exp:{name:'Exponential (y = a·e^(bx))'},
  pow:{name:'Power (y = a·xᵇ)'}, inv:{name:'Inverse (y = k/x)'}, log:{name:'Logarithmic (y = a + b·ln x)'}
};
function fitWhyNot(type, xs, ys){
  var n=xs.length;
  if(n<2) return 'Need at least 2 points.';
  if(type==='quad' && n<3) return 'Need at least 3 points.';
  if(type==='exp' && ys.some(function(v){return v<=0;})) return 'Needs every y > 0.';
  if(type==='pow' && (xs.some(function(v){return v<=0;})||ys.some(function(v){return v<=0;}))) return 'Needs every x > 0 and y > 0.';
  if(type==='inv' && xs.some(function(v){return v===0;})) return 'Can\'t use x = 0.';
  if(type==='log' && xs.some(function(v){return v<=0;})) return 'Needs every x > 0.';
  var sx = xs.some(function(v){return v!==xs[0];}); if(!sx && type!=='inv') return 'All x values are the same.';
  return '';
}
function linReg(X, Y){
  var n=X.length, sx=0, sy=0, sxx=0, sxy=0;
  for(var i=0;i<n;i++){ sx+=X[i]; sy+=Y[i]; sxx+=X[i]*X[i]; sxy+=X[i]*Y[i]; }
  var d = n*sxx-sx*sx; var m = d ? (n*sxy-sx*sy)/d : 0;
  return {m:m, b:(sy-m*sx)/n};
}
function solve3(A, B){
  var M=A.map(function(r,i){ return r.concat([B[i]]); });
  for(var c=0;c<3;c++){
    var p=c; for(var r=c+1;r<3;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    var t=M[c]; M[c]=M[p]; M[p]=t;
    if(Math.abs(M[c][c])<1e-14) return null;
    for(r=0;r<3;r++){ if(r===c) continue; var f=M[r][c]/M[c][c]; for(var k=c;k<4;k++) M[r][k]-=f*M[c][k]; }
  }
  return [M[0][3]/M[0][0], M[1][3]/M[1][1], M[2][3]/M[2][2]];
}
function doFit(type, xs, ys){
  if(fitWhyNot(type,xs,ys)) return null;
  var f, co, n=xs.length, i;
  if(type==='lin'){ var r=linReg(xs,ys); co=r; f=function(x){ return r.m*x+r.b; }; }
  else if(type==='lin0'){ var sxy=0,sxx=0; for(i=0;i<n;i++){ sxy+=xs[i]*ys[i]; sxx+=xs[i]*xs[i]; } var mm=sxx?sxy/sxx:0; co={m:mm}; f=function(x){ return mm*x; }; }
  else if(type==='quad'){
    var S=[0,0,0,0,0], T=[0,0,0];
    for(i=0;i<n;i++){ var x=xs[i], p=1; for(var k=0;k<5;k++){ S[k]+=p; if(k<3) T[k]+=p*ys[i]; p*=x; } }
    var sol = solve3([[S[4],S[3],S[2]],[S[3],S[2],S[1]],[S[2],S[1],S[0]]],[ (function(){var s=0;for(var j=0;j<n;j++) s+=xs[j]*xs[j]*ys[j]; return s;})(), T[1], T[0] ]);
    if(!sol) return null; co={a:sol[0],b:sol[1],c:sol[2]}; f=function(x){ return sol[0]*x*x+sol[1]*x+sol[2]; };
  }
  else if(type==='exp'){ var r2=linReg(xs, ys.map(Math.log)); var a=Math.exp(r2.b), b=r2.m; co={a:a,b:b}; f=function(x){ return a*Math.exp(b*x); }; }
  else if(type==='pow'){ var r3=linReg(xs.map(Math.log), ys.map(Math.log)); var a2=Math.exp(r3.b), b2=r3.m; co={a:a2,b:b2}; f=function(x){ return x>0? a2*Math.pow(x,b2) : NaN; }; }
  else if(type==='inv'){ var s1=0,s2=0; for(i=0;i<n;i++){ s1+=ys[i]/xs[i]; s2+=1/(xs[i]*xs[i]); } var kk=s1/s2; co={k:kk}; f=function(x){ return x!==0? kk/x : NaN; }; }
  else if(type==='log'){ var r4=linReg(xs.map(Math.log), ys); co={a:r4.b,b:r4.m}; f=function(x){ return x>0? r4.b+r4.m*Math.log(x) : NaN; }; }
  var mean=ys.reduce(function(a,b){return a+b;},0)/n, ssr=0, sst=0;
  for(i=0;i<n;i++){ var e=ys[i]-f(xs[i]); ssr+=e*e; sst+=(ys[i]-mean)*(ys[i]-mean); }
  return {type:type, f:f, co:co, r2: sst>0 ? 1-ssr/sst : 1};
}
function fmtCo(v){
  if(!isFinite(v)) return '?';
  var a=Math.abs(v);
  if(a!==0 && (a>=1e5 || a<1e-3)){
    var e=Math.floor(Math.log10(a)), mnt=v/Math.pow(10,e);
    var sup=String(e).replace(/-/g,'⁻').replace(/\d/g,function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d];});
    return (+mnt.toPrecision(4))+'×10'+sup;
  }
  return String(+v.toPrecision(4));
}
function signed(v){ return (v<0?' − ':' + ')+fmtCo(Math.abs(v)); }
function fitEquation(F, xn, yn){
  var c=F.co;
  switch(F.type){
    case 'lin': return yn+' = '+fmtCo(c.m)+'·'+xn+signed(c.b);
    case 'lin0': return yn+' = '+fmtCo(c.m)+'·'+xn;
    case 'quad': return yn+' = '+fmtCo(c.a)+'·'+xn+'²'+signed(c.b)+'·'+xn+signed(c.c);
    case 'exp': return yn+' = '+fmtCo(c.a)+'·e^('+fmtCo(c.b)+'·'+xn+')';
    case 'pow': return yn+' = '+fmtCo(c.a)+'·'+xn+'^'+fmtCo(c.b);
    case 'inv': return yn+' = '+fmtCo(c.k)+' / '+xn;
    case 'log': return yn+' = '+fmtCo(c.a)+signed(c.b)+'·ln('+xn+')';
  }
  return '';
}
function fitSamples(F, x0, x1){
  var out=[], N=160;
  for(var i=0;i<=N;i++){ var x=x0+(x1-x0)*i/N; var y=F.f(x); out.push(isFinite(y)?[x,y]:null); }
  return out;
}

/* apply line state to a graph cfg; returns equation text or '' */
function applyLine(cfg, L, xs, ys, xname, yname, bx){
  cfg.connect = !!L.connect;

  if(L.fit && xs.length>1){
    var F = doFit(L.type, xs, ys);
    if(!F){ return '<span style="color:#b3261e">This fit type can\'t be used with this data: '+esc(fitWhyNot(L.type,xs,ys))+'</span>'; }
    var r=rangeOf(xs), x0=r.min, x1=r.max;
    if(L.extend && axisSet(cfg.x)){ x0=cfg.x.start; x1=cfg.x.start+bx*cfg.x.inc; }
    cfg.fitPts = fitSamples(F, x0, x1);
    var parts=[];

    if(L.showR2) parts.push('R² = '+F.r2.toFixed(4)+(F.r2<0.5?' (poor fit — try another type)':''));

/* Pop-up note next to a "go up by" box */
function incNote(v, un){

function morphMarkup(u){
  var W=520,H=360,ml=62,mr=16,mt=30,mb=56,pw=W-ml-mr,ph=H-mt-mb,o=[];
  var by=10, ys=20, yi=10;
  function py(v){ return mt+ph-(v-ys)/yi*(ph/by); }
  o.push('<rect x="'+ml+'" y="'+mt+'" width="'+pw+'" height="'+ph+'" fill="#fff"/>');
  for(var j=0;j<=by;j++){ var yy=mt+ph-j*ph/by; o.push('<line class="gl" x1="'+ml+'" y1="'+yy+'" x2="'+(ml+pw)+'" y2="'+yy+'"/><text class="tk" font-size="12" x="'+(ml-7)+'" y="'+(yy+4)+'" text-anchor="end">'+(ys+j*yi)+'</text>'); }
  var fake=[], tru=[];
  for(var i=0;i<=5;i++) fake.push(ml+i*pw/5);
  for(var k=0;k<=10;k++) tru.push(ml+k*pw/10);
  tru.forEach(function(x,k){ o.push('<line class="gl" style="opacity:'+u+'" x1="'+x+'" y1="'+mt+'" x2="'+x+'" y2="'+(mt+ph)+'"/><text class="tk" font-size="12" style="opacity:'+u+'" x="'+x+'" y="'+(mt+ph+18)+'" text-anchor="middle">'+(k*2)+'</text>'); });
  fake.forEach(function(x,k){ o.push('<line class="gl5" style="opacity:'+(1-u)+'" x1="'+x+'" y1="'+mt+'" x2="'+x+'" y2="'+(mt+ph)+'"/><text font-size="13" font-weight="700" fill="#b3261e" style="opacity:'+(1-u)+'" x="'+x+'" y="'+(mt+ph+18)+'" text-anchor="middle">'+CD.t[k]+'</text>'); });
  var P = CD.t.map(function(t,k){ var xt=ml+t/20*pw; return [fake[k]+(xt-fake[k])*u, py(CD.y[k])]; });
  o.push('<line class="ax" x1="'+ml+'" y1="'+(mt+ph)+'" x2="'+(ml+pw)+'" y2="'+(mt+ph)+'"/><line class="ax" x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(mt+ph)+'"/>');
  o.push('<polyline class="ln" points="'+P.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>');
  P.forEach(function(p){ o.push('<circle class="pt" cx="'+p[0]+'" cy="'+p[1]+'" r="5"/>'); });
  o.push('<text class="lbl" font-size="14" x="'+(ml+pw/2)+'" y="'+(H-10)+'" text-anchor="middle">Time (min)</text><text class="lbl" font-size="14" transform="translate(16,'+(mt+ph/2)+') rotate(-90)" text-anchor="middle">Temperature (°C)</text><text class="ttl" font-size="15" x="'+(ml+pw/2)+'" y="20" text-anchor="middle">Temperature vs. Time (cooling water)</text>');
  return o.join('');
}

function exportSVG(){
  var f=fS(), d=fData(), bar=fBar(), c=freeCfg(true), eq='';
  var plotted=(f.auto||bar)?d.ys.length:f.pts.length;
  if(!bar && plotted>=2 && c.x && c.y){ var sx=[],sy=[]; if(f.auto){sx=d.xs;sy=d.ys;} else f.pts.forEach(function(k){ sx.push(d.xs[k]); sy.push(d.ys[k]); }); eq=applyLine(c, f.L, sx, sy, f.xq||'x', f.yq||'y', ST.settings.bx); }
  var g=geom(c), W=1600, H=1000, o=[];
  o.push('<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="Segoe UI, Roboto, Arial, sans-serif">');
  o.push('<style>'+SVG_CSS+'</style><rect width="'+W+'" height="'+H+'" fill="#fff"/>');
  o.push('<text x="24" y="40" font-size="26" fill="#1d2731"><tspan font-weight="700">Name:</tspan> '+esc(ST.name||'________________')+'</text>');
  o.push('<text x="1010" y="40" font-size="22" fill="#1d2731" text-anchor="end"><tspan font-weight="700">Date:</tspan> '+esc(new Date().toLocaleDateString())+'</text>');
  o.push('<svg x="10" y="56" width="1010" height="884" viewBox="0 0 '+g.W+' '+g.H+'">'+graphMarkup(c,g)+'</svg>');
  if(eq) o.push('<text x="40" y="975" font-size="22" font-family="Consolas, monospace" fill="#1d2731">'+eq.replace(/(&nbsp;)+/g,'\u2003\u2003').replace(/<[^>]+>/g,'')+'</text>');
  // data table
  var n=d.ys.length, per = n>25 ? Math.ceil(n/2) : n, blocks = n>25?2:1, tx=1050, tw=530, bwid=tw/blocks, cw=bwid/2;
  var rh=Math.min(34, 880/(per+1)), fsz=Math.min(18, rh*0.62);
  o.push('<text x="'+(tx)+'" y="40" font-size="22" font-weight="700" fill="#1d2731">Data table</text>');
  var hx=f.xq?axisLabel(f.xq,f.xu):'x', hy=f.yq?axisLabel(f.yq,f.yu):'y';
  for(var b=0;b<blocks;b++){
    var bx0=tx+b*bwid, y0=56;
    [hx,hy].forEach(function(t,j){ var hf=Math.min(fsz, (cw-8)/(Math.max(t.length,1)*0.55)); o.push('<rect x="'+(bx0+j*cw)+'" y="'+y0+'" width="'+cw+'" height="'+rh+'" fill="#eef3f8" stroke="#9fb0c2"/><text x="'+(bx0+j*cw+cw/2)+'" y="'+(y0+rh*0.68)+'" font-size="'+hf+'" font-weight="700" text-anchor="middle" fill="#1d2731">'+esc(t)+'</text>'); });
    for(var r=0;r<per;r++){
      var k=b*per+r; if(k>=n) break;
      var yy=y0+rh*(r+1);
      [bar?d.xs[k]:fmtNum(d.xs[k]), fmtNum(d.ys[k])].forEach(function(t,j){ o.push('<rect x="'+(bx0+j*cw)+'" y="'+yy+'" width="'+cw+'" height="'+rh+'" fill="#fff" stroke="#c5d0db"/><text x="'+(bx0+j*cw+cw/2)+'" y="'+(yy+rh*0.68)+'" font-size="'+fsz+'" text-anchor="middle" fill="#1d2731">'+esc(t)+'</text>'); });
    }
  }
  o.push('<text x="'+(W-20)+'" y="'+(H-14)+'" font-size="14" fill="#8a96a3" text-anchor="end">chemistryteacher.net/graphing</text></svg>');
  return o.join('');
}
var SVG_CSS='.gl{stroke:#cfe2f3;stroke-width:1}.gl5{stroke:#8fb9de;stroke-width:1.2}.ax{stroke:#1d2731;stroke-width:2.4}.tk{fill:#1d2731}.lbl{fill:#1d2731;font-weight:600}.ph{fill:#98a4b0}.ttl{fill:#1d2731;font-weight:700}.pt{fill:#1d2731;stroke:#fff;stroke-width:1}.ln{fill:none;stroke:#1758b8;stroke-width:2.2}.fit{fill:none;stroke:#c2185b;stroke-width:2.4}.barr{fill:#7fa7d9;stroke:#3f6fae}.reg,.hlr,.mk-ok{display:none}';
function exportGo(kind){
  var f=fS(), d=fData(), A=fAxes(), bar=fBar();
  if(d.ys.length<2) return ffb('fExFb','bad','Enter at least 2 rows of data.');
  if(!A.ok) return ffb('fExFb','bad','Your axes don\'t pass the rules yet — press Check x / Check y and fix them.');
  if(!bar && !f.auto && f.pts.length<d.ys.length) return ffb('fExFb','bad','Plot all '+d.ys.length+' points first (or choose Auto-plot points).');
  ffb('fExFb','','');
  var svg=exportSVG();
  if(kind==='print'){
    var pa=$('#printArea'); pa.innerHTML=svg; document.body.classList.add('printing');
    setTimeout(function(){ window.print(); }, 60);
    return;
  }
  if(kind==='email'){
    var to=Q.get('email')||'';
    var url='https://mail.google.com/mail/?view=cm&fs=1'+(to?'&to='+encodeURIComponent(to):'')+'&su='+encodeURIComponent('Graph: '+(fTitle()||'my lab data'))+'&body='+encodeURIComponent(freeText()+'\n\n(Attach your downloaded PNG to include the picture of the graph.)');
    window.open(url,'_blank','noopener');
    ffb('fExFb','info','Gmail opened in a new tab with your data table. Tip: press <b>Download PNG</b> first, then attach the picture in Gmail.');
    return;
  }
  freePNG(svg, function(blob, name){
    if(!blob){ ffb('fExFb','bad','Could not make the image — use Print instead.'); return; }
    if(kind==='copy'){
      try{
        if(navigator.clipboard && window.ClipboardItem){
          navigator.clipboard.write([new ClipboardItem({'image/png':blob, 'text/plain':new Blob([freeText()],{type:'text/plain'})})])
            .then(function(){ ffb('fExFb','ok','Copied — paste it into Google Classroom, a Doc, or an email.'); })
            .catch(function(){ navigator.clipboard.writeText(freeText()).then(function(){ ffb('fExFb','ok','Copied the data table as text (this browser can\'t copy pictures — use Download PNG for the graph).'); }, function(){ ffb('fExFb','bad','Copy didn\'t work here — use Download PNG instead.'); }); });
        } else if(navigator.clipboard){ navigator.clipboard.writeText(freeText()).then(function(){ ffb('fExFb','ok','Copied the data table as text — use Download PNG for the graph picture.'); }); }
        else ffb('fExFb','bad','Copy isn\'t available in this browser — use Download PNG instead.');
      }catch(e){ ffb('fExFb','bad','Copy didn\'t work here — use Download PNG instead.'); }
      return;
    }
    var u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(u); },4000);
    ffb('fExFb','ok','Downloaded '+name+'. Upload it to Google Classroom.');
  });
}
function freePNG(svg, cb){
  var img=new Image(), scale=1.5;
  var name=('graph-'+(ST.name?ST.name+'-':'')+(fTitle()||'lab')).replace(/[^a-z0-9]+/gi,'-').replace(/-+$/,'').toLowerCase().slice(0,80)+'.png';
  img.onload=function(){
    var cv=document.createElement('canvas'); cv.width=1600*scale; cv.height=1000*scale;
    var ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0,cv.width,cv.height);
    try{ cv.toBlob(function(b){ cb(b, name); },'image/png'); }catch(e){ cb(null); }
  };
  img.onerror=function(){ cb(null); };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function freeText(){
  var f=fS(), d=fData(), bar=fBar(), A=fAxes();
  var hx=f.xq?axisLabel(f.xq,f.xu):'x', hy=f.yq?axisLabel(f.yq,f.yu):'y', lines=[];
  lines.push(fTitle()||'Graph'); if(ST.name) lines.push('Name: '+ST.name); lines.push('Date: '+new Date().toLocaleDateString()); lines.push('');
  lines.push(hx+'\t'+hy);
  d.xs.forEach(function(x,i){ lines.push((bar?x:fmtNum(x))+'\t'+fmtNum(d.ys[i])); });

}
