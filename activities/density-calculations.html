<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Density Calculations Trainer (D = m/V, Displacement &amp; L × W × H)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#eef1f5;color:#15191e;-webkit-tap-highlight-color:transparent;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
/* header */
header{display:flex;align-items:center;gap:10px;min-height:56px;padding:5px 10px 5px 64px;background:#1f3a5f;color:#fff;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0;font-weight:700;line-height:1.15}
header h1 small{display:block;font-weight:500;font-size:.75rem;opacity:.85}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{min-height:46px;min-width:96px;padding:3px 10px;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:#2d4f7c;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tab small{font-weight:600;font-size:.74rem;opacity:.95;margin-top:2px}
.tab.on{background:#fff;color:#1f3a5f;border-color:#fff}
.tab.full{background:#1d7a35;border-color:#9fe0b0;color:#fff}
.tab.full.on{box-shadow:0 0 0 3px #fff inset}
.tab.lock{opacity:.62}
.cband{margin:8px 0;padding:6px 12px;border-radius:10px;font-weight:900;letter-spacing:.03em}
.solcard{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.solcard .gl{text-align:left;font-size:1.02rem}
.solcard .gst{text-align:left;text-transform:none;font-size:.85rem;letter-spacing:0}
.sm{color:#7a8692;font-weight:700;font-size:.85rem}
.garr{display:flex;flex-direction:column;align-items:center}
.garr small{font-size:.72rem;font-weight:900;color:#2b6cb0;letter-spacing:.02em}
.vcard .eq{font-size:1.4rem}
/* dimensional analysis: units shown full size so students see them cancel */
.du .u{font-size:.68em;font-weight:800;color:#2b6cb0;margin-left:.14em;position:relative;display:inline-block}
.du .u.cu{color:#b3261e}
.du .u.cu::after{content:"";position:absolute;left:50%;width:1.5em;margin-left:-.75em;top:50%;border-top:.15em solid #b3261e;transform:rotate(-35deg)}
.dabox{display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;min-height:2.2em;border:.07em dashed #f29d12;border-radius:.2em;background:#fff7e6;color:#c56a00;font-weight:900}
.daq{margin:6px 0}
.qtext .daq .eq{font-size:1.5rem;justify-content:flex-start;display:flex}
.kbtn .dab{font-size:1.15rem;display:inline-flex}
.opt .eq.dab{font-size:1.1rem;display:inline-flex}
.mtab .eq.da{font-size:1rem}
/* layout */
main{height:calc(100% - 56px);display:grid;grid-template-columns:minmax(380px,44%) 1fr;gap:12px;padding:10px 12px}
.col{overflow:auto;min-height:0;padding-bottom:6px}
.panel{background:#fff;border:1px solid #d5dbe2;border-radius:14px;padding:12px}
#right .panel{min-height:100%;display:flex;flex-direction:column;gap:10px}
/* step pills */
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pills .lbl{font-weight:700;color:#3b4652;margin-right:2px;font-size:.9rem}
.pill{min-width:44px;min-height:40px;padding:2px 10px;border-radius:20px;border:2px solid #b9c3ce;background:#fff;font-weight:700;color:#3b4652}
.pill.cur{border-color:#1f3a5f;background:#1f3a5f;color:#fff}
.pill.done{border-color:#1d7a35;color:#1d7a35;background:#e6f4ea}
.pill.cur.done{background:#1d7a35;color:#fff}
.pill:disabled{opacity:.45}
.pill.cur:disabled,.pill.done:disabled{opacity:1}
.streak{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:.85rem;font-weight:700;color:#3b4652}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #1d7a35;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff}
.dot.on{background:#1d7a35}
/* gray reference boxes */
.gray{background:#eceff3;border:1px solid #cfd6de;border-radius:10px;padding:8px 12px;color:#26303a}
.gray .t{font-size:.75rem;font-weight:800;letter-spacing:.04em;color:#5a6672;text-transform:uppercase;margin-bottom:2px}
.teach{font-size:1.02rem;line-height:1.4;margin:0 0 8px}
.story{margin-bottom:8px;font-size:1rem;line-height:1.38}
.showclue .clue{color:#b3141a;text-decoration:underline;text-decoration-color:#d4202a;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
.clue{text-decoration:none}
/* question box */
.qbox{border:5px solid #f29d12;border-radius:14px;background:#fffdf7;overflow:hidden;margin-bottom:8px}
.qhead{background:#f29d12;color:#2b1a00;font-weight:800;font-size:.85rem;letter-spacing:.04em;padding:4px 10px}
.qbody{padding:8px 12px 10px}
.qtext{font-size:1.22rem;font-weight:800;line-height:1.3}
.kw{color:#b3141a;text-decoration:underline;text-decoration-color:#d4202a;text-decoration-thickness:3px;text-underline-offset:3px}
.qhint{font-size:.92rem;color:#4a5560;margin-top:3px}
.ans{border:2px dashed #9aa6b2;border-radius:10px;padding:5px 8px 7px;margin-top:6px;background:#fff}
.anslbl{font-size:.72rem;font-weight:800;letter-spacing:.06em;color:#6a7682;margin-bottom:5px}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.row+.row{margin-top:7px}
.opt{min-height:48px;padding:6px 14px;border-radius:10px;border:2px solid #9aa6b2;background:#f7f9fb;font-weight:700;font-size:1.05rem;display:inline-flex;align-items:center;gap:6px}
.opt:hover:not(:disabled){border-color:#1f3a5f}
.opt.right{background:#e6f4ea;border-color:#1d7a35;color:#145a27}
.opt.wrong{background:#fdecea;border-color:#b3261e;color:#8c1d18}
.lawopt{flex-direction:column;align-items:flex-start;gap:2px;padding:6px 12px}
.lawopt .mini .eq{font-size:1rem}
.opbtn{min-width:52px;min-height:46px;border-radius:10px;border:2px solid #1f3a5f;background:#fff;font-size:1.45rem;font-weight:800;color:#1f3a5f}
.opbtn.sel{background:#1f3a5f;color:#fff}
.kbtn{min-height:52px;min-width:110px;padding:6px 16px;border-radius:10px;border:2px solid #1f3a5f;background:#fff;font-size:1.25rem;font-weight:800;color:#1f3a5f}
.kbtn.wrong{background:#fdecea;border-color:#b3261e;color:#8c1d18}
.undo{min-height:46px;padding:4px 12px;border-radius:10px;border:2px solid #6a7682;background:#fff;font-weight:700;margin-left:auto}
.chip{min-height:46px;padding:4px 12px;border-radius:12px;border:2px solid #2b6cb0;background:#eef5fd;font-weight:800;font-size:1.12rem;color:#123;display:inline-flex;align-items:baseline;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.chip small,.tk small{font-size:.62em;color:#66727e;font-weight:600}
.chip.sel{background:#2b6cb0;color:#fff;border-color:#174a80}
.chip.sel small{color:#dbe8f7}
.chip.used{display:none}
.chip.grp{border-style:double;border-width:4px}
.big{min-height:52px;padding:6px 22px;border-radius:12px;border:none;background:#1f3a5f;color:#fff;font-weight:800;font-size:1.15rem}
.big.green{background:#1d7a35}
.big.ghost{background:#fff;color:#1f3a5f;border:2px solid #1f3a5f}
.big:disabled{opacity:.45}
.nextrow{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.fb{margin-top:8px;border-radius:10px;padding:7px 10px;font-size:.98rem;line-height:1.35}
.fb.bad{background:#fdecea;border:2px solid #b3261e;color:#6f1510}
.fb.good{background:#e6f4ea;border:2px solid #1d7a35;color:#0f4720}
.fb.note{background:#fff7e6;border:2px solid #f29d12;color:#5a3a00}
.fb b{display:block}
.doneline{background:#e6f4ea;border:1px solid #8fcca0;border-left:6px solid #1d7a35;color:#0f4720;border-radius:8px;padding:4px 10px;font-weight:700;font-size:.92rem;margin-bottom:6px}
.measuring *,.measuring *::after{animation:none!important;transition:none!important}
.dl2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.glow{animation:glow 1.1s ease-in-out infinite;position:relative;z-index:1}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,157,18,.9)}50%{box-shadow:0 0 0 7px rgba(242,157,18,.35)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* equation board */
.boardt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.boardt h2{margin:0;font-size:1rem;color:#1f3a5f}
.fcard{display:inline-flex;align-items:center;gap:8px;font-size:1.05rem}
.fcard.moved{background:#fff7e6;border-color:#f29d12}
.fcard .t{line-height:1.15}
.fcard .eq{font-size:1.8rem;gap:.25em}
.ann{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05}
.ann .ar{color:#c8102e;font-size:.7em;font-weight:900;line-height:.9}
.ann .al{color:#c8102e;font-size:.5em;font-weight:800;white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ann .al em{font-style:normal;text-transform:uppercase;font-size:.85em;letter-spacing:.03em}
.chip .role{font-style:normal;font-size:.62em;font-weight:800;color:#fff;background:#c8102e;border-radius:6px;padding:1px 5px;margin-left:3px;text-transform:uppercase;letter-spacing:.03em;align-self:center}
.chip.sel .role{background:#fff;color:#c8102e}
.eqwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;border:2px solid #e1e6ec;border-radius:14px;background:#fbfcfe;padding:10px 6px;overflow:hidden}
.eq{display:flex;align-items:center;justify-content:center;gap:.3em;font-size:2.3rem;font-weight:700;white-space:nowrap;max-width:100%}
.eqs{padding:0 .15em;color:#1f3a5f}
.side{display:inline-flex;align-items:center;gap:.18em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
.fn,.fd{display:flex;align-items:center;gap:.18em;padding:0 .2em}
.fn{border-bottom:.08em solid currentColor;padding-bottom:.08em}
.fd{padding-top:.08em}
.times{color:#5d6975;font-weight:600;font-size:.8em}
.tk{display:inline-flex;align-items:baseline;gap:.12em;transition:opacity .5s}
.tk small{font-size:.42em}
.tile{display:inline-flex;align-items:center;justify-content:center;min-width:1.25em;padding:0 .22em;height:1.3em;border-radius:.22em;background:#6a2fb0;color:#fff;font-weight:800;font-size:.92em}
.symtk{font-style:italic;font-weight:700;color:#26303a}
.cst{color:#1f3a5f}
.x{position:relative;opacity:.35}
.x::after{content:"";position:absolute;left:-4%;right:-4%;top:50%;border-top:.09em solid #b3261e;transform:rotate(-18deg)}
.nw{animation:pop .5s}
@keyframes pop{0%{transform:scale(1.5);color:#c56a00}100%{transform:scale(1)}}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:2.1em;min-height:1.45em;padding:0 .2em;border:.07em dashed #6a7682;border-radius:.2em;background:#fff;cursor:pointer;color:#7a8692;font-style:italic;font-size:.95em}
.slot.filled{border-style:solid;border-color:#2b6cb0;background:#eef5fd;color:#123;font-style:normal}
.slot.unk{border-color:#6a2fb0;background:#f5effc}
.slot.tgt{outline:.1em solid #f29d12}
.paren{color:#5d6975;font-weight:500}
.status.bad{color:#b3261e}
.status{font-size:1.15rem;font-weight:800;color:#1d7a35;text-align:center;min-height:1.6em}
.answer{font-size:1.9rem;font-weight:800;text-align:center;color:#0f4720;background:#e6f4ea;border:2px solid #1d7a35;border-radius:12px;padding:6px}
.answer small{font-size:.55em;color:#2d5d3a}
.sense{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:#f1faf3;border:2px dashed #1d7a35;border-radius:12px;padding:6px 10px;color:#0f4720;font-weight:700}
.sense .arw{font-size:1.6rem;font-weight:900;white-space:nowrap}
.sense .arw i{font-style:normal;color:#b3141a}
.flipnote{font-size:.85rem;color:#5a6672;font-weight:600;margin-top:4px}
/* before -> after gas pictures */
.strip{display:flex;align-items:stretch;justify-content:center;gap:6px;flex-wrap:wrap}
.gs{flex:1 1 0;min-width:140px;max-width:250px;border:2px solid #d5dbe2;border-radius:12px;background:#fbfcfe;padding:4px 6px 6px;text-align:center;display:flex;flex-direction:column;align-items:center}
.gs.after{border-color:#c9b3e6;background:#fbf8ff}
.gst{font-size:.72rem;font-weight:900;letter-spacing:.06em;color:#5a6672;text-transform:uppercase}
.gl{font-size:.95rem;font-weight:800;line-height:1.3;color:#15191e}
.gl .sm{color:#7a8692;font-weight:700;font-size:.85rem}
.gl .tile{font-size:.9rem;height:1.4em}
.garr{align-self:center;font-size:2rem;color:#1f3a5f;font-weight:900}
.gsvg{display:block;max-width:100%;height:auto}
.gsvg .pt{animation:jig .6s ease-in-out infinite alternate}
.gsvg.fast .pt{animation-duration:.28s}
.gsvg.slow .pt{animation-duration:1.15s}
@keyframes jig{0%{transform:translate(0,0)}100%{transform:translate(3px,-3px)}}
/* learn visuals */
.vis{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.vcard{border:2px solid #d5dbe2;border-radius:12px;padding:10px 16px;background:#fbfcfe;min-width:260px}
.vcard.ok{border-color:#1d7a35;background:#f1faf3}
.vcard .h{font-weight:800;margin-bottom:6px}
.vcard .eq{font-size:1.8rem}
.lcards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.lcard{flex:1 1 0;min-width:150px;max-width:230px;border:2px solid #d5dbe2;border-radius:12px;background:#fbfcfe;padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.lcard .h{font-weight:900;color:#1f3a5f}
.lcard .eq{font-size:1.2rem}
.lcard .same{font-size:.85rem;font-weight:800;color:#5a6672;background:#eceff3;border-radius:8px;padding:2px 8px}
.lcard .rel{font-size:1.15rem;font-weight:900;color:#b3141a}
.lcard .rel small{display:block;font-size:.72rem;color:#5a6672;letter-spacing:.05em;text-transform:uppercase}
.mtab{border-collapse:collapse;font-size:1rem;width:100%;max-width:600px}
.mtab td,.mtab th{border:1px solid #d5dbe2;padding:6px 8px;text-align:left;vertical-align:middle}
.mtab th{background:#eceff3;font-size:.85rem}
.mtab .w{color:#8c1d18;background:#fdf3f2}
.mtab .r{color:#145a27;background:#f1faf3}
.mtab .eq{font-size:1.1rem;justify-content:flex-start;display:inline-flex;vertical-align:middle}
.mini{display:inline-flex;vertical-align:middle}
.mini .eq{font-size:1rem;gap:.2em}
.mini .tk small{font-size:.6em}
.opt.sm{min-height:44px;padding:4px 10px;font-size:.95rem}
.opt .eq{font-size:1.25rem}
.qtext .eq{font-size:1em;display:inline-flex}
.frame{font-size:.95rem;font-weight:800;color:#c56a00;min-height:1.4em}
.storyhl{font-size:1.05rem;line-height:1.5;text-align:left;max-width:560px}
.storyhl span{border-radius:4px;padding:0 2px;transition:background .3s}
.storyhl .on1{background:#dbeaf8;outline:2px solid #2b6cb0}
.storyhl .on2{background:#efe4fb;outline:2px solid #6a2fb0}
/* modal + toast + keypad */
.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.mbox{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:96vh;overflow:auto;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mbox h3{margin:0 0 8px;color:#1f3a5f}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f3a5f;color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .6s}
.kp{max-width:360px}
.kpd{font-size:1.9rem;font-weight:800;border:2px solid #9aa6b2;border-radius:10px;padding:6px 10px;min-height:56px;text-align:right;background:#fbfcfe;overflow:auto;white-space:nowrap}
.kpd small{font-size:.5em;color:#66727e}
.kpg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.kpg button{min-height:56px;border-radius:10px;border:2px solid #b9c3ce;background:#f7f9fb;font-size:1.35rem;font-weight:800}
.kpg .ok{background:#1d7a35;color:#fff;border-color:#1d7a35}
.kperr{color:#8c1d18;font-weight:700;min-height:1.3em;margin-top:6px}
.card{border:3px solid #1f3a5f;border-radius:14px;padding:12px 16px}
.card table{border-collapse:collapse;width:100%}
.card td{padding:4px 6px;border-bottom:1px solid #e1e6ec}
.card td:last-child{text-align:right;font-weight:800}
.units{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-weight:700}
.units .lb{min-width:96px}
.units .opt{min-height:44px;padding:4px 12px;font-size:.95rem}
.units .opt.sel{background:#1f3a5f;color:#fff;border-color:#1f3a5f}
#print{display:none}
@media (max-width:900px){
  main{display:block;height:auto}
  .col{overflow:visible}
  #right{margin-top:10px}
  .eq{font-size:1.8rem}
}
@media print{
  header,main,.modal,.toast{display:none!important}
  #print{display:block;padding:20px;font-size:14pt}
  #print .eq{font-size:20pt;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== density additions ===== */
.kbtn small{display:block;font-size:.72rem;font-weight:800;color:#5a6672;margin-top:2px}
.kbtn.wrong small{color:#8c1d18}
.kbtn.two{line-height:1.15;padding:5px 14px}
.dragtip{font-size:.82rem;color:#5a6672;font-weight:700;margin-top:6px}
/* volume-method slider (big + color-coded so the teacher can read it from across the room) */
.vsw{display:flex;gap:4px;padding:4px;border-radius:16px;border:3px solid #1f3a5f;background:#dfe5ec;min-height:64px;width:100%;cursor:pointer}
.vsw:focus-visible{outline:3px solid #f29d12;outline-offset:2px}
.vsw .seg{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 10px;border-radius:12px;color:#5a6672;line-height:1.05;transition:background .2s,color .2s}
.vsw .seg b{font-size:1.3rem;font-weight:900;letter-spacing:.04em}
.vsw .seg small{font-size:.8rem;font-weight:800;margin-top:3px}
.vm-disp .vsw .s-disp{background:#2b6cb0;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.vm-lwh .vsw .s-lwh{background:#f29d12;color:#2b1a00;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.vswlbl{font-size:.75rem;font-weight:900;letter-spacing:.06em;color:#5a6672;text-transform:uppercase;margin-bottom:-4px}
/* lab bench */
.bench{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid #e1e6ec;border-radius:14px;background:#fbfcfe}
.bench .ldrag{cursor:grab}
.bench .ldrag:active{cursor:grabbing}
.bench .hot{animation:hot 1.1s ease-in-out infinite}
@keyframes hot{0%,100%{opacity:1}50%{opacity:.45}}
.drop{animation:drop 1.1s cubic-bezier(.5,0,.8,1) both}
@keyframes drop{from{transform:translateY(var(--dy0))}to{transform:none}}
.rise{animation:rise .7s ease-out 1s both}
@keyframes rise{from{transform:translateY(var(--rz))}to{transform:none}}
.bob{animation:bob 1.6s ease-in-out 1.2s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(3px)}}
.ntab{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:8px}
.ntab th,.ntab td{border:1px solid #d5dbe2;padding:4px 6px;text-align:left}
.ntab th{background:#eceff3;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}
.ntab tr.cur td{background:#fff7e6}
.ntab td.ok{color:#145a27;font-weight:800}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.idgrid .opt{flex-direction:column;align-items:flex-start;gap:0;min-height:52px;padding:4px 10px}

<div id="print"></div>
<script>
/* ===== EQUATION ENGINE (no DOM) ===== */
var SYMS = {M1:'M₁',M2:'M₂',V1:'V₁',V2:'V₂',T1:'T₁',T2:'T₂',P1:'P₁',P2:'P₂',dT:'ΔT',dH:'ΔH',H:'[H⁺]',OH:'[OH⁻]',PY:'% yield',act:'actual',theo:'theoretical'};
function sy(s){ return SYMS[s] || s; }
var SUPM = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':''};
function sup(s){ return String(s).split('').map(function(c){ return SUPM[c] !== undefined ? SUPM[c] : c; }).join(''); }
function fmt3(x){
  if (!isFinite(x) || isNaN(x)) return '—';
  if (x === 0) return '0';
  var a = Math.abs(x);
  if (a >= 1e5 || a < 1e-3){ var p = x.toExponential(2).split('e'); return p[0] + '×10' + sup(parseInt(p[1], 10)); }
  if (a >= 1000) return String(Math.round(Number(x.toPrecision(3))));
  var s = Number(x).toPrecision(3);
  if (s.indexOf('e') >= 0) s = String(Number(s));
  if (s.indexOf('.') < 0 && /0$/.test(s)) s += '.';
  return s;
}
function r3(x){ return Number(Number(x).toPrecision(3)); }

var CONSTS = {
  'c:R':  {val:0.0821, txt:'0.0821', unit:'L·atm/mol·K', name:'R'},
  'c:NA': {val:6.02e23, txt:'6.02×10²³', unit:'/mol', name:'6.02×10²³'},
  'c:100':{val:100, txt:'100', unit:'', name:'100'},
  'c:14': {val:14, txt:'14', unit:'', name:'14'}
};

/* quantity types: name + whether a slot's unit is a ___ unit */
var QT = {
  density:'density', mass:'mass', volume:'volume', molarity:'concentration (molarity)', moles:'moles',
  heat:'energy (heat)', sheat:'specific heat', dtemp:'temperature change', temp:'temperature',
  pressure:'pressure', mm:'molar mass', count:'particle count', dh:'heat per gram', pct:'percent',
  ph:'pH', poh:'pOH', conc:'concentration'
};

/* formulas: L/R templates; vars: sym -> quantity type */
var FORMULAS = {
  density: {name:'Density', grp:'Measurement & Math', L:{k:'f',num:['D']}, R:{k:'f',num:['m'],den:['V']}, q:{D:'density',m:'mass',V:'volume'}}
};
function formulaSyms(fid){ return Object.keys(FORMULAS[fid].q); }

function F(num, den){ return {k:'f', num:num || [], den:den || []}; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* build an equation side from a template; mk(sym) -> factor */
function buildSide(t, mk){
  if (t.k === 'f') return F(t.num.map(mk), (t.den || []).map(mk));
  if (t.k === 's') return {k:'s', t:t.t.map(function(p){ return {s:p[0], f:F([mk(p[1])])}; })};
  if (t.k === 'l') return {k:'l', a:F([mk(t.a)])};
}
function constFactor(sym){ var c = CONSTS[sym]; return {id:sym, sym:sym, val:c.val, txt:c.txt, unit:c.unit, k:1}; }
/* values: sym -> {val,txt,unit}; U = unknown sym */
function buildEq(fid, values, U){
  var fo = FORMULAS[fid];
  function mk(sym){
    if (sym.indexOf('c:') === 0) return constFactor(sym);
    if (sym === U) return {id:sym, sym:sym, v:1};
    var g = values[sym];
    return {id:sym, sym:sym, val:g.val, txt:g.txt, unit:g.unit};
  }
  return {L:buildSide(fo.L, mk), R:buildSide(fo.R, mk)};
}

/* ---------- searching ---------- */
function locIn(side, id){
  if (!side) return null;
  if (side.k === 'f'){
    var i;
    for (i = 0; i < side.num.length; i++) if (side.num[i].id === id) return {w:'num'};
    for (i = 0; i < side.den.length; i++) if (side.den[i].id === id) return {w:'den'};
    var all = side.num.concat(side.den);
    for (i = 0; i < all.length; i++) if (all[i].w && locIn(all[i].w, id)) return {w:'wrap'};
    return null;
  }
  if (side.k === 's'){
    for (var j = 0; j < side.t.length; j++){
      var t = side.t[j], r = locIn(t.f, id);
      if (r){
        if (r.w === 'num' && t.f.num.length === 1 && t.f.den.length === 0) return {w: t.s > 0 ? 'plus' : 'minus'};
        return {w:'deep'};
      }
    }
    return null;
  }
  if (side.k === 'l') return locIn(side.a, id) ? {w:'log'} : null;
  if (side.k === 'p') return locIn(side.a, id) ? {w:'pow'} : null;
  return null;
}
function locate(eq, id){
  var r = locIn(eq.L, id); if (r){ r.sd = 'L'; return r; }
  r = locIn(eq.R, id); if (r){ r.sd = 'R'; return r; }
  return null;
}
function findFactor(eq, id){
  var found = null;
  function walk(side){
    if (!side || found) return;
    if (side.k === 'f'){ side.num.concat(side.den).forEach(function(f){ if (found) return; if (f.w) walk(f.w); else if (f.id === id) found = f; }); }
    else if (side.k === 's') side.t.forEach(function(t){ walk(t.f); });
    else walk(side.a);
  }
  walk(eq.L); walk(eq.R);
  return found;
}
/* every plain factor in order (L then R) */
function allFactors(eq){
  var out = [];
  function walk(side){
    if (side.k === 'f') side.num.concat(side.den).forEach(function(f){ if (f.w) walk(f.w); else out.push(f); });
    else if (side.k === 's') side.t.forEach(function(t){ walk(t.f); });
    else walk(side.a);
  }
  walk(eq.L); walk(eq.R);
  return out;
}
function isAlone(side, U){ return side.k === 'f' && side.num.length === 1 && side.den.length === 0 && side.num[0].id === U && !side.num[0].w; }
function aloneSide(eq, U){ if (isAlone(eq.L, U)) return 'L'; if (isAlone(eq.R, U)) return 'R'; return null; }

/* ---------- applying a move to BOTH sides ---------- */
function simplify(side){
  if (side.k === 'f'){
    side.num = side.num.filter(function(f){ return !f.x; });
    side.den = side.den.filter(function(f){ return !f.x; });
    side.num.concat(side.den).forEach(function(f){ delete f.nw; if (f.w) f.w = simplify(f.w); });
    if (side.num.length === 1 && side.den.length === 0 && side.num[0].w) return side.num[0].w;
    return side;
  }
  if (side.k === 's'){
    side.t = side.t.filter(function(t){ return !t.x; });
    side.t.forEach(function(t){ delete t.nw; t.f = simplify(t.f); });
    if (side.t.length === 1 && side.t[0].s === 1) { var f = side.t[0].f; return f.k ? f : F([{id:'w', w:f}]); }
    if (side.t.length === 0) return F([{id:'zero', sym:'0', val:0, txt:'0', unit:'', k:1}]);
    return side;
  }
  if (side.k === 'l' || side.k === 'p'){ delete side.nw; side.a = simplify(side.a); return side; }
  return side;
}
function asFrac(S){ return S.k === 'f' ? S : F([{id:'w', w:S}]); }
/* op: '×','÷','+','−','p10'; ids: factor ids (group = several). Returns {mid,out,cancels} */
function applyOp(eq, op, ids){
  var mid = clone(eq), cancels = [], cs = [];
  ['L','R'].forEach(function(sd){
    var S = mid[sd];
    if (op === 'p10'){
      if (S.k === 'l'){ var a = S.a; a.num.forEach(function(f){ f.nw = 1; }); mid[sd] = a; cancels.push('log'); }
      else mid[sd] = {k:'p', a:S, nw:1};
      return;
    }
    if (op === '×' || op === '÷'){
      S = asFrac(S);
      ids.forEach(function(id){
        var fac = clone(findFactor(eq, id)); delete fac.x; fac.nw = 1;
        var same = op === '×' ? S.den : S.num, other = op === '×' ? S.num : S.den;
        var hit = null;
        for (var i = 0; i < same.length; i++) if (same[i].id === id && !same[i].x){ hit = same[i]; break; }
        if (hit){ hit.x = 1; fac.x = 1; cancels.push(id); cs.push(sd); }
        other.push(fac);
      });
      mid[sd] = S;
      return;
    }
    var sg = op === '+' ? 1 : -1;
    var fac2 = clone(findFactor(eq, ids[0])); delete fac2.x; fac2.nw = 1;
    if (S.k !== 's') S = {k:'s', t:[{s:1, f:asFrac(S)}]};
    var hit2 = null;
    S.t.forEach(function(t){
      if (!hit2 && !t.x && t.s === -sg && t.f.k === 'f' && t.f.den.length === 0 && t.f.num.length === 1 && t.f.num[0].id === fac2.id) hit2 = t;
    });
    var nt = {s:sg, f:F([fac2]), nw:1};
    if (hit2){ hit2.x = 1; nt.x = 1; cancels.push(fac2.id); cs.push(sd); }
    S.t.push(nt);
    mid[sd] = S;
  });
  return {mid:mid, out:{L:simplify(clone(mid.L)), R:simplify(clone(mid.R))}, cancels:cancels, cs:cs};
}

/* ---------- judging a move ---------- */
function chipLabel(eq, ids){
  if (ids.length > 1) return '(' + ids.map(function(id){ var f = findFactor(eq, id); return f.v ? sy(f.sym) : f.txt; }).join(' × ') + ')';
  var f = findFactor(eq, ids[0]);
  if (!f) return '?';
  return f.v ? sy(f.sym) : f.txt;
}
function judge(eq, op, ids, res, U){
  var u = sy(U), uL = locate(eq, U), uSd = uL.sd, uSide = eq[uSd];
  function bad(type, title, why){ return {ok:false, type:type, title:title, why:why}; }
  if (op === 'p10'){
    if (res.cancels.indexOf('log') >= 0) return {ok:true};
    return bad('opposite', 'Mistake: 10⁻ˣ with no −log', '10⁻ˣ only undoes −log, and there is no −log here. Tap ↶ Undo.');
  }
  if (uSide.k === 'l') return bad('opposite', 'Mistake: ' + u + ' is stuck inside −log', 'Nothing can reach ' + u + ' until the −log is gone. 10⁻ˣ undoes −log. Tap ↶ Undo and try 10⁻ˣ.');
  if (res.cancels.indexOf(U) >= 0 && op !== '×'){
    if (op === '÷') return bad('opposite', 'Mistake: divided by the unknown', 'That knocks ' + u + ' off its side. You want ' + u + ' alone, not gone. Tap ↶ Undo.');
    return bad('opposite', 'Mistake: subtracted the unknown', 'That knocks ' + u + ' off its side. You want ' + u + ' alone, not gone. Tap ↶ Undo.');
  }
  if (res.cancels.length > 0 && (op === '×' || op === '÷' || res.cs.indexOf(uSd) >= 0)) return {ok:true};
  var x = chipLabel(eq, ids), L = locate(eq, ids[0]), onU = L && L.sd === uSd, isVar = ids[0] === U && ids.length === 1;
  var uDen = uSide.k === 'f' && uSide.den.some(function(f){ return f.id === U; });
  if (uDen && onU && !isVar && L.w === 'num') return bad('nohelp', 'Mistake: work on ' + u + ' first', x + ' is on top, but ' + u + ' is on the bottom. Bring ' + u + ' up first: × ' + u + ' on both sides. Tap ↶ Undo.');
  var nohelp = bad('nohelp', "Mistake: that move doesn't help", x + " isn't on " + u + "'s side, so that just adds clutter. Tap ↶ Undo and work on what's next to " + u + '.');
  if (op === '×' || op === '÷'){
    if (uSide.k === 's'){
      if (!onU) return nohelp;
      var und = L.w === 'minus' ? '+' : '−';
      return bad('opposite', 'Mistake: ' + (op === '×' ? 'multiplied' : 'divided') + ' instead of ' + (und === '−' ? 'subtracting' : 'adding'),
        x + ' is ' + (L.w === 'minus' ? 'subtracted from ' : 'added to ') + u + ', not multiplied. To undo ' + (und === '−' ? '+' : '−') + ' you ' + und + '. Tap ↶ Undo and try ' + und + ' ' + x + '.');
    }
    if (isVar){
      if (op === '×') return bad('opposite', 'Mistake: ' + u + ' is already on top', u + ' is already on top, so × ' + u + ' just makes ' + u + ' × ' + u + '. Tap ↶ Undo.');
      return bad('opposite', 'Mistake: divided by ' + u + ' again', u + ' is already on the bottom. To bring it up, × ' + u + '. Tap ↶ Undo and try × ' + u + '.');
    }
    if (!onU) return nohelp;
    if (op === '×') return bad('opposite', 'Mistake: multiplied when you should divide', 'You multiplied by ' + x + ', but ' + x + ' was already multiplying ' + u + '. To undo × you ÷. Tap ↶ Undo and try ÷ ' + x + '.');
    return bad('opposite', 'Mistake: divided when you should multiply', x + ' was already dividing ' + u + " (it's on the bottom). To undo ÷ you ×. Tap ↶ Undo and try × " + x + '.');
  }
  /* + or − */
  var verb = op === '+' ? 'added' : 'subtracted';
  if (uSide.k === 's'){
    if (!onU) return nohelp;
    if (L.w === 'plus') return bad('opposite', 'Mistake: added when you should subtract', x + ' was already added to ' + u + '. To undo + you −. Tap ↶ Undo and try − ' + x + '.');
    if (L.w === 'minus') return bad('opposite', 'Mistake: subtracted when you should add', x + ' was already subtracted from ' + u + '. To undo − you +. Tap ↶ Undo and try + ' + x + '.');
    return nohelp;
  }
  if (isVar) return bad('opposite', 'Mistake: ' + verb + ' ' + u, 'Adding or subtracting ' + u + " won't get it alone. Tap ↶ Undo.");
  if (!onU) return nohelp;
  if (L.w === 'den') return bad('opposite', 'Mistake: ' + verb + ' instead of multiplying', x + ' is dividing ' + u + ', not added to it. To undo ÷ you ×. Tap ↶ Undo and try × ' + x + '.');
  return bad('opposite', 'Mistake: ' + verb + ' instead of dividing', x + ' is multiplying ' + u + ', not added to it. To undo × you ÷. Tap ↶ Undo and try ÷ ' + x + '.');
}

/* ---------- best next move + hint ---------- */
function nextMove(eq, U){
  var L = locate(eq, U); if (!L) return null;
  var S = eq[L.sd];
  if (isAlone(S, U)) return null;
  if (S.k === 'l') return {op:'p10', ids:[], why: sy(U) + ' is inside −log. 10⁻ˣ undoes −log, so tap 10⁻ˣ.'};
  if (S.k === 's'){
    for (var i = 0; i < S.t.length; i++){
      var t = S.t[i];
      if (!(t.f.num.length === 1 && t.f.num[0].id === U)){
        var f = t.f.num[0], o = t.s > 0 ? '−' : '+';
        return {op:o, ids:[f.id], why: f.txt + ' is ' + (t.s > 0 ? 'added to ' : 'subtracted from ') + sy(U) + '. To undo ' + (t.s > 0 ? '+ you −' : '− you +') + ': ' + o + ' ' + f.txt + ' on both sides.'};
      }
    }
  }
  if (S.k === 'f'){
    if (S.den.some(function(f){ return f.id === U; })) return {op:'×', ids:[U], why: sy(U) + ' is on the bottom. Multiply both sides by ' + sy(U) + ' to bring it up.'};
    if (S.den.length){ var d = S.den[0]; return {op:'×', ids:[d.id], why: d.txt + ' is dividing ' + sy(U) + " (it's on the bottom). To undo ÷ you ×: multiply both sides by " + d.txt + '.'}; }
    var o2 = S.num.filter(function(f){ return f.id !== U; });
    if (o2.length >= 2) return {op:'÷', ids:o2.map(function(f){ return f.id; }), group:true,
      why: o2.map(function(f){ return f.txt; }).join(' and ') + ' are all multiplying ' + sy(U) + '. Divide both sides by all of them at once (or one at a time).'};
    if (o2.length === 1) return {op:'÷', ids:[o2[0].id], why: o2[0].txt + ' is multiplying ' + sy(U) + '. To undo × you ÷: divide both sides by ' + o2[0].txt + '.'};
  }
  return null;
}

/* chips available in the solve step */
function solveChips(eq, U){
  var out = [], seen = {};
  allFactors(eq).forEach(function(f){
    if (seen[f.id]) return; seen[f.id] = 1;
    if (f.v){ var L = locate(eq, U); if (L && eq[L.sd].k === 'f' && eq[L.sd].den.some(function(d){ return d.id === U; })) out.push({ids:[f.id]}); return; }
    out.push({ids:[f.id]});
  });
  var L2 = locate(eq, U);
  if (L2){
    var S = eq[L2.sd];
    if (S.k === 'f' && !S.den.some(function(d){ return d.id === U; })){
      var o = S.num.filter(function(f){ return f.id !== U && !f.w; });
      if (o.length >= 2) out.push({ids:o.map(function(f){ return f.id; }), group:true});
    }
  }
  return out;
}

/* ---------- evaluating ---------- */
function ev(S){
  if (S.k === 'f'){ var v = 1; S.num.forEach(function(f){ v *= fv(f); }); S.den.forEach(function(f){ v /= fv(f); }); return v; }
  if (S.k === 's') return S.t.reduce(function(a, t){ return a + t.s * ev(t.f); }, 0);
  if (S.k === 'l') return -Math.log10(ev(S.a));
  if (S.k === 'p') return Math.pow(10, -ev(S.a));
}
function fv(f){ return f.w ? ev(f.w) : f.val; }

/* ---------- plain-text form (for copy/email) ---------- */
function facText(f, symMode){
  if (f.w) return '(' + sideText(f.w, symMode) + ')';
  if (f.v) return sy(f.sym);
  if (symMode) return f.k ? CONSTS[f.id].name : sy(f.sym);
  return f.txt;
}
function prodText(arr, symMode){ return arr.length ? arr.map(function(f){ return facText(f, symMode); }).join(' × ') : '1'; }
function sideText(S, symMode){
  if (S.k === 'f'){
    if (!S.den.length) return prodText(S.num, symMode);
    var n = prodText(S.num, symMode), d = prodText(S.den, symMode);
    if (S.num.length > 1) n = '(' + n + ')';
    if (S.den.length > 1) d = '(' + d + ')';
    return n + ' / ' + d;
  }
  if (S.k === 's') return S.t.map(function(t, i){ var tx = sideText(t.f, symMode); return i === 0 ? (t.s < 0 ? '−' + tx : tx) : (t.s < 0 ? ' − ' : ' + ') + tx; }).join('');
  if (S.k === 'l') return '−log(' + sideText(S.a, symMode) + ')';
  if (S.k === 'p') return '10^−(' + sideText(S.a, symMode) + ')';
}
function eqText(eq, symMode){ return sideText(eq.L, symMode) + ' = ' + sideText(eq.R, symMode); }

if (typeof module !== 'undefined' && module.exports) module.exports = {FORMULAS:FORMULAS, CONSTS:CONSTS, buildEq:buildEq, applyOp:applyOp, judge:judge, nextMove:nextMove, solveChips:solveChips, ev:ev, eqText:eqText, aloneSide:aloneSide, fmt3:fmt3, locate:locate, sy:sy};

</script>
<script>
/* ===== APP ===== */
(function(){
'use strict';
var Q = new URLSearchParams(location.search);
var UNLOCK = Q.get('unlock') === 'all';
var EMAIL = Q.get('email') || '';
var KEY = 'ctn-density-calculations-v1';
var LEFT = document.getElementById('left'), RIGHT = document.getElementById('right'), TABS = document.getElementById('tabs');
var PAGE = 'chemistryteacher.net/density-calculations';

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function R(a, b){ return a + Math.random() * (b - a); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function G(v, unit, role, clue){ v = r3(v); return {val:v, txt:fmt3(v), unit:unit || '', role:role || '', clue:clue || ''}; }
function G1(v, unit){ v = Math.round(v * 10) / 10; return {val:v, txt:v.toFixed(1), unit:unit || ''}; }
function T(g){ return g.txt + (g.unit ? ' ' + g.unit : ''); }
function num(o, k){ return o[k] || 0; }
function r5(x){ return Math.max(5, Math.round(x / 5) * 5); }
function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
function nice(x){ return String(Number(Number(x).toPrecision(4))); }
function has(v){ return v !== null && v !== undefined; }
function t1(x){ return (Math.round(x * 10) / 10).toFixed(1); }

var QT = {density:'density', mass:'mass', volume:'volume'};
var MU = {D:'g/mL', m:'g', V:'mL'};
var PRE = {disp:1, lwh:1}, POST = {};
function isPP(ph){ return !!(PRE[ph] || POST[ph]); }

/* ---------- materials (densities in g/cm³ = g/mL) ---------- */
var MATS = [
  {id:'al', f:'aluminum', d:2.70, col:'#c3ccd5', k:'metal'},
  {id:'fe', f:'iron', d:7.87, col:'#7d838b', k:'metal'},
  {id:'cu', f:'copper', d:8.96, col:'#c8743a', k:'metal'},
  {id:'zn', f:'zinc', d:7.14, col:'#a7b0b9', k:'metal'},
  {id:'brass', f:'brass', d:8.50, col:'#c9a227', k:'metal'},
  {id:'pb', f:'lead', d:11.3, col:'#5f6670', k:'metal'},
  {id:'ag', f:'silver', d:10.5, col:'#d7dbe0', k:'metal'},
  {id:'au', f:'gold', d:19.3, col:'#e0b228', k:'metal'},
  {id:'ti', f:'titanium', d:4.51, col:'#8e98a3', k:'metal'},

      right = '<div class="panel"><div class="boardt"><h2>Equation board</h2>' + fcardHTML(formulaHTML(fid, fu)) + '</div><div class="eqwrap">' + templateHTML(fid, ctx) + '</div><div class="status">' + (f.U !== 'V' && f.units.vm !== 'typed' ? 'V is worked out from your measurements.' : 'Tap an empty slot to type its value.') + '</div>' + extra + '</div>';
    } else {
      var b = f.b;
      h += boardLeft(b).replace(/STEP 1 OF 1/g, 'STEP 3 OF 3');
      if (b.phase === 'done'){
        h += '<div class="nextrow"><button class="big" data-act="fcopy">📋 Copy</button><button class="big" data-act="fmail">✉ Email using Google</button><button class="big" data-act="fprint">🖨 Print</button></div>' +
          '<div class="nextrow"><button class="big ghost" data-act="fagain">↻ Same unknown, new numbers</button><button class="big ghost" data-act="fnew">New problem</button></div><div id="fmsg" class="qhint"></div>';
      }
      right = boardRight(b);
    }
  }
  LEFT.innerHTML = h;
  RIGHT.innerHTML = right;
}
function freeSummary(){
  var f = C.free, b = f.b, lines = [];
  lines.push(TD.title + ' — Free Form');
  lines.push('Formula: ' + formulaText('density') + '   (solve for ' + f.U + ')');
  lines.push('Values: ' + freeKnowns().map(function(s){ return FNAME[s] + ' = ' + f.vals[s].txt + ' ' + f.vals[s].unit; }).join(', '));
  lines.push('Steps:');
  var k = 1;
  if (b.vline) lines.push('  ' + (k++) + '. ' + b.vline);
  lines.push('  ' + (k++) + '. Plug in:  ' + eqText(b.eq0));
  b.moves.forEach(function(m){ lines.push('  ' + (k++) + '. ' + m.op + ' ' + m.label + ' on both sides:  ' + m.text); });
  if (b.flipped) lines.push('     (flipped so ' + f.U + ' is on the left:  ' + eqText(b.eq) + ')');
  lines.push('Rearranged formula:  ' + eqText(b.eq, true));
  lines.push('Answer:  ' + ansText(b));
  lines.push('Check:  ' + senseText(b));
  lines.push(''); lines.push(PAGE);
  return lines.join('\n');
}
function freePrint(){
  var f = C.free, b = f.b, P = document.getElementById('print');
  var txt = freeSummary().split('\n');
  P.innerHTML = '<h2>' + esc(TD.title) + ': Free Form</h2>' + formulaHTML('density') +
    '<p>' + txt.slice(2).map(esc).join('<br>').replace(/ {2}/g, '&nbsp;&nbsp;') + '</p><p><b>Rearranged formula:</b></p>' + eqHTML(b.eq, {sym:true}) +
    '<p style="font-size:18pt"><b>Answer: ' + esc(ansText(b)) + '</b></p>';
  window.print();
}

/* ===================================================================
   RENDER + ACTIONS
   =================================================================== */
function render(){
  ensureValid();
  if (!unlocked(C.tab)) C.tab = 'learn';
  renderTabs();
  if (C.tab === 'learn') renderLearn();
  else if (C.tab === 'lab') renderLab();
  else if (C.tab === 'guided') renderGuided();
  else if (C.tab === 'prac') renderPractice();
  else renderFree();
  fitEqs();
}
function goTab(t){
  if (!unlocked(t)){ modal('<h3>🔒 ' + esc(LOCKMSG[t]) + '</h3><p>The parts unlock in order: Learn → Lab → Guided → Practice. Free Form is always open.</p><div class="mbtns"><button class="big" data-act="close">OK</button></div>'); return; }
  C.tab = t; LV.pick = null; LV.wrong = null; closeModal(); save(); render();
  if (t === 'learn') startStop();
  LEFT.scrollTop = 0;
}
function startStop(){ LV.pick = null; LV.wrong = null; render(); playFrames(); }

var ACT = {
  tab:function(a){ goTab(a); },
  close:function(){ closeModal(); KP = null; },
  /* learn */
  lstop:function(a){ C.learn.cur = a; save(); startStop(); },
  lopt:function(a){
    var st = stopById(C.learn.cur), o = st.opts[+a];
    if (o.ok){ LV.pick = +a; LV.wrong = null; C.learn.done[st.id] = 1; save(); }
    else LV.wrong = +a;
    render();
  },
  lnext:function(){ var l = ids(TD.stops), i = l.indexOf(C.learn.cur); if (i < l.length - 1){ C.learn.cur = l[i + 1]; save(); startStop(); } else goTab('lab'); },
  /* lab */
  lmode:function(a){ setVM(a); },
  lout:function(){ labTakeOut(); },
  lrec:function(){ labRecord(); },
  lvq:function(a){ labVolq(+a); },
  lchip:function(a){ var c = labCur(); if (!c || c.ls.step !== 'calc') return; c.ls.sel = c.ls.sel === a ? null : a; c.ls.fb = null; render(); },
  lslot:function(a){ var c = labCur(); if (!c || c.ls.step !== 'calc') return; if (!c.ls.sel){ if (!c.ls.fills[a]){ c.ls.fb = {ok:false, title:'', why:'Tap a value first, then tap its slot (or drag it there).'}; render(); } return; } placeLab(c.ls.sel, a); },
  lcalc:function(){ labCalc(); },
  lid:function(a){ labId(a); },
  /* board */
  pp:function(a){ var b = curBoard(); if (b && !b.auto) doPP(b, a); },
  chip:function(a){ var b = curBoard(); if (!b || b.phase !== 'plug' || b.auto) return; b.sel = b.sel === a ? null : a; b.fb = null; render(); },
  slot:function(a){ var b = curBoard(); if (!b || b.phase !== 'plug' || b.auto) return; if (!b.sel){ if (!b.fills[a]){ b.fb = {ok:false, title:'', why:'Tap a value first, then tap its slot.'}; render(); } return; } placeChip(b, b.sel, a); },
  op:function(a){ var b = curBoard(); if (!b || b.locked || b.busy || b.auto) return; b.op = b.op === a ? null : a; b.fb = null; render(); },
  schip:function(a){
    var b = curBoard(); if (!b || b.locked || b.busy || b.auto) return;
    var c = solveChips(b.eq, b.p.U)[+a]; if (!c) return;
    if (!b.op){ b.fb = {ok:false, title:'', why:'Tap an operation first (+ − × ÷), then a number. Or drag the number onto an operation.'}; render(); return; }
    doMove(b, b.op, c.ids);
  },
  undo:function(){ var b = curBoard(); if (b && !b.busy && !b.auto) undo(b); },
  calc:function(){ var b = curBoard(); if (b && !b.busy && !b.auto) calc(b); },
  showme:function(){ var b = curBoard(); if (b) showMe(b); },
  /* guided */
  gprob:function(a){ C.guided.cur = a; C.guided.b = null; save(); render(); },
  gnext:function(){ var l = ids(TD.gp), i = l.indexOf(C.guided.cur); if (i < l.length - 1){ C.guided.cur = l[i + 1]; C.guided.b = null; save(); render(); } else goTab('prac'); },
  /* practice */
  plvl:function(a){ C.prac.lvl = a; C.prac.b = null; save(); render(); },
  pnext:function(a){
    var pr = C.prac, l = ids(TD.levels), i = l.indexOf(pr.lvl);
    if (a === 'lvl' && i < l.length - 1) pr.lvl = l[i + 1];
    newPracProblem(); save(); render();
    if (cntDone(TD.levels, pr.done) === l.length && !pr.cardShown){ pr.cardShown = 1; save(); openCard(); }
  },
  card:function(){ C.prac.cardShown = 1; save(); openCard(); },
  cardcopy:function(){
    var c = cardData(), text = cardText(c), cv = cardCanvas(c);
    try {
      if (navigator.clipboard && window.ClipboardItem){
        cv.toBlob(function(blob){
          navigator.clipboard.write([new ClipboardItem({'image/png':blob, 'text/plain':new Blob([text], {type:'text/plain'})})]).then(function(){ cardMsg('✓ Copied (picture + text). Paste it into Google Classroom or an email.'); },
            function(){ copyText(text, function(ok){ cardMsg(ok ? '✓ Copied the text (this browser blocked the picture; use ⬇ Save PNG for it).' : 'Copy was blocked. Use ⬇ Save PNG instead.'); }); });
        });
        return;
      }
    } catch(e){}
    copyText(text, function(ok){ cardMsg(ok ? '✓ Copied the text. Use ⬇ Save PNG for the picture.' : 'Copy was blocked. Use ⬇ Save PNG instead.'); });
  },
  cardpng:function(){
    var c = cardData(), cv = cardCanvas(c);
    cv.toBlob(function(blob){ var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'density-calculations-card.png'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000); cardMsg('✓ Saved the PNG to your Downloads.'); });
  },
  cardmail:function(){ gmail(TD.title + ': Completion Card', cardText(cardData())); },
  /* free */
  fstep:function(a){ var st = +a, f = C.free; if (st >= f.step) return; if (st === 1) freeReset(1); else { f.b = null; f.step = 2; } save(); render(); },
  fvar:function(a){ var f = C.free; f.U = a; f.b = null; f.step = 2; f.err = ''; delete f.vals[a]; save(); render(); },
  funit:function(a){
    var p = a.split(':'), f = C.free;
    f.units[p[0]] = p[1]; f.err = '';
    Object.keys(f.vals).forEach(function(s){ f.vals[s].unit = fUnit(s); });
    save(); render();
  },
  fslot:function(a){ if (C.free.step !== 2 || a === C.free.U) return; if (freeKnowns().indexOf(a) < 0) return; openKeypad(a); },
  kp:function(a){ if (KP) kpKey(a); },
  fgo:function(){
    var f = C.free, kn = freeKnowns();
    if (!kn.every(function(s){ return f.vals[s]; })) return;
    var giv = {}, vline = null, vu = fVU();
    if (f.U !== 'D') giv.D = {val:f.vals.D.val, txt:f.vals.D.txt, unit:fUnit('D')};
    if (f.U !== 'm') giv.m = {val:f.vals.m.val, txt:f.vals.m.txt, unit:'g'};
    if (f.U !== 'V'){
      if (f.units.vm === 'disp'){
        var a = f.vals.Vi, z = f.vals.Vf;
        if (!(z.val > a.val)){ f.err = 'The water after must be higher than the water before.'; render(); return; }
        var v = z.val - a.val;
        giv.V = {val:v, txt:nice(v), unit:'mL', from:z.txt + ' − ' + a.txt + ' mL'};
        vline = 'V = water after − water before = ' + z.txt + ' − ' + a.txt + ' = ' + nice(v) + ' mL';
      } else if (f.units.vm === 'lwh'){
        var v2 = f.vals.L.val * f.vals.W.val * f.vals.H.val;
        giv.V = {val:v2, txt:nice(v2), unit:'cm³', from:f.vals.L.txt + ' × ' + f.vals.W.txt + ' × ' + f.vals.H.txt + ' cm'};
        vline = 'V = L × W × H = ' + f.vals.L.txt + ' × ' + f.vals.W.txt + ' × ' + f.vals.H.txt + ' = ' + nice(v2) + ' cm³';
      } else giv.V = {val:f.vals.V.val, txt:f.vals.V.txt, unit:vu};
    }
    f.err = '';
    var aunit = f.U === 'D' ? 'g/' + vu : f.U === 'm' ? 'g' : vu;
    f.b = newBoard('free', {fid:'density', U:f.U, givens:giv, aunit:aunit, kind:f.units.vm === 'lwh' ? 'block' : 'irr', col:'#9a8f86', rock:true});
    if (vline){ f.b.vline = vline; f.b.kdone.push(esc(vline)); if (f.units.vm === 'lwh') f.b.dims = {L:f.vals.L.val, W:f.vals.W.val, H:f.vals.H.val}; }
    f.step = 3; save(); render();
  },
  fagain:function(){ var f = C.free; f.vals = {}; f.b = null; f.step = 2; save(); render(); },
  fnew:function(){ freeReset(1); save(); render(); },
  fcopy:function(){ copyText(freeSummary(), function(ok){ var el = document.getElementById('fmsg'); if (el) el.textContent = ok ? '✓ Copied. Paste it into your lab or homework.' : 'Copy was blocked by this browser.'; }); },
  fmail:function(){ gmail(TD.title + ': Free Form', freeSummary()); },
  fprint:function(){ freePrint(); }
};

var suppressClick = false;
document.addEventListener('click', function(e){
  if (suppressClick){ e.preventDefault(); return; }
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var fn = ACT[el.dataset ? el.dataset.act : el.getAttribute('data-act')]; if (fn) fn(el.getAttribute('data-arg'), el);
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.slot[data-act]')){ e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') ACT.close();
});
function noClick(){ suppressClick = true; setTimeout(function(){ suppressClick = false; }, 80); }

/* ---------- drag a chip: onto a slot (plug in), or onto + − × ÷ (solve) ---------- */
var drag = null;
document.addEventListener('pointerdown', function(e){
  var c = e.target.closest('.chip[data-act="chip"],.chip[data-act="lchip"],.chip[data-act="schip"]'); if (!c || c.disabled) return;
  drag = {el:c, act:c.dataset.act, arg:c.dataset.arg, x:e.clientX, y:e.clientY, ghost:null};
});
document.addEventListener('pointermove', function(e){
  if (!drag) return;
  if (!drag.ghost){
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 10) return;
    var gh = drag.el.cloneNode(true); gh.classList.add('sel'); gh.classList.remove('glow');
    gh.style.cssText = 'position:fixed;pointer-events:none;z-index:80;opacity:.92;margin:0';
    document.body.appendChild(gh); drag.ghost = gh;
    document.querySelectorAll('.opbtn,.slot').forEach(function(o){ o.classList.add('glowable'); });
  }
  drag.ghost.style.left = (e.clientX - 30) + 'px'; drag.ghost.style.top = (e.clientY - 25) + 'px';
  e.preventDefault();
});
function endDrag(e, cancel){
  if (!drag) return; var d = drag; drag = null;
  if (!d.ghost) return;
  d.ghost.remove(); noClick();
  if (cancel) return;
  var el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el) return;
  if (d.act === 'chip'){ var s = el.closest('[data-act="slot"]'), b = curBoard(); if (s && b && b.phase === 'plug'){ b.sel = d.arg; placeChip(b, d.arg, s.dataset.arg); } return; }
  if (d.act === 'lchip'){ var s2 = el.closest('[data-act="lslot"]'), c = labCur(); if (s2 && c && c.ls.step === 'calc'){ c.ls.sel = d.arg; placeLab(d.arg, s2.dataset.arg); } return; }
  var b2 = curBoard(); if (!b2 || b2.locked || b2.busy || b2.auto) return;
  var ch = solveChips(b2.eq, b2.p.U)[+d.arg]; if (!ch) return;
  var opb = el.closest('.opbtn[data-act="op"]');
  if (opb){ doMove(b2, opb.dataset.arg, ch.ids); return; }
  if (el.closest('[data-drop="eq"]') && b2.op){ doMove(b2, b2.op, ch.ids); return; }
  b2.fb = {ok:false, title:'', why:'Drop the number onto + − × or ÷ (or tap an operation first, then the number).'}; render();
}
document.addEventListener('pointerup', function(e){ endDrag(e, false); });
document.addEventListener('pointercancel', function(e){ endDrag(e, true); });

/* ---------- lab bench dragging (samples + ruler) ---------- */
var LD = null;
function svgPt(svg, e){ var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
document.addEventListener('pointerdown', function(e){
  var el = e.target.closest && e.target.closest('#bench .ldrag'); if (!el) return;
  var svg = document.getElementById('bench'); if (!svg) return;
  LD = {el:el, k:el.getAttribute('data-k'), id:el.getAttribute('data-id'), p0:svgPt(svg, e), moved:false, svg:svg, base:C.lab.rx, nx:C.lab.rx};
  try { el.setPointerCapture(e.pointerId); } catch(x){}
  e.preventDefault();
});
document.addEventListener('pointermove', function(e){
  if (!LD) return;
  var p = svgPt(LD.svg, e), dx = p.x - LD.p0.x, dy = p.y - LD.p0.y;
  if (!LD.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
  LD.moved = true;
  if (LD.k === 'ruler'){ LD.nx = clamp(LD.base + dx, 140, 250); LD.el.setAttribute('transform', 'translate(' + LD.nx.toFixed(1) + ',0)'); }
  else LD.el.setAttribute('transform', 'translate(' + dx.toFixed(1) + ',' + dy.toFixed(1) + ')');
  e.preventDefault();
});
function labPointerEnd(e, cancel){
  if (!LD) return; var d = LD; LD = null; noClick();
  if (cancel){ render(); return; }
  var p = svgPt(d.svg, e);
  if (!d.moved){
    if (d.k === 'samp') labStart(d.id);
    else if (d.k === 'bal') dropInCyl();
    else toast('Drag the ruler sideways to line up the 0.');
    return;
  }
  if (d.k === 'samp'){ if (p.x >= 420 && p.y >= 150) labStart(d.id); else render(); }
  else if (d.k === 'bal'){ if (p.x >= 190 && p.x <= 420 && p.y <= 380) dropInCyl(); else render(); }
  else rulerDrop(d.nx);
}
document.addEventListener('pointerup', function(e){ labPointerEnd(e, false); });
document.addEventListener('pointercancel', function(e){ labPointerEnd(e, true); });
window.addEventListener('resize', function(){ fitEqs(); });

/* ---------- start ---------- */
var MQ = Q.get('mode');
if (MQ === 'free') C.tab = 'free';
else if (MQ === 'lab' && unlocked('lab')) C.tab = 'lab';
render();
if (C.tab === 'learn') playFrames();
var anyProgress = cntDone(TD.stops, C.learn.done) || cntDone(SAMP, C.lab.done) || cntDone(TD.gp, C.guided.done) || Object.keys(C.prac.count).length || C.free.U;
if (hadSave && anyProgress) setTimeout(function(){ toast('Welcome back — you’re right where you left off'); }, 300);
window.__S = function(){ return S; };
window.__T = {gen:gen, newBoard:newBoard, doPP:doPP, ppDef:ppDef, placeChip:placeChip, doMove:doMove, calc:calc, nextMove:nextMove, render:render, expect:expect, tmplSyms:tmplSyms, aloneSide:aloneSide, labStart:labStart, dropInCyl:dropInCyl, rulerDrop:rulerDrop, labRecord:labRecord, labVolq:labVolq, placeLab:placeLab, labCalc:labCalc, labId:labId, setVM:setVM, volqOpts:volqOpts, closestMat:closestMat, C:function(){ return C; }};
})();
