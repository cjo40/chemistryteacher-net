<!DOCTYPE html>
<html lang="en">

<title>Endothermic vs Exothermic – Interactive Activity</title>

<style>

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:18px;-webkit-text-size-adjust:100%}

.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

.tag.exo{color:var(--exo);background:var(--exo-bg);border-color:var(--exo)}

.fb{border-radius:10px;padding:.55rem .8rem;border:2px solid;margin-top:.6rem}

.fb.info{background:var(--acc-bg);border-color:var(--acc)}
.muted{color:var(--muted)}
.hint{font-size:.92rem;color:var(--muted);margin:.1rem 0 .4rem}
.exo-t{color:var(--exo);font-weight:700}.endo-t{color:var(--endo);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.learn-nav{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
.dots{display:flex;gap:.35rem;flex-wrap:wrap}
.dot{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:800;position:relative;padding:0}
.dot.cur{background:var(--ink);color:#fff}
.dot .ck{position:absolute;right:-6px;top:-7px;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;font-size:.7rem;line-height:20px;border:2px solid #fff}
.prog{flex:1;min-width:150px;font-size:.85rem}
.bar{height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.stop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:.9rem;align-items:start}

.stop .num{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--ink);color:#fff;font-size:.85em;margin-right:.2em;vertical-align:.08em}
.stop ul{margin:0;padding-left:1.2rem}.stop li{margin:.4rem 0}
.note{border-left:5px solid var(--focus);background:#fff8e6;padding:.45rem .7rem;border-radius:0 8px 8px 0;font-size:.95rem;margin-top:.7rem}
.vis svg{width:100%;height:auto;display:block;max-height:60vh}
.cap{margin-top:.5rem;min-height:2.9em;font-size:.97rem}
.learn-foot{display:flex;justify-content:space-between;gap:.5rem;margin-top:.7rem}

.part{cursor:pointer}
.part:hover{filter:brightness(.95)}
.lbl{font-size:17px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.lbl.sys{fill:#7a3d00}.lbl.sur{fill:#173a80}
.svgt{font-size:16px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}

.flow-out .mv{animation:flowOut 1.8s linear infinite}

.jig{animation:jig 1.1s ease-in-out infinite}

.th-col{transform-box:fill-box;transform-origin:50% 100%}

@keyframes thDown{0%,10%{transform:scaleY(.42)}65%,100%{transform:scaleY(.16)}}
.th-up{animation:thUp 4.5s ease-in-out infinite}
.th-down{animation:thDown 4.5s ease-in-out infinite}

.shake{animation:shake .45s}

.d-grid{stroke:#e2e5eb;stroke-width:1}
.d-axis{stroke:#15171c;stroke-width:3}
.d-tick{font-size:13px;fill:#4b5262}
.d-axlab{font-size:15px;fill:#15171c;font-weight:700}
.d-guide{stroke:#6b7280;stroke-width:2;stroke-dasharray:6 5}
.d-curve{fill:none;stroke:#15171c;stroke-width:4.5;stroke-linejoin:round}
.d-cat{fill:none;stroke:#555;stroke-width:3.5;stroke-dasharray:10 7}
.d-level{stroke:#15171c;stroke-width:8;stroke-linecap:round}
.d-dot{fill:#15171c}
.d-ea{stroke:#6a1fb0;stroke-width:4;fill:#6a1fb0}
.d-dh{stroke:#0b6b5a;stroke-width:4;fill:#0b6b5a}

.head{stroke:none!important}

.tg.bad .hit{stroke:rgba(163,21,26,.3);fill:rgba(163,21,26,.25)}
.badge circle{fill:#fff;stroke:#15171c;stroke-width:2.5}
.badge text{font-size:16px;font-weight:800;text-anchor:middle;fill:#15171c}
.badge.good circle{fill:var(--good);stroke:var(--good)}.badge.good text{fill:#fff}
.badge.bad circle{fill:var(--bad);stroke:var(--bad)}.badge.bad text{fill:#fff}

.handle{cursor:ns-resize}
/* cards grid (stop 6) */
.exgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem}

.excard{border:2px solid var(--line);border-radius:10px;background:#fff;padding:.35rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;min-height:120px;font-weight:700;font-size:.85rem;text-align:center}
.excard svg{width:52px;height:52px}
.excard.sel{outline:4px solid var(--focus)}
.excard.dim{opacity:.3}
/* lab */
.subtabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
.labgrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:.9rem;align-items:start}
.checklist h2{font-size:1.1rem}
.ckl{list-style:none;padding:0;margin:0}
.ckl li{display:flex;gap:.45rem;align-items:flex-start;margin:.3rem 0;font-size:.92rem}
.ckl button{all:unset;cursor:pointer;display:flex;gap:.45rem;align-items:flex-start}
.ckl button:focus-visible{outline:3px solid var(--focus)}
.ckbox{width:22px;height:22px;flex:none;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-weight:900;font-size:.8rem;background:#fff}
.ckl li.done .ckbox{background:var(--good);border-color:var(--good);color:#fff}
.ckl li.done .st{color:var(--good);font-weight:700}
@media (max-width:1180px){.labgrid{grid-template-columns:1fr}.checklist{order:-1}.ckl{display:flex;flex-wrap:wrap;gap:0 1rem}.ckl li{margin:.15rem 0}}
.toolbar{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;align-items:flex-end;padding:.45rem .7rem;border:2px solid var(--line);border-radius:10px;background:#fafbfc;margin:.5rem 0 .7rem}
.packgrid{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.2fr);gap:1rem}
@media (max-width:760px){.packgrid{grid-template-columns:1fr}}
.readout{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.readout .t{font-size:2.3rem;font-weight:800;font-variant-numeric:tabular-nums;border:3px solid var(--ink);border-radius:10px;padding:0 .5rem;background:#111;color:#7dff9a;line-height:1.25}
.graph{width:100%;height:290px;display:block;border:2px solid var(--line);border-radius:10px;background:#fff}
table.data{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
table.data th,table.data td{border:1px solid var(--line);padding:.22rem .35rem;text-align:center}
table.data th{background:var(--soft)}
.tablewrap{overflow:auto;max-height:240px}
input[type=range]{width:100%;height:40px;accent-color:var(--acc)}
.choice-grp{margin:.35rem 0}
.choice-grp b{display:block;margin-bottom:.2rem}
.buildgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,1fr);gap:1rem;align-items:start}
@media (max-width:900px){.buildgrid{grid-template-columns:1fr}}
.stat{display:grid;grid-template-columns:auto 1fr;gap:.15rem .7rem;font-size:1.05rem;align-items:center}
.stat b{font-variant-numeric:tabular-nums}
.stepper{display:grid;grid-template-columns:1fr auto auto;gap:.35rem;align-items:center;margin:.25rem 0}
.bigtype{font-size:1.15rem;font-weight:800;padding:.35rem .6rem;border-radius:10px;border:3px solid;margin:.4rem 0;text-align:center}
.bigtype.exo{color:var(--exo);background:var(--exo-bg);border-color:var(--exo)}
.bigtype.endo{color:var(--endo);background:var(--endo-bg);border-color:var(--endo)}
.bigtype.zero{color:var(--muted);border-color:var(--line)}
.chal{border:2px solid var(--acc);background:var(--acc-bg);border-radius:10px;padding:.6rem .7rem;margin-top:.6rem}
/* sort */
.pool{display:flex;flex-wrap:wrap;gap:.45rem;min-height:64px;padding:.5rem;border:2px dashed var(--line);border-radius:10px;background:#fff}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.7rem}
.bin{border:3px solid;border-radius:12px;padding:.5rem;min-height:140px;background:#fff;display:flex;flex-direction:column;gap:.4rem}
.bin.endo{border-color:var(--endo);background:var(--endo-bg)}
.bin.exo{border-color:var(--exo);background:var(--exo-bg)}
.bin h3{margin:0;font-size:1.05rem}.bin h3 small{font-weight:400;font-size:.8rem}
.bin.over{outline:4px solid var(--focus);outline-offset:2px}
.binlist{display:flex;flex-direction:column;gap:.35rem}
.chip{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:.4rem .65rem;min-height:44px;text-align:left;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;font-weight:600;font-size:.93rem;line-height:1.25}
.chip.selected{outline:4px solid var(--focus);outline-offset:1px}
.chip.dragging{z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.3);pointer-events:none}
.chip.placed{cursor:default;border-style:solid}
.chip.right{border-color:var(--good);background:var(--good-bg)}
.chip.wrong{border-color:var(--bad);background:var(--bad-bg)}
.chip .why{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
/* quiz */
.qwrap{max-width:900px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;font-weight:700;color:var(--muted);font-size:.9rem}
.qtype{display:inline-block;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--soft);border-radius:6px;padding:.1rem .45rem;margin:.3rem 0}
.qtext{font-size:1.25rem;margin:.3rem 0 .6rem}
.choices{display:grid;gap:.45rem}
.choice{display:flex;gap:.6rem;align-items:center;text-align:left;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:.5rem .7rem;min-height:48px;font-weight:600}
.choice .lt{flex:none;width:1.8em;height:1.8em;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice .mk{margin-left:auto;font-weight:800}
.qdiag svg{width:100%;max-width:640px;display:block;margin:0 auto;height:auto}
#cardCanvas{width:100%;max-width:900px;height:auto;display:block;border:2px solid var(--line);border-radius:10px;margin:.5rem 0;background:#fff}
.lockbox{max-width:760px;margin:1rem auto;text-align:left}
.lockbox li{margin:.35rem 0}
#qLetters .btn:disabled{opacity:.75}
@media (max-width:600px){header.top{position:static}.checklist{order:1!important}.tabs{margin-left:0}}
footer{max-width:1400px;margin:0 auto;padding:0 .8rem 1.2rem;font-size:.8rem;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap;justify-content:space-between;align-items:center}
footer button{font-size:.8rem;border:1px solid var(--line);background:#fff;border-radius:8px;padding:.3rem .6rem}
</style>
</head>

function vPE(el){

function vPhase(el){
  var B={S:[110,330,'SOLID'],L:[490,330,'LIQUID'],G:[300,78,'GAS']};
  var AR=[['melt','S','L','Melting','endo','Solid → liquid. Particles absorb energy to break out of their fixed positions (ice melting in your hand).'],
          ['freeze','L','S','Freezing','exo','Liquid → solid. Particles release energy as they lock into place (water freezing in a freezer).'],
          ['vap','L','G','Vaporization','endo','Liquid → gas (boiling or evaporating). Particles absorb energy to escape the liquid. Sweat evaporating cools your skin.'],
          ['cond','G','L','Condensation','exo','Gas → liquid. Particles release energy as they come together (steam on a mirror). Steam burns are worse than boiling-water burns for this reason.'],
          ['sub','S','G','Sublimation','endo','Solid → gas, skipping the liquid (dry ice, solid CO₂). Absorbs energy.'],
          ['dep','G','S','Deposition','exo','Gas → solid, skipping the liquid (frost forming on a cold window). Releases energy.']];
  var filt='all',sel=null;
  function geo(a,b){
    var A=B[a],C=B[b],dx=C[0]-A[0],dy=C[1]-A[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
    function tb(){return Math.min(75/Math.max(Math.abs(ux),1e-6),48/Math.max(Math.abs(uy),1e-6))+12;}
    var t=tb(),off=14;
    return {x1:A[0]+ux*t+nx*off,y1:A[1]+uy*t+ny*off,x2:C[0]-ux*t+nx*off,y2:C[1]-uy*t+ny*off,ux:ux,uy:uy,nx:nx,ny:ny};
  }
  function draw(){
    var s='<rect width="600" height="420" fill="#fff"/>';
    ['S','L','G'].forEach(function(k){var b=B[k];s+='<rect x="'+(b[0]-75)+'" y="'+(b[1]-48)+'" width="150" height="96" rx="12" fill="#f4f5f8" stroke="#15171c" stroke-width="3"/><text x="'+b[0]+'" y="'+(k==='G'?b[1]-56:b[1]+72)+'" text-anchor="middle" class="svgt">'+b[2]+'</text>';
      var p='';
      if(k==='S'){for(var r=0;r<3;r++)for(var c=0;c<5;c++)p+='<circle cx="'+(b[0]-40+c*20)+'" cy="'+(b[1]-20+r*20)+'" r="8" fill="#6c8ebf" stroke="#234" stroke-width="1.5"/>';}
      if(k==='L'){var pts=[[-48,30],[-30,32],[-12,30],[6,32],[24,30],[42,31],[-40,13],[-20,15],[0,12],[20,15],[38,13],[-28,-4],[10,-3]];pts.forEach(function(q,i){p+='<circle class="'+(i%2?'jig':'jig2')+'" cx="'+(b[0]+q[0])+'" cy="'+(b[1]+q[1])+'" r="8" fill="#6c8ebf" stroke="#234" stroke-width="1.5"/>';});}
      if(k==='G'){[[-50,-25],[35,-30],[-10,5],[50,20],[-45,28],[15,32]].forEach(function(q,i){p+='<circle class="'+(i%2?'jig':'jig2')+'" cx="'+(b[0]+q[0])+'" cy="'+(b[1]+q[1])+'" r="8" fill="#6c8ebf" stroke="#234" stroke-width="1.5"/>';});}
      s+=p;});
    AR.forEach(function(a){
      var g=geo(a[1],a[2]),col=a[4]==='endo'?'#1747c2':'#b8390c',dim=(filt!=='all'&&filt!==a[4]),hl=sel===a[0];
      var hx=g.x2,hy=g.y2,bx=hx-g.ux*16,by=hy-g.uy*16;
      var lt=a[0]==='sub'?0.42:(a[0]==='cond'?0.25:0.5),lx=g.x1+(g.x2-g.x1)*lt+g.nx*30,ly=g.y1+(g.y2-g.y1)*lt+g.ny*30,anc=Math.abs(g.nx)<0.3?'middle':(g.nx>0?'start':'end');
      s+='<g class="part" data-a="'+a[0]+'" opacity="'+(dim?0.18:1)+'">'+
        '<line x1="'+g.x1.toFixed(1)+'" y1="'+g.y1.toFixed(1)+'" x2="'+g.x2.toFixed(1)+'" y2="'+g.y2.toFixed(1)+'" stroke="rgba(0,0,0,0)" stroke-width="30"/>'+
        (hl?'<line x1="'+g.x1.toFixed(1)+'" y1="'+g.y1.toFixed(1)+'" x2="'+g.x2.toFixed(1)+'" y2="'+g.y2.toFixed(1)+'" stroke="#ffb000" stroke-width="16" stroke-linecap="round" opacity=".6"/>':'')+
        '<line x1="'+g.x1.toFixed(1)+'" y1="'+g.y1.toFixed(1)+'" x2="'+bx.toFixed(1)+'" y2="'+by.toFixed(1)+'" stroke="'+col+'" stroke-width="5" '+(a[4]==='exo'?'stroke-dasharray="10 6"':'')+'/>'+
        '<path d="M'+hx.toFixed(1)+' '+hy.toFixed(1)+' L'+(bx+g.nx*9).toFixed(1)+' '+(by+g.ny*9).toFixed(1)+' L'+(bx-g.nx*9).toFixed(1)+' '+(by-g.ny*9).toFixed(1)+'Z" fill="'+col+'"/>'+
        '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anc+'" class="svgt" fill="'+col+'">'+a[3]+'</text>'+
        '<text x="'+lx.toFixed(1)+'" y="'+(ly+17).toFixed(1)+'" text-anchor="'+anc+'" font-size="13" font-weight="700" fill="'+col+'" style="paint-order:stroke;stroke:#fff;stroke-width:4px">'+(a[4]==='endo'?'energy IN (endo)':'energy OUT (exo)')+'</text></g>';
    });
    var info=sel?AR.filter(function(a){return a[0]===sel;})[0]:null;
    el.innerHTML='<div class="row" style="margin-bottom:.4rem"><button class="btn sm'+(filt==='all'?' sel':'')+'" data-f="all">All 6</button><button class="btn sm endo'+(filt==='endo'?' sel':'')+'" data-f="endo">Energy IN (endo)</button><button class="btn sm exo'+(filt==='exo'?' sel':'')+'" data-f="exo">Energy OUT (exo)</button></div>'+
    '<svg viewBox="0 0 600 420" role="img" aria-label="Phase change triangle: solid, liquid and gas with six labeled arrows">'+s+'</svg>'+
    '<div class="cap">'+(info?'<b>'+info[3]+'</b> <span class="tag '+info[4]+'">'+(info[4]==='endo'?'Endothermic':'Exothermic')+'</span> '+info[5]:'Tap an arrow. Solid lines = energy <b>in</b>; dashed lines = energy <b>out</b>.')+'</div>';
  }
  el.addEventListener('click',function(e){var b=e.target.closest('button');if(b&&b.hasAttribute('data-f')){filt=b.getAttribute('data-f');draw();return;}var a=e.target.closest('[data-a]');if(a){sel=a.getAttribute('data-a');draw();}});
  draw();
}

function vEvidence(el){
  var T=22,raf=0,qi=0;
  var CHECKS=[['The water temperature goes from 22.0 °C to 29.4 °C.','exo','The surroundings got warmer, so energy left the system: exothermic, ΔH < 0.'],
              ['The water temperature goes from 21.5 °C to 16.2 °C.','endo','The surroundings got colder, so the system absorbed energy: endothermic, ΔH > 0.'],
              ['You hold the beaker and it feels colder and colder.','endo','Your hand is the surroundings. It is losing energy to the system, so the reaction is endothermic.'],
              ['A thermometer in the beaker rises 6 °C after mixing.','exo','A rising thermometer means the surroundings gained energy that the system released: exothermic.']];
  el.innerHTML='<svg viewBox="0 0 600 330" role="img" aria-label="Beaker with thermometer in the water">'+
   '<rect width="600" height="330" fill="#fafbfc"/>'+

   '<text x="225" y="182" text-anchor="middle" font-size="13" font-weight="800" fill="#7a3d00">system</text>'+
   '<rect x="292" y="20" width="18" height="268" rx="9" fill="#fff" stroke="#333" stroke-width="2.5"/><rect id="evc" x="297" y="150" width="8" height="132" fill="#d32020"/><circle cx="301" cy="285" r="13" fill="#d32020" stroke="#333" stroke-width="2.5"/>'+
   '<text x="392" y="110" class="svgt">Thermometer reads</text><text id="evt" x="392" y="160" font-size="42" font-weight="800">22.0 °C</text>'+
   '<text x="392" y="200" font-size="15" fill="#333">It sits in the <tspan font-weight="800">water</tspan>,</text><text x="392" y="220" font-size="15" fill="#333">which is part of the</text><text x="392" y="240" font-size="15" font-weight="800" fill="#333">surroundings.</text></svg>'+
   '<div class="row"><button class="btn exo" id="evExo">Run an exothermic reaction</button><button class="btn endo" id="evEndo">Run an endothermic reaction</button></div>'+
   '<div class="cap" id="evCap">Press a button and watch the thermometer.</div>'+
   '<div class="card" style="margin-top:.5rem;background:#fbfbfd"><b>Check yourself:</b> <span id="evQ"></span><div class="row" style="margin-top:.35rem"><button class="btn endo sm" data-ans="endo">Endothermic</button><button class="btn exo sm" data-ans="exo">Exothermic</button><button class="btn sm" id="evNext">Next scenario</button></div><div id="evFb"></div></div>';
  function show(){var y=282-(T-0)*4.4;$('#evc',el).setAttribute('y',y.toFixed(1));$('#evc',el).setAttribute('height',(282-y+3).toFixed(1));$('#evt',el).textContent=fmt(T,1)+' °C';
    var w=$('#evw',el);w.setAttribute('fill',T>24?'#ffd2b5':(T<20?'#a9c8ff':'#bfe0ff'));}
  function run(to){cancelAnimationFrame(raf);var from=22,t0=performance.now();T=22;show();
    $('#evCap',el).innerHTML='Running…';
    function f(now){var p=Math.min(1,(now-t0)/2200);T=from+(to-from)*(1-Math.pow(1-p,3));show();if(p<1)raf=requestAnimationFrame(f);else{
      $('#evCap',el).innerHTML=to>22?'<b>22.0 → '+fmt(to,1)+' °C: rose.</b> The surroundings <b>gained</b> energy → the system <b>released</b> it → <span class="exo-t">exothermic, ΔH < 0</span>.':'<b>22.0 → '+fmt(to,1)+' °C: fell.</b> The surroundings <b>lost</b> energy → the system <b>absorbed</b> it → <span class="endo-t">endothermic, ΔH > 0</span>.';}}
    raf=requestAnimationFrame(f);}
  function q(){$('#evQ',el).textContent=CHECKS[qi][0];$('#evFb',el).innerHTML='';}
  el.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    if(b.id==='evExo')run(31.4);else if(b.id==='evEndo')run(13.6);
    else if(b.id==='evNext'){qi=(qi+1)%CHECKS.length;q();}
    else if(b.hasAttribute('data-ans')){var ok=b.getAttribute('data-ans')===CHECKS[qi][1];$('#evFb',el).innerHTML='<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?'✓ Correct.':'✗ Not quite.')+'</b> '+CHECKS[qi][2]+'</div>';}
  });
  show();q();
  return function(){cancelAnimationFrame(raf);};
}

var STOPS=[
  {title:'System vs. surroundings',vis:vSystem,bullets:[
    'The <b>system</b> is the part we are studying: the <b>chemical reaction</b> itself (the reacting particles).',

    'Energy moves <b>between</b> the system and the surroundings, usually as <b>heat</b>.',
    'We describe energy changes from the <b>system’s point of view</b>: energy leaving the system is “released”; energy entering it is “absorbed”.']},
  {title:'Exothermic: energy OUT',vis:function(el){return vFlow(el,true);},bullets:[
    '<b>Exothermic</b>: the system <b>releases energy</b> to the surroundings (<b>exo</b> = out).',
    'The <b>surroundings get warmer</b>: the beaker, water and air heat up.',
    'The system ends with <b>less</b> energy, so <b>ΔH is negative</b> (ΔH < 0).',
    'Energy can be written as a <b>product</b>: CH₄ + 2O₂ → CO₂ + 2H₂O + <b>890 kJ</b> (ΔH = −890 kJ).']},
  {title:'Endothermic: energy IN',vis:function(el){return vFlow(el,false);},bullets:[

    'The <b>surroundings get colder</b>, which is why it <b>feels cold</b> to touch.',
    'The system ends with <b>more</b> energy, so <b>ΔH is positive</b> (ΔH > 0).',
    'Energy can be written as a <b>reactant</b>: NH₄NO₃(s) + <b>25.7 kJ</b> → NH₄⁺(aq) + NO₃⁻(aq).']},
  {title:'Bonds: breaking vs. forming',vis:vBonds,bullets:[
    '<b>Breaking bonds absorbs energy</b> (always endothermic).',
    '<b>Forming bonds releases energy</b> (always exothermic).',
    'If forming new bonds <b>releases more</b> energy than breaking old bonds absorbs → <b>exothermic</b>.',
    'If breaking bonds <b>absorbs more</b> energy than forming bonds releases → <b>endothermic</b>.',
    '<b>ΔH ≈ (energy to break bonds) − (energy released forming bonds)</b>.'],

    '<b>ΔH</b> = products − reactants, shown by an arrow from the reactant level to the product level.',

  {title:'Everyday examples',vis:vEveryday,bullets:[

    '<b>Endothermic</b>: <b>photosynthesis</b>, <b>instant cold packs</b> (NH₄NO₃ dissolving), <b>cooking an egg</b>, <b>baking soda + vinegar</b> (only slightly).',

/* ---------- drag & tap helper ---------- */
var selChip=null,lastDrag=0,lastDragChip=null;
function enableDnD(root,onMove){
  root.addEventListener('pointerdown',function(e){
    var chip=e.target.closest('.chip');if(!chip||!root.contains(chip)||chip.disabled||chip.classList.contains('placed'))return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    var sx=e.clientX,sy=e.clientY,moved=false,over=null;
    function mv(ev){var dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!moved&&Math.sqrt(dx*dx+dy*dy)>8){moved=true;chip.classList.add('dragging');if(selChip){selChip.classList.remove('selected');selChip=null;}}
      if(moved){ev.preventDefault();chip.style.transform='translate('+dx+'px,'+dy+'px)';
        var t=document.elementFromPoint(ev.clientX,ev.clientY),b=t&&t.closest?t.closest('[data-bin]'):null;if(b&&!root.contains(b))b=null;
        if(b!==over){if(over)over.classList.remove('over');over=b;if(over)over.classList.add('over');}}}
    function up(ev){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      chip.classList.remove('dragging');chip.style.transform='';if(over)over.classList.remove('over');
      if(moved){lastDrag=Date.now();lastDragChip=chip;if(over&&ev.type==='pointerup')onMove(chip,over.getAttribute('data-bin'));}}
    window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  });
  root.addEventListener('click',function(e){
    if(Date.now()-lastDrag<350&&(!e.target.closest('.chip')||e.target.closest('.chip')===lastDragChip))return;
    var chip=e.target.closest('.chip'),bin0=e.target.closest('[data-bin]');
    if(chip&&chip.classList.contains('placed'))chip=null;
    if(chip&&root.contains(chip)){if(chip.disabled)return;
      if(selChip&&selChip!==chip&&root.contains(selChip)&&bin0&&root.contains(bin0)&&!bin0.contains(selChip)){var c0=selChip;c0.classList.remove('selected');selChip=null;onMove(c0,bin0.getAttribute('data-bin'));return;}
      if(selChip===chip){chip.classList.remove('selected');selChip=null;}
      else{if(selChip)selChip.classList.remove('selected');selChip=chip;chip.classList.add('selected');}
      return;}
    var bin=e.target.closest('[data-bin]');
    if(bin&&root.contains(bin)&&selChip&&root.contains(selChip)){var c=selChip;c.classList.remove('selected');selChip=null;onMove(c,bin.getAttribute('data-bin'));}
  });
  root.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute&&e.target.hasAttribute('data-bin')&&e.target.tagName!=='BUTTON'){e.preventDefault();e.target.click();}});
}

var SOL={
  CaCl2:{f:'CaCl₂',name:'calcium chloride',M:110.98,dH:-82.8,col:'#b8390c',dash:[]},
  NaOH:{f:'NaOH',name:'sodium hydroxide',M:40.00,dH:-44.5,col:'#7a1fa2',dash:[10,6]},
  NH4NO3:{f:'NH₄NO₃',name:'ammonium nitrate',M:80.04,dH:25.7,col:'#1747c2',dash:[3,5]},
  KCl:{f:'KCl',name:'potassium chloride',M:74.55,dH:17.2,col:'#0f6b6b',dash:[12,5,3,5]}
};
var SOLKEYS=['CaCl2','NaOH','NH4NO3','KCl'];
var A={sol:'CaCl2',mass:5,speed:1,state:'ready',t:0,T:22,cur:null,trials:[],raf:0,last:0,xt:[]};
var T0=22.0,VW=100.0,C=4.18,TAU1=4.0,TAU2=1.5,DUR=30;
function resp(t){if(t<=0)return 0;return 1-(TAU1*Math.exp(-t/TAU1)-TAU2*Math.exp(-t/TAU2))/(TAU1-TAU2);}
function dissolved(t){return t<=0?0:1-Math.exp(-t/TAU1);}
function finalT(sol,mass){var s=SOL[sol],n=mass/s.M,q=-n*s.dH*1000;return T0+q/((VW+mass)*C);}

  '<g id="xtals"></g>'+
  '<g id="rod"><line x1="120" y1="8" x2="150" y2="324" stroke="#8a8f98" stroke-width="7" stroke-linecap="round" opacity=".9"/></g>'+
  '<path d="M48 20 L60 32 L60 318 Q60 338 80 338 L240 338 Q260 338 260 318 L260 32 L272 20" fill="none" stroke="#2c3440" stroke-width="7" stroke-linejoin="round"/>'+

  '<g id="drops" opacity="0" fill="#7fb2ff">'+[60,110,170,230,280].map(function(y,i){return '<circle cx="'+(i%2?52:268)+'" cy="'+(y+60)+'" r="3.5"/><circle cx="'+(i%2?268:52)+'" cy="'+(y+80)+'" r="3"/>';}).join('')+'</g>'+

  (function(){var s='';for(var T=0;T<=80;T+=10){var y=ty(T);s+='<line x1="216" y1="'+y+'" x2="226" y2="'+y+'" stroke="#333" stroke-width="2"/><text x="229" y="'+(y+4)+'" font-size="12" font-weight="700" fill="#222" style="paint-order:stroke;stroke:#fff;stroke-width:3px">'+T+'</text>';if(T<80)s+='<line x1="216" y1="'+ty(T+5)+'" x2="221" y2="'+ty(T+5)+'" stroke="#333" stroke-width="1.5"/>';}return s;})()+
  '</g>';
  $('#beaker').innerHTML=b;
  el.addEventListener('click',labAClick);

function ty(T){return +(300-T*3.5).toFixed(1);}
function labAClick(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-sol')&&A.state!=='running'){if(A.state==='done')newTrial();A.sol=b.getAttribute('data-sol');updateLabA();}
  else if(b.hasAttribute('data-spd')){A.speed=+b.getAttribute('data-spd');$$('[data-spd]').forEach(function(x){x.classList.toggle('sel',x===b);});}
  else if(b.id==='runBtn'&&A.state!=='running'){if(A.state==='done')newTrial();startRun();}
  else if(b.id==='newBtn'&&A.state==='done')newTrial();
  else if(b.hasAttribute('data-cls')){var g=b.getAttribute('data-cls').split(':');A.cur.pick=A.cur.pick||{};A.cur.pick[g[0]]=g[1];$$('[data-cls^="'+g[0]+':"]').forEach(function(x){x.classList.toggle('sel',x===b);});$('#clsCheck').disabled=!(A.cur.pick.type&&A.cur.pick.sign);}
  else if(b.id==='clsCheck')checkClass();
  else if(b.id==='mathBtn'){var m=$('#mathBox');m.hidden=!m.hidden;b.textContent=m.hidden?'Show the math':'Hide the math';}
}
function updateLabA(){
  var s=SOL[A.sol];
  $$('[data-sol]').forEach(function(x){var k=x.getAttribute('data-sol');x.classList.toggle('sel',k===A.sol);x.disabled=A.state==='running';x.textContent=SOL[k].f+(S.sol[k]?' ✓':'');});
  $('#mass').disabled=A.state==='running';
  $('#massVal').textContent=fmt(A.mass,1)+' g';
  $('#runBtn').disabled=A.state==='running';
  $('#newBtn').disabled=A.state!=='done';
  $('#boatLbl').textContent=A.state==='ready'?fmt(A.mass,1)+' g '+s.f:(A.cur?fmt(A.cur.mass,1)+' g '+SOL[A.cur.sol].f+' added':'');
  $('#pile').style.display=A.state==='ready'?'':'none';
  drawBeaker();
}
function tempColor(T){
  var d=clamp((T-22)/30,-1,1),a=[191,224,255],h=[255,196,160],c=[150,190,255],t=d>=0?h:c,k=Math.abs(d);
  return 'rgb('+Math.round(a[0]+(t[0]-a[0])*k)+','+Math.round(a[1]+(t[1]-a[1])*k)+','+Math.round(a[2]+(t[2]-a[2])*k)+')';
}
function drawBeaker(){
  var T=A.T,y=ty(T);
  $('#tcol').setAttribute('y',y);$('#tcol').setAttribute('height',(322-y).toFixed(1));
  $('#water').setAttribute('fill',tempColor(T));
  $('#steam').setAttribute('opacity',clamp((T-30)/20,0,0.9).toFixed(2));
  $('#drops').setAttribute('opacity',clamp((17-T)/5,0,1).toFixed(2));
  $('#tRead').textContent=fmt(T,1)+' °C';
  $('#tTime').textContent='t = '+fmt(A.t,1)+' s';
  var rod=$('#rod'),stir=A.state==='running'&&A.t<14;
  rod.setAttribute('transform',stir?'rotate('+(7*Math.sin(A.t*5)).toFixed(2)+' 134 160)':'');
  var x='';
  if(A.state!=='ready'&&A.cur){
    var f=dissolved(A.t),fall=Math.min(1,A.t/0.7);
    A.xt.forEach(function(c){var sz=c.s*Math.cbrt(Math.max(0,1-f));if(sz<1.5)return;var cy=-20+(c.y+20)*fall*fall;x+='<rect x="'+(c.x-sz/2).toFixed(1)+'" y="'+(cy-sz/2).toFixed(1)+'" width="'+sz.toFixed(1)+'" height="'+sz.toFixed(1)+'" fill="#fff" stroke="#777" stroke-width="1.2" transform="rotate('+c.r+' '+c.x+' '+cy.toFixed(1)+')"/>';});
  }
  $('#xtals').innerHTML=x;
}
function startRun(){
  var tf=finalT(A.sol,A.mass);
  A.cur={sol:A.sol,mass:A.mass,Ti:T0,Tf:tf,pts:[[0,T0]],done:false,pick:null,ok:null,id:A.trials.length+1};
  A.trials.push(A.cur);
  var n=Math.round(4+A.mass*0.8);A.xt=[];
  for(var i=0;i<n;i++)A.xt.push({x:80+Math.random()*105,y:318+Math.random()*12,s:7+Math.random()*5,r:Math.round(Math.random()*60)});
  A.state='running';A.t=0;A.T=T0;A.last=0;$('#classify').innerHTML='';
  updateLabA();
  A.raf=requestAnimationFrame(frame);
}
function frame(now){
  if(A.state!=='running')return;
  if(!A.last)A.last=now;
  var dt=Math.min(0.1,(now-A.last)/1000)*A.speed*2;A.last=now;
  var tPrev=A.t;A.t=Math.min(DUR,A.t+dt);
  var cur=A.cur,dT=cur.Tf-T0;
  for(var ts=Math.floor(tPrev/0.25+1)*0.25;ts<=A.t+1e-9;ts+=0.25){cur.pts.push([ts,T0+dT*resp(ts)]);}
  A.T=T0+dT*resp(A.t);
  if(A.t>=DUR){A.T=cur.Tf;cur.pts[cur.pts.length-1]=[DUR,cur.Tf];A.state='done';cur.done=true;updateLabA();drawGraph();drawTables();showClassify();return;}
  drawBeaker();drawGraph();if(Math.floor(A.t)!==Math.floor(tPrev))drawTables();
  A.raf=requestAnimationFrame(frame);
}
function newTrial(){A.state='ready';A.t=0;A.T=T0;A.xt=[];$('#classify').innerHTML='';updateLabA();drawGraph();drawTables();}
function showClassify(){
  var c=A.cur,s=SOL[c.sol],dt=Math.round((c.Tf-T0)*10)/10;
  $('#classify').innerHTML='<div class="card" style="margin-top:.6rem;border-color:var(--acc)"><b>Trial '+c.id+': '+fmt(c.mass,1)+' g '+s.f+'.</b> The thermometer went from <b>22.0 °C</b> to <b>'+fmt(c.Tf,1)+' °C</b> (ΔT = '+fmtS(dt,1)+' °C).'+
  '<div class="choice-grp"><b>Dissolving '+s.f+' is…</b><div class="row"><button class="btn sm endo" data-cls="type:endo">Endothermic</button><button class="btn sm exo" data-cls="type:exo">Exothermic</button></div></div>'+
  '<div class="choice-grp"><b>The sign of ΔH is…</b><div class="row"><button class="btn sm" data-cls="sign:+">Positive (+)</button><button class="btn sm" data-cls="sign:-">Negative (−)</button></div></div>'+
  '<button class="btn pri" id="clsCheck" disabled>Check</button><div id="clsFb"></div></div>';
}
function checkClass(){
  var c=A.cur,s=SOL[c.sol],exo=s.dH<0,p=c.pick,okT=(p.type==='exo')===exo,okS=(p.sign==='-')===exo,ok=okT&&okS;
  c.ok=ok;c.call=(p.type==='exo'?'Exo':'Endo')+', ΔH '+(p.sign==='-'?'−':'+');
  var fb='';
  if(ok){
    if(!S.sol[c.sol]){S.sol[c.sol]=true;save();}
    var dT=Math.round((c.Tf-T0)*10)/10,m=VW+c.mass,qw=m*C*dT,n=c.mass/s.M,dH=-qw/n/1000;
    fb='<div class="fb good"><b>✓ Correct!</b> The water (surroundings) got '+(exo?'<b>warmer</b>, so dissolving '+s.f+' <b>released</b> energy: exothermic, ΔH negative.':'<b>colder</b>, so dissolving '+s.f+' <b>absorbed</b> energy: endothermic, ΔH positive.')+
    ' <button class="btn sm" id="mathBtn">Show the math</button><div id="mathBox" hidden style="margin-top:.4rem;font-variant-numeric:tabular-nums">'+
    'q<sub>water</sub> = m·c·ΔT = ('+fmt(m,1)+' g)(4.18 J/g·°C)('+fmtS(dT,1)+' °C) = <b>'+fmtS(qw,0)+' J</b><br>'+
    'q<sub>reaction</sub> = −q<sub>water</sub> = <b>'+fmtS(-qw,0)+' J</b><br>'+
    'n = '+fmt(c.mass,1)+' g ÷ '+fmt(s.M,2)+' g/mol = <b>'+n.toFixed(4)+' mol</b><br>'+
    'ΔH = q<sub>reaction</sub> ÷ n = <b>'+fmtS(dH,1)+' kJ/mol</b> &nbsp;(accepted: '+fmtS(s.dH,1)+' kJ/mol)<br>'+
    '<span class="muted">m includes the dissolved solid. Small differences come from rounding ΔT to 0.1 °C, so bigger masses give closer answers.</span></div></div>';
  }else{
    var up=c.Tf>T0;
    fb='<div class="fb bad"><b>✗ Not quite.</b> The thermometer is in the <b>water</b> (surroundings) and it went <b>'+(up?'UP':'DOWN')+'</b>. '+(up?'If the surroundings gained energy, did the system release or absorb it?':'If the surroundings lost energy, where did it go?')+' Change your answer and check again.</div>';
  }
  $('#clsFb').innerHTML=fb;
  if(ok){$$('[data-cls]').forEach(function(x){x.disabled=true;});$('#clsCheck').disabled=true;}
  drawTables();updateLabA();updateLocks();
}
function drawTables(){
  var c=A.cur,rows='<tr><th>Time (s)</th><th>Temperature (°C)</th></tr>';
  if(c){$('#tdLabel').textContent='(trial '+c.id+': '+fmt(c.mass,1)+' g '+SOL[c.sol].f+')';
    for(var t=0;t<=DUR;t+=3){var have=t<=A.t+1e-9||c.done;rows+='<tr><td>'+t+'</td><td>'+(have?fmt(t===DUR&&c.done?c.Tf:T0+(c.Tf-T0)*resp(t),1):'')+'</td></tr>';}}
  else{$('#tdLabel').textContent='';rows+='<tr><td colspan="2">Run a trial to collect data.</td></tr>';}
  $('#trialTable').innerHTML=rows;
  var r='<tr><th>#</th><th>Solid</th><th>Mass (g)</th><th>T<sub>i</sub> (°C)</th><th>T<sub>f</sub> (°C)</th><th>ΔT (°C)</th><th>Your call</th><th>Result</th></tr>';
  var done=A.trials.filter(function(x){return x.done;});
  if(!done.length)r+='<tr><td colspan="8">No completed trials yet.</td></tr>';
  done.forEach(function(x){var d=Math.round((x.Tf-T0)*10)/10;r+='<tr><td>'+x.id+'</td><td>'+SOL[x.sol].f+'</td><td>'+fmt(x.mass,1)+'</td><td>22.0</td><td>'+fmt(x.Tf,1)+'</td><td>'+fmtS(d,1)+'</td><td>'+(x.call||'—')+'</td><td>'+(x.ok===true?'✓ correct':(x.ok===false?'✗ try again':'not classified'))+'</td></tr>';});
  $('#results').innerHTML=r;
}
function drawGraph(){
  var cv=$('#graph');if(!cv||!cv.offsetParent)return;
  var w=cv.clientWidth,h=cv.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  var pad={l:52,r:70,t:14,b:44},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;
  var ser=A.trials.slice(-6),lo=22,hi=22;
  ser.forEach(function(s){s.pts.forEach(function(p){lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1]);});});
  lo=Math.floor((lo-1)/5)*5;hi=Math.ceil((hi+1)/5)*5;if(hi-lo<10){hi=lo+10;}
  var gs=(hi-lo)>40?10:5;
  function X(t){return pad.l+t/DUR*pw;}function Yv(T){return pad.t+(hi-T)/(hi-lo)*ph;}
  c.font='13px "Atkinson Hyperlegible",system-ui,sans-serif';c.lineWidth=1;c.strokeStyle='#e2e5eb';c.fillStyle='#333';
  c.textAlign='right';c.textBaseline='middle';
  for(var T=lo;T<=hi;T+=gs){c.beginPath();c.moveTo(pad.l,Yv(T));c.lineTo(pad.l+pw,Yv(T));c.stroke();c.fillText(T,pad.l-6,Yv(T));}
  c.textAlign='center';c.textBaseline='top';
  for(var t=0;t<=DUR;t+=5){c.beginPath();c.moveTo(X(t),pad.t);c.lineTo(X(t),pad.t+ph);c.stroke();c.fillText(t,X(t),pad.t+ph+5);}
  c.strokeStyle='#15171c';c.lineWidth=2.5;c.beginPath();c.moveTo(pad.l,pad.t);c.lineTo(pad.l,pad.t+ph);c.lineTo(pad.l+pw,pad.t+ph);c.stroke();
  c.font='bold 14px "Atkinson Hyperlegible",system-ui,sans-serif';c.fillStyle='#15171c';c.fillText('Time (s)',pad.l+pw/2,h-18);
  c.save();c.translate(14,pad.t+ph/2);c.rotate(-Math.PI/2);c.textBaseline='middle';c.fillText('Temperature (°C)',0,0);c.restore();
  c.setLineDash([4,4]);c.strokeStyle='#888';c.lineWidth=1.5;c.beginPath();c.moveTo(pad.l,Yv(22));c.lineTo(pad.l+pw,Yv(22));c.stroke();c.setLineDash([]);
  if(!ser.length){c.font='15px "Atkinson Hyperlegible",system-ui,sans-serif';c.fillStyle='#4b5262';c.textAlign='center';c.textBaseline='middle';c.fillText('Your temperature-vs-time data will appear here.',pad.l+pw/2,pad.t+ph/2-14);return;}
  ser.forEach(function(s,i){var sl=SOL[s.sol],last=i===ser.length-1;
    c.strokeStyle=sl.col;c.globalAlpha=last?1:0.55;c.lineWidth=last?4:2.5;c.setLineDash(sl.dash);c.beginPath();

  }
  if(q.type==='sort'){
    h+='<p class="hint">Drag each card into a bin, or tap a card and then tap a bin. Tap the gray area to move a card back. Then press <b>Check answer</b>.</p><div id="qsort"><div class="pool" data-bin="pool" id="qPool"></div><div class="bins"><div class="bin endo" data-bin="endo" tabindex="0" role="button" aria-label="Endothermic bin"><h3>↓ Endothermic</h3><div class="binlist" id="qEndo"></div></div><div class="bin exo" data-bin="exo" tabindex="0" role="button" aria-label="Exothermic bin"><h3>↑ Exothermic</h3><div class="binlist" id="qExo"></div></div></div></div><div class="row" style="margin-top:.6rem"><button class="btn pri" id="qSortCheck" disabled>Check answer</button></div>';
  }
  if(q.type==='click'){
    h+='<div class="qdiag" id="qClick">'+diagSVG(D({R:b.dg.R,P:b.dg.P,pk:b.dg.pk,cat:b.dg.cat!=null?b.dg.cat:null,letters:q.letters,click:true}),'Unlabeled potential energy diagram with lettered parts')+'</div>'+
    '<p class="hint">Click the part on the diagram, or choose its letter:</p><div class="row" id="qLetters">'+Object.keys(q.letters).map(function(t){return q.letters[t]+'|'+t;}).sort().map(function(s){var p=s.split('|');return '<button class="btn" data-t="'+p[1]+'" style="min-width:3rem">'+p[0]+'</button>';}).join('')+'</div>';
  }
  h+='<div id="qfb" aria-live="polite"></div><div class="row" style="margin-top:.6rem;justify-content:flex-end"><button class="btn pri" id="qNext" hidden>'+(Q.i===Q.list.length-1?'See my score card →':'Next question →')+'</button></div></div>';
  el.innerHTML=h;Q.answered=false;
  if(q.type==='sort')drawQSort();
}
function drawQSort(){
  var q=Q.list[Q.i],pool='',en='',ex='';selChip=null;
  q.items.forEach(function(it,j){var cls='chip';if(Q.answered)cls+=' placed '+(it.at===it.k?'right':'wrong');
    var hh='<button class="'+cls+'" data-j="'+j+'"'+(Q.answered?' disabled':'')+'>'+(Q.answered?(it.at===it.k?'✓ ':'✗ '):'')+it.t+(Q.answered&&it.at!==it.k?'<span class="why">Belongs in '+(it.k==='endo'?'Endothermic':'Exothermic')+'</span>':'')+'</button>';
    if(it.at==='pool')pool+=hh;else if(it.at==='endo')en+=hh;else ex+=hh;});
  $('#qPool').innerHTML=pool||'<span class="muted" style="font-size:.85rem">All cards placed.</span>';$('#qEndo').innerHTML=en;$('#qExo').innerHTML=ex;
  var btn=$('#qSortCheck');if(btn)btn.disabled=Q.answered||q.items.some(function(it){return it.at==='pool';});
}
function grade(ok,extra){
  var q=Q.list[Q.i];Q.answered=true;if(ok)Q.score++;Q.ans.push({ok:ok,s:q.src.s});
  $('#qfb').innerHTML='<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?'✓ Correct!':'✗ Not quite.')+'</b> '+(extra||'')+q.src.ex+'</div>';
  $('#qNext').hidden=false;$('#qNext').focus();
  $('.qhead span:last-child').textContent='Attempt #'+Q.attempt+' · Score: '+Q.score;
}
function quizClick(e){
  var el=$('#quiz'),b=e.target.closest('button');
  if(b&&b.id==='qStart'){startQuiz();return;}
  if(b&&b.hasAttribute('data-gostop')){showTab('learn');renderStop(+b.getAttribute('data-gostop'));return;}
  if(b&&b.hasAttribute('data-golab')){goLab(b.getAttribute('data-golab'));return;}
  if(b&&b.id==='qNext'){if(Q.i<Q.list.length-1){Q.i++;renderQ();window.scrollTo(0,0);}else{Q.finished=true;Q.date=new Date();renderCard();window.scrollTo(0,0);}return;}
  if(b&&b.id==='qRetake'){Q={list:[],i:0,ans:[],score:0,answered:false,finished:false,attempt:0,date:null};startQuiz();window.scrollTo(0,0);return;}
  if(b&&b.id==='dlPng'){downloadCard();return;}
  if(b&&b.id==='cpPng'){copyCard();return;}
  if(b&&b.id==='gmail'){emailCard();return;}
  if(!Q.list.length||Q.finished)return;
  var q=Q.list[Q.i];if(Q.answered)return;
  if(q.type==='mc'&&b&&b.hasAttribute('data-oi')){
    var oi=+b.getAttribute('data-oi'),ok=oi===0;
    $$('.choice',el).forEach(function(c){c.disabled=true;var o=+c.getAttribute('data-oi');if(o===0){c.classList.add('right');$('.mk',c).textContent='✓ correct';}else if(c===b){c.classList.add('wrong');$('.mk',c).textContent='✗ your answer';}});
    grade(ok,ok?'':'The answer is “'+q.src.c[0]+'.” ');return;
  }
  if(q.type==='sort'&&b&&b.id==='qSortCheck'){
    var right=q.items.filter(function(it){return it.at===it.k;}).length,ok2=right===q.items.length;
    drawQSort();grade(ok2,ok2?'':right+' of '+q.items.length+' were in the right bin. ');return;
  }
  if(q.type==='click'){
    var t=e.target.closest('[data-t]');if(!t)return;var pick=t.getAttribute('data-t'),ok3=pick===q.src.target;
    $$('#qClick .tg,#qClick .badge',el).forEach(function(g){var gt=g.getAttribute('data-t');if(gt===q.src.target)g.classList.add('good');else if(gt===pick)g.classList.add('bad');g.classList.remove('clk');});
    $$('#qLetters button',el).forEach(function(x){x.disabled=true;var xt=x.getAttribute('data-t');if(xt===q.src.target){x.classList.add('sel');x.style.background='var(--good)';x.style.borderColor='var(--good)';x.textContent+=' ✓';}else if(xt===pick){x.textContent+=' ✗';}});
    grade(ok3,ok3?'':'The correct part is letter '+q.letters[q.src.target]+'. ');
  }
}
$('#quiz').addEventListener('click',quizClick);
enableDnD($('#quiz'),function(chip,bin){
  if(!Q.list.length||Q.answered)return;var q=Q.list[Q.i];if(q.type!=='sort')return;
  var j=+chip.getAttribute('data-j');if(isNaN(j))return;q.items[j].at=bin;drawQSort();
});

/* ---------- score card ---------- */
function dateStr(d){try{return d.toLocaleString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return d.toString();}}
function fit(c,t,w){if(c.measureText(t).width<=w)return t;while(t.length>3&&c.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…';}
function paintCard(cv){
  var W=900,H=790,sc=2,F='"Atkinson Hyperlegible",system-ui,sans-serif';
  cv.width=W*sc;cv.height=H*sc;var c=cv.getContext('2d');c.setTransform(sc,0,0,sc,0,0);
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  c.fillStyle='#15171c';c.fillRect(0,0,W,112);
  c.fillStyle='#f08a4b';c.fillRect(0,112,W/2,8);c.fillStyle='#4f7df0';c.fillRect(W/2,112,W/2,8);
  c.fillStyle='#fff';c.textBaseline='alphabetic';c.textAlign='left';
  c.font='bold 34px '+F;c.fillText('Endothermic vs Exothermic – Score Card',36,56);
  c.font='20px '+F;c.fillText('chemistryteacher.net/endothermic-exothermic',36,90);
  c.fillStyle='#15171c';c.font='20px '+F;
  c.fillText('Date: '+dateStr(Q.date||new Date()),36,166);
  c.fillText('Attempt #'+Q.attempt,36,198);
  c.fillText('Questions: 10 (random from a '+BANK.length+'-question bank)',36,230);
  var pct=Q.score/10;
  c.fillStyle=pct>=0.8?'#e3f5ea':(pct>=0.6?'#fff6dd':'#fdeaea');c.strokeStyle='#15171c';c.lineWidth=3;
  if(c.roundRect){c.beginPath();c.roundRect(650,140,214,104,14);c.fill();c.stroke();}else{c.fillRect(650,140,214,104);c.strokeRect(650,140,214,104);}
  c.fillStyle='#15171c';c.textAlign='center';c.font='bold 54px '+F;c.fillText(Q.score+' / 10',757,208);c.font='bold 16px '+F;c.fillText('SCORE',757,234);
  c.textAlign='left';c.strokeStyle='#c4c9d2';c.lineWidth=2;c.beginPath();c.moveTo(36,262);c.lineTo(W-36,262);c.stroke();
  for(var i=0;i<Q.ans.length;i++){
    var a=Q.ans[i],y=300+i*44,cx=58;
    if(i%2===0){c.fillStyle='#f5f6f8';c.fillRect(36,y-22,W-72,44);}
    c.beginPath();c.arc(cx,y,14,0,Math.PI*2);c.fillStyle=a.ok?'#0f6b37':'#a3151a';c.fill();
    c.strokeStyle='#fff';c.lineWidth=3.5;c.lineCap='round';c.beginPath();
    if(a.ok){c.moveTo(cx-7,y);c.lineTo(cx-2,y+6);c.lineTo(cx+8,y-6);}else{c.moveTo(cx-6,y-6);c.lineTo(cx+6,y+6);c.moveTo(cx+6,y-6);c.lineTo(cx-6,y+6);}c.stroke();
    c.fillStyle='#15171c';c.font='bold 20px '+F;c.textBaseline='middle';c.fillText((i+1)+'.',84,y+1);
    c.font='20px '+F;c.fillText(fit(c,a.s,640),118,y+1);
    c.font='bold 16px '+F;c.textAlign='right';c.fillStyle=a.ok?'#0f6b37':'#a3151a';c.fillText(a.ok?'Correct':'Incorrect',W-48,y+1);c.textAlign='left';c.textBaseline='alphabetic';
  }
  c.fillStyle='#4b5262';c.font='15px '+F;c.fillText('Learn → Lab → Quiz · No name or personal information is recorded on this card.',36,H-24);
}
function renderCard(){
  var el=$('#quiz');
  el.innerHTML='<div class="card"><h2>Your score: '+Q.score+' / 10</h2><p class="hint">Attempt #'+Q.attempt+'. Download or copy your score card, then email it to your teacher if asked.</p><canvas id="cardCanvas" aria-label="Score card image: '+Q.score+' out of 10"></canvas>'+
  '<div class="row"><button class="btn pri" id="dlPng">⬇ Download PNG</button><button class="btn" id="cpPng">⧉ Copy image</button><button class="btn" id="gmail">✉ Email via Gmail</button><button class="btn" id="qRetake">↻ Retake quiz (new questions)</button></div><div id="cardMsg" aria-live="polite"></div>'+
  '<p class="hint" style="margin-top:.6rem">Email tip: download the PNG first, then attach it in the Gmail window. The To: line is left blank for you.</p></div>';
  paintCard($('#cardCanvas'));
}
function cardMsg(t,good){$('#cardMsg').innerHTML='<div class="fb '+(good?'good':'info')+'">'+t+'</div>';}
function downloadCard(){
  var cv=$('#cardCanvas'),name='endothermic-exothermic-score-attempt-'+Q.attempt+'.png';
  try{cv.toBlob(function(b){if(!b){fallback();return;}var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);cardMsg('Saved <b>'+name+'</b> (check your Downloads folder).',true);},'image/png');}catch(e){fallback();}
  function fallback(){try{var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=name;document.body.appendChild(a);a.click();a.remove();cardMsg('Saved '+name+'.',true);}catch(x){cardMsg('Download is blocked on this device. Take a screenshot of the card instead.');}}
}
function copyCard(){
  var cv=$('#cardCanvas');
  if(!navigator.clipboard||typeof ClipboardItem==='undefined'){cardMsg('Copying images is not supported in this browser. Use <b>Download PNG</b> instead.');return;}
  var p=new Promise(function(res,rej){cv.toBlob(function(b){b?res(b):rej(new Error('no blob'));},'image/png');});
  navigator.clipboard.write([new ClipboardItem({'image/png':p})]).then(function(){cardMsg('Score card copied. Paste it with Ctrl+V (⌘+V on Mac/iPad).',true);})
  .catch(function(){p.then(function(b){return navigator.clipboard.write([new ClipboardItem({'image/png':b})]);}).then(function(){cardMsg('Score card copied. Paste it with Ctrl+V (⌘+V on Mac/iPad).',true);}).catch(function(){cardMsg('This browser blocked copying the image. Use <b>Download PNG</b> instead.');});});
}
function emailCard(){
  var lines=['Endothermic vs Exothermic – Score Card','chemistryteacher.net/endothermic-exothermic','Date: '+dateStr(Q.date||new Date()),'Attempt #'+Q.attempt,'Score: '+Q.score+'/10',''];
  Q.ans.forEach(function(a,i){lines.push((i+1)+'. '+(a.ok?'✓':'✗')+' '+a.s);});
  lines.push('','(Score card PNG attached.)');
  var url='https://mail.google.com/mail/?view=cm&fs=1&to=&su='+encodeURIComponent('Endothermic vs Exothermic – Score Card')+'&body='+encodeURIComponent(lines.join('\n'));
  var w=null;try{w=window.open(url,'_blank');}catch(e){}
  if(w){try{w.opener=null;}catch(e){}cardMsg('Gmail opened in a new tab. Attach the PNG you downloaded, add your teacher’s address, and send.',true);}
  else cardMsg('Your browser blocked the pop-up. <a href="'+url.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">Open Gmail here</a>, then attach the PNG.');
}

/* ---------- tabs ---------- */
var curTab='learn';
function showTab(t){
  curTab=t;$$('.tab').forEach(function(b){b.setAttribute('aria-selected',b.getAttribute('data-tab')===t?'true':'false');});
  $$('.panel').forEach(function(p){p.classList.toggle('on',p.id==='p-'+t);});
  if(t==='learn')renderStop(curStop);else stopVisual();
  if(t==='lab'){showSub(curSub);}
  if(t==='quiz')renderQuizHome();
  window.scrollTo(0,0);
}
$$('.tab').forEach(function(b){b.addEventListener('click',function(){showTab(b.getAttribute('data-tab'));});});
var rsT=0;window.addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(drawGraph,120);});
var resetArm=0;
$('#resetAll').addEventListener('click',function(){
  var b=this;if(Date.now()-resetArm>4000){resetArm=Date.now();b.textContent='Click again to erase all progress';return;}
  try{localStorage.removeItem(KEY);}catch(e){}location.reload();
});

/* ---------- init ---------- */
buildLabA();buildLabC();
renderStop(0);updateLocks();
})();
</script>
