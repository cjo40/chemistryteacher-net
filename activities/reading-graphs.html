<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph of the Day: Reading &amp; Interpreting Graphs</title>
<style>
:root{--ink:#1d2731;--muted:#5b6875;--paper:#f6f8fa;--card:#fff;--line:#d5dde5;--acc:#1758b8;--acc2:#e8f0fb;--ok:#17723a;--okbg:#e5f5ea;--bad:#b3261e;--badbg:#fdecea;--hl:#f2a900;--hlbg:#fff4d6;--red:#c62828}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #8ab4f8;outline-offset:2px}
.hide{display:none!important}

/* header */
#top{flex:none;display:flex;align-items:center;gap:12px 16px;padding:6px 10px 6px 64px;background:#fff;border-bottom:1px solid var(--line);min-height:64px;flex-wrap:wrap}
#ttl{font-weight:800;font-size:24px;line-height:1.15}
#ttl .dt{font-weight:700;color:var(--muted);white-space:nowrap}
#ttl .rnd{display:inline-block;font-size:13px;font-weight:800;background:#efe4ff;color:#5a2ca0;border-radius:999px;padding:2px 9px;vertical-align:middle;margin-left:4px}
#badge{display:flex;align-items:center;gap:8px;background:var(--acc2);border:2px solid #b8cdf0;border-radius:14px;padding:2px 6px 2px 14px;transition:background .3s}
#badge .sc{font-size:28px;font-weight:800;color:#123c78;white-space:nowrap}
#badge.done{background:var(--ok);border-color:var(--ok)}
#badge.done .sc{color:#fff}
.dots{display:flex}
.dots button{width:44px;height:48px;min-height:0;padding:0;border:none;background:none;border-radius:50%;display:grid;place-items:center}
.dots button i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px;border:2px solid #9fb0c2;background:#fff;color:#9aa6b2}
.dots button.y i{background:var(--ok);border-color:var(--ok);color:#fff}
.dots button.n i{background:var(--bad);border-color:var(--bad);color:#fff}
.dots button.cur i{box-shadow:0 0 0 3px var(--hl)}
.dots button:disabled{cursor:default}
#badge.done .dots button i{border-color:#fff}
#top{position:relative;padding-right:66px}
#gear{position:absolute;right:10px;top:8px;font-size:22px;width:48px;padding:0}

/* layout */
#app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(360px,470px) 1fr;gap:12px;padding:10px 12px 12px}
#left{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
#right{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;min-height:0;min-width:0;display:flex}
#gwrap{flex:1;min-width:0;min-height:0;position:relative}
#gwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}

.about{flex:none;background:#f1f4f8;border:1px solid #cfd8e2;border-left:5px solid #8a9aab;border-radius:10px;padding:4px 12px 8px;font-size:16px}
.lt{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#5b6875}
.spk{width:44px;height:40px;min-height:0;padding:0;font-size:20px;border:none;background:transparent;border-radius:8px}
.spk.on{background:#ffe7a3}

/* question box */
.ask{flex:none;border:3px solid #f2a900;background:#fffaeb;border-radius:14px;padding:0 0 10px;box-shadow:0 2px 0 #e9c46a}
.ask-tag{display:flex;align-items:center;justify-content:space-between;background:#f2a900;color:#3d2a00;font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:0 2px 0 12px;border-radius:10px 10px 0 0;min-height:40px}
.ask-tag .rv{background:#3d2a00;color:#ffd666;border-radius:999px;padding:1px 8px;font-size:12px;margin-left:6px}
.ask-q{font-size:20px;font-weight:800;line-height:1.3;padding:8px 12px 2px}
.kw{color:#b3261e;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ask-a{margin:8px 10px 0;background:#fff;border:2px dashed #c9a227;border-radius:10px;padding:5px 8px 8px}
.ask-al{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8a6d00;margin-bottom:5px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{display:flex;align-items:center;gap:9px;text-align:left;min-height:54px;padding:5px 9px;font-size:17px;font-weight:650;border:2px solid #b9c7d6;border-radius:10px;background:#fff;line-height:1.2;transition:background .15s,border-color .15s}
.ch .L{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.ch:hover:not(:disabled){border-color:var(--acc);background:#f4f8fe}
.ch:disabled{cursor:default;color:inherit}
.ch.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)} .ch.bad .L{background:var(--bad)}
.ch.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)} .ch.ok .L{background:var(--ok)}
.ch.dim{opacity:.5}
.fbrow{display:flex;gap:8px;align-items:stretch;margin:8px 10px 0}
.fb{flex:1;padding:7px 10px;border-radius:10px;font-size:16px;line-height:1.3;animation:pop .25s ease-out}
.fb.ok{background:var(--okbg);color:#0f5229;border:2px solid #9fd3b0}
.fb.bad{background:var(--badbg);color:#8c1d18;border:2px solid #f0b4ae}
.fb .big{font-weight:800;font-size:18px;margin-right:4px}
.fb .ans{color:#0f5229;margin-top:3px}
.next{flex:none;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:800;font-size:20px;min-height:52px;padding:6px 20px;border-radius:12px}
.next:hover{filter:brightness(1.08)}
.donebox{flex:none;border:3px solid var(--ok);background:var(--okbg);border-radius:14px;padding:16px 14px;text-align:center;color:#0f5229;animation:pop .3s ease-out}
.donebox .big{font-size:28px;font-weight:800;line-height:1.2}
.donebox p{margin:8px 0;font-size:18px}
.donebox .rev{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.donebox .rev button{min-width:56px;font-weight:800}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.mk{animation:fadein .35s ease-out}
@media (prefers-reduced-motion:reduce){.fb,.donebox,.mk{animation:none}}

#app.alldone{grid-template-columns:1fr} #app.alldone #right,#app.alldone .about{display:none}
#app.alldone #left{max-width:640px;width:100%;margin:30px auto 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:94vh;overflow:auto;padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h2{margin:0 0 8px;font-size:22px}
.mbox h3{margin:14px 0 4px;font-size:16px}
.mbox p{margin:6px 0}
.mbox table{border-collapse:collapse;font-size:15px}
.mbox td{padding:2px 10px 2px 0;vertical-align:top}
.mbox code,.linkout{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:#f1f4f8;border-radius:6px;padding:1px 5px;word-break:break-all}
.linkout{display:block;padding:8px;margin:6px 0;border:1px solid var(--line)}
.mbox label{display:block;font-weight:700;font-size:14px;margin:8px 0 2px}
.mbox input{font:inherit;min-height:44px;border:1px solid #aab6c2;border-radius:8px;padding:6px 9px;width:100%}
.warn{background:#fff1d6;color:#6b3d00;border:1px solid #f0c36d;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:15px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.small{font-size:14px;color:var(--muted)}

/* narrow / portrait: graph on top, page scrolls */
@media (max-width:900px), (orientation:portrait) and (max-width:1100px){
  body{height:auto;overflow:auto}
  #app{display:flex;flex-direction:column;height:auto}
  #right{order:-1;height:56vh;min-height:300px;flex:none}
  #left{overflow:visible}
  #ttl{font-size:19px}
  #badge .sc{font-size:21px}
}
@media (max-height:720px) and (min-width:901px){
  #top{min-height:58px;padding-top:3px;padding-bottom:3px}
  #app{padding-top:8px;gap:10px} #left{gap:8px}
  .about{font-size:15px;padding:2px 10px 6px} .lt .spk{height:34px}
  .ask-tag{min-height:36px} .ask-q{font-size:19px;padding-top:6px}
  .ask-a{margin-top:6px} .ch{min-height:50px;font-size:16px} .choices{gap:7px}
  .fbrow{margin-top:7px} .fb{font-size:15px;padding:6px 9px} .fb .big{font-size:17px}
}
@media (max-width:520px){ .choices{grid-template-columns:1fr} #top{padding-left:60px} }

/* check + gallery pages */
.page{padding:14px 14px 14px 64px;overflow:auto;height:100%}
.page table{border-collapse:collapse;font-size:14px;background:#fff}
.page td,.page th{border:1px solid #c5d0db;padding:3px 7px;vertical-align:top;text-align:left}
.page .ok{color:var(--ok);font-weight:700}
.page .bad{color:var(--bad);font-weight:700}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px}
.gal figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px}
.gal figcaption{font-weight:700;padding:2px 4px}
.gal svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<header id="top">
  <div id="ttl"></div>
  <div id="badge"><span class="sc" id="sc"></span><div class="dots" id="dots"></div></div>
  <button id="gear" aria-label="Settings" title="Settings">⚙</button>
</header>
<main id="app">
  <section id="left">
    <div class="about">
      <div class="lt"><span>About this graph</span><button class="spk" id="spkDesc" aria-label="Read the description aloud">🔊</button></div>
      <div id="desc"></div>
    </div>
    <div id="qhost"></div>
  </section>
  <section id="right"><div id="gwrap"></div></section>
</main>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
'use strict';
/* ================= helpers ================= */
var $ = function(s,r){ return (r||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function kw(s){ return esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="kw">$1</span>'); }
function plain(s){ return String(s).replace(/\[\[(.+?)\]\]/g,'$1'); }
function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYMD(s){ var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s||'').trim()); if(!m) return null; var d=new Date(+m[1],+m[2]-1,+m[3]); return isNaN(d)?null:d; }
function addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); return x; }
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function nice(d){ return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate(); }
function niceY(d){ return nice(d)+', '+d.getFullYear(); }
function decs(v){ var s=String(+(+v).toFixed(6)); var i=s.indexOf('.'); return i<0?0:s.length-i-1; }
function fmt(v,dec){ if(dec===undefined) dec=Math.min(2,decs(v)); var a=Math.abs(v); if(a>=1000) return v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return (+v).toFixed(dec).replace('-','−'); }
function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

var LS = { get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del:function(k){ try{ localStorage.removeItem(k); }catch(e){} } };

  var segs=[[0,0.6,0,200,0.6],[0.6,1.6,1.1,120,0.5],[1.6,2.4,2.0,70,0.4],[2.4,3.0,2.7,40,0.3],[3.0,3.4,3.2,15,0.2]], pts=[];
  for(var k=0;k<=40;k++){ var t=k/10, h=0;
    for(var j=0;j<segs.length;j++){ var s=segs[j]; if(t>=s[0]-1e-9 && t<=s[1]+1e-9){ var u=(t-s[2])/s[4]; h=Math.max(0,s[3]*(1-u*u)); break; } }
    pts.push([t,Math.round(h*10)/10]); }
  return pts;
}
var SETS=[
/* ---------- 1 ---------- */
{n:1, topic:'Birds at a backyard feeder',
 title:'Number of Birds vs. Month',
 desc:'A student counted the birds at a backyard feeder on the first Saturday of every month for one year. Each dot is one count.',
 x:{l:'Month',cats:MONTHS}, y:{l:'Number of birds',min:10,max:50,st:2,ev:5},
 series:[{pts:[[0,34],[1,38],[2,44],[3,40],[4,30],[5,18],[6,12],[7,14],[8,22],[9,32],[10,40],[11,36]]}],

   s:{pt:[[2,44]]}},
  {t:2, q:'In which month were there [[12]] birds?',
   c:[['July','Go across from 12 on the y-axis to the dot, then down: July.'],
      ['August','August had 14 birds, one box higher.'],
      ['December','December is month 12, but the question asks for 12 BIRDS on the y-axis.'],
      ['June','June had 18 birds.']],
   s:{hy:[12],pt:[[6,12]]}},
  {t:3, q:'Which month had the [[MOST]] birds?',
   c:[['March','March has the highest dot on the graph: 44 birds.'],
      ['January','January is the FIRST month, not the highest dot.'],
      ['November','November is high (40), but March is higher.'],
      ['July','July is the LOWEST point, not the highest.']],
   s:{ring:[[2,44]]}},
  {t:6, q:'Between which two [[NEIGHBORING]] months did the number of birds [[DROP]] the most?',

/* ---------- 2 ---------- */
{n:2, topic:'Cooling hot chocolate',

 series:[{pts:[[0,80],[5,64],[10,52],[15,44],[20,38],[25,34],[30,32]]}],
 qs:[

      ['54 °C','That is one box too high. Each box is 2 °C.']],
   s:{pt:[[10,52]]}},
  {t:2, q:'At what time was the hot chocolate [[38 °C]]?',
   c:[['20 minutes','Go across from 38 °C to the dot, then down: 20 minutes.'],
      ['25 minutes','At 25 minutes it was 34 °C.'],

function normAxis(a){
  var o={l:a.l, cat:!!a.cats};

  else { o.min=a.min; o.max=a.max; o.st=a.st; o.ev=a.ev||1; }

  o.dec=decs(o.st*o.ev);

}

function getSet(n){ for(var i=0;i<SETS.length;i++) if(SETS[i].n===n) return SETS[i]; return null; }

  if(kind==='sq'){ var s=r*0.95; return '<rect x="'+(x-s).toFixed(1)+'" y="'+(y-s).toFixed(1)+'" width="'+(2*s).toFixed(1)+'" height="'+(2*s).toFixed(1)+'" fill="'+fill+'" stroke="#fff" stroke-width="1"/>'; }
  return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" fill="'+fill+'" stroke="#fff" stroke-width="1"/>';
}

  o.push('<text x="'+(ml+pw/2)+'" y="'+(H-12)+'" font-size="'+(fs+2)+'" font-weight="700" text-anchor="middle" fill="#1d2731">'+esc(xlab)+'</text>');

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" role="img" aria-label="'+esc(S.title)+'">'+o.join('')+'</svg>';
}

/* ================= which set today ================= */
function todayDate(){ var t=parseYMD(Q.get('today')); if(t) return t; var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
/* The date picks the set, so every device shows the same set on the same date:
   Set #1 = Mon, Nov 30, 2026, then one set per weekday (Mon–Fri), looping after #35.
   If this device already finished the date's set, it takes the LAST set in the loop (counting from
   today) that it has not finished: the one furthest ahead, so the device stays in sync as long as possible. When all 35 are finished, it stops.
   Weekends show the coming Monday's set. ?day=12 forces a set. */
var EPOCH=new Date(2026,10,30);
function computeDay(today){
  var isSchool=function(d){ var w=d.getDay(); return w>0 && w<6; };
  var eff=today; while(!isSchool(eff)) eff=addDays(eff,1);
  var diff=Math.round((Date.UTC(eff.getFullYear(),eff.getMonth(),eff.getDate())-Date.UTC(EPOCH.getFullYear(),EPOCH.getMonth(),EPOCH.getDate()))/864e5);
  var wk=Math.floor(diff/7), idx=wk*5+(diff-wk*7);
  var n = idx<0 ? 1 : (idx%35)+1, forced=false;
  var fd=parseInt(Q.get('day'),10); if(fd>=1 && fd<=35){ n=fd; forced=true; }
  return {n:n, dateSet:n, idx:idx, loop:idx>=35, eff:eff, forced:forced, isSchoolToday:isSchool(today)};
}

/* ================= state ================= */
var KEY='gotd-reading-graphs-v1', HKEY='gotd-reading-graphs-done-v1', HIST={done:{}}, ALLDONE=false;
function loadHist(){ var h=null; try{ h=JSON.parse(LS.get(HKEY)||'null'); }catch(e){ h=null; } HIST=(h && typeof h.done==='object')?h:{done:{}}; }
function saveHist(){ LS.set(HKEY,JSON.stringify(HIST)); }
function remaining(){ var r=[]; for(var n=1;n<=35;n++) if(!HIST.done[n]) r.push(n); return r; }
function markDone(){ if(SET && P && liveIndex()===5 && !HIST.done[DAY.n]){ HIST.done[DAY.n]={s:score().s,d:ymd(TODAY)}; saveHist(); } }
var DEV=LS.get('gotd-device'); if(!DEV){ DEV=Math.random().toString(36).slice(2)+Date.now().toString(36); LS.set('gotd-device',DEV); }
var TODAY, DAY, SET, store, P, view, lastAns=-1;   // P = progress for today's set
function load(){
  TODAY=todayDate(); DAY=computeDay(TODAY); loadHist();
  var s=null; try{ s=JSON.parse(LS.get(KEY)||'null'); }catch(e){ s=null; }
  if(!s || s.date!==ymd(TODAY) || typeof s.sets!=='object') s={date:ymd(TODAY), sets:{}};
  store=s; ALLDONE=false; lastAns=-1;
  if(!DAY.forced){
    if(store.pick) DAY.n=store.pick;          // keep the same set all day, even after it is finished
    else {
      var pick=0;
      if(!HIST.done[DAY.dateSet]) pick=DAY.dateSet;
      else for(var k=34;k>=1;k--){ var c=((DAY.dateSet-1+k)%35)+1; if(!HIST.done[c]){ pick=c; break; } }  // last unfinished set in the loop = furthest ahead, so it stays in sync longest
      if(!pick){ ALLDONE=true; SET=null; P=null; view=0; return; }
      DAY.n=pick; store.pick=pick;
    }
  }
  SET=getSet(DAY.n);
  if(!store.sets[DAY.n]) store.sets[DAY.n]={a:[[],[],[],[],[]]};
  P=store.sets[DAY.n];
  view=liveIndex();
  if(typeof P.v==='number' && P.v>=0 && P.v<=5 && (P.v===liveIndex() || resolved(P.v))) view=P.v;
}
function save(){ if(!store) return; if(P) P.v=view; LS.set(KEY,JSON.stringify(store)); }
function resolved(i){ var a=P.a[i]; return !!a && (a.indexOf(0)>=0 || a.length>=2); }
function liveIndex(){ var qs=SET.qs||[]; for(var i=0;i<qs.length;i++) if(!resolved(i)) return i; return qs.length?5:0; }
function score(){ var s=0,n=0; P.a.forEach(function(a){ if(a.length){ n++; if(a[0]===0) s++; } }); return {s:s,n:n}; }
function order(qi,len){ var r=rng(hash(DEV+':'+DAY.n+':'+qi)), a=[]; for(var i=0;i<len;i++) a.push(i); for(var j=len-1;j>0;j--){ var k=Math.floor(r()*(j+1)); var t=a[j]; a[j]=a[k]; a[k]=t; } return a; }

/* ================= speech ================= */
var canSpeak = ('speechSynthesis' in window) && typeof SpeechSynthesisUtterance!=='undefined', speakingBtn=null;
function sayable(t){
  return plain(t).replace(/CO₂/g,'C O 2').replace(/°C/g,' degrees Celsius').replace(/°F/g,' degrees Fahrenheit').replace(/\bmL\b/g,'milliliters').replace(/\bppm\b/g,'parts per million').replace(/\bkPa\b/g,'kilopascals')
    .replace(/(\d)\s?cm\b/g,'$1 centimeters').replace(/(\d)\s?g\b/g,'$1 grams').replace(/(\d)\s?K\b/g,'$1 kelvins').replace(/(\d)\s?ft\b/g,'$1 feet').replace(/(\d)\s?in\.?(?=[\s,.)]|$)/g,'$1 inches').replace(/(\d)\s?gal\b/g,'$1 gallons').replace(/(\d)\s?min\b/g,'$1 minutes').replace(/(\d)\s?s\b/g,'$1 seconds')
    .replace(/−/g,' minus ').replace(/×/g,' times ').replace(/→/g,' to ').replace(/–/g,' to ');
}
function stopSpeak(){ if(canSpeak){ try{ speechSynthesis.cancel(); }catch(e){} } if(speakingBtn){ speakingBtn.classList.remove('on'); speakingBtn=null; } }
function speak(text,btn){
  if(!canSpeak) return;
  if(speakingBtn===btn){ stopSpeak(); return; }
  stopSpeak();
  try{ var u=new SpeechSynthesisUtterance(sayable(text)); u.rate=0.92; u.lang='en-US'; u.onend=u.onerror=function(){ if(speakingBtn===btn){ btn.classList.remove('on'); speakingBtn=null; } }; speakingBtn=btn; btn.classList.add('on'); speechSynthesis.speak(u); }catch(e){ speakingBtn=null; }
}

/* ================= render ================= */
var gw=$('#gwrap'), curMarks=null;
function drawGraph(){ if(!SET) return; var r=gw.getBoundingClientRect(); var W=Math.max(320,Math.round(r.width)), H=Math.max(240,Math.round(r.height)); gw.innerHTML=graphSVG(SET,W,H,curMarks); }
function renderHeader(){
  var left=remaining().length;
  $('#ttl').innerHTML='Graph of the Day #'+DAY.n+' <span class="dt">· '+esc(nice(TODAY))+'</span>'+(!DAY.forced && (DAY.loop || DAY.n!==DAY.dateSet)?' <span class="rnd">'+left+' left</span>':'');
  var sc=score(), done=liveIndex()===5;
  $('#badge').className=done?'done':'';
  $('#sc').textContent = done ? '✓ Done — '+sc.s+'/5' : 'Score '+sc.s+'/'+sc.n;
  var h='';
  for(var i=0;i<5;i++){
    var a=P.a[i], cls=a.length? (a[0]===0?'y':'n') : '', sym=a.length?(a[0]===0?'✓':'✗'):(i+1);
    var can = resolved(i) || i===liveIndex();
    h+='<button class="'+cls+(i===view?' cur':'')+'" data-i="'+i+'" '+(can?'':'disabled')+' aria-label="Question '+(i+1)+(a.length?(a[0]===0?', correct':', missed'):'')+'"><i>'+sym+'</i></button>';
  }
  $('#dots').innerHTML=h;
}
function marksFor(i){ var q=SET.qs[i]; return (q && P.a[i].length) ? q.s : null; }
function renderAllDone(){
  $('#app').classList.add('alldone');
  $('#ttl').innerHTML='Graph of the Day <span class="dt">· '+esc(nice(TODAY))+'</span>';
  $('#badge').className='done'; $('#sc').textContent='✓ All 35 done'; $('#dots').innerHTML='';
  $('#qhost').innerHTML='<div class="donebox"><div class="big">🎉 You finished all 35 graphs!</div><p>Great work reading graphs. Ask your teacher what to do next.</p><div class="rev"><button id="resetAllBtn">↺ Reset and start over</button></div></div>';
  gw.innerHTML='';
}
function render(){
  stopSpeak();
  $('#app').classList.toggle('alldone',ALLDONE);
  if(ALLDONE){ renderAllDone(); return; }
  renderHeader();
  $('#desc').innerHTML=kw(SET.desc||'');
  $('#spkDesc').classList.toggle('hide',!canSpeak);
  var host=$('#qhost'), qs=SET.qs||[];
  if(!qs.length){ host.innerHTML='<div class="ask"><div class="ask-tag">❓ Questions</div><div class="ask-q">Questions coming soon.</div></div>'; curMarks=null; drawGraph(); return; }
  if(view===5){
    var sc=score();
    var last=!DAY.forced && !remaining().length;
    host.innerHTML='<div class="donebox"><div class="big">✓ Done for today — '+sc.s+'/5.</div><p>'+(last?'That was your last graph. You finished all 35!':'Come back tomorrow for a new graph!')+'</p><p class="small" style="color:#0f5229">Tap a question to look back at it:</p><div class="rev">'+[0,1,2,3,4].map(function(i){ var a=P.a[i]; return '<button data-rev="'+i+'">'+(a[0]===0?'✓':'✗')+' Q'+(i+1)+'</button>'; }).join('')+'</div></div>';
    curMarks=null; drawGraph(); save(); return;
  }
  var q=qs[view], a=P.a[view], ord=order(view,q.c.length), res=resolved(view), live=view===lastAns;
  var h='<div class="ask"><div class="ask-tag"><span>❓ Question '+(view+1)+' of 5'+(res&&!live?'<span class="rv">Review</span>':'')+'</span><button class="spk" id="spkQ" aria-label="Read the question aloud">🔊</button></div>';
  h+='<div class="ask-q">'+kw(q.q)+'</div><div class="ask-a"><div class="ask-al">✎ Your answer</div><div class="choices">';
  ord.forEach(function(ci,k){
    var cls='', mark=String.fromCharCode(65+k);
    if(a.indexOf(ci)>=0 && ci!==0){ cls='bad'; mark='✗'; }
    if(ci===0 && res){ cls='ok'; mark='✓'; }
    if(res && !cls) cls='dim';
    var dis = res || a.indexOf(ci)>=0;
    h+='<button class="ch '+cls+'" data-c="'+ci+'" '+(dis?'disabled':'')+'><span class="L">'+mark+'</span><span>'+esc(q.c[ci][0])+'</span></button>';
  });
  h+='</div></div>';
  if(a.length){
    var last=a[a.length-1], fb;
    if(last===0) fb='<div class="fb ok"><span class="big">✓ '+(a.length===1?'Correct!':'Correct on your second try.')+'</span> '+esc(q.c[0][1])+'</div>';
    else if(!res) fb='<div class="fb bad"><span class="big">✗ Not quite.</span> '+esc(q.c[last][1])+' Look at the red marks on the graph and try once more.</div>';
    else fb='<div class="fb bad"><span class="big">✗ Not quite.</span> '+esc(q.c[last][1])+'<div class="ans"><b>✓ The answer:</b> '+esc(q.c[0][1])+'</div></div>';
    h+='<div class="fbrow">'+fb+(res?'<button class="next" id="next">Next ▶</button>':'')+'</div>';
  }
  h+='</div>';
  host.innerHTML=h;
  var sq=$('#spkQ'); if(sq) sq.classList.toggle('hide',!canSpeak);
  curMarks=marksFor(view); drawGraph(); save();
}
function choose(ci){
  var i=view, a=P.a[i]; if(resolved(i) || a.indexOf(ci)>=0) return;
  a.push(ci); if(resolved(i)) lastAns=i; markDone(); save(); render();
  var nb=$('#next'); if(nb) try{ nb.focus({preventScroll:true}); }catch(e){}
}
function next(){ if(view<4) view++; else view=5; if(view<5 && !resolved(view) && view!==liveIndex()) view=liveIndex(); render(); }

/* ================= modals / settings ================= */
var modal=$('#modal'), mbox=$('#mbox');
function openModal(html){ mbox.innerHTML=html; modal.hidden=false; var b=mbox.querySelector('button'); if(b) try{ b.focus(); }catch(e){} }
function closeModal(){ modal.hidden=true; mbox.innerHTML=''; }
modal.addEventListener('click',function(e){ if(e.target===modal) closeModal(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !modal.hidden) closeModal(); });
function confirmBox(title,msg,btn,fn){
  openModal('<h2>'+title+'</h2><p>'+msg+'</p><div class="mrow"><button id="noR">Cancel</button><button class="danger" id="yesR">'+btn+'</button></div>');
  $('#noR').onclick=closeModal; $('#yesR').onclick=function(){ fn(); closeModal(); };
}
function resetAll(){
  confirmBox('Reset all graphs?','This erases every graph this device has finished, plus today’s answers. Graphs it has not done come back.','Reset everything',function(){
    LS.del(HKEY); LS.del(KEY); store=null; load(); render(); });
}
function settings(){
  var D=DAY, done=35-remaining().length;
  var h='<h2>⚙ Settings</h2><table>';
  h+='<tr><td>Today</td><td><b>'+esc(niceY(TODAY))+'</b>'+(D.isSchoolToday?'':' (weekend — showing Monday’s set)')+'</td></tr>';
  h+='<tr><td>Today’s set</td><td>'+(ALLDONE?'none — all 35 finished':'<b>#'+D.n+'</b> of 35'+(D.forced?' (picked with ?day=)':D.n!==D.dateSet?' (today’s date set #'+D.dateSet+' was already finished)':''))+'</td></tr>';
  h+='<tr><td>Finished on this device</td><td><b>'+done+'</b> of 35</td></tr></table>';
  h+='<p class="small">Nothing to set up. The date picks the set, so everyone sees the same graph on the same day: #1 on Mon, Nov 30, 2026, then one set per weekday, looping after #35 (Fri, Jan 15, 2027). If this device already finished the date’s set, it gets the last graph in the loop it has not finished (the one furthest ahead), so it stays in step with the class as long as possible. When all 35 are finished, it stops. To show a certain set (for a sub), add <code>?day=12</code> to the link.</p>';
  h+='<div class="mrow">'+(ALLDONE?'':'<button id="restart">Start today over</button>')+'<button class="danger" id="resetAll">Reset all graphs</button><button id="closeM">Close</button></div>';
  openModal(h);
  $('#closeM').onclick=closeModal;
  $('#resetAll').onclick=resetAll;
  var rs=$('#restart'); if(rs) rs.onclick=function(){
    confirmBox('Start today over?','This erases today’s answers on this device and starts Graph of the Day #'+DAY.n+' from Question 1.','Start over',function(){
      delete HIST.done[DAY.n]; saveHist(); store.sets[DAY.n]={a:[[],[],[],[],[]]}; P=store.sets[DAY.n]; view=0; lastAns=-1; save(); render(); });
  };
}

/* ================= events ================= */
$('#qhost').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.c!==undefined) choose(+b.dataset.c);
  else if(b.id==='next') next();
  else if(b.id==='spkQ'){ var q=SET.qs[view], ord=order(view,q.c.length); speak(q.q+'. '+ord.map(function(ci,k){ return String.fromCharCode(65+k)+': '+q.c[ci][0]+'.'; }).join(' '), b); }
  else if(b.dataset.rev!==undefined){ view=+b.dataset.rev; render(); }
  else if(b.id==='resetAllBtn') resetAll();
});
$('#dots').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; view=+b.dataset.i; render(); });
$('#spkDesc').addEventListener('click',function(){ speak(SET.desc,this); });
$('#gear').addEventListener('click',settings);
var rt=null; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(drawGraph,120); });
function checkDate(){ if(!store || ymd(todayDate())!==store.date){ closeModal(); load(); render(); } }
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden'){ save(); stopSpeak(); } else checkDate(); });
window.addEventListener('pagehide',function(){ save(); });
setInterval(checkDate,60000);

/* ================= check + gallery (teacher/dev only, not linked) ================= */
function onSeries(S,x,y){ return S.series.some(function(s){ return s.pts.some(function(p){ return Math.abs(p[0]-x)<1e-9 && Math.abs(p[1]-y)<1e-6; }); }); }
function onLine(S,x,y){ return S.series.some(function(s){ if(s.line===false) return false; for(var i=1;i<s.pts.length;i++){ var a=s.pts[i-1],b=s.pts[i]; if(x>=a[0]-1e-9 && x<=b[0]+1e-9 && b[0]!==a[0]){ var yy=a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); if(Math.abs(yy-y)<1e-6) return true; } } return false; }); }
function checkSet(S){
  var w=[], err=[];
  if(!S.x){ err.push('no graph'); return {err:err,w:w}; }
  var X=S.X, Y=S.Y, inX=function(x){ return x>=X.min-1e-9 && x<=X.max+1e-9; }, inY=function(y){ return y>=Y.min-1e-9 && y<=Y.max+1e-9; };
  [X,Y].forEach(function(A,k){ if(Math.abs(A.nb-(A.max-A.min)/A.st)>1e-6) err.push((k?'y':'x')+' range not a whole number of boxes'); });
  S.series.forEach(function(s){ s.pts.forEach(function(p){ if(!inX(p[0])||!inY(p[1])) err.push('point off graph '+p); }); });
  if(S.fit){ if(!inX(S.fit.x0)||!inX(S.fit.x1)) err.push('fit line outside x range'); }
  var dw=plain(S.desc||'').split(/\s+/).length; if(dw>60) w.push('description '+dw+' words');
  var qs=S.qs||[]; if(qs.length!==5) err.push(qs.length+' questions (need 5)');
  var gs={};
  qs.forEach(function(q,i){
    var tag='Q'+(i+1)+': ';
    var g=TYPE_GROUP[q.t]; if(!g) err.push(tag+'bad type '+q.t);
    gs[q.g||g]=1;
    if(!q.c || q.c.length!==4) err.push(tag+'needs 4 choices');
    var seen={}; (q.c||[]).forEach(function(c){ if(!c[0]||!c[1]) err.push(tag+'missing text/reason'); var k=String(c[0]).toLowerCase(); if(seen[k]) err.push(tag+'duplicate choice '+c[0]); seen[k]=1; if(String(c[1]).split(/\s+/).length>24) w.push(tag+'long reason: '+c[0]); if(/\b(choice|option) [A-D]\b|(^|\s)[A-D]\)/.test(c[1])) err.push(tag+'reason mentions a letter'); });
    var qw=plain(q.q).split(/\s+/).length; if(qw>24) w.push(tag+'question '+qw+' words');
    if(!q.s || !Object.keys(q.s).length) err.push(tag+'no graph marking');
    var s=q.s||{};
    (s.pt||[]).forEach(function(p){ var y=p[1]==='fit'?(S.fit?fitY(S,p[0]):NaN):p[1]; if(!inX(p[0])||!inY(y)) err.push(tag+'marking off graph '+p); else if(p[1]!=='fit' && !onSeries(S,p[0],y) && !onLine(S,p[0],y)) err.push(tag+'pt '+p+' not on data'); });
    (s.ring||[]).forEach(function(p){ if(!onSeries(S,p[0],p[1])) err.push(tag+'ring '+p+' not a data point'); });
    (s.hy||[]).forEach(function(y){ if(!inY(y)) err.push(tag+'hy off graph'); });
    (s.vx||[]).concat([].concat.apply([],s.band||[])).forEach(function(x){ if(!inX(x)) err.push(tag+'x marking off graph'); });
  });
  GROUPS.forEach(function(g){ if(!gs[g]) err.push('missing group '+g); });
  return {err:err,w:w};
}
function checkPage(){
  document.body.style.overflow='auto'; document.body.style.height='auto';
  var tc={}, rows='', bad=0;
  SETS.forEach(function(S){ (S.qs||[]).forEach(function(q){ tc[q.t]=(tc[q.t]||0)+1; });
    var r=checkSet(S); if(r.err.length) bad++;
    rows+='<tr><td>#'+S.n+'</td><td>'+esc(S.topic)+'</td><td>'+((S.qs||[]).map(function(q){return q.t;}).join(', '))+'</td><td class="'+(r.err.length?'bad':'ok')+'">'+(r.err.length?esc(r.err.join(' · ')):'✓ OK')+'</td><td class="small">'+esc(r.w.join(' · '))+'</td></tr>';
  });
  var t='<div class="page"><h2>Check: '+SETS.length+' sets · '+(bad?'<span class="bad">'+bad+' with problems</span>':'<span class="ok">no problems</span>')+'</h2><p>Question types used: '+Object.keys(tc).sort(function(a,b){return a-b;}).map(function(k){ return 'type '+k+' × '+tc[k]; }).join(', ')+'</p><table><tr><th>Set</th><th>Topic</th><th>Types</th><th>Problems</th><th>Warnings</th></tr>'+rows+'</table></div>';
  document.body.innerHTML=t;
}
function galleryPage(){
  document.body.style.overflow='auto'; document.body.style.height='auto';
  var h='<div class="page"><h2>All 35 graphs</h2><div class="gal">';
  SETS.forEach(function(S){ h+='<figure><figcaption>#'+S.n+' · '+esc(S.topic)+'</figcaption>'+(S.x?graphSVG(S,760,470,null):'<p>(no graph yet)</p>')+'</figure>'; });
  document.body.innerHTML=h+'</div></div>';
}
window.GOTD={SETS:SETS,checkSet:checkSet,computeDay:computeDay,graphSVG:graphSVG,state:function(){ return {store:store,view:view,day:DAY}; }};

if(Q.get('check')==='1') checkPage();
else if(Q.get('gallery')==='1') galleryPage();
else { load(); render(); }
})();
</script>
