<style>

.tstat{font-weight:400;font-size:.78rem;display:flex;align-items:center;gap:.25rem}

main{max-width:1400px;margin:0 auto;padding:.7rem 1rem 1.5rem}

.dots{display:flex;gap:.35rem;flex-wrap:wrap}

.dot.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.pwrap{flex:1;min-width:200px;display:flex;align-items:center;gap:.6rem;font-size:.9rem}
.pbar{flex:1;height:14px;background:#d7deea;border-radius:8px;overflow:hidden;border:1px solid var(--line2)}

.tryit{margin-top:.7rem;background:var(--warn-l);border-left:5px solid #d97706;padding:.45rem .7rem;border-radius:8px;font-size:.95rem}
.vsvg{width:100%;height:auto;max-height:min(54vh,430px);display:block;background:#f8fafc;border:1px solid var(--line);border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.1rem 0 .5rem}
.chip{min-height:38px;padding:.2em .7em;border-radius:999px;font-weight:700}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chipgroup{font-size:.8rem;color:var(--muted);font-weight:700;align-self:center;margin-right:.2rem}
.cap{margin:.5rem 0 0;font-size:1rem;min-height:2.9em}
.btnrow{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.stopnav{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:.7rem}
.mini-table{border-collapse:collapse;width:100%;margin-top:.5rem;font-size:.92rem}
.mini-table th,.mini-table td{border:1px solid var(--line);padding:.3rem .45rem;text-align:left;vertical-align:top}
.mini-table th{background:#f1f5f9}
.props{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.4rem;align-items:center;margin-top:.5rem;font-size:.88rem}
.prop{border:2px solid var(--line);border-radius:10px;padding:.35rem .5rem;background:#fff;min-height:100%}
.prop b{display:block}
.op{font-weight:700;font-size:1.3rem}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

.steps{margin:.5rem 0 0;padding-left:1.2rem;min-height:4.5em}

.checklist{position:sticky;top:70px}
.checklist h3{margin-top:0}
.ck{list-style:none;padding:0;margin:0}
.ck li{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.95rem}

@media (max-width:920px){.lab-wrap{grid-template-columns:1fr}.checklist{position:static;order:-1}}
.subtabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
.subtab{font-weight:700}
.subtab[aria-selected=true]{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d)}
.subtab .sdone{color:var(--good)}
.intro{margin:0 0 .6rem}

.tray{display:flex;flex-wrap:wrap;gap:.5rem;min-height:84px;padding:.5rem;border:2px dashed var(--line2);border-radius:12px;background:#fff;margin-bottom:.7rem}
.tray.empty::before{content:"All items sorted. Press Check (or move items to change answers).";color:var(--muted);font-size:.9rem;align-self:center}
.tray.over,.bin.over{border-color:var(--blue);background:var(--blue-l)}
.bins{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:.6rem}
.bin{border:2px solid var(--line2);border-radius:12px;background:#fff;min-height:130px;padding:.4rem;cursor:pointer}
.binhead{display:flex;align-items:center;gap:.4rem;font-weight:700;font-size:.95rem;margin-bottom:.35rem}
.bincount{margin-left:auto;font-weight:400;color:var(--muted);font-size:.85rem}
.binitems{display:flex;flex-wrap:wrap;gap:.4rem}
.item{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:2px solid #7c8aa0;border-radius:10px;padding:.25rem .45rem;cursor:grab;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.item.sel{outline:4px solid var(--blue);outline-offset:1px}
.item.ok{border-color:var(--good);background:var(--good-l)}
.item.no{border-color:var(--bad);background:var(--bad-l)}
.item.ok::after,.item.no::after{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.8rem}
.item.ok::after{content:"✓";background:var(--good)}
.item.no::after{content:"✗";background:var(--bad)}
.sorter.locked .item{cursor:default}
.ghost{position:fixed;left:0;top:0;transform:translate(-50%,-50%) scale(1.05);pointer-events:none;z-index:999;box-shadow:0 10px 24px rgba(0,0,0,.28);opacity:.95;margin:0}
.dragsrc{opacity:.3}
.card{min-width:98px;min-height:64px}
.card .fml{font-size:1.4rem;font-weight:700;line-height:1.1}
.card .nm{font-size:.72rem;color:var(--muted)}
.card svg{width:112px;height:auto;display:block}
.tile svg{width:150px;height:auto;display:block}
.tile .tl{font-size:.72rem;color:var(--muted);font-weight:700}
.vi{width:44px;height:28px;flex:none}
.fb{margin-top:.6rem;padding:.55rem .8rem;border-radius:10px;border:2px solid var(--line);background:#fff}
.fb:empty{display:none}
.fb.good{border-color:var(--good);background:var(--good-l)}
.fb.bad{border-color:var(--bad);background:var(--bad-l)}
.fb.info{border-color:var(--blue);background:var(--blue-l)}
.fblist{list-style:none;padding:0;margin:.4rem 0 0;font-size:.92rem;max-height:320px;overflow:auto}
.fblist li{padding:.3rem 0;border-bottom:1px solid var(--line)}
.mk{display:inline-grid;place-items:center;width:1.4em;height:1.4em;border-radius:50%;color:#fff;font-weight:700;font-size:.8em;margin-right:.35em}
.mk.y{background:var(--good)}.mk.n{background:var(--bad)}
.zoomwrap{display:flex;gap:.8rem;align-items:flex-start;margin-bottom:.6rem;flex-wrap:wrap}
.zoom{width:300px;max-width:100%;border:2px solid var(--line2);border-radius:12px;background:#fff;padding:.3rem}
.zoom svg{width:100%;height:auto;display:block}
.zoomhint{flex:1;min-width:200px;font-size:.92rem;color:var(--muted)}
/* build */
.lc-grid{display:grid;grid-template-columns:168px minmax(0,1fr);gap:.8rem;align-items:start}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.patom{touch-action:none;user-select:none;-webkit-user-select:none;padding:.2rem;display:flex;flex-direction:column;align-items:center;min-height:68px;font-size:.72rem;line-height:1.1}
.patom svg{width:38px;height:38px}
.ws{width:100%;height:auto;display:block;background:#f8fafc;border:2px solid var(--line2);border-radius:12px;touch-action:none;max-height:56vh}
.ws .wsatom{cursor:grab}
.ws-tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;margin:.4rem 0}
.zonebox{border:2px solid var(--line2);border-radius:10px;padding:.35rem;font-size:.85rem;display:flex;gap:.35rem;align-items:center}
.zonebox.done{border-color:var(--good);background:var(--good-l)}
.builtlist{display:flex;flex-wrap:wrap;gap:.4rem}
.bchip{border:2px solid var(--line);border-radius:10px;padding:.2rem .5rem;font-size:.88rem;background:#fff}
.result{display:flex;gap:.8rem;align-items:flex-start}
.result .big{font-size:1.5rem;font-weight:700}
details.ideas{margin-top:.5rem;font-size:.92rem}
details.ideas summary{cursor:pointer;font-weight:700;color:var(--blue-d)}
@media (max-width:720px){.lc-grid{grid-template-columns:1fr}.palette{grid-template-columns:repeat(5,minmax(0,1fr))}.zones{grid-template-columns:1fr 1fr}}
/* quiz */
.qwrap{max-width:960px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.4rem;color:var(--muted);font-weight:700}
.qtype{display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:8px;padding:.05em .5em;font-size:.8rem}
.qtext{font-size:1.25rem;font-weight:700;margin:.3rem 0 .7rem}
.choices{display:grid;gap:.5rem}
.choice{text-align:left;padding:.65rem 1rem;font-size:1.05rem}
.choice.right{border-color:var(--good);background:var(--good-l);font-weight:700}
.choice.right::before{content:"✓ ";color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-l)}
.choice.wrong::before{content:"✗ ";color:var(--bad)}
.choice:disabled{opacity:1;cursor:default}
.panels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem}
.pbtn{padding:.3rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;font-weight:700}
.pbtn svg{width:100%;height:auto;display:block}
.pbtn.right{border-color:var(--good);background:var(--good-l)}
.pbtn.wrong{border-color:var(--bad);background:var(--bad-l)}
.pbtn:disabled{opacity:1;cursor:default}
@media (max-width:760px){.panels{grid-template-columns:1fr 1fr}}
.diag{max-width:640px}
.diag svg{width:100%;height:auto;max-height:58vh;display:block;background:#f8fafc;border:1px solid var(--line);border-radius:12px;touch-action:manipulation}
.qnav{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.7rem}
.startbox{text-align:center;max-width:680px;margin:1rem auto}
.startbox .big{font-size:1.1rem}
.lockbox{max-width:680px;margin:1rem auto}
.lockbox ul{padding-left:.2rem;list-style:none}
.lockbox li{margin:.35rem 0}
.cardimg{max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px;display:block;margin:.6rem auto}
.scorebtns{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.status{text-align:center;min-height:1.5em;font-weight:700;margin-top:.4rem}
.fadein{animation:fi .35s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.cutting .gone{opacity:.12;transition:opacity .4s}
.vhl{opacity:0;transition:opacity .2s;pointer-events:none}
.vhl.on{opacity:1}
.fnode rect{fill:#fff;stroke:#334155;stroke-width:2}
.fnode.on rect{fill:#dbeafe;stroke:#0b57d0;stroke-width:4}
.fnode.leaf rect{fill:#f8fafc}
.fnode.leaf.on rect{fill:#dbeafe}
.fnode text{font-weight:700;font-size:17px;fill:#0f172a;pointer-events:none}
.fedge{stroke:#64748b;stroke-width:2.5;fill:none}
.fedge.on{stroke:#0b57d0;stroke-width:6}
.felbl{font-size:13px;fill:#334155;pointer-events:none}
.clickable{cursor:pointer}
.srt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.fadein{animation:none}.pfill{transition:none}}
</style>

function atomSVG(a){

}
function bbox(at){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;at.forEach(a=>{x0=Math.min(x0,a.x-a.r);y0=Math.min(y0,a.y-a.r);x1=Math.max(x1,a.x+a.r);y1=Math.max(y1,a.y+a.r);});return{x0,y0,x1,y1,w:x1-x0,h:y1-y0};}
function center(at){const b=bbox(at),cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2;return at.map(a=>Object.assign({},a,{x:a.x-cx,y:a.y-cy}));}
function rot(at,t){const c=Math.cos(t),s=Math.sin(t);return at.map(a=>Object.assign({},a,{x:a.x*c-a.y*s,y:a.x*s+a.y*c}));}

function ring(el,n){const r=EL[el].r,R=r/Math.sin(Math.PI/n),o=[];for(let i=0;i<n;i++){const t=i*2*Math.PI/n+Math.PI/n;o.push({el,x:R*Math.cos(t),y:R*Math.sin(t),r});}return o;}
function ionLat(c,a,cols,rows,plain){const rc=ION[c][0],ra=ION[a][0],d=rc+ra,o=[];for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const isC=(i+j)%2===0,e=isC?c:a;o.push({el:e,x:i*d,y:j*d,r:isC?rc:ra,lab:plain?e:ION[e][1]});}return center(o);}

/* species -> centered unit atoms. 'Na+' style = ion; MOL key; or element symbol (single atom) */
function spAt(k){

function atomsSVG(at,sc,ox,oy,plain){return at.map(a=>atomSVG({el:a.el,x:ox+a.x*sc,y:oy+a.y*sc,r:a.r*sc,lab:plain?a.el:(a.lab||a.el)})).join('');}

/* scatter particles into a rectangle without overlap */
function scatter(out,specs,rect,sc,rng,placed){
  placed=placed||[];
  specs.forEach(sp=>{let at=rot(spAt(sp),rng()*Math.PI*2);const R=boundR(at)*sc;
    for(let t=0;t<400;t++){const x=rect.x+R+rng()*Math.max(0,rect.w-2*R),y=rect.y+R+rng()*Math.max(0,rect.h-2*R);

  });

const FN={matter:[320,46,'Matter'],pure:[165,150,'Pure substance'],mixture:[475,150,'Mixture'],element:[85,262,'Element'],compound:[245,262,'Compound'],homog:[395,262,'Homogeneous'],hetero:[555,262,'Heterogeneous']};

/* ============ animation loop ============ */
const anims=new Set();let rafOn=false,lastT=0;
function addAnim(fn){anims.add(fn);if(!rafOn){rafOn=true;lastT=0;requestAnimationFrame(loop);}return()=>anims.delete(fn);}
function loop(t){if(!anims.size){rafOn=false;return;}const dt=lastT?Math.min(.05,(t-lastT)/1000):0;lastT=t;if(!document.hidden)anims.forEach(f=>{try{f(t/1000,dt);}catch(e){anims.delete(f);console.error(e);}});requestAnimationFrame(loop);}

/* ============ drag & drop (pointer events: mouse + touch + pen) ============ */
function dragify(el,o){
  let st=null;
  el.addEventListener('pointerdown',e=>{if(e.button>0||(o.disabled&&o.disabled()))return;st={x:e.clientX,y:e.clientY,id:e.pointerId,drag:false,g:null,over:null};try{el.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.id)return;
    if(!st.drag&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>7){st.drag=true;const r=el.getBoundingClientRect();
      const g=o.ghost?h('div',{class:'ghost'},o.ghost()):el.cloneNode(true);g.classList.add('ghost');g.classList.remove('sel','dragsrc');if(!o.ghost)g.style.width=r.width+'px';document.body.append(g);st.g=g;el.classList.add('dragsrc');}
    if(st.drag){st.cx=e.clientX;st.cy=e.clientY;st.g.style.left=e.clientX+'px';st.g.style.top=e.clientY+'px';upd(st);if(!st.as){const s0=st;s0.as=true;(function sc(){if(st!==s0)return;const y=s0.cy,H=window.innerHeight;const v=y<90?-Math.min(18,(90-y)/3+4):y>H-70?Math.min(18,(y-(H-70))/3+4):0;if(v){window.scrollBy(0,v);upd(s0);}requestAnimationFrame(sc);})();}}});
  function upd(s){const t=hit(s.cx,s.cy);if(t!==s.over){s.over&&s.over.classList.remove('over');t&&t.classList.add('over');s.over=t;}}
  const end=(e,cancel)=>{if(!st||e.pointerId!==st.id)return;const s=st;st=null;
    if(s.drag){s.g.remove();el.classList.remove('dragsrc');s.over&&s.over.classList.remove('over');if(!cancel)o.onDrop&&o.onDrop(hit(e.clientX,e.clientY),e);}
    else if(!cancel)o.onTap&&o.onTap(e);};
  el.addEventListener('pointerup',e=>end(e,false));
  el.addEventListener('pointercancel',e=>end(e,true));
  el.addEventListener('lostpointercapture',e=>{if(st&&st.drag)end(e,true);});
  function hit(x,y){const ts=o.targets();for(const t of ts){const r=t.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return t;}return null;}
}

/* ============ sorter widget (Lab A, Lab B, quiz) ============ */
function Sorter(root,cfg){
  const items=cfg.items,bins=cfg.bins;const place={},marks={};let sel=null,locked=false;
  items.forEach(it=>place[it.id]=null);
  root.innerHTML='';root.classList.add('sorter');
  const th=h('div',{class:'trayhead'},cfg.hint||'<b>Unsorted</b> — drag each item into a bin, <i>or</i> tap an item, then tap a bin.');
  const tray=h('div',{class:'tray','aria-label':'Unsorted items'});
  const binsEl=h('div',{class:'bins'});binsEl.style.setProperty('--cols',cfg.cols||bins.length);
  if(cfg.binStyle)binsEl.setAttribute('style',`--cols:${cfg.cols||bins.length};${cfg.binStyle}`);
  root.append(th,tray,binsEl);
  const binEls={};
  bins.forEach(b=>{const be=h('div',{class:'bin',tabindex:'0',role:'button','aria-label':'Bin: '+b.label});be.dataset.bin=b.id;
    be.innerHTML=`<div class="binhead">${b.icon||''}<span>${b.label}</span><span class="bincount"></span></div><div class="binitems"></div>`;
    be.addEventListener('click',e=>{if(e.target.closest('.item'))return;if(sel&&!locked)move(sel,b.id);});
    be.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&sel&&!locked){e.preventDefault();move(sel,b.id);}});
    binEls[b.id]=be;binsEl.append(be);});
  tray.addEventListener('click',e=>{if(e.target.closest('.item'))return;if(sel&&!locked)move(sel,null);});
  const itemEls={};
  items.forEach(it=>{const el=h('div',{class:'item '+(cfg.itemClass||''),tabindex:'0',role:'button','aria-label':it.aria||'item'},it.html);el.dataset.id=it.id;itemEls[it.id]=el;
    dragify(el,{disabled:()=>locked,targets:()=>Object.values(binEls).concat([tray]),onDrop:t=>{if(!t)return;move(it.id,t===tray?null:t.dataset.bin);},onTap:()=>select(it.id)});
    el.addEventListener('keydown',e=>{if(locked)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();select(it.id);}});});
  function select(id){if(locked)return;sel=sel===id?null:id;render();if(sel&&cfg.onSelect)cfg.onSelect(items.find(i=>i.id===id));}
  function move(id,bin){place[id]=bin;delete marks[id];sel=null;render();cfg.onChange&&cfg.onChange();}
  function render(){
    Object.values(binEls).forEach(b=>b.querySelector('.binitems').innerHTML='');tray.innerHTML='';
    items.forEach(it=>{const el=itemEls[it.id];el.classList.toggle('sel',sel===it.id);el.classList.remove('ok','no');if(marks[it.id])el.classList.add(marks[it.id]);
      (place[it.id]?binEls[place[it.id]].querySelector('.binitems'):tray).append(el);});
    tray.classList.toggle('empty',items.every(i=>place[i.id]));
    for(const k in binEls){const n=items.filter(i=>place[i.id]===k).length;binEls[k].querySelector('.bincount').textContent=n?n:'';}
  }
  render();
  return{
    allPlaced:()=>items.every(i=>place[i.id]),
    placed:()=>items.filter(i=>place[i.id]).length,
    check(){const res=items.map(it=>({it,bin:place[it.id],ok:place[it.id]===it.ans}));res.forEach(r=>{if(r.bin)marks[r.it.id]=r.ok?'ok':'no';});render();return res;},
    lock(){locked=true;sel=null;root.classList.add('locked');render();},
    showAnswers(){items.forEach(it=>{if(place[it.id]!==it.ans){place[it.id]=it.ans;marks[it.id]='no';}});render();},
    reset(){items.forEach(i=>{place[i.id]=null;delete marks[i.id];});sel=null;locked=false;root.classList.remove('locked');render();},
    returnWrong(){items.forEach(i=>{if(marks[i.id]==='no'){place[i.id]=null;delete marks[i.id];}});render();}
  };
}

/* simple particle simulation for Learn stop 2 */
function particleSim(svg,W,H,sp,state,sc,rng){
  const parts=[];let html='';
  if(state==='metal'){const at=metLat(sp,9,6,rng);const b=bbox(at);const s=Math.min((W-20)/b.w,(H-20)/b.h,sc*1.3);
    at.forEach((a,i)=>{parts.push({x:W/2+a.x*s,y:H/2+a.y*s,ph:rng()*6.28,jig:true,atoms:[{el:a.el,x:0,y:0,r:a.r}],s});});}
  else{const base=spAt(sp);const R=boundR(base)*sc;
    if(state==='solid'){const step=2*R+4;const cols=Math.max(1,Math.floor((W-10)/step)),rows=Math.max(1,Math.floor((H-10)/step));const ox=(W-cols*step)/2+step/2,oy=(H-rows*step)/2+step/2;
      for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)parts.push({x:ox+i*step,y:oy+j*step,a:(sp==='I2'||sp==='Br2')?0.6:0,ph:rng()*6.28,jig:true,atoms:base,s:sc,R});}
    else{const n=state==='gas'?7:13;const placed=[];
      for(let k=0;k<n;k++){for(let t=0;t<300;t++){const x=R+rng()*(W-2*R),y=R+rng()*(H-2*R);if(placed.every(p=>Math.hypot(p.x-x,p.y-y)>p.R+R+2)){const sp0=state==='gas'?55:14;const ang=rng()*6.28;const p={x,y,R,vx:Math.cos(ang)*sp0,vy:Math.sin(ang)*sp0,a:rng()*6.28,w:(rng()-.5)*(state==='gas'?2:0.6),atoms:base,s:sc};placed.push(p);parts.push(p);break;}}}}}
  parts.forEach((p,i)=>{html+=`<g data-i="${i}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})">${atomsSVG(p.atoms,p.s,0,0)}</g>`;});
  svg.innerHTML=html;const gs=$$('g[data-i]',svg);
  if(reduceMotion)return()=>{};
  return addAnim((t,dt)=>{
    parts.forEach(p=>{if(p.jig)return;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.w*dt;
      if(p.x<p.R){p.x=p.R;p.vx=Math.abs(p.vx);}if(p.x>W-p.R){p.x=W-p.R;p.vx=-Math.abs(p.vx);}
      if(p.y<p.R){p.y=p.R;p.vy=Math.abs(p.vy);}if(p.y>H-p.R){p.y=H-p.R;p.vy=-Math.abs(p.vy);}});
    for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){const A=parts[i],B=parts[j];if(A.jig||B.jig)continue;const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy),m=A.R+B.R;
      if(d<m&&d>0){const nx=dx/d,ny=dy/d,ov=(m-d)/2;A.x-=nx*ov;A.y-=ny*ov;B.x+=nx*ov;B.y+=ny*ov;const rv=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;if(rv<0){A.vx+=rv*nx;A.vy+=rv*ny;B.vx-=rv*nx;B.vy-=rv*ny;}}}
    parts.forEach((p,i)=>{let x=p.x,y=p.y,a=p.a||0;if(p.jig){x+=Math.sin(t*9+p.ph)*1.4;y+=Math.cos(t*7.3+p.ph*1.3)*1.4;a+=Math.sin(t*5+p.ph)*.04;}gs[i].setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(a*57.3).toFixed(1)})`);});
  });
}

{t:'The atom',b:`<ul>
<li>An <b>atom</b> is the smallest particle of an <b>element</b> that is still that element.</li>

    const a0=axis==='v'?box.y0:box.x0,a1=axis==='v'?box.y1:box.x1;const mid=axis==='v'?(s.x0+s.x1)/2:(s.y0+s.y1)/2;const m0=axis==='v'?box.x0:box.y0,m1=axis==='v'?box.x1:box.y1;

/* 2 Element */
{t:'Elements',b:`<ul>

{t:'Compounds',b:`<ul>

<li>A compound has <b>new properties</b>, different from the elements that formed it.</li>

<li>A compound can be broken back into its elements only by <b>chemical means</b> (a chemical reaction such as electrolysis), not by filtering, boiling or a magnet.</li></ul>

/* 5 Ionic */
{t:'Ionic compounds are not molecules',b:`<ul>
<li>When a <b>metal</b> reacts with a <b>nonmetal</b>, electrons transfer and make <b>ions</b>: Na → Na⁺ and Cl → Cl⁻.</li>
<li>Opposite charges pull the ions into a repeating 3-D <b>crystal lattice</b>. In 3-D each Na⁺ touches 6 Cl⁻, so there is <b>no separate "NaCl molecule."</b></li>
<li>The formula shows the smallest whole-number ratio of ions — one <b>formula unit</b>.</li>
<li>So ionic compounds are <b>compounds, but not molecules</b>.</li></ul>
<div class="tryit"><b>Try it:</b> tap any ion to see its neighbors and one formula unit.</div>`,
init(v){v.innerHTML=`<div class="chips"><button class="chip on" id="ioLat" aria-pressed="true">NaCl lattice</button><button class="chip" id="ioWat" aria-pressed="false">Compare: water molecules</button></div><svg class="vsvg" viewBox="0 0 460 300" id="ioSvg" role="img" aria-label="sodium chloride lattice"></svg><p class="cap" id="ioCap" aria-live="polite"></p>
  <table class="mini-table"><tr><th>Ionic compound</th><th>Ions</th><th>Formula unit (ratio)</th></tr><tr><td>NaCl</td><td>Na⁺, Cl⁻</td><td>1 : 1</td></tr><tr><td>MgO</td><td>Mg²⁺, O²⁻</td><td>1 : 1</td></tr><tr><td>CaCl₂</td><td>Ca²⁺, Cl⁻</td><td>1 : 2</td></tr><tr><td>Al₂O₃</td><td>Al³⁺, O²⁻</td><td>2 : 3</td></tr></table>`;
  const svg=$('#ioSvg',v),cap=$('#ioCap',v);const sc=26;const cols=8,rows=6;
  function lattice(){const at=ionLat('Na','Cl',cols,rows);const d=(ION.Na[0]+ION.Cl[0])*sc;
    svg.innerHTML=at.map((a,i)=>`<g class="clickable" data-i="${i}" data-c="${i%cols}" data-r="${Math.floor(i/cols)}">${atomSVG({el:a.el,x:230+a.x*sc,y:150+a.y*sc,r:a.r*sc,lab:a.lab})}</g>`).join('')+`<g id="ioHL" pointer-events="none"></g>`;
    cap.innerHTML='Tap an ion. (This is one flat slice of a 3-D crystal.)';
    $$('g[data-i]',svg).forEach(g=>g.addEventListener('click',()=>{const i=+g.dataset.i,c=+g.dataset.c,r=+g.dataset.r;const a=at[i];const x=230+a.x*sc,y=150+a.y*sc;
      const pc=c<cols-1?c+1:c-1;const p=at[r*cols+pc];const px=230+p.x*sc;const x0=Math.min(x,px)-d*.62,w=Math.abs(px-x)+d*1.24;
      const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[c+dx,r+dy]).filter(([cc,rr])=>cc>=0&&cc<cols&&rr>=0&&rr<rows).map(([cc,rr])=>at[rr*cols+cc]);
      $('#ioHL',svg).innerHTML=nb.map(n=>`<circle cx="${230+n.x*sc}" cy="${150+n.y*sc}" r="${n.r*sc+5}" fill="none" stroke="#f59e0b" stroke-width="4"/>`).join('')+`<rect x="${x0}" y="${y-d*.62}" width="${w}" height="${d*1.24}" rx="12" fill="#fde68a" fill-opacity=".28" stroke="#b45309" stroke-width="4" stroke-dasharray="8 5"/>`;
      const other=a.el==='Na'?'Cl⁻':'Na⁺';
      cap.innerHTML=`This ${a.lab} touches <b>${nb.length} ${other} ions</b> in this slice (6 in 3-D). No pair belongs together, so we just count the ratio: the dashed box is <b>one formula unit</b> = 1 Na⁺ : 1 Cl⁻.`;}));}
  function water(){const o=[];scatter(o,rep('H2O',9),{x:10,y:10,w:440,h:280},22,mulberry(5));svg.innerHTML=o.map(atomSVG).join('');cap.innerHTML='Water is different: it is made of <b>separate H₂O molecules</b>. Each one is a molecule <i>and</i> a compound.';}

  lattice();}},
/* 6 Venn */
{t:'The Venn diagram',b:`<ul>
<li>"Molecule" and "compound" answer <b>two different questions</b>: Is it a covalently bonded unit? Does it contain 2 or more elements?</li>
<li><b>Molecule only</b> — elements made of molecules: O₂, N₂, O₃.</li>
<li><b>Both</b> — <b>molecular (covalent) compounds</b>: H₂O, CO₂, CH₄.</li>
<li><b>Compound only</b> — <b>ionic compounds</b> (formula units): NaCl, MgO, CaCl₂.</li>
<li><b>Neither</b> — elements that are not molecules: noble gases He, Ne and metals Fe, Cu.</li></ul>
<div class="tryit"><b>Try it:</b> tap each region of the diagram.</div>`,
init(v){v.innerHTML=`<div class="diag">${vennSVG('lv',true)}</div><p class="cap" id="vCap" aria-live="polite">Tap a region.</p>`;
  const svg=$('svg',v),cap=$('#vCap',v);
  const T={molecule:'<b>Molecule only:</b> covalently bonded atoms of <b>one element</b> — O₂, N₂, O₃ (also H₂, Cl₂, P₄, S₈).',both:'<b>Both:</b> covalently bonded atoms of <b>2+ different elements</b> — H₂O, CO₂, CH₄. Molecular compounds.',compound:'<b>Compound only:</b> 2+ elements but held in an ionic lattice, so they come in <b>formula units</b>, not molecules — NaCl, MgO, CaCl₂.',neither:'<b>Neither:</b> one element and no molecules — noble gases (He, Ne) are single atoms; metals (Fe, Cu) are metallic lattices.'};
  svg.addEventListener('click',e=>{const z=vennZoneAt(svg,e);vennShow(svg,z);cap.innerHTML=T[z];});}},
/* 7 Pure vs mixture */
{t:'Pure substances vs. mixtures',b:`<ul>
<li>A <b>pure substance</b> (an element or a compound) has a <b>fixed composition</b> — every sample is the same.</li>
<li>A <b>mixture</b> is 2 or more substances <b>physically combined</b>, not chemically bonded.</li>
<li>Mixtures have <b>variable composition</b>, and each part <b>keeps its own properties</b>.</li>
<li>Mixtures separate by <b>physical means</b>: <b>filtration</b>, <b>distillation</b>, <b>evaporation</b>, a <b>magnet</b> (also chromatography and sieving).</li></ul>
<div class="tryit"><b>Try it:</b> use the magnet on the mixture, then on the compound.</div>`,

 <table class="mini-table"><tr><th>Method</th><th>Separates…</th><th>Example</th></tr><tr><td><b>Filtration</b></td><td>an undissolved solid from a liquid</td><td>sand from water</td></tr><tr><td><b>Distillation</b></td><td>a liquid, by boiling and condensing it</td><td>pure water from salt water</td></tr><tr><td><b>Evaporation</b></td><td>a dissolved solid (the liquid is lost)</td><td>salt from salt water</td></tr><tr><td><b>Magnet</b></td><td>a magnetic metal (iron, nickel, cobalt)</td><td>iron filings from sulfur or sand</td></tr></table>`;

/* 8 Homogeneous vs heterogeneous */
{t:'Homogeneous vs. heterogeneous mixtures',b:`<ul>
<li><b>Homogeneous mixture</b> (also called a <b>solution</b>): <b>uniform</b> — the same composition throughout; you can't see separate parts.</li>
<li>Examples: <b>salt water</b>, <b>air</b>, <b>brass</b> (copper + zinc alloy), <b>vinegar</b> (acetic acid in water).</li>
<li><b>Heterogeneous mixture</b>: <b>not uniform</b> — you can see different parts, pieces or layers.</li>
<li>Examples: <b>sand + water</b>, <b>trail mix</b>, <b>oil + water</b>, <b>granite</b>.</li></ul>
<div class="tryit"><b>Quick test:</b> would every scoop or sample have exactly the same makeup?</div>`,

{t:'Classifying matter: the flowchart',b:`<ul>
<li><b>Step 1:</b> Can it be separated by <b>physical means</b>? Yes → <b>mixture</b>. No → <b>pure substance</b>.</li>
<li><b>Pure substance:</b> only <b>one kind of atom</b> → <b>element</b>. 2+ elements <b>chemically bonded</b> → <b>compound</b>.</li>
<li><b>Mixture:</b> <b>uniform</b> throughout → <b>homogeneous</b>. Visibly <b>different parts</b> → <b>heterogeneous</b>.</li>
<li>"Molecule or not?" is a <b>separate question</b> about how the particles are held together — that's the Venn diagram.</li></ul>
<div class="tryit"><b>Try it:</b> pick a sample and follow its path.</div>`,
init(v){v.innerHTML=`<div id="fcChips"></div><div class="diag">${flowSVG(true)}</div><ol class="steps" id="fcSteps" aria-live="polite"></ol>`;

  const X=[{label:'O₂',p:['matter','pure','element'],s:[PH+' <b>No</b> → pure substance','One kind of atom? <b>Yes</b> (only O) → <b>element</b>']},

   {label:'H₂O',p:['matter','pure','compound'],s:[PH+' <b>No</b> → pure substance','One kind of atom? <b>No</b> — H and O are bonded in a fixed 2:1 ratio → <b>compound</b>']},
   {label:'NaCl',p:['matter','pure','compound'],s:[PH+' <b>No</b> → pure substance','One kind of atom? <b>No</b> — Na⁺ and Cl⁻ bonded 1:1 → <b>compound</b>']},
   {label:'Air',p:['matter','mixture','homog'],s:[PH+' <b>Yes</b> — N₂, O₂, Ar are not bonded to each other → mixture','Uniform throughout? <b>Yes</b> → <b>homogeneous mixture</b>']},
   {label:'Salt water',p:['matter','mixture','homog'],s:[PH+' <b>Yes</b> — evaporate the water and the salt is left → mixture','Uniform throughout? <b>Yes</b> → <b>homogeneous mixture</b>']},
   {label:'Brass',p:['matter','mixture','homog'],s:[PH+' <b>Yes</b> — Cu:Zn ratio varies; it can be melted apart → mixture','Uniform throughout? <b>Yes</b> → <b>homogeneous mixture</b> (alloy)']},
   {label:'Granite',p:['matter','mixture','hetero'],s:[PH+' <b>Yes</b> — the grains can be broken apart → mixture','Uniform throughout? <b>No</b>, you can see different grains → <b>heterogeneous mixture</b>']},
   {label:'Trail mix',p:['matter','mixture','hetero'],s:[PH+' <b>Yes</b> — pick the pieces apart by hand → mixture','Uniform throughout? <b>No</b> → <b>heterogeneous mixture</b>']}];

];

const SUBDB={};SUBST.forEach(s=>{SUBDB[ckey(parseF(s[0]))]={f:s[0],name:s[1],kind:s[2],part:s[3],zone:s[4],note:s[5]};});
const DIAT={H:'H₂',N:'N₂',O:'O₂',Cl:'Cl₂'};
const CZ=['both','compound','neither'];
function builtZones(){const z=new Set();S.built.forEach(f=>{const d=SUBDB[ckey(parseF(f))];if(d&&CZ.includes(d.zone))z.add(d.zone);});return z;}
const CBINS=VBINS.filter(b=>CZ.includes(b.id));

function labCInit(){
  const root=$('#labC');
  root.innerHTML=`<h3>C · Build-a-Particle</h3><p class="intro">Drag atoms into the build area (or tap an atom to add it). New atoms <b>snap</b> so they touch the nearest atom. Tap an atom to select it; drag it off the area to remove it. Then press <b>Check particle</b>. Goal: build <b>4 real particles</b> that cover <b>all 3 Venn zones</b>: Both, Compound only and Neither.</p>
  <div class="lc-grid"><div class="palette" id="pal" aria-label="Atom palette"></div>
  <div><svg class="ws" id="ws" viewBox="0 0 640 400" role="application" aria-label="Build area"></svg>
  <div class="ws-tools"><button class="primary" id="lcCheck">✓ Check particle</button><button id="lcDel">Remove selected</button><button id="lcClear">Clear all</button></div>
  <div class="fb" id="lcMsg" aria-live="polite"></div>
  <details class="ideas"><summary>Need ideas?</summary>Try one He atom… one Fe atom… one O with two H… one C with four H… one Na with one Cl… one Mg with one O.</details></div></div>
  <h3 style="margin-top:.9rem">Your real particles</h3><div class="zones" id="zoneTrack" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div><div class="builtlist" id="builtList"></div><div id="nextC"></div>`;
  const PAL=['H','C','N','O','Na','Cl','Mg','He','Fe','S'];const SC=26;const W=640,H=400;
  const ws=$('#ws'),msg=$('#lcMsg');let atoms=[],nid=1,selId=null,lastId=null;
  const pal=$('#pal');
  PAL.forEach(el=>{const b=h('button',{class:'patom','aria-label':`Add ${EL[el].n} atom`},`<svg viewBox="0 0 40 40">${atomSVG({el,x:20,y:20,r:17})}</svg>${EL[el].n}`);pal.append(b);
    dragify(b,{targets:()=>[ws],ghost:()=>`<svg viewBox="0 0 60 60" width="${Math.round(EL[el].r*SC*2+6)}" style="border-radius:50%">${atomSVG({el,x:30,y:30,r:27})}</svg>`,onDrop:(t,e)=>{if(!t)return;const p=svgPt(ws,e);addAtom(el,p.x,p.y,null);},onTap:()=>{const anchor=atoms.find(a=>a.id===selId)||atoms.find(a=>a.id===lastId)||atoms[atoms.length-1];if(!anchor)addAtom(el,W/2,H/2,null);else addAtom(el,anchor.x+40,anchor.y,anchor);}});
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.dispatchEvent(new PointerEvent('pointerup',{pointerId:-1}));}});});
  const R=el=>EL[el].r*SC;
  const clampP=(x,y,r)=>({x:Math.max(r+2,Math.min(W-r-2,x)),y:Math.max(r+2,Math.min(H-r-2,y))});
  function free(x,y,r,ex){return x>=r&&x<=W-r&&y>=r&&y<=H-r&&atoms.every(o=>ex.includes(o.id)||Math.hypot(o.x-x,o.y-y)>=o.r+r-1.5);}
  function spot(n,r,a0,selfId){for(let k=0;k<24;k++){for(const sg of k?[1,-1]:[1]){const a=a0+sg*k*Math.PI/12;const x=n.x+(n.r+r)*Math.cos(a),y=n.y+(n.r+r)*Math.sin(a);if(free(x,y,r,[n.id,selfId]))return{x,y};}}return null;}
  function nearest(x,y,ex){let best=null,bd=1e9;atoms.forEach(o=>{if(o.id===ex)return;const d=Math.hypot(o.x-x,o.y-y)-o.r;if(d<bd){bd=d;best=o;}});return best?{a:best,d:bd}:null;}
  function addAtom(el,x,y,anchor){if(atoms.length>=30){say('info','That\'s plenty of atoms (30 max). Remove some first.');return;}
    const r=R(el);let p=clampP(x,y,r);
    if(atoms.length){const nn=anchor?{a:anchor,d:0}:nearest(x,y);if(nn&&(anchor||nn.d-r<80)){const a0=anchor?0:Math.atan2(y-nn.a.y,x-nn.a.x);let s=spot(nn.a,r,a0,-1);if(!s&&anchor){for(const o of atoms){s=spot(o,r,0,-1);if(s)break;}}if(s)p=s;}}
    const a={id:nid++,el,x:p.x,y:p.y,r};atoms.push(a);lastId=a.id;draw();clearMsg();}
  function snapExisting(a){const nn=nearest(a.x,a.y,a.id);if(!nn||nn.d-a.r>80)return;const s=spot(nn.a,a.r,Math.atan2(a.y-nn.a.y,a.x-nn.a.x),a.id);if(s){a.x=s.x;a.y=s.y;}}
  function draw(){ws.innerHTML=`<defs><pattern id="wsg" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#wsg)"/>`+(atoms.length?'':`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="20" fill="#64748b">Drag or tap atoms from the palette</text>`)+
    atoms.map(a=>`<g class="wsatom" data-id="${a.id}">${a.id===selId?`<circle cx="${a.x}" cy="${a.y}" r="${a.r+6}" fill="none" stroke="#0b57d0" stroke-width="3" stroke-dasharray="6 4"/>`:''}${atomSVG(a)}</g>`).join('');}
  let drag=null;
  ws.addEventListener('pointerdown',e=>{const g=e.target.closest('.wsatom');if(!g)return;const a=atoms.find(x=>x.id===+g.dataset.id);if(!a)return;drag={a,sx:e.clientX,sy:e.clientY,moved:false,id:e.pointerId,ox:a.x,oy:a.y};try{ws.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  ws.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6)drag.moved=true;if(drag.moved){const p=svgPt(ws,e);drag.a.x=p.x;drag.a.y=p.y;draw();}});
  ws.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;
    if(!d.moved){selId=selId===d.a.id?null:d.a.id;draw();return;}
    const r=ws.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){atoms=atoms.filter(x=>x!==d.a);if(selId===d.a.id)selId=null;draw();clearMsg();return;}
    const p=clampP(d.a.x,d.a.y,d.a.r);d.a.x=p.x;d.a.y=p.y;snapExisting(d.a);draw();clearMsg();});
  ws.addEventListener('pointercancel',()=>{if(drag){drag.a.x=drag.ox;drag.a.y=drag.oy;drag=null;draw();}});
  ws.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&selId){atoms=atoms.filter(a=>a.id!==selId);selId=null;draw();}});
  $('#lcDel').onclick=()=>{if(!selId){say('info','Tap an atom in the build area to select it first.');return;}atoms=atoms.filter(a=>a.id!==selId);selId=null;draw();clearMsg();};
  $('#lcClear').onclick=()=>{atoms=[];selId=null;draw();clearMsg();};
  function say(cls,t){msg.className='fb '+cls;msg.innerHTML=t;}
  function clearMsg(){msg.className='fb';msg.innerHTML='';}
  function connected(){if(!atoms.length)return false;const seen=new Set([atoms[0].id]);const q=[atoms[0]];while(q.length){const a=q.pop();atoms.forEach(b=>{if(!seen.has(b.id)&&Math.hypot(a.x-b.x,a.y-b.y)<=a.r+b.r+4){seen.add(b.id);q.push(b);}});}return seen.size===atoms.length;}
  $('#lcCheck').onclick=()=>{
    if(!atoms.length){say('info','Add some atoms first.');return;}
    if(!connected()){say('bad','Some atoms are not touching. Snap all the atoms together into one particle, then check again.');return;}
    const c={};atoms.forEach(a=>c[a.el]=(c[a.el]||0)+1);const k=ckey(c);const d=SUBDB[k];
    const fml=Object.keys(c).sort((a,b)=>{const o=x=>x==='C'?0:x==='H'?1:2;return o(a)-o(b)||a.localeCompare(b);}).map(e=>e+(c[e]>1?c[e]:'')).join('');
    if(d){const isNew=!S.built.includes(d.f);if(isNew){S.built.push(d.f);save();}
      const zl=d.zone==='molecule'?'':` · Venn zone: <b>${ZONES[d.zone]}</b>`;say('good',`<div class="result">${d.zone==='molecule'?'':vennIcon(d.zone).replace('class="vi"','class="vi" style="width:66px;height:42px"')}<div><div class="big">${F(d.f)} — ${d.name}</div>
      <b>${d.kind==='element'?'Element':'Compound'}</b> · ${d.part}${zl}${d.note?'<br>'+d.note:''}${isNew?'':'<br><i>You already built this one — try a different particle.</i>'}</div></div>`);
      renderBuilt();updateStatus();return;}
    const keys=Object.keys(c);let hint='';
    if(keys.length===1&&c[keys[0]]===1&&DIAT[keys[0]])hint=` Hint: a lone ${keys[0]} atom isn't stable — elemental ${EL[keys[0]].n} exists as ${DIAT[keys[0]]}.`;
    else if(keys.length===1&&keys[0]==='S')hint=' Hint: elemental sulfur\'s common form is S₈ — a ring of 8 S atoms.';
    else{const g=Object.values(c).reduce((a,b)=>{while(b){[a,b]=[b,a%b];}return a;});if(g>1){const red={};keys.forEach(e=>red[e]=c[e]/g);const d2=SUBDB[ckey(red)];if(d2&&d2.zone==='compound')hint=` Hint: that's ${g} formula units of ${uni(d2.f)} stuck together. An ionic formula is the smallest ratio — build just one.`;}}
    say('bad',`<b>${uni(fml)}</b>: Not a real substance; try again.${hint}`);};
  function renderBuilt(){const z=builtZones();
    $('#zoneTrack').innerHTML=CBINS.map(b=>`<div class="zonebox${z.has(b.id)?' done':''}">${b.icon}<span>${z.has(b.id)?'✓ ':''}${b.label}</span></div>`).join('');
    $('#builtList').innerHTML=S.built.length?S.built.map(f=>{const d=SUBDB[ckey(parseF(f))];return`<span class="bchip"><b>${F(f)}</b> ${d.name} · ${d.zone==='molecule'?'element (molecule)':ZONES[d.zone]}</span>`;}).join(''):'<span style="color:#475569">None yet.</span>';
    $('#builtList').insertAdjacentHTML('beforeend',`<span style="align-self:center;color:#475569;font-size:.9rem">${S.built.length}/4+ built, ${z.size}/3 zones</span>`);}
  draw();renderBuilt();
}

/* ---------- lab tabs & checklist ---------- */
function labStatus(){return{a:S.labABest>=.8,b:!!S.labB,c:S.built.length>=4&&builtZones().size===3};}
function renderChecklist(){const st=labStatus();const z=builtZones();
  const L=[['a','Venn Sorter: score 80% or better',S.labABest?`Best: ${Math.round(S.labABest*100)}%`:'Not checked yet'],['b','Matter Sorter: all boxes sorted correctly',S.labB?'Done':'Not done yet'],['c','Build-a-Particle: 4 real particles covering all 3 Venn zones',`${S.built.length} built · ${z.size}/3 zones`]];
  const all=st.a&&st.b&&st.c;const learnDone=S.viewed.length>=STOPS.length;
  $('#checklist').innerHTML=`<h3>Lab Checklist</h3><ul class="ck">${L.map(([k,t,s])=>`<li class="${st[k]?'done':''}"><span class="ckbox" aria-hidden="true">${st[k]?'✓':''}</span><span>${t}<small>${st[k]?'✓ Complete — ':''}${s}</small></span><span class="srt">${st[k]?'complete':'not complete'}</span></li>`).join('')}</ul>`+
   (all?`<div class="ckdone">✓ Lab complete!${learnDone?' The Quiz is unlocked.':' View every Learn stop to unlock the Quiz.'}</div>${learnDone?'<button class="primary" style="margin-top:.5rem;width:100%" id="goQuiz">Go to Quiz ▶</button>':''}`:'');
  const g=$('#goQuiz');if(g)g.onclick=()=>setPane('quiz');
  updateLabNext();$('#sdA').textContent=st.a?'✓':'';$('#sdB').textContent=st.b?'✓':'';$('#sdC').textContent=st.c?'✓':'';}
function labNext(k){return h('div',{class:'stopnav',id:'next'+k,style:'justify-content:flex-end'});}
function goLab(k){$(`.subtab[data-lab="${k}"]`).click();window.scrollTo(0,0);}
function updateLabNext(){const st=labStatus();const learnDone=S.viewed.length>=STOPS.length;
  const A=$('#nextA'),B=$('#nextB'),C=$('#nextC');if(!A||!B||!C)return;
  A.innerHTML=st.a?'<span style="color:var(--good);font-weight:700">✓ Part A passed</span><button class="primary">Next: B · Matter Sorter ▶</button>':'';
  B.innerHTML=st.b?'<span style="color:var(--good);font-weight:700">✓ Part B passed</span><button class="primary">Next: C · Build-a-Particle ▶</button>':'';
  C.className='stopnav';C.style.justifyContent='flex-end';
  const qOpen=!quizLocked();
  C.innerHTML=st.c?`<span style="color:var(--good);font-weight:700">✓ Part C passed</span><button class="primary">${qOpen?'Next: Quiz ▶':(!st.a?'Next: finish Part A ▶':!st.b?'Next: finish Part B ▶':'Next: finish Learn stops ▶')}</button>`:'';
  const a=$('button',A),b=$('button',B),c=$('button',C);
  if(a)a.onclick=()=>goLab('B');if(b)b.onclick=()=>goLab('C');
  if(c)c.onclick=()=>{if(qOpen)setPane('quiz');else if(!st.a)goLab('A');else if(!st.b)goLab('B');else{setPane('learn');showStop(STOPS.map((_,i)=>i).find(i=>!S.viewed.includes(i))||0);}};}
let labInited=false;
function labInit(){if(labInited)return;labInited=true;labAInit();labBInit();labCInit();
  $$('.subtab').forEach(b=>b.onclick=()=>{$$('.subtab').forEach(x=>x.setAttribute('aria-selected',String(x===b)));['A','B','C'].forEach(k=>$('#lab'+k).hidden=k!==b.dataset.lab);});}

 {t:'panels',q:'Click the box that shows an <b>ionic compound</b> (formula units, not molecules).',boxes:['b7','b6','b4','b12'],short:'Click the ionic compound',x:'A repeating 1:1 Na/Cl lattice is an ionic compound; Fe and Cu/Zn lattices are an element and an alloy.'},
 {t:'venn',q:'Click the region of the Venn diagram where <b>H₂O</b> belongs.',a:'both',short:'Venn: place H₂O',x:'H₂O is a covalent molecule of 2 elements — the overlap (both).'},
 {t:'venn',q:'Click the region of the Venn diagram where <b>NaCl</b> belongs.',a:'compound',short:'Venn: place NaCl',x:'NaCl is ionic: a compound, but not a molecule.'},
 {t:'venn',q:'Click the region of the Venn diagram where <b>Fe</b> belongs.',a:'neither',short:'Venn: place Fe',x:'Iron is a metal element — not a molecule and not a compound.'},
 {t:'venn',q:'Click the region of the Venn diagram where <b>CH₄</b> belongs.',a:'both',short:'Venn: place CH₄',x:'CH₄ is a covalent molecule of 2 elements — the overlap (both).'},
 {t:'flow',q:'Click the flowchart box where <b>trail mix</b> belongs.',a:'hetero',short:'Flowchart: place trail mix',x:'Trail mix has visible, separable pieces — heterogeneous mixture.'},
 {t:'flow',q:'Click the flowchart box where <b>brass</b> belongs.',a:'homog',short:'Flowchart: place brass',x:'Brass is a uniform alloy — homogeneous mixture.'},
 {t:'flow',q:'Click the flowchart box where <b>carbon dioxide (CO₂)</b> belongs.',a:'compound',short:'Flowchart: place CO₂',x:'CO₂ is a pure substance of 2 bonded elements — compound.'},
 {t:'flow',q:'Click the flowchart box where <b>neon (Ne)</b> belongs.',a:'element',short:'Flowchart: place Ne',x:'Neon is a pure substance of one kind of atom — element.'}
];
const TYPEL={mc:'Multiple choice',tf:'True / False',sort:'Drag to sort',panels:'Click the diagram',venn:'Click the diagram',flow:'Click the diagram'};
let Q=null;
function quizLocked(){const st=labStatus();return!(S.viewed.length>=STOPS.length&&st.a&&st.b&&st.c);}
function renderQuiz(){const root=$('#quizRoot');
  if(quizLocked()){const st=labStatus();const miss=STOPS.map((s,i)=>i).filter(i=>!S.viewed.includes(i));
    root.innerHTML=`<div class="panel lockbox"><h2 style="display:flex;gap:.5rem;align-items:center;margin-top:0">${LOCK} Quiz locked</h2><p>The quiz unlocks after you view <b>every Learn stop</b> and finish the <b>Lab Checklist</b>. Still needed:</p><ul>
     ${miss.length?`<li>Learn: view stop${miss.length>1?'s':''} ${miss.map(i=>`<button class="linkbtn" data-stop="${i}">${i+1}</button>`).join(', ')}</li>`:'<li>✓ Learn: all stops viewed</li>'}
     <li>${st.a?'✓':'✗'} Lab A · Venn Sorter ≥ 80% ${st.a?'':`<button class="linkbtn" data-lab="A">go</button>`}</li>
     <li>${st.b?'✓':'✗'} Lab B · Matter Sorter all correct ${st.b?'':`<button class="linkbtn" data-lab="B">go</button>`}</li>
     <li>${st.c?'✓':'✗'} Lab C · 4 real particles in all 3 Venn zones ${st.c?'':`<button class="linkbtn" data-lab="C">go</button>`}</li></ul></div>`;
    $$('[data-stop]',root).forEach(b=>b.onclick=()=>{setPane('learn');showStop(+b.dataset.stop);});
    $$('[data-lab]',root).forEach(b=>b.onclick=()=>{setPane('lab');$(`.subtab[data-lab="${b.dataset.lab}"]`).click();});return;}
  if(Q&&!Q.done){showQ();return;}
  if(Q&&Q.done){showScore();return;}
  root.innerHTML=`<div class="panel startbox"><h2 style="margin-top:0">Quiz: Compounds vs Molecules</h2><p class="big">10 questions drawn at random from a bank of ${BANK.length}. Mixed formats: multiple choice, true/false, drag-to-sort and click-on-diagram. Feedback after every answer. Unlimited retakes.</p><p>Attempts so far: <b>${S.attempts}</b></p><button class="primary" id="qStart" style="font-size:1.15rem;padding:.5em 1.6em">Start attempt #${S.attempts+1} ▶</button></div>`;
  $('#qStart').onclick=startQuiz;}
function startQuiz(){S.attempts++;save();
  const sorts=shuffle(BANK.filter(q=>q.t==='sort')).slice(0,2);const clicks=shuffle(BANK.filter(q=>['panels','venn','flow'].includes(q.t))).slice(0,2);
  const rest=shuffle(BANK.filter(q=>!sorts.includes(q)&&!clicks.includes(q))).slice(0,6);
  Q={items:shuffle(sorts.concat(clicks,rest)).map(q=>({q,ok:null,ch:q.ch?shuffle(q.ch):null,boxes:q.boxes?shuffle(q.boxes):null})),i:0,attempt:S.attempts,done:false,answered:false};
  showQ();}
function showQ(){const root=$('#quizRoot');const it=Q.items[Q.i],q=it.q;const score=Q.items.filter(x=>x.ok).length;
  root.innerHTML=`<div class="panel"><div class="qhead"><span>Question ${Q.i+1} of 10 · <span class="qtype">${TYPEL[q.t]}</span></span><span>Attempt #${Q.attempt} · Score so far: ${score}</span></div><div class="pbar" style="margin-bottom:.6rem"><div class="pfill" style="width:${Q.i*10}%"></div></div><div class="qtext">${q.q}</div><div id="qBody"></div><div class="fb" id="qFb" aria-live="polite"></div><div class="qnav"><button class="primary" id="qNext" hidden>${Q.i===9?'See score card ▶':'Next question ▶'}</button></div></div>`;
  const body=$('#qBody'),fb=$('#qFb'),nx=$('#qNext');Q.answered=false;
  const finish=ok=>{it.ok=ok;Q.answered=true;fb.className='fb '+(ok?'good':'bad');fb.innerHTML=`<b>${ok?'✓ Correct.':'✗ Not quite.'}</b> ${q.x}`;nx.hidden=false;nx.focus();};
  nx.onclick=()=>{if(Q.i<9){Q.i++;showQ();}else{Q.done=true;showScore();}};
  if(q.t==='mc'||q.t==='tf'){const ch=q.t==='tf'?['True','False']:it.ch;const right=q.t==='tf'?(q.a?'True':'False'):(q.ans||q.ch[0]);
    body.innerHTML=`<div class="choices">${ch.map((c,k)=>`<button class="choice" data-k="${k}">${String.fromCharCode(65+k)}. ${c}</button>`).join('')}</div>`;
    $$('.choice',body).forEach(b=>b.onclick=()=>{if(Q.answered)return;const c=ch[+b.dataset.k];const ok=c===right;$$('.choice',body).forEach(x=>{x.disabled=true;if(ch[+x.dataset.k]===right)x.classList.add('right');});if(!ok)b.classList.add('wrong');finish(ok);});}
  else if(q.t==='sort'){const items=shuffle(q.items).map((p,k)=>({id:'q'+k,ans:p[1],html:q.txt?`<div style="font-weight:700;padding:.3rem .2rem">${p[0]}</div>`:`<div class="fml" style="font-size:1.35rem;font-weight:700">${F(p[0])}</div>`,aria:p[0]}));
    const sw=h('div');body.append(sw);const btn=h('button',{class:'primary'},'✓ Check my sort');const row=h('div',{class:'btnrow'});row.append(btn);body.append(row);
    const so=Sorter(sw,{items,bins:q.bins.map(b=>({id:b[0],label:b[1],icon:['both','compound','neither'].includes(b[0])?vennIcon(b[0]):''})),cols:q.bins.length,itemClass:'card'});
    btn.onclick=()=>{if(Q.answered)return;if(!so.allPlaced()){fb.className='fb info';fb.textContent='Sort every item first.';return;}const res=so.check();so.lock();btn.disabled=true;const ok=res.every(r=>r.ok);if(!ok)fb.dataset.n=res.filter(r=>r.ok).length;finish(ok);if(!ok)fb.innerHTML+=` <i>(${res.filter(r=>r.ok).length}/${res.length} placed correctly — all must be right to earn the point.)</i>`;};}
  else if(q.t==='panels'){body.innerHTML=`<div class="panels">${it.boxes.map((b,k)=>`<button class="pbtn" data-b="${b}">Box ${String.fromCharCode(65+k)}${boxSVG(b,'Box '+String.fromCharCode(65+k))}</button>`).join('')}</div>`;
    $$('.pbtn',body).forEach(b=>b.onclick=()=>{if(Q.answered)return;const ok=b.dataset.b===q.boxes[0];$$('.pbtn',body).forEach(x=>{x.disabled=true;if(x.dataset.b===q.boxes[0])x.classList.add('right');});if(!ok)b.classList.add('wrong');finish(ok);});}
  else if(q.t==='venn'){body.innerHTML=`<div class="diag">${vennSVG('qv'+Q.i,false)}</div>`;const svg=$('svg',body);
    svg.addEventListener('click',e=>{if(Q.answered)return;const z=vennZoneAt(svg,e);vennShow(svg,q.a);const ok=z===q.a;finish(ok);if(!ok)fb.innerHTML+=` You clicked <b>${ZONES[z]}</b>; the correct region (${ZONES[q.a]}) is now shaded.`;});}
  else if(q.t==='flow'){body.innerHTML=`<div class="diag">${flowSVG(false)}</div>`;const svg=$('svg',body);$$('.fnode',svg).forEach(g=>g.classList.add('clickable'));
    svg.addEventListener('click',e=>{if(Q.answered)return;const g=e.target.closest('.fnode');if(!g)return;const n=g.dataset.n;const path=q.a==='element'||q.a==='compound'?['matter','pure',q.a]:['matter','mixture',q.a];flowShow(svg,path);const ok=n===q.a;finish(ok);if(!ok)fb.innerHTML+=` You clicked <b>${FN[n][2]}</b>; the correct path is highlighted.`;});}
}
/* ---------- score card ---------- */
function stamp(){const d=Q.when||(Q.when=new Date());return d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function drawCard(){const n=Q.items.filter(x=>x.ok).length;const W=1000,rowH=46,H=300+10*rowH+60;const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');const FF='"Atkinson Hyperlegible", system-ui, sans-serif';
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#0f2a4a';g.fillRect(0,0,W,110);
  g.fillStyle='#fff';g.font=`700 38px ${FF}`;g.fillText('Compounds vs Molecules: Classifying Matter',36,58);g.font=`400 22px ${FF}`;g.fillStyle='#cfe0ff';g.fillText('chemistryteacher.net/compounds-vs-molecules',36,92);
  g.fillStyle='#0f172a';g.font=`700 24px ${FF}`;g.fillText('Score Card',36,152);g.font=`400 22px ${FF}`;g.fillText(`Date & time: ${stamp()}`,36,190);g.fillText(`Attempt #${Q.attempt}`,36,224);
  g.beginPath();g.arc(870,195,72,0,Math.PI*2);g.fillStyle=n>=8?'#e3f5e9':n>=6?'#fff4d6':'#fdecea';g.fill();g.lineWidth=6;g.strokeStyle=n>=8?'#0a7a33':n>=6?'#b45309':'#b42318';g.stroke();
  g.fillStyle='#0f172a';g.textAlign='center';g.font=`700 46px ${FF}`;g.fillText(`${n}/10`,870,205);g.font=`400 18px ${FF}`;g.fillText('score',870,236);g.textAlign='left';
  g.strokeStyle='#c5cedb';g.lineWidth=2;g.beginPath();g.moveTo(36,262);g.lineTo(W-36,262);g.stroke();
  Q.items.forEach((it,k)=>{const y=300+k*rowH;if(k%2===0){g.fillStyle='#f4f6fa';g.fillRect(30,y-30,W-60,rowH);}
    g.fillStyle=it.ok?'#0a7a33':'#b42318';g.beginPath();g.arc(62,y-8,15,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.font=`700 20px ${FF}`;g.textAlign='center';g.fillText(it.ok?'✓':'✗',62,y-1);g.textAlign='left';
    g.fillStyle='#0f172a';g.font=`400 22px ${FF}`;g.fillText(`${k+1}. ${it.q.short}`,92,y);g.font=`700 18px ${FF}`;g.fillStyle=it.ok?'#0a7a33':'#b42318';g.textAlign='right';g.fillText(it.ok?'Correct':'Incorrect',W-48,y);g.textAlign='left';});
  g.fillStyle='#475569';g.font=`400 17px ${FF}`;g.fillText('✓ = correct   ✗ = incorrect',36,H-24);return c;}
function showScore(){const root=$('#quizRoot');const n=Q.items.filter(x=>x.ok).length;const c=drawCard();
  root.innerHTML=`<div class="panel"><h2 style="margin-top:0;text-align:center">Attempt #${Q.attempt}: ${n}/10</h2><img class="cardimg" alt="Score card: ${n} out of 10, attempt ${Q.attempt}" src="${c.toDataURL('image/png')}">
   <div class="scorebtns"><button class="primary" id="sDl">⬇ Download PNG</button><button id="sCp">⧉ Copy image</button><button id="sGm">✉ Email via Gmail</button><button id="sRe">↺ Retake quiz</button></div><p class="status" id="sSt" aria-live="polite"></p>
   <p style="text-align:center;color:#475569;font-size:.9rem">To email: download the PNG first, then open Gmail and attach it. No names are collected.</p></div>`;
  const st=$('#sSt');const fname=`compounds-vs-molecules-score-attempt${Q.attempt}.png`;
  $('#sDl').onclick=()=>{c.toBlob(b=>{const u=URL.createObjectURL(b);const a=h('a',{href:u,download:fname});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);st.textContent='Downloaded '+fname;},'image/png');};
  $('#sCp').onclick=async()=>{try{if(!navigator.clipboard||!window.ClipboardItem)throw 0;await navigator.clipboard.write([new ClipboardItem({'image/png':new Promise(r=>c.toBlob(r,'image/png'))})]);st.textContent='Score card copied — paste it anywhere.';}catch(e){st.textContent='This browser can\'t copy images. Use Download PNG instead.';}};
  $('#sGm').onclick=()=>{const body=`Compounds vs Molecules: Classifying Matter\nchemistryteacher.net/compounds-vs-molecules\nDate & time: ${stamp()}\nAttempt #${Q.attempt}\nScore: ${n}/10\n\n${Q.items.map((it,k)=>`${it.ok?'✓':'✗'} ${k+1}. ${it.q.short}`).join('\n')}\n\n(Score card PNG attached.)`;
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=&su=${encodeURIComponent('Compounds vs Molecules – Score Card')}&body=${encodeURIComponent(body)}`,'_blank','noopener');st.textContent='Gmail opened in a new tab — attach the downloaded PNG.';};
  $('#sRe').onclick=()=>{Q=null;renderQuiz();};}

/* ============ tabs, status, init ============ */
let curPane='learn';
function setPane(p){curPane=p;$$('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.pane===p)));
  ['learn','lab','quiz'].forEach(k=>$('#pane-'+k).hidden=k!==p);
  if(p==='learn')showStop(curStop);else{stopCleanup&&stopCleanup();stopCleanup=null;}
  if(p==='lab')labInit();if(p==='quiz')renderQuiz();updateStatus();window.scrollTo(0,0);}
function updateStatus(){const n=S.viewed.length,st=labStatus(),labN=[st.a,st.b,st.c].filter(Boolean).length;
  $('#tstat-learn').textContent=n>=STOPS.length?'✓':`${n}/${STOPS.length}`;
  $('#tstat-lab').textContent=labN===3?'✓':`${labN}/3`;
  const lk=quizLocked();const tq=$('#tab-quiz');tq.classList.toggle('locked',lk);
  const need=[];if(n<STOPS.length)need.push(`${STOPS.length-n} stop${STOPS.length-n>1?'s':''}`);if(labN<3)need.push(`${3-labN} lab task${3-labN>1?'s':''}`);
  $('#tstat-quiz').innerHTML=lk?`${LOCK}<span>needs ${need.join(' + ')}</span>`:'';
  tq.setAttribute('aria-label',lk?`Quiz (locked: needs ${need.join(' and ')})`:'Quiz');
  if(labInited)renderChecklist();}
$$('.tab').forEach(t=>t.onclick=()=>setPane(t.dataset.pane));
$('#resetBtn').onclick=function(){if(this.dataset.arm){S={viewed:[],labABest:0,labB:false,built:[],attempts:0};save();location.reload();}else{this.dataset.arm='1';this.textContent='Click again to confirm reset';setTimeout(()=>{delete this.dataset.arm;this.textContent='Reset progress';},4000);}};
learnInit();showStop(0);updateStatus();
</script>
