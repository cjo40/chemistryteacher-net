<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuclear Equation Builder</title>
<style>
:root{
  --bg:#0a0f15; --panel:#111923; --panel2:#16212e; --border:#243447; --text:#e6edf3; --muted:#8aa0b5;
  --accent:#3fe0c5; --accent2:#5ab0ff; --amber:#ffb020; --red:#ff6b6b; --green:#3ddc84; --violet:#b58cff;
  --math:'STIX Two Math','Cambria Math',Cambria,'Times New Roman',serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:1400px;margin:0 auto;padding:6px 12px 10px;display:flex;flex-direction:column;gap:6px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0 6px 0 0;color:var(--accent);letter-spacing:.4px;white-space:nowrap;text-shadow:0 0 12px rgba(63,224,197,.35)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:8px 14px;min-height:42px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent);color:#03201b}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:700}
.badge{padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.badge.easy{background:#123d2a;color:#6ff0a8}.badge.medium{background:#3d3212;color:#ffd166}.badge.hard{background:#3d1520;color:#ff8fa3}
.tries{display:flex;gap:4px;align-items:center}.tries i{width:11px;height:11px;border-radius:50%;background:var(--accent);display:inline-block}.tries i.used{background:#33404f}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px}
.top{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:8px}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:8px}
.eqcard{display:flex;flex-direction:column;gap:8px}
.prompt{font-size:1.05rem;line-height:1.35;min-height:1.4em}
.prompt b{color:var(--accent)}
.workspace{display:flex;align-items:center;gap:4px;min-height:108px;overflow-x:auto;padding:10px 8px;background:var(--panel2);border-radius:10px;border:1px solid var(--border)}
.wsempty{color:var(--muted);padding:0 6px}
.tok{display:inline-flex;align-items:center;flex:0 0 auto;user-select:none}
.op{font-family:var(--math);font-size:2rem;padding:2px 6px;color:var(--muted);border-radius:8px;border:2px solid transparent}
.op.arrow{font-size:2.3rem;color:var(--text);padding:2px 10px}
.op.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,224,197,.2)}
.build .op{cursor:pointer}
.nuc{font-family:var(--math);padding:4px 7px;border-radius:9px;border:2px solid transparent}
.nuc.edit{border-color:#2c3e52;background:#0e151e;cursor:pointer}
.nuc.blank{border:2px dashed var(--amber);background:rgba(255,176,32,.07);cursor:pointer}
.nuc.sel{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,224,197,.22)}
.nuc.revealed{border:2px solid var(--amber);color:var(--amber);background:rgba(255,176,32,.08)}
.nuc.done-ok{border-color:var(--green)}
.coef{font-size:2.1rem;margin-right:5px;line-height:1}
.nums{display:inline-flex;flex-direction:column;align-items:flex-end;justify-content:space-between;height:3.3rem;margin-right:2px;line-height:1}
.nums .f{font-size:1.2rem}
.sym{font-size:2.7rem;line-height:1}
.f{border-radius:4px;padding:0 2px;min-width:.7em;text-align:right}
.f.empty{color:#566b82}
.f.active{background:rgba(63,224,197,.28);outline:1px solid var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 16px;min-height:44px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#03201b;border-color:transparent}
.btn.op-btn{font-family:var(--math);font-size:1.4rem;min-width:56px;padding:4px 12px}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.fb{min-height:1.4em;font-weight:700;line-height:1.35}
.fb.ok{color:var(--green)}.fb.bad{color:var(--red)}.fb.info{color:var(--muted)}.fb.rev{color:var(--amber)}
.hintline{min-height:0;color:var(--accent2);font-weight:600;line-height:1.35}
.hintline:not(:empty)::before{content:"💡 "}
.hintline .hl:first-child{display:inline}
.hs{display:block;margin:5px 0 3px;padding:6px 12px;background:rgba(90,176,255,.13);border-left:4px solid var(--accent2);border-radius:6px;font-weight:800;font-size:1.12em;color:var(--text)}
.hs .hn{font-size:1.2em}
.hn{font-family:var(--math);font-size:1.15em;color:var(--text);white-space:nowrap}
.hn sup,.hn sub{font-size:.62em}
.hq{display:inline-block;min-width:1.4em;text-align:center;border:1.5px dashed var(--amber);border-radius:5px;color:var(--amber);font-weight:800;padding:0 3px}
.hl{display:block;margin-top:3px}
.animcard{display:flex;flex-direction:column;gap:6px}
.animwrap{position:relative;height:200px;background:radial-gradient(ellipse at center,#14202d 0%,#0b1118 75%);border-radius:10px;border:1px solid var(--border);overflow:hidden}
#cv{width:100%;height:100%;display:block}
.replay{margin-left:auto;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-weight:700;font-size:.85rem;min-height:30px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:30px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.bal{display:grid;grid-template-columns:62px 1fr 26px 1fr;gap:4px 6px;align-items:center;font-size:.85rem;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px}
.bal .hd{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}
.bt{position:relative;height:22px;background:#0b1118;border-radius:6px;overflow:hidden}
.bf{position:absolute;left:0;top:0;bottom:0;background:var(--amber);opacity:.8;transition:width .25s}
.bf.eq{background:var(--green)}
.bv{position:absolute;left:6px;top:0;line-height:22px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.bs{text-align:center;font-weight:900}
.bs.eq{color:var(--green)}.bs.ne{color:var(--amber)}
.ptwrap{overflow-x:auto}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:2px;min-width:540px}
.el{height:36px;border:1px solid transparent;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;overflow:hidden;color:var(--text)}
.el .z{font-size:.55rem;line-height:1;color:#9fb3c6;font-weight:600}
.el .s{font-weight:800;font-size:.88rem;line-height:1.05}
.el .n{font-size:.5rem;color:#a9bccd;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip;padding:0 1px}
.el.blk-s{background:#1d2b45}.el.blk-p{background:#1c3833}.el.blk-d{background:#28283f}.el.blk-f{background:#3a2836}
.el:hover,.el:focus-visible{border-color:var(--accent);outline:none}
.el:active{transform:scale(.94)}
.el.flash{border-color:var(--accent);box-shadow:0 0 8px var(--accent)}
.ph{height:36px;display:flex;align-items:center;justify-content:center;font-size:.55rem;color:var(--muted);border:1px dashed #2c3e52;border-radius:4px}
.spacer{grid-column:1/-1;height:6px}
.selinfo{font-size:.8rem;color:var(--muted);min-height:1.2em;margin-top:4px}
.species{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sp{background:#1b2a3a;border:1px solid var(--border);border-radius:10px;padding:4px 10px;min-height:44px;display:flex;align-items:center;gap:7px}
.sp:hover{border-color:var(--accent)}
.sp .note{font-family:var(--math);font-size:1.25rem;line-height:1}
.sp .note sup,.sp .note sub{font-size:.62em}
.sp .lbl{font-size:.82rem;color:#c3d2df;font-weight:600}
.padcol{display:flex;flex-direction:column;gap:8px}
.padcol .seg{display:flex}.padcol .seg button{flex:1;padding:8px 4px;font-size:.85rem}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.numpad button{min-height:46px;font-size:1.35rem;font-weight:800;background:var(--panel2);border:1px solid var(--border);border-radius:10px}
.numpad button:hover{border-color:var(--accent)}
.numpad button:active{transform:scale(.95)}
.numpad .wide{grid-column:span 3;font-size:.95rem}
.tip{font-size:.78rem;color:var(--muted);line-height:1.35}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:520px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.modal h2{margin:0 0 6px;color:var(--accent)}
.modal .big{font-size:3.4rem;font-weight:900;margin:4px 0}
.modal .muted{color:var(--muted);font-size:.85rem}
.mrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.rgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}
.rc{border-radius:8px;padding:5px 2px;font-size:.78rem;font-weight:700;background:var(--panel2);border:1px solid var(--border)}
.rc.r0{border-color:var(--green);color:var(--green)}.rc.r1{border-color:#b6e36b;color:#b6e36b}.rc.r2{border-color:var(--amber);color:var(--amber)}.rc.rx{border-color:var(--red);color:var(--red)}
@media (max-width:1250px){.el .n{display:none}}
@media (max-width:1100px){
  .top{grid-template-columns:minmax(0,1fr)}
  .bottom{grid-template-columns:minmax(0,1fr)}
  .padcol{order:-1}
  .numpad,.padcol .seg{width:100%;max-width:440px;margin:0 auto}
}
@media (max-width:640px){
  .app{padding:6px}
  h1{font-size:1rem;width:100%}
  .progress{margin-left:0}
  .sym{font-size:2.1rem}.coef{font-size:1.7rem}.nums{height:2.7rem}.nums .f{font-size:1rem}
  .op{font-size:1.6rem}.op.arrow{font-size:1.8rem}
  .workspace{min-height:96px}
  .el{height:34px}.el .s{font-size:.78rem}.el .z{font-size:.5rem}.ph{height:34px}
  .animwrap{height:210px}
  .seg button{padding:8px 10px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>☢ Nuclear Equation Builder</h1>
    <div class="seg" id="modeSeg"><button data-mode="guided">Guided</button><button data-mode="free">Free Form</button></div>
    <div class="seg" id="levelSeg"><button data-level="1">Level 1</button><button data-level="2">Level 2</button><button data-level="3">Level 3</button></div>
    <div class="progress" id="progress"><span id="qnum"></span><span class="badge" id="tier"></span><span class="tries" id="tries" title="Tries left"></span></div>
  </header>

  <div class="top">
    <section class="card eqcard">
      <div class="prompt" id="prompt"></div>
      <div class="workspace" id="ws"></div>
      <div class="tools" id="tools">
        <button class="btn op-btn" data-tool="plus" title="Insert a plus sign">+</button>
        <button class="btn op-btn" data-tool="arrow" title="Insert the reaction arrow">→</button>
        <button class="btn" data-tool="del">⌫ Delete</button>
        <span class="tip" style="align-self:center">Tap a species to edit it. Tap its symbol to change the element.</span>
      </div>
      <div class="fb" id="fb"></div>
      <div class="hintline" id="hintline"></div>
      <div class="actions">
        <button class="btn primary" id="checkBtn">Check</button>
        <button class="btn primary" id="nextBtn" hidden>Next →</button>
        <button class="btn" id="hintBtn">Hint</button>
        <button class="btn" id="clearBtn">Clear</button>
      </div>
    </section>
    <section class="card animcard">
      <div class="animwrap"><canvas id="cv"></canvas></div>
      <div class="legend">
        <span><i class="dot" style="background:#ff5d5d"></i>proton</span>
        <span><i class="dot" style="background:#9aa7b4"></i>neutron</span>
        <span><i class="dot" style="background:#5ab0ff"></i>beta (e)</span>
        <span><i class="dot" style="background:#ffd84a"></i>positron (e)</span>
        <span style="color:#b58cff">〰 gamma</span>
        <button class="replay" id="replayBtn" hidden>↻ Replay</button>
      </div>
      <div class="bal" id="bal" hidden>
        <span></span><span class="hd">Left side</span><span></span><span class="hd">Right side</span>
        <span class="hd">Top (A)</span><div class="bt"><div class="bf" id="bAL"></div><span class="bv" id="vAL"></span></div><span class="bs" id="sA"></span><div class="bt"><div class="bf" id="bAR"></div><span class="bv" id="vAR"></span></div>
        <span class="hd">Bottom (Z)</span><div class="bt"><div class="bf" id="bZL"></div><span class="bv" id="vZL"></span></div><span class="bs" id="sZ"></span><div class="bt"><div class="bf" id="bZR"></div><span class="bv" id="vZR"></span></div>
      </div>
    </section>
  </div>

  <div class="bottom">
    <section class="card ptcol">
      <div class="species" id="species"></div>
      <div class="ptwrap"><div class="ptable" id="pt"></div></div>
      <div class="selinfo" id="selinfo"></div>
    </section>
    <section class="card padcol">
      <div class="seg" id="targetSeg"><button data-field="coef">Coef</button><button data-field="A">Top (A)</button><button data-field="Z">Bottom (Z)</button></div>
      <div class="numpad" id="numpad"></div>
      <div class="tip" id="padtip"></div>
    </section>
  </div>
</div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script>
(() => {
'use strict';

/* ================= ELEMENT DATA ================= */
const SYMS = 'H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');
const NAMES = 'Hydrogen Helium Lithium Beryllium Boron Carbon Nitrogen Oxygen Fluorine Neon Sodium Magnesium Aluminum Silicon Phosphorus Sulfur Chlorine Argon Potassium Calcium Scandium Titanium Vanadium Chromium Manganese Iron Cobalt Nickel Copper Zinc Gallium Germanium Arsenic Selenium Bromine Krypton Rubidium Strontium Yttrium Zirconium Niobium Molybdenum Technetium Ruthenium Rhodium Palladium Silver Cadmium Indium Tin Antimony Tellurium Iodine Xenon Cesium Barium Lanthanum Cerium Praseodymium Neodymium Promethium Samarium Europium Gadolinium Terbium Dysprosium Holmium Erbium Thulium Ytterbium Lutetium Hafnium Tantalum Tungsten Rhenium Osmium Iridium Platinum Gold Mercury Thallium Lead Bismuth Polonium Astatine Radon Francium Radium Actinium Thorium Protactinium Uranium Neptunium Plutonium Americium Curium Berkelium Californium Einsteinium Fermium Mendelevium Nobelium Lawrencium Rutherfordium Dubnium Seaborgium Bohrium Hassium Meitnerium Darmstadtium Roentgenium Copernicium Nihonium Flerovium Moscovium Livermorium Tennessine Oganesson'.split(' ');
const ZOF = {}; SYMS.forEach((s, i) => ZOF[s] = i + 1);

function ptPos(z) { // [row, col]; rows 9-10 = f-block
  if (z === 1) return [1, 1]; if (z === 2) return [1, 18];
  if (z <= 4) return [2, z - 2]; if (z <= 10) return [2, z + 8];
  if (z <= 12) return [3, z - 10]; if (z <= 18) return [3, z];
  if (z <= 36) return [4, z - 18]; if (z <= 54) return [5, z - 36];
  if (z <= 56) return [6, z - 54]; if (z <= 71) return [9, z - 54];
  if (z <= 86) return [6, z - 68]; if (z <= 88) return [7, z - 86];
  if (z <= 103) return [10, z - 86]; return [7, z - 100];
}

/* ================= REACTION BANK ================= */
const TYPE_NAME = {
  alpha: 'alpha decay', beta: 'beta decay', positron: 'positron emission', ec: 'electron capture',
  alphag: 'alpha decay with gamma emission', betag: 'beta decay with gamma emission',
  fission: 'fission', fusion: 'fusion', trans: 'transmutation (bombardment)'
};
const BANK = [
  // ---------- EASY: alpha / beta-minus ----------
  {tier:'easy', t:'alpha', e:'U238/92 -> Th234/90 + He4/2', p:'Uranium-238 undergoes alpha decay.'},
  {tier:'easy', t:'alpha', e:'Ra226/88 -> Rn222/86 + He4/2', p:'Radium-226 undergoes alpha decay.'},
  {tier:'easy', t:'alpha', e:'Rn222/86 -> Po218/84 + He4/2', p:'Radon-222 undergoes alpha decay.'},
  {tier:'easy', t:'alpha', e:'Po210/84 -> Pb206/82 + He4/2', p:'Polonium-210 undergoes alpha decay.'},
  {tier:'easy', t:'alpha', e:'Am241/95 -> Np237/93 + He4/2', p:'Americium-241 (used in smoke detectors) undergoes alpha decay.'},
  {tier:'easy', t:'alpha', e:'Pu239/94 -> U235/92 + He4/2', p:'Plutonium-239 undergoes alpha decay.'},
  {tier:'easy', t:'alpha', e:'Th232/90 -> Ra228/88 + He4/2', p:'Thorium-232 undergoes alpha decay.'},
  {tier:'easy', t:'beta', e:'C14/6 -> N14/7 + e0/-1', p:'Carbon-14 undergoes beta decay.'},
  {tier:'easy', t:'beta', e:'I131/53 -> Xe131/54 + e0/-1', p:'Iodine-131 undergoes beta decay.'},
  {tier:'easy', t:'beta', e:'Sr90/38 -> Y90/39 + e0/-1', p:'Strontium-90 undergoes beta decay.'},
  {tier:'easy', t:'beta', e:'H3/1 -> He3/2 + e0/-1', p:'Hydrogen-3 (tritium) undergoes beta decay.'},
  {tier:'easy', t:'beta', e:'Th234/90 -> Pa234/91 + e0/-1', p:'Thorium-234 undergoes beta decay.'},
  {tier:'easy', t:'beta', e:'P32/15 -> S32/16 + e0/-1', p:'Phosphorus-32 undergoes beta decay.'},
  {tier:'easy', t:'beta', e:'K40/19 -> Ca40/20 + e0/-1', p:'Potassium-40 undergoes beta decay.'},
  {tier:'easy', t:'beta', e:'U239/92 -> Np239/93 + e0/-1', p:'Uranium-239 undergoes beta decay.'},
  // ---------- MEDIUM: positron / electron capture / gamma ----------
  {tier:'medium', t:'positron', e:'C11/6 -> B11/5 + e0/+1', p:'Carbon-11 undergoes positron emission.'},
  {tier:'medium', t:'positron', e:'F18/9 -> O18/8 + e0/+1', p:'Fluorine-18 (used in PET scans) undergoes positron emission.'},
  {tier:'medium', t:'positron', e:'O15/8 -> N15/7 + e0/+1', p:'Oxygen-15 undergoes positron emission.'},
  {tier:'medium', t:'positron', e:'N13/7 -> C13/6 + e0/+1', p:'Nitrogen-13 undergoes positron emission.'},
  {tier:'medium', t:'positron', e:'Na22/11 -> Ne22/10 + e0/+1', p:'Sodium-22 undergoes positron emission.'},
  {tier:'medium', t:'ec', e:'Be7/4 + e0/-1 -> Li7/3', p:'Beryllium-7 undergoes electron capture.'},
  {tier:'medium', t:'ec', e:'K40/19 + e0/-1 -> Ar40/18', p:'Potassium-40 undergoes electron capture.'},
  {tier:'medium', t:'ec', e:'Fe55/26 + e0/-1 -> Mn55/25', p:'Iron-55 undergoes electron capture.'},
  {tier:'medium', t:'ec', e:'I125/53 + e0/-1 -> Te125/52', p:'Iodine-125 undergoes electron capture.'},
  {tier:'medium', t:'ec', e:'Cr51/24 + e0/-1 -> V51/23', p:'Chromium-51 undergoes electron capture.'},
  {tier:'medium', t:'alphag', e:'U238/92 -> Th234/90 + He4/2 + γ0/0', p:'Uranium-238 undergoes alpha decay and gives off a gamma ray.'},
  {tier:'medium', t:'alphag', e:'Ra226/88 -> Rn222/86 + He4/2 + γ0/0', p:'Radium-226 undergoes alpha decay and gives off a gamma ray.'},
  {tier:'medium', t:'betag', e:'Co60/27 -> Ni60/28 + e0/-1 + γ0/0', p:'Cobalt-60 undergoes beta decay and gives off a gamma ray.'},
  {tier:'medium', t:'betag', e:'Cs137/55 -> Ba137/56 + e0/-1 + γ0/0', p:'Cesium-137 undergoes beta decay and gives off a gamma ray.'},
  {tier:'medium', t:'betag', e:'I131/53 -> Xe131/54 + e0/-1 + γ0/0', p:'Iodine-131 undergoes beta decay and gives off a gamma ray.'},
  // ---------- HARD: fission / fusion / transmutation ----------
  {tier:'hard', t:'fission', e:'U235/92 + n1/0 -> Ba141/56 + Kr92/36 + 3 n1/0', p:'Uranium-235 absorbs a neutron and splits into barium-141, krypton-92, and neutrons.'},
  {tier:'hard', t:'fission', e:'U235/92 + n1/0 -> Xe140/54 + Sr94/38 + 2 n1/0', p:'Uranium-235 absorbs a neutron and splits into xenon-140, strontium-94, and neutrons.'},
  {tier:'hard', t:'fission', e:'U235/92 + n1/0 -> Cs144/55 + Rb90/37 + 2 n1/0', p:'Uranium-235 absorbs a neutron and splits into cesium-144, rubidium-90, and neutrons.'},
  {tier:'hard', t:'fission', e:'Pu239/94 + n1/0 -> Xe134/54 + Zr103/40 + 3 n1/0', p:'Plutonium-239 absorbs a neutron and splits into xenon-134, zirconium-103, and neutrons.'},

function title(text) { g.save(); g.fillStyle = '#8aa0b5'; g.font = '600 13px system-ui,sans-serif'; g.fillText(text, 10, 20); g.restore(); }
const easeIn = u => u * u, easeOut = u => 1 - (1 - u) * (1 - u), clamp01 = u => Math.max(0, Math.min(1, u));

function buildScene(left, right, ttl) {
  const L = bodies(left), R = bodies(right);
  const cA = left.reduce((a, s) => a + s.coef * Math.max(0, s.A), 0), cZ = left.reduce((a, s) => a + s.coef * s.Z, 0);
  let ti = 0; L.forEach((b, i) => { if (b.A > L[ti].A) ti = i; });
  const order = R.map((_, i) => i).sort((a, b) => R[b].A - R[a].A);
  const heavy = order.filter(i => R[i].kind === 'nuc' && R[i].A >= 20);
  const anchors = heavy.length >= 2 ? heavy : [order[0]];
  const emitted = order.filter(i => !anchors.includes(i));
  const maxA = Math.min(300, Math.max(4, cA, ...L.map(b => b.A), ...R.map(b => b.A)));
  return { L, R, ti, anchors, emitted, cA, cZ, maxA, title: ttl, finished: false };
}
function drawScene(sc, t) {
  const W = AN.W, H = AN.H; g.setTransform(AN.dpr, 0, 0, AN.dpr, 0, 0); g.clearRect(0, 0, W, H);
  const s = scaleFor(sc.maxA), cx = W / 2, cy = H * 0.44;
  title(sc.title);
  const tgt = sc.L[sc.ti];
  if (t < 0.42) {
    const u = t / 0.42;
    const wob = sc.L.length === 1 ? Math.sin(t * 95) * u * s * 0.9 : 0;
    drawBody(tgt, cx + wob, cy, s);
    labelBody(tgt, cx, cy, s, 1 - clamp01((u - 0.55) / 0.35));
    const proj = sc.L.filter((_, i) => i !== sc.ti), m = proj.length;
    proj.forEach((b, j) => {
      const sx = Math.max(radiusOf(b, s) + 10, W * 0.08), sy = cy + (j - (m - 1) / 2) * Math.min(70, H * 0.3);
      const ex = cx - radiusOf(tgt, s) * 0.5, e = easeIn(u);
      const x = sx + (ex - sx) * e, y = sy + (cy - sy) * e;
      drawBody(b, x, y, s);
      labelBody(b, x, y, s, 1 - clamp01((u - 0.55) / 0.35));
    });
  } else if (t < 0.55) {
    const u = (t - 0.42) / 0.13, wob = Math.sin(t * 140) * s * 0.7;
    drawNucleus(cx + wob, cy, sc.cA, sc.cZ, s, 0.4 + 0.6 * Math.sin(u * Math.PI));
  } else {
    const u = easeOut(clamp01((t - 0.55) / 0.45)), raw = clamp01((t - 0.55) / 0.45);
    if (raw < 0.5) { // flash ring
      g.save(); g.strokeStyle = `rgba(255,230,140,${0.8 * (1 - raw * 2)})`; g.lineWidth = 3;
      g.beginPath(); g.arc(cx, cy, 10 + raw * Math.min(W, H) * 0.8, 0, Math.PI * 2); g.stroke(); g.restore();
    }
    const la = clamp01((raw - 0.45) / 0.4);
    const k = sc.anchors.length;
    sc.anchors.forEach((i, j) => {
      const b = sc.R[i];
      const fx = k === 1 ? cx : cx + (j - (k - 1) / 2) * (W * 0.44 / Math.max(1, k - 1));
      const x = cx + (fx - cx) * u;
      drawBody(b, x, cy, s); labelBody(b, x, cy, s, la);
    });
    const m = sc.emitted.length, center = -0.5, step = Math.min(1.15, 3.6 / Math.max(1, m));
    const MULTI = [-Math.PI / 2, Math.PI / 2, -Math.PI / 2 + 0.55, Math.PI / 2 - 0.55, -Math.PI / 2 - 0.55, Math.PI / 2 + 0.55];
    const aR = k === 1 ? radiusOf(sc.R[sc.anchors[0]], s) : 0;
    sc.emitted.forEach((i, j) => {
      const b = sc.R[i], ang = k > 1 ? MULTI[j % 6] : center + (j - (m - 1) / 2) * step, ca = Math.cos(ang), sa = Math.sin(ang);
      const D0 = aR * 0.6;
      let D = Math.min(W, H) * 0.42 + aR * 0.5;
      // keep inside canvas
      const lim = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const exT = lim(cx + ca * D, 26, W - 26), eyT = lim(cy + sa * D, 34, H - 44);
      if (b.kind === 'g') {
        const len = Math.hypot(exT - cx, eyT - cy);
        drawGamma(cx + ca * D0, cy + sa * D0, ang, u * (len - D0) + 0.0001, 60);
        const hx = cx + ca * (D0 + u * (len - D0)), hy = cy + sa * (D0 + u * (len - D0));
        drawNuclide(hx, hy + 22, 'γ', 0, 0, 15, la);
        return;
      }
      const sx = cx + ca * D0, sy = cy + sa * D0, x = sx + (exT - sx) * u, y = sy + (eyT - sy) * u;
      drawBody(b, x, y, s); labelBody(b, x, y, s, la);
    });
  }
}
function drawIdle() {
  const W = AN.W, H = AN.H; g.setTransform(AN.dpr, 0, 0, AN.dpr, 0, 0); g.clearRect(0, 0, W, H);
  const id = AN.idle; if (!id) return;
  const cy = H * 0.44;
  const question = (x, y, r) => {
    g.save(); g.setLineDash([6, 5]); g.strokeStyle = '#ffb020'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#ffb020'; g.font = `700 ${Math.round(r)}px system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', x, y); g.restore();
  };
  if (id.title) title(id.title);
  if (!id.items.length) {
    question(W / 2, cy, 34);
    g.save(); g.fillStyle = '#8aa0b5'; g.font = '14px system-ui,sans-serif'; g.textAlign = 'center';
    g.fillText(id.text || '', W / 2, cy + 64); g.restore(); return;
  }
  const items = id.items.map(it => it.unknown ? it : Object.assign({ kind: kindOf(it) }, it));
  const maxA = Math.min(300, Math.max(4, ...items.map(it => it.unknown ? 4 : it.A)));
  let s = scaleFor(maxA) * 0.85;
  const gap = 34, arrowW = id.arrowQ ? 90 : 0;
  const widthAt = sc => items.reduce((a, it) => a + 2 * (it.unknown ? 26 : radiusOf(it, sc)), 0) + gap * (items.length - 1) + arrowW;
  let tw = widthAt(s); if (tw > W * 0.92) { s *= (W * 0.92) / tw; tw = widthAt(s); }
  let x = (W - tw) / 2;
  items.forEach((it, i) => {
    const r = it.unknown ? 26 : radiusOf(it, s);
    x += r;
    if (it.unknown) question(x, cy, r);
    else if (it.kind === 'g') { drawGamma(x - 20, cy, 0, 40, 40); drawNuclide(x, cy + 30, 'γ', 0, 0, 15, 1); }
    else { drawBody(it, x, cy, s); labelBody(it, x, cy, s, 1); }
    x += r;
    if (i < items.length - 1) { g.save(); g.fillStyle = '#8aa0b5'; g.font = '24px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('+', x + gap / 2, cy); g.restore(); x += gap; }
  });
  if (id.arrowQ) {
    g.save(); g.fillStyle = '#e6edf3'; g.font = '28px serif'; g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillText('→', x + 30, cy);
    g.fillStyle = '#ffb020'; g.font = '700 26px system-ui,sans-serif'; g.fillText('?', x + 70, cy); g.restore();
  }
  if (id.text) { g.save(); g.fillStyle = '#8aa0b5'; g.font = '13px system-ui,sans-serif'; g.textAlign = 'center'; g.fillText(id.text, W / 2, H - 12); g.restore(); }
}
function play(left, right, ttl) {
  cancelAnimationFrame(AN.raf);
  AN.scene = buildScene(left, right, ttl); AN.playing = true; AN.start = performance.now(); AN.t = 0;
  $('replayBtn').hidden = false;
  AN.raf = requestAnimationFrame(tick);
}
function tick(now) {
  if (!AN.scene) return;
  const t = Math.min(1, (now - AN.start) / 3600); AN.t = t;
  drawScene(AN.scene, t);
  if (t < 1) AN.raf = requestAnimationFrame(tick); else { AN.playing = false; AN.scene.finished = true; }
}
function setIdle(spec) {
  cancelAnimationFrame(AN.raf); AN.playing = false; AN.scene = null; AN.idle = spec;
  $('replayBtn').hidden = true; drawIdle();
}
function updateAnimIdle() {
  if (S.mode === 'free') {
    if (S.free.solved && AN.scene) return;
    const items = [];
    for (const t of S.free.tokens) {
      if (t.t === 'arrow') break;
      if (t.t !== 'sp') continue;
      const A = parseInt(t.A, 10), Z = parseInt(t.Z, 10);
      if (!t.sym || isNaN(A) || isNaN(Z)) continue;
      const n = Math.min(t.coef === '' ? 1 : (parseInt(t.coef, 10) || 1), 4);
      for (let i = 0; i < n; i++) items.push({ sym: t.sym, A, Z });
    }
    setIdle({ items, title: 'Your reactants', text: items.length ? 'Press Check to watch your reaction.' : 'Your reactants will appear here.' });
    return;
  }
  const q = S.guided.q;
  if (q.done && AN.scene) return;
  if (S.level === 3) { setIdle({ items: [], text: 'Build the equation, then press Check to watch it happen.' }); return; }
  const items = [];
  for (const t of q.tokens) {
    if (t.t === 'arrow') break;
    if (t.t !== 'sp') continue;
    if (t.blank) items.push({ unknown: true });
    else { const n = t.coef === '' ? 1 : +t.coef; for (let i = 0; i < n; i++) items.push({ sym: t.sym, A: +t.A, Z: +t.Z }); }
  }
  setIdle({ items, arrowQ: true, text: 'Answer correctly to watch the reaction.' });
}
function resizeCanvas() {
  const r = cv.getBoundingClientRect(); if (!r.width || !r.height) return;
  AN.dpr = window.devicePixelRatio || 1; AN.W = r.width; AN.H = r.height;
  cv.width = Math.round(r.width * AN.dpr); cv.height = Math.round(r.height * AN.dpr);
  AN.spriteS = 0;
  if (AN.scene) drawScene(AN.scene, AN.playing ? AN.t : 1); else drawIdle();
}
$('replayBtn').addEventListener('click', () => { if (AN.scene) { AN.scene.finished = false; AN.playing = true; AN.start = performance.now(); cancelAnimationFrame(AN.raf); AN.raf = requestAnimationFrame(tick); } });
if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(cv); else window.addEventListener('resize', resizeCanvas);

/* ================= WIRING ================= */
$('modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.mode === S.mode) return;
  S.mode = b.dataset.mode; AN.scene = null; render();
  if (S.mode === 'guided' && S.guided.q.done) play(S.guided.q.item.eq.left, S.guided.q.item.eq.right, cap(TYPE_NAME[S.guided.q.item.t]));
});
$('levelSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) requestLevel(+b.dataset.level); });
$('targetSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const c = cur(); if (!c.done) { c.field = b.dataset.field; c.fresh = true; render(); } });
$('species').addEventListener('click', e => { const b = e.target.closest('.sp'); if (b) onSpecies(b.dataset.k); });
$('tools').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = b.dataset.tool; if (t === 'plus') insertOp('plus'); else if (t === 'arrow') insertOp('arrow'); else if (t === 'del') deleteSel();
});
$('checkBtn').addEventListener('click', onCheck);
$('nextBtn').addEventListener('click', onNext);
$('hintBtn').addEventListener('click', onHint);
$('clearBtn').addEventListener('click', clearAll);
document.addEventListener('keydown', e => { // optional physical keyboard support
  if (!$('overlay').hidden) return;
  if (/^[0-9]$/.test(e.key)) { onDigit(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { onBack(); e.preventDefault(); }
  else if (e.key === '-') { onSign(); e.preventDefault(); }
  else if (e.key === 'Enter') { const c = cur(); if (c.done && S.mode === 'guided') onNext(); else onCheck(); e.preventDefault(); }
});

/* ================= SELF-TEST ================= */
function selfTest() {
  let fails = 0;
  if (SYMS.length !== 118 || NAMES.length !== 118) { console.error('Element table length', SYMS.length, NAMES.length); fails++; }
  BANK.forEach((b, i) => {
    const L = sums(b.eq.left), R = sums(b.eq.right);
    if (L.A !== R.A || L.Z !== R.Z) { console.error(`Bank #${i} unbalanced: ${b.e}`, L, R); fails++; }
    [...b.eq.left, ...b.eq.right].forEach(s => { const e = speciesErr(s); if (e) { console.error(`Bank #${i} (${b.e}): ${e}`); fails++; } });
    if (!b.p || !TYPE_NAME[b.t]) { console.error(`Bank #${i} missing prompt/type`); fails++; }
  });
  const tiers = {}; BANK.forEach(b => tiers[b.tier] = (tiers[b.tier] || 0) + 1);
  console.log(`[Nuclear Equation Builder] self-test: ${BANK.length} reactions checked, ${fails} failure(s).`, tiers);
  return fails;
}

/* ================= INIT ================= */
buildPeriodicTable(); buildNumpad(); selfTest(); newSet(); resizeCanvas();
window.__NEB = { S, BANK, selfTest, play, l3Hint }; // for testing
})();
