<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Significant Figures &amp; Measurement</title>
<meta name="description" content="Interactive significant figures activity: read graduated cylinders, burets and balances, count sig figs, round, and multiply/divide with the correct number of significant figures.">
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#0f172a; --muted:#475569; --line:#cbd5e1;
  --accent:#1d4ed8; --accent-2:#1e3a8a; --sig:#065f46; --sigbg:#d1fae5; --non:#64748b;
  --ok:#065f46; --okbg:#dcfce7; --bad:#9f1239; --badbg:#ffe4e6; --warn:#92400e; --warnbg:#fef3c7;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:18px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
sup{font-size:.7em;line-height:0;vertical-align:super}
.topbar{position:sticky;top:0;z-index:20;background:#0f2747;color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:8px 16px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.topbar h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{background:#1f3b66;border:2px solid #3b5b8c;color:#fff;border-radius:10px;padding:6px 14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:42px}
.tab[aria-selected="true"]{background:#fff;color:#0f2747;border-color:#fff}
.tab.locked{opacity:.85}
.tab .lock{width:16px;height:16px}
.tab .chk{font-weight:900;color:#4ade80}
.tab[aria-selected="true"] .chk{color:#15803d}
main{max-width:1280px;margin:0 auto;padding:12px 16px 40px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{font-size:24px;margin:2px 0 8px}
h3{font-size:20px;margin:4px 0 6px}
.btn{border:2px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:44px;touch-action:manipulation}
.btn:hover{background:var(--accent-2)}
.btn.sec{background:#fff;color:var(--accent)}
.btn.sec:hover{background:#eef2ff}
.btn.small{padding:4px 10px;min-height:36px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sel{background:#0f2747;border-color:#0f2747;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:15px}
input.ans{border:2px solid #64748b;border-radius:10px;padding:8px 10px;font-size:20px;width:220px;max-width:100%;background:#fff}
input.ans.int{width:110px}
input.ans:focus{outline:3px solid #93c5fd;border-color:var(--accent)}
.fb{border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok);border:2px solid #86efac}
.fb.bad{background:var(--badbg);color:var(--bad);border:2px solid #fda4af}
.fb.info{background:#e0f2fe;color:#075985;border:2px solid #7dd3fc}
.fb .tag{display:inline-block;background:#fff;border-radius:6px;padding:0 6px;margin-right:6px;font-weight:800}
.alt{font-weight:400;color:var(--muted)}
.key{font-weight:800}
kbd{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:5px;padding:0 5px;font-family:inherit}

/* numbers with digit classes */
.num{display:inline-flex;align-items:baseline;gap:2px;font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;letter-spacing:1px}
.num.big{font-size:52px}
.num .d{padding:0 2px;border-radius:6px;transition:background .3s,color .3s}
.num .d.sig{color:var(--sig);font-weight:900;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px;background:var(--sigbg)}
.num .d.non{color:var(--non);font-weight:400;text-decoration:line-through dotted;text-decoration-thickness:2px}
.num .d.focus{outline:3px solid #f59e0b}
.num .tens{color:var(--muted);font-size:.8em;margin-left:6px}
.sigtxt{color:var(--sig);font-weight:900;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.legend{font-size:15px;color:var(--muted);margin-top:6px}

/* learn */
.lp{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.pbar{flex:1;min-width:160px;height:12px;background:#e2e8f0;border-radius:8px;overflow:hidden;border:1px solid #cbd5e1}
.pbar span{display:block;height:100%;background:#16a34a;width:0;transition:width .3s}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid #94a3b8;background:#fff;font-weight:800;font-size:15px;cursor:pointer}
.dot.seen{background:#dcfce7;border-color:#16a34a}
.dot.cur{background:#0f2747;color:#fff;border-color:#0f2747}
.stop{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.2fr);gap:14px;align-items:start}
.stop-text ul{margin:4px 0 0;padding-left:22px}
.stop-text li{margin:6px 0}
.stop-vis{min-height:330px}
.lnav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;position:sticky;bottom:0;background:#fff;padding:8px 0;border-top:1px solid #e2e8f0;z-index:5}
.vis-ctrls{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.cap{font-size:16px;color:var(--muted);margin-top:4px}
.callout{background:#fff7ed;border:2px solid #fdba74;border-radius:10px;padding:8px 12px;margin-top:8px}

/* instruments */
.inst{display:inline-block}
.inst-views{display:flex;align-items:flex-start;gap:6px}
svg.overview{width:76px;height:auto}
svg.zoom{width:240px;max-width:62vw;height:auto;touch-action:manipulation}
svg.balance{width:300px;max-width:100%;height:auto}
svg.pipet{width:190px;height:auto}
.inst-cap{font-size:15px;color:var(--muted);max-width:330px}
.reading-line{font-size:26px;font-weight:700;margin-top:6px}
.est{color:#b45309;text-decoration:underline wavy;text-decoration-thickness:2px;text-underline-offset:5px}
.drop{opacity:0}
.dripping .d1{animation:drip 1.2s linear infinite}
.dripping .d2{animation:drip 1.2s linear .6s infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}80%{transform:translateY(34px);opacity:1}100%{transform:translateY(40px);opacity:0}}

/* practice */
.seg{display:inline-flex;border:2px solid #0f2747;border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px}
.seg button.on{background:#0f2747;color:#fff}
.types{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.types .btn{font-size:16px;padding:4px 10px;min-height:38px}
.pgrid{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(260px,1fr);gap:14px;align-items:start}
.step{border-left:5px solid #cbd5e1;padding:6px 10px;margin:8px 0;background:#f8fafc;border-radius:0 10px 10px 0;animation:fadein .35s ease}
.step.done{border-left-color:#16a34a}
.step.shown{border-left-color:#f59e0b}
.step .why{color:var(--muted);font-size:16px;margin-top:2px}
.step .lab{font-weight:800}
.step .stepans{font-weight:800;color:var(--sig)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mastery{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mbar{display:flex;gap:6px}
.mbar span{width:44px;height:20px;border-radius:6px;border:2px solid #16a34a;background:#fff}
.mbar span.on{background:#16a34a}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.tapnum .d{cursor:pointer;border:2px solid #94a3b8;margin:0 2px;min-width:40px;text-align:center;background:#fff;padding:2px 6px}
.tapnum .d.picked{background:var(--sigbg);color:var(--sig);font-weight:900;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px;border-color:#059669}
.tapnum .d.wrong{outline:3px solid #e11d48}
.prob{font-size:20px}
.calc{display:inline-block;background:#1f2937;border-radius:16px;padding:12px;border:3px solid #111827}
.calc .scr{background:#c7d9b7;font-family:'Courier New',monospace;font-size:30px;padding:8px 12px;border-radius:8px;text-align:right;min-width:260px;color:#111;font-weight:700}
.calc .scr small{display:block;font-size:15px;text-align:left;font-weight:400}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.mcopts{display:grid;gap:8px;margin-top:8px}
.mcopts button{text-align:left;border:2px solid #94a3b8;border-radius:10px;background:#fff;padding:10px 12px;cursor:pointer;font-size:18px;min-height:48px}
.mcopts button.right{border-color:#16a34a;background:#dcfce7}
.mcopts button.wrongpick{border-color:#e11d48;background:#ffe4e6}
.wrongpick{border-color:#e11d48!important;background:#ffe4e6!important;color:#9f1239!important}
.dcol svg.zoom{width:190px}
.phase{display:inline-block;background:#0f2747;color:#fff;border-radius:8px;padding:2px 10px;font-weight:800;font-size:16px;letter-spacing:.5px;text-transform:uppercase}
.pickone{font-size:15px;font-weight:700;color:var(--muted);margin:4px 0 2px}
.opts{display:grid;gap:8px;max-width:640px;margin:4px 0}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:2px solid #94a3b8;border-radius:12px;background:#f8fafc;padding:10px 14px;font-size:18px;cursor:pointer;min-height:50px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent);background:#eef2ff}
.opt .dotr{flex:none;width:22px;height:22px;border-radius:50%;border:3px solid #64748b;background:#fff}
.opt.picked .dotr{border-color:#0f2747;background:radial-gradient(circle,#0f2747 45%,#fff 50%)}
.opt.rightpick{border-color:#16a34a!important;background:#dcfce7!important;color:#065f46!important;font-weight:700}
.opt.rightpick .dotr{border-color:#16a34a;background:radial-gradient(circle,#16a34a 45%,#fff 50%)}
.opt:disabled{cursor:default}
.opt:disabled:not(.picked){opacity:.6}
.btn.ghost{background:transparent;border:2px dashed #94a3b8;color:var(--muted);font-weight:600}
.btn.ghost:hover{background:#f1f5f9;color:var(--ink)}
.newrow{margin-top:14px;padding-top:10px;border-top:1px solid #e2e8f0}
.pnext{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.seg button .lock,.types .lock{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.lockbox{display:flex;gap:12px;align-items:flex-start}
.needs li{margin:6px 0}
#scoreCanvas{max-width:100%;height:auto;border:1px solid #cbd5e1;border-radius:10px;background:#fff}

@media (max-width:860px){
  .stop,.pgrid{grid-template-columns:1fr}
  .topbar h1{font-size:18px}
  .tabs{margin-left:0}
}
@media (max-width:520px){
  body{font-size:17px}
  .num{font-size:26px}.num.big{font-size:38px}
  .tab{padding:5px 9px}
  main{padding:8px}
  .types{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .types .btn{white-space:nowrap}
  svg.zoom{width:200px}
}
@media (max-height:640px) and (min-width:861px){
  .stop-vis{min-height:0}
  svg.zoom{width:200px}
  h2{font-size:22px}
}
body:has(#ct-bar.pos-tl) .topbar{padding-left:58px}
</style>

<body>
<header class="topbar">
  <h1>Significant Figures &amp; Measurement</h1>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="learn" aria-selected="true">Learn</button>
    <button class="tab" role="tab" data-tab="practice" aria-selected="false">Practice</button>
    <button class="tab" role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
  </nav>
</header>
<main>
  <section id="learn" class="panel active" aria-label="Learn"></section>
  <section id="practice" class="panel" aria-label="Practice"></section>
  <section id="quiz" class="panel" aria-label="Quiz"></section>
</main>
<script>
"use strict";
/* ===================== SIG FIG ENGINE ===================== */
const SUPMAP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','⁺':'+'};
const TOSUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':'⁺'};
function supStr(n){ return String(n).split('').map(c=>TOSUP[c]||c).join(''); }

/* seeded RNG (mulberry32) so I-do examples are stable */
function makeRng(seed){ let a = seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let RNG = Math.random;
function rnd(){ return RNG(); }
function ri(a,b){ return a+Math.floor(rnd()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function withSeed(seed, fn){ const old=RNG; RNG=makeRng(seed); try{ return fn(); } finally { RNG=old; } }

/* count sig figs in a mantissa string (no exponent) */
function countSF(m){
  m = String(m).replace(/^[+-]/,'');
  if(m.indexOf('.')>=0){ return m.replace('.','').replace(/^0+/,'').length; }
  return m.replace(/^0+/,'').replace(/0+$/,'').length;
}
function decimalsOf(m){ m=String(m); const i=m.indexOf('.'); return i<0?0:m.length-i-1; }

/* classify each character of a mantissa string */
function classify(m){
  const ch=[...String(m)];
  const hasPt = ch.indexOf('.')>=0;
  const dig = ch.map((c,i)=>/\d/.test(c)?i:-1).filter(i=>i>=0);
  const nz = dig.filter(i=>ch[i]!=='0');
  const firstNZ = nz.length?nz[0]:Infinity, lastNZ = nz.length?nz[nz.length-1]:-1;
  return ch.map((c,i)=>{
    if(!/\d/.test(c)) return {ch:c, kind:'point', sig:false, digit:false};
    if(c!=='0') return {ch:c, kind:'nonzero', sig:true, digit:true};
    if(i<firstNZ) return {ch:c, kind:'leading', sig:false, digit:true};
    if(i<lastNZ) return {ch:c, kind:'captive', sig:true, digit:true};
    return hasPt ? {ch:c, kind:'trailing-dec', sig:true, digit:true} : {ch:c, kind:'trailing-nodec', sig:false, digit:true};
  });
}
const KIND_TXT = {
  'nonzero':'Nonzero digit — always measured, so it is significant.',
  'captive':'Zero in the middle — it sits between measured digits, so it was measured too. Significant.',
  'leading':'Zero in front — it only shows how SMALL the number is (a placeholder). Not significant.',
  'trailing-dec':'Zero at the end after a decimal point — they didn\'t have to write it, so they wrote it because they measured it. Significant.',
  'trailing-nodec':'Zero at the end with no decimal point — it is needed to show how BIG the number is (a placeholder). Not significant.'
};
const KIND_SHORT = {'nonzero':'measured','captive':'measured (middle)','leading':'size only','trailing-dec':'measured (end, decimal)','trailing-nodec':'size only (no decimal)'};

/* parse a student answer. Accepts 2.50 × 10³, 2.50e3, 2.50E3, 2.50x10^3, 2.50*10^3, units after it */
function parseNum(raw){
  if(raw==null) return null;
  let s=String(raw).trim();
  if(!s) return null;
  s=s.replace(/[−–—]/g,'-');
  s=s.replace(/10\s*([⁻⁺]?[⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,(_,e)=>'10^'+[...e].map(c=>SUPMAP[c]).join(''));
  s=s.replace(/[\s,]/g,'');
  const m=s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))(?:(?:[x×X*·∙]|\*\*?)10(?:\^|\*\*)\(?([+-]?\d+)\)?|[eE]([+-]?\d+))?(.*)$/);
  if(!m) return null;
  const rest=m[4]||'';
  if(rest && !/^[a-df-wyzA-DF-WYZµμ°%\/][^]*$/.test(rest)) return null; // allow units only
  const mant=m[1].replace(/^\+/,'');
  const sci = m[2]!==undefined || m[3]!==undefined;
  const exp = sci ? parseInt(m[2]!==undefined?m[2]:m[3],10) : 0;
  const value = Number(mant+'e'+exp);
  if(!isFinite(value)) return null;
  const coef = Math.abs(Number(mant));
  return {raw:String(raw), mant, exp, sci, value, sf:countSF(mant), dec:decimalsOf(mant), hasPt:mant.indexOf('.')>=0, coefOk: !sci || (coef>=1 && coef<10)};
}

/* exact-ish decimal digits like a 12-digit calculator */
function toDigits(x){ const s=Math.abs(x).toExponential(11); const p=s.split('e'); return {neg:x<0, d:p[0].replace('.',''), e:parseInt(p[1],10)}; }
function roundSig(x,n){
  if(x===0) return {neg:false,d:'0'.repeat(Math.max(1,n)),e:0};
  const t=toDigits(x); let e=t.e;
  const keep=t.d.slice(0,n).split('').map(Number);
  while(keep.length<n) keep.push(0);
  if(Number(t.d[n]||'0')>=5){ let i=n-1; while(i>=0){ keep[i]++; if(keep[i]<10) break; keep[i]=0; i--; } if(i<0){ keep.unshift(1); keep.pop(); e++; } }
  return {neg:t.neg, d:keep.join(''), e};
}
function truncSig(x,n){ const t=toDigits(x); return {neg:t.neg, d:t.d.slice(0,n).padEnd(n,'0'), e:t.e}; }
function rNum(r){ return Number((r.neg?'-':'')+r.d[0]+'.'+(r.d.slice(1)||'0')+'e'+r.e); }
function roundDec(x,d){ if(x===0) return 0; const t=toDigits(x); const n=t.e+1+d; if(n<=0) return 0; return rNum(roundSig(x,n)); }
function fmtPlain(r){
  const n=r.d.length, e=r.e; let s;
  if(e>=n-1){ s=r.d+'0'.repeat(e-n+1); if(countSF(s)!==n){ if(e===n-1) s+='.'; else return null; } }
  else if(e>=0){ s=r.d.slice(0,e+1)+'.'+r.d.slice(e+1); }
  else { s='0.'+'0'.repeat(-e-1)+r.d; }
  return (r.neg?'-':'')+s;
}
function coefStr(r){ return (r.neg?'-':'')+r.d[0]+(r.d.length>1?'.'+r.d.slice(1):''); }
function fmtSci(r){ return coefStr(r)+' × 10'+supStr(r.e); }
function fmtSciHTML(r){ return coefStr(r)+' × 10<sup>'+r.e+'</sup>'; }
function plainOK(r){ const p=fmtPlain(r); return p!==null && r.e>=-3 && r.e<=5 && r.e<=r.d.length-1; }
function fmtBest(r){ return plainOK(r)?fmtPlain(r):fmtSci(r); }
function fmtBestHTML(r){ return plainOK(r)?fmtPlain(r):fmtSciHTML(r); }
function fmtAlt(r){ const p=fmtPlain(r); return (p!==null && !plainOK(r) && r.e<=7) ? p : null; }
function sigStr(x,n){ return fmtBest(roundSig(x,n)); }
/* plain string of a number exactly as given (for measured values we store strings) */
function calcDisplay(x){ // what a 10-digit calculator shows
  if(x===0) return '0';
  const t=toDigits(x);
  if(t.e>=10 || t.e<-5){ const r=roundSig(x,10); let c=coefStr(r).replace(/\.?0+$/,''); return c+' × 10'+supStr(r.e); }
  const r=roundSig(x,10); let s=fmtPlain(r); if(s===null) s=String(rNum(r));
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
function qn(x){ return '"'+x+'"'; }
function same(a,b){ return Math.abs(a-b) <= 1e-9*Math.max(Math.abs(a),Math.abs(b)) || (a===0&&b===0); }
function placeName(dec){ return ({0:'ones',1:'tenths',2:'hundredths',3:'thousandths',4:'ten-thousandths'})[dec] || (dec<0?'tens':'small'); }
function plural(n,w){ return n+' '+w+(n===1?'':'s'); }

/* ---------- grade a calculated / rounded answer ---------- */
function grade(input, raw, n, opts){
  opts=opts||{};
  const p=parseNum(input);
  const r=roundSig(raw,n), exp=rNum(r);
  const res={ok:false, p, r, expected:fmtBest(r), expectedHTML:fmtBestHTML(r), msg:'', mistake:null};
  if(opts.requireSci){ res.expected=fmtSci(r); res.expectedHTML=fmtSciHTML(r); }
  else { const a=fmtAlt(r); if(a){ res.expectedHTML+=' <span class="alt">(or '+a+')</span>'; } }
  if(!p){ res.msg='I can\'t read that as a number. Examples: 2.50 or 0.0450 or 2.50 × 10³ (type 2.50e3 or 2.50x10^3).'; res.mistake='Unreadable answer'; return res; }
  const valOk=same(p.value,exp);
  if(opts.requireSci && !p.sci){
    res.mistake='Not in scientific notation';
    res.msg = valOk ? 'The value is right, but this question asks for scientific notation (coefficient × 10 to a power).' : 'Write your answer in scientific notation (coefficient × 10 to a power), e.g. 4.51 × 10⁻⁴ (type 4.51e-4).';
    return res;
  }
  if(opts.requireSci && p.sci && !p.coefOk){

/* number rendered with digit classification */
function digitsHTML(str, opt){
  opt=opt||{};
  const s=splitSci(str);
  const cl=classify(s.mant);
  let h='<span class="num'+(opt.big?' big':'')+'">';
  cl.forEach((c,i)=>{
    if(!c.digit){ h+=`<span class="pt">${c.ch}</span>`; return; }
    const cls = opt.show ? (c.sig?'d sig':'d non') : 'd';
    h+=`<span class="${cls}" data-i="${i}" data-kind="${c.kind}">${c.ch}</span>`;
  });
  if(s.sci) h+=`<span class="tens"> × 10<sup>${s.exp}</sup></span>`;
  return h+'</span>';
}

function intCheck(ans, hint){ return v=>{ const n=parseInt(String(v).trim(),10); return {ok:n===ans, hint}; }; }
function numCheck(ans, hint, relTol){ return v=>{ const p=parseNum(v); if(!p) return {ok:false, hint:'Type a number.'}; return {ok: Math.abs(p.value-ans)<= (relTol||1e-9)*Math.max(Math.abs(ans),1e-12)+1e-12, hint}; }; }
function calcCheck(raw, hint){ return v=>{ const p=parseNum(v); if(!p) return {ok:false,hint:'Type the number your calculator shows.'}; const ok=Math.abs(p.value-raw)<=0.0005*Math.abs(raw); return {ok, hint: ok?'':hint}; }; }
function choiceCheck(i, hint){ return v=>({ok:+v===i, hint}); }
function digitCheck(d, hint){ return v=>({ok:String(v).trim()===String(d), hint}); }

/* number strings rich in zeros */
function genZeroNumber(){
  const nz=()=>String(ri(1,9));
  const dg=()=>String(ri(0,9));
  const t=pick(['small','small','captive','trailnd','trailpt','decz','decz','sci']);
  let s;
  if(t==='small'){ const z=ri(1,3); let d=nz(); const len=ri(1,3); for(let i=0;i<len;i++) d+=(rnd()<0.3?'0':dg()); if(rnd()<0.5) d+='0'; s='0.'+'0'.repeat(z)+d; }
  else if(t==='captive'){ s=nz()+'0'.repeat(ri(1,2))+nz(); if(rnd()<0.4) s+=nz(); }
  else if(t==='trailnd'){ s=nz()+(rnd()<0.5?nz():(rnd()<0.5?'0'+nz():''))+'0'.repeat(ri(1,3)); }
  else if(t==='trailpt'){ s=nz()+(rnd()<0.5?nz():'')+'0'.repeat(ri(1,3))+'.'; }
  else if(t==='decz'){ const ip=pick([nz(), nz()+'0', nz()+'00', '0']); let fp=(ip==='0'?nz():dg())+(rnd()<0.5?'0':''); if(rnd()<0.5) fp+='0'; s=ip+'.'+fp; if(!/0/.test(s.replace(/^0\./,''))) s+='0'; }
  else { let c=nz()+'.'+(rnd()<0.5?'0':dg())+(rnd()<0.5?nz():'')+'0'; if(rnd()<0.3) c=c.slice(0,-1); let e=ri(-8,9); if(e>=-1&&e<=1) e=e<0?-4:5; s=c+' × 10'+supStr(e); }
  return s;
}
function numHTML(s){ const sp=splitSci(s); return sp.sci? sp.mant+' × 10<sup>'+sp.exp+'</sup>' : esc(sp.mant); }
function placeholderCount(str){ const cl=classify(splitSci(str).mant); return cl.filter(c=>c.kind==='leading'||c.kind==='trailing-nodec').length; }
function sfOf(str){ return classify(splitSci(str).mant).filter(c=>c.sig).length; }

GEN.round=function(){
  const cat=pick(['zero','big','small','normal','half','normal']);
  let digits, e, n;
  const nz=()=>String(ri(1,9)), dg=()=>String(ri(0,9));
  if(cat==='zero'){ n=ri(2,3); digits=nz()+(n===3?String(ri(0,8)):'')+'9'+String(ri(5,9))+(rnd()<0.5?nz():''); e=ri(-2,1); }
  else if(cat==='big'){ n=ri(2,3); digits=nz()+dg()+dg()+dg()+nz()+(rnd()<0.5?nz():''); e=digits.length-1; }
  else if(cat==='small'){ n=ri(2,3); digits=nz()+dg()+dg()+nz()+(rnd()<0.5?nz():''); e=-ri(2,4); }
  else if(cat==='half'){ n=ri(2,3); digits=nz()+dg()+(n===3?dg():'')+'5'; e=ri(-1,1); }
  else { n=ri(1,4); digits=nz()+dg()+dg()+dg()+nz(); e=ri(-1,2); }
  const r0={neg:false,d:digits,e}; const given=fmtPlain(r0); const v=rNum(r0);
  const r=roundSig(v,n), keep=digits[n-1], next=digits[n], up=+next>=5;

  P.ti=ti; P.phase=ph; P.idoK=0; S.ui.ti=ti; saveUI('phase',ph);
  drawPracticeNav();
  if(ph==='ido') renderIdo(); else if(ph==='wedo') renderWedo(); else renderYoudo();
  try{ $('#practice').scrollIntoView({block:'start'}); window.scrollTo({top:0}); }catch(e){}
}
function updMastery(){ drawPracticeNav(); }
function phaseHead(label){ return `<div class="row" style="gap:8px;margin-bottom:4px"><span class="phase">${PHN[P.phase]}</span><h3 style="margin:0">${String.fromCharCode(65+P.ti)}. ${TYPES[P.ti].name}</h3>${label?`<span class="muted">· ${label}</span>`:''}</div>`; }
function probHead(pr){ return `<div class="prob">${pr.prompt}</div>`; }
function visualBox(pr){ return pr.visual ? `<div id="pvis">${pr.visual}</div>` : ''; }
/* I do */
function renderIdo(){
  const ti=P.ti, type=TYPES[ti].id;
  const pr=withSeed(1000+ti*37+P.idoK*7919, ()=>genProblem(type));
  P.prob=pr; let shown=0;
  const body=$('#pbody');
  body.innerHTML=`${phaseHead('Worked example '+(P.idoK%3+1)+' of 3')}<div class="${pr.visual?'pgrid':''}"><div>${probHead(pr)}${pr.tapStr?`<div style="margin:10px 0">${digitsHTML(pr.tapStr,{big:true})}</div>`:''}<div id="isteps"></div>
   <div class="row" style="margin-top:8px"><button class="btn" id="inext">Show step 1 ▶</button><button class="btn sec" id="iall">Show all</button><button class="btn ghost" id="ianother">↻ Another example</button></div></div><div>${visualBox(pr)}</div></div>`;
  const reveal=()=>{ if(shown>=pr.steps.length) return; const st=pr.steps[shown];
    $('#isteps').insertAdjacentHTML('beforeend',`<div class="step done"><div class="lab">Step ${shown+1}: ${st.q}</div><div class="stepans">→ ${st.ans}</div><div class="why">Why: ${st.why}</div></div>`);
    if(st.visual && $('#pvis')) $('#pvis').innerHTML=st.visual;
    if(st.kind==='final' && pr.tapStr){ const n=$('.num.big',body); if(n) n.outerHTML=digitsHTML(pr.tapStr,{big:true,show:true}); }
    shown++; $('#inext').textContent= shown<pr.steps.length?`Show step ${shown+1} ▶`:'Done ✓'; $('#inext').disabled=shown>=pr.steps.length;
    if(shown>=pr.steps.length) markPhase('ido'); };
  $('#inext').onclick=reveal; $('#iall').onclick=()=>{ while(shown<pr.steps.length) reveal(); };
  $('#ianother').onclick=()=>{ P.idoK=(P.idoK+1)%3; renderIdo(); };
}
/* input widget for a step / final */
function inputWidget(kind, opts, tapStr){
  if(kind==='choice') return `<div class="pickone">Pick one:</div><div class="opts" role="radiogroup">${opts.map((o,i)=>`<button class="opt" role="radio" aria-checked="false" data-c="${i}"><span class="dotr" aria-hidden="true"></span><span>${o}</span></button>`).join('')}</div>`;
  if(kind==='tap') return `<div class="tapnum" style="margin:6px 0">${digitsHTML(tapStr,{big:true})}</div><button class="btn" data-go>Check</button>`;
  const cls = (kind==='int'||kind==='digit')?'ans int':'ans';
  const im = (kind==='int'||kind==='digit')?'numeric':'text';
  return `<span class="row"><input class="${cls}" inputmode="${im}" autocomplete="off" aria-label="answer"><button class="btn" data-go>Check</button></span>`;
}
function wireInput(box, kind, onSubmit){
  if(kind==='choice'){ $$('[data-c]',box).forEach(b=>b.onclick=()=>{ $$('[data-c]',box).forEach(x=>x.setAttribute('aria-checked','false')); b.setAttribute('aria-checked','true'); b.classList.add('picked'); onSubmit(b.dataset.c,b); }); return; }
  if(kind==='tap'){ $$('.tapnum .d',box).forEach(d=>d.onclick=()=>d.classList.toggle('picked')); $('[data-go]',box).onclick=()=>onSubmit($$('.tapnum .d.picked',box).map(d=>+d.dataset.i)); return; }
  const inp=$('input',box); const go=()=>onSubmit(inp.value); $('[data-go]',box).onclick=go; onEnter(inp,go); setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} },30);
}
function markTapWrong(box, wrong){ (wrong||[]).forEach(w=>{ const d=$(`.tapnum .d[data-i="${w.i}"]`,box); if(d) d.classList.add('wrong'); }); }
/* We do */
function renderWedo(){
  const pr=genProblem(TYPES[P.ti].id); P.prob=pr; P.step=0; P.miss=0;
  const body=$('#pbody');
  body.innerHTML=`${phaseHead('')}<div class="${pr.visual?'pgrid':''}"><div>${probHead(pr)}${pr.tapStr?`<div style="margin:10px 0">${digitsHTML(pr.tapStr,{big:true})}</div>`:''}<div id="wsteps"></div><div class="newrow"><button class="btn ghost" id="wnew">↻ New problem</button></div></div><div>${visualBox(pr)}</div></div>`;
  $('#wnew').onclick=renderWedo;
  wedoStep();
}
function wedoStep(){
  const pr=P.prob, i=P.step; const st=pr.steps[i]; if(!st) return;
  const isFinal=st.kind==='final'; const kind=isFinal?pr.final.kind:st.kind;
  const box=h(`<div class="step"><div class="lab">Step ${i+1} of ${pr.steps.length}: ${st.q}</div><div class="w-in">${inputWidget(isFinal&&kind==='tap'?'tap':kind, st.opts, pr.tapStr)}</div><div class="w-fb"></div></div>`);
  $('#wsteps').appendChild(box); P.miss=0; try{ if(i>0) box.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){}
  const done=(how)=>{ box.classList.add(how==='ok'?'done':'shown'); $('.w-in',box).querySelectorAll('input,button').forEach(x=>x.disabled=true);
    $('.w-fb',box).insertAdjacentHTML('beforeend',`<div class="stepans">${how==='ok'?'✓':'Answer:'} ${st.ans}</div><div class="why">Why: ${st.why}</div>`);
    if(st.visual && $('#pvis')) $('#pvis').innerHTML=st.visual;
    if(isFinal && pr.tapStr){ const n=$('.tapnum .num',box); if(n) n.outerHTML=digitsHTML(pr.tapStr,{big:true,show:true}); }
    P.step++; if(P.step<pr.steps.length) wedoStep(); else { $('#wsteps').insertAdjacentHTML('beforeend',`<div class="fb ok">✓ Problem complete! Do another with <b>New problem</b>, or press <b>Next: You do</b> below.</div>`); markPhase('wedo'); } };
  wireInput(box, isFinal&&kind==='tap'?'tap':kind, (val,btn)=>{
    let r; if(isFinal){ r=pr.final.grade(val); r.hint=r.msg; } else r=st.check(val);
    const fb=$('.w-fb',box);
    if(r.ok){ fb.innerHTML=''; if(btn&&btn.classList) btn.classList.add('rightpick'); done('ok'); return; }
    if(btn&&btn.classList) { btn.classList.add('wrongpick'); }
    if(isFinal && kind==='tap') markTapWrong(box, r.wrong);
    fb.innerHTML=fbHTML(false, isFinal&&r.mistake ? r.hint : 'Not quite.', isFinal?r.mistake:null); done('shown');
  });
}
/* You do */
function renderYoudo(){
  const t=TYPES[P.ti].id, d=pr_()[t];
  const pr=genProblem(t); P.prob=pr; P.hintUsed=false; P.answered=false;
  if(pr.visualPlain) pr.visual=pr.visualPlain;
  const body=$('#pbody'); const kind=pr.final.kind;
  body.innerHTML=`${phaseHead('')}<div class="${pr.visual?'pgrid':''}"><div>${probHead(pr)}
    <div class="step" id="yin">${inputWidget(kind,null,pr.tapStr)}${pr.unit&&kind!=='tap'?` <span class="muted">${pr.unit} (units are not graded)</span>`:''}</div>
    <div class="row"><button class="btn sec" id="yhint" ${pr.noHint?'style="display:none"':''}>Hint (resets streak)</button><button class="btn sec" id="ynext" style="display:none">Next problem ▶</button></div><div id="yfb"></div></div><div>${visualBox(pr)}</div></div>`;
  $('#yhint').onclick=()=>{ P.hintUsed=true; if(!d.youdo){ d.streak=0; save(); drawPracticeNav(); } $('#yfb').innerHTML=`<div class="fb info">Hint: ${pr.final.hint}</div>`; };
  $('#ynext').onclick=renderYoudo;
  wireInput($('#yin'), kind, val=>{
    if(P.answered) return; P.answered=true;
    const r=pr.final.grade(val); $('#yin').querySelectorAll('input,button').forEach(x=>x.disabled=true);
    if(kind==='tap'){ markTapWrong($('#yin'), r.wrong); }
    let justDone=false;
    if(r.ok && !P.hintUsed){ d.streak=(d.streak||0)+1; if(d.streak>=3 && !d.youdo){ justDone=true; } }
    else if(!r.ok){ d.streak=0; }
    save(); if(justDone) markPhase('youdo'); else drawPracticeNav();
    let html;
    if(pr.noHint) html = r.ok ? fbHTML(true,'Correct!') : fbHTML(false,`Correct reading: <b>${r.correctHTML}</b>`, r.mistake);
    else { html=fbHTML(r.ok, r.ok?(P.hintUsed?'Correct! (Hint used, so the streak doesn\'t grow.)':'Correct!'):r.msg, r.ok?null:r.mistake);
      if(!r.ok) html+=`<div class="fb info">Correct answer: ${r.correctHTML}</div>`; }
    if(justDone) html+=`<div class="fb ok">🎉 3 in a row — section ${String.fromCharCode(65+P.ti)} complete! ${P.ti<TYPES.length-1?'Press <b>Next section</b> below.':(quizUnlocked()?'All practice done — the Quiz is unlocked.':'All practice done! View every Learn stop to unlock the Quiz.')}</div>`;
    $('#yfb').innerHTML=html; $('#ynext').style.display=''; $('#yhint').style.display='none'; (justDone?$('#pnext'):$('#ynext')).focus();
  });
}

function mc(short, prompt, correct, wrongs, expl){

}

}
function readQ(instKey){

    grade:v=>{ const r=gradeReading(v,inst,level,top); return {ok:r.ok, msg:r.ok?`Correct — ${level.toFixed(inst.dec)} mL (certain digits + one estimated digit).`:r.msg+` Correct reading: ${level.toFixed(inst.dec)} mL.`}; }};

const Q={list:[], i:0, score:0, results:[], answered:false, started:null};
function buildQuiz(){
  const by=c=>QBANK.filter(q=>q.cat===c);
  const pickN=(arr,n)=>shuffle(arr).slice(0,n);
  const chosen=shuffle([].concat(pickN(by('num'),3),pickN(by('zero'),2),pickN(by('read'),2),pickN(by('mc'),3)));
  Q.list=chosen.map(q=>q.f()); Q.i=0; Q.score=0; Q.results=[]; Q.answered=false;
}

  const qin=$('#qin',el);

    Q.results.push({short:q.short, ok:r.ok});
    if(q.kind==='mc'){ $$('.mcopts button',qin).forEach((b,i)=>{ b.disabled=true; if(i===q.ci) b.classList.add('right'); }); if(!r.ok && btn) btn.classList.add('wrongpick'); }

  if(q.kind==='mc'){ qin.innerHTML=`<div class="mcopts">${q.opts.map((o,i)=>`<button data-c="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`; $$('[data-c]',qin).forEach(b=>b.onclick=()=>submit(b.dataset.c,b)); }

/* ---------- score card ---------- */
function drawScoreCard(){
  const W=900, rowH=40, H=250+Q.results.length*rowH+60;
  const c=document.createElement('canvas'); c.width=W; c.height=H; c.id='scoreCanvas';
  const x=c.getContext('2d'); const F='"Atkinson Hyperlegible", system-ui, sans-serif';
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
  x.fillStyle='#0f2747'; x.fillRect(0,0,W,96);
  x.fillStyle='#fff'; x.font='bold 34px '+F; x.fillText('Significant Figures & Measurement',30,48);
  x.font='20px '+F; x.fillText('chemistryteacher.net/significant-figures',30,80);
  const d=Q.finished||new Date();
  x.fillStyle='#0f172a'; x.font='20px '+F;
  x.fillText('Date: '+d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})+'   Time: '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),30,134);
  x.fillText('Attempt #'+Q.attempt,30,166);
  x.font='bold 56px '+F; x.fillStyle=Q.score>=8?'#065f46':Q.score>=6?'#92400e':'#9f1239';
  x.fillText(Q.score+' / 10',W-230,170);
  x.fillStyle='#cbd5e1'; x.fillRect(30,196,W-60,2);
  Q.results.forEach((r,i)=>{ const y=236+i*rowH;
    x.fillStyle=i%2?'#f8fafc':'#ffffff'; x.fillRect(30,y-28,W-60,rowH);
    x.font='bold 24px '+F; x.fillStyle=r.ok?'#065f46':'#9f1239'; x.fillText(r.ok?'✓':'✗',44,y);
    x.font='20px '+F; x.fillStyle='#0f172a'; let t=(i+1)+'. '+r.short; if(t.length>70) t=t.slice(0,68)+'…'; x.fillText(t,84,y); });
  x.font='16px '+F; x.fillStyle='#475569'; x.fillText('Sig figs are graded in this activity.',30,H-24);
  return c;
}
function renderScore(){
  const el=$('#quiz');
  el.innerHTML=`<div class="card"><h2>Score card</h2><div id="sc"></div>
   <div class="row" style="margin-top:10px"><button class="btn" id="dl">Download PNG</button><button class="btn sec" id="cp">Copy image to clipboard</button><button class="btn sec" id="gm">Email via Gmail</button><button class="btn sec" id="rt">Retake quiz</button></div>
   <div id="scmsg"></div><p class="small muted">To turn it in: download the PNG (or copy it), then attach it to your email or assignment.</p></div>`;
  S.lastScore={score:Q.score, attempt:Q.attempt, results:Q.results, finished:(Q.finished||new Date()).toISOString()}; save();
  const cv=drawScoreCard(); $('#sc',el).appendChild(cv);
  $('#dl',el).onclick=()=>{ try{ const a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download='significant-figures-score-card.png'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ $('#scmsg').innerHTML=fbHTML(false,'Download failed — try right-clicking the image and choosing "Save image as".'); } };
  $('#cp',el).onclick=()=>{ try{ cv.toBlob(b=>{ if(navigator.clipboard && window.ClipboardItem){ navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(()=>{ $('#scmsg').innerHTML=fbHTML(true,'Copied! Paste it into your email or assignment.'); }).catch(()=>{ $('#scmsg').innerHTML=fbHTML(false,'Copy was blocked by this browser — use Download PNG instead.'); }); } else $('#scmsg').innerHTML=fbHTML(false,'This browser can\'t copy images — use Download PNG instead.'); }); }catch(e){ $('#scmsg').innerHTML=fbHTML(false,'Copy failed — use Download PNG instead.'); } };
  $('#gm',el).onclick=()=>{ const d=Q.finished||new Date();
    const body=`Significant Figures & Measurement — Score Card\nchemistryteacher.net/significant-figures\nDate: ${d.toLocaleString('en-US')}\nAttempt #${Q.attempt}\nScore: ${Q.score}/10\n\n`+Q.results.map((r,i)=>`${r.ok?'✓':'✗'} ${i+1}. ${r.short}`).join('\n')+`\n\n(Score card PNG attached.)`;
    const url='https://mail.google.com/mail/?view=cm&fs=1&to=&su='+encodeURIComponent('Significant Figures – Score Card')+'&body='+encodeURIComponent(body);
    window.open(url,'_blank','noopener'); };
  $('#rt',el).onclick=()=>{ Q.list=[]; Q.done=true; renderQuiz(); };
}

/* ===================== APP ===================== */
let curTab='learn';
const RENDER={learn:renderLearn, practice:renderPractice, quiz:renderQuiz};
const rendered={};
function showTab(t){
  if(t!=='learn') clearTimers();
  curTab=t; saveUI('tab',t);
  $$('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t?'true':'false'));
  $$('.panel').forEach(p=>p.classList.toggle('active', p.id===t));
  if(!RENDER[t]) t='learn';
  if(t==='quiz' || !rendered[t]){ RENDER[t](); rendered[t]=true; }
  if(t==='learn') gotoStop(curStop);
  try{ window.scrollTo({top:0}); }catch(e){}
}
function init(){
  load();
  delete S.lab;
  if(/[?&]unlock\b/.test(location.search)){ for(let i=0;i<LEARN_N;i++) if(S.viewed.indexOf(i)<0) S.viewed.push(i); S.mastered=true; TYPES.forEach(t=>{ S.prac[t.id]={ido:true,wedo:true,youdo:true,streak:3}; }); save(); }
  S.mastered = TYPES.every(t=>S.prac&&S.prac[t.id]&&S.prac[t.id].youdo); save();
  if(!(Number.isInteger(S.ui.ti) && S.ui.ti>=0 && S.ui.ti<TYPES.length)){ delete S.ui.ti; delete S.ui.phase; }
  if(typeof S.ui.stop==='number' && S.ui.stop<STOPS.length) curStop=S.ui.stop;
  $$('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  refreshTabs();
  const ft=h(`<footer style="max-width:1280px;margin:0 auto;padding:0 16px 24px" class="small muted">${STORAGE_OK?'Your progress is saved in this browser automatically.':'<b style="color:#9f1239">This browser is blocking saved progress (private window?) — your work will be lost if you close it.</b>'} <button class="btn small sec" id="reset">Reset my progress</button></footer>`);
  document.body.appendChild(ft);
  let armed=false; $('#reset').onclick=()=>{ if(!armed){ armed=true; $('#reset').textContent='Click again to erase ALL progress'; setTimeout(()=>{ armed=false; const r=$('#reset'); if(r) r.textContent='Reset my progress'; },4000); return; }
    try{ localStorage.removeItem(STORE); }catch(e){} location.href=location.pathname; };
  let t=S.ui.tab||'learn'; if(!RENDER[t] || (t==='quiz' && !quizUnlocked())) t='learn';
  showTab(t);
}
init();

</script>
