<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pH Calculations Trainer: pH, pOH, [H⁺] and [OH⁻]</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#eef1f5;color:#15191e;-webkit-tap-highlight-color:transparent;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
/* header */
header{display:flex;align-items:center;gap:10px;min-height:56px;padding:5px 10px 5px 64px;background:#1f3a5f;color:#fff}
header h1{font-size:1.05rem;margin:0;font-weight:700;line-height:1.15}
header h1 small{display:block;font-weight:500;font-size:.75rem;opacity:.85}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{min-height:46px;min-width:96px;padding:3px 10px;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:#2d4f7c;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tab small{font-weight:600;font-size:.74rem;opacity:.95;margin-top:2px}
.tab.on{background:#fff;color:#1f3a5f;border-color:#fff}
.tab.full{background:#1d7a35;border-color:#9fe0b0;color:#fff}
.tab.full.on{box-shadow:0 0 0 3px #fff inset}
.tab.lock{opacity:.62}
/* layout */
main{height:calc(100% - 56px);display:grid;grid-template-columns:minmax(380px,44%) 1fr;gap:12px;padding:10px 12px}
.col{overflow:auto;min-height:0;padding-bottom:6px}
.panel{background:#fff;border:1px solid #d5dbe2;border-radius:14px;padding:12px}
#right .panel{min-height:100%;display:flex;flex-direction:column;gap:10px}
/* step pills */
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pills .lbl{font-weight:700;color:#3b4652;margin-right:2px;font-size:.9rem}
.pill{min-width:44px;min-height:40px;padding:2px 10px;border-radius:20px;border:2px solid #b9c3ce;background:#fff;font-weight:700;color:#3b4652}
.pill.cur{border-color:#1f3a5f;background:#1f3a5f;color:#fff}
.pill.done{border-color:#1d7a35;color:#1d7a35;background:#e6f4ea}
.pill.cur.done{background:#1d7a35;color:#fff}
.pill:disabled{opacity:.45}
.pill.cur:disabled,.pill.done:disabled{opacity:1}
.streak{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:.85rem;font-weight:700;color:#3b4652}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #1d7a35;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff}
.dot.on{background:#1d7a35}
/* gray reference boxes */
.gray{background:#eceff3;border:1px solid #cfd6de;border-radius:10px;padding:8px 12px;color:#26303a}
.gray .t{font-size:.75rem;font-weight:800;letter-spacing:.04em;color:#5a6672;text-transform:uppercase;margin-bottom:2px}
.teach{font-size:1.02rem;line-height:1.4;margin:0 0 8px}
.story{margin-bottom:8px;font-size:1rem;line-height:1.38}
/* question box */
.qbox{border:5px solid #f29d12;border-radius:14px;background:#fffdf7;overflow:hidden;margin-bottom:8px}
.qhead{background:#f29d12;color:#2b1a00;font-weight:800;font-size:.85rem;letter-spacing:.04em;padding:4px 10px}
.qbody{padding:8px 12px 10px}
.qtext{font-size:1.22rem;font-weight:800;line-height:1.3}
.kw{color:#b3141a;text-decoration:underline;text-decoration-color:#d4202a;text-decoration-thickness:3px;text-underline-offset:3px}
.qhint{font-size:.92rem;color:#4a5560;margin-top:3px}
.ans{border:2px dashed #9aa6b2;border-radius:10px;padding:5px 8px 7px;margin-top:6px;background:#fff}
.anslbl{font-size:.72rem;font-weight:800;letter-spacing:.06em;color:#6a7682;margin-bottom:5px}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.row+.row{margin-top:7px}
.opt{min-height:48px;padding:6px 14px;border-radius:10px;border:2px solid #9aa6b2;background:#f7f9fb;font-weight:700;font-size:1.05rem;display:inline-flex;align-items:center;gap:6px}
.opt:hover:not(:disabled){border-color:#1f3a5f}
.opt.right{background:#e6f4ea;border-color:#1d7a35;color:#145a27}
.opt.wrong{background:#fdecea;border-color:#b3261e;color:#8c1d18}
.fopt{flex-direction:column;align-items:flex-start;gap:2px;padding:6px 12px}
.fopt .nm{font-size:.8rem;font-weight:800;color:#5a6672;letter-spacing:.03em}
.fopt .eq{font-size:1.3rem}
.abopt{min-width:118px;justify-content:center;font-size:1.15rem;min-height:54px;border-width:3px}
.abopt.acid{border-color:#d7261e}
.abopt.neut{border-color:#3fae49}
.abopt.base{border-color:#4b3fa8}
.opbtn{min-width:52px;min-height:46px;border-radius:10px;border:2px solid #1f3a5f;background:#fff;font-size:1.45rem;font-weight:800;color:#1f3a5f}
.opbtn.sel{background:#1f3a5f;color:#fff}
.opbtn.p10{font-size:1.05rem;min-width:64px}
.undo{min-height:46px;padding:4px 12px;border-radius:10px;border:2px solid #6a7682;background:#fff;font-weight:700;margin-left:auto}
.chip{min-height:46px;padding:4px 12px;border-radius:12px;border:2px solid #2b6cb0;background:#eef5fd;font-weight:800;font-size:1.12rem;color:#123;display:inline-flex;align-items:baseline;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.chip small,.tk small{font-size:.62em;color:#66727e;font-weight:600}
.chip.sel{background:#2b6cb0;color:#fff;border-color:#174a80}
.chip.sel small{color:#dbe8f7}
.chip.used{display:none}
.chip.grp{border-style:double;border-width:4px}
.big{min-height:52px;padding:6px 22px;border-radius:12px;border:none;background:#1f3a5f;color:#fff;font-weight:800;font-size:1.15rem}
.big.green{background:#1d7a35}
.big.ghost{background:#fff;color:#1f3a5f;border:2px solid #1f3a5f}
.big:disabled{opacity:.45}
.nextrow{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.fb{margin-top:8px;border-radius:10px;padding:7px 10px;font-size:.98rem;line-height:1.35}
.fb.bad{background:#fdecea;border:2px solid #b3261e;color:#6f1510}
.fb.good{background:#e6f4ea;border:2px solid #1d7a35;color:#0f4720}
.fb b{display:block}
.doneline{background:#e6f4ea;border:1px solid #8fcca0;border-left:6px solid #1d7a35;color:#0f4720;border-radius:8px;padding:4px 10px;font-weight:700;font-size:.92rem;margin-bottom:6px}
.measuring *,.measuring *::after{animation:none!important;transition:none!important}
.dl2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.glow{animation:glow 1.1s ease-in-out infinite;position:relative;z-index:1}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,157,18,.9)}50%{box-shadow:0 0 0 7px rgba(242,157,18,.35)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* equation board */
.boardt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.boardt h2{margin:0;font-size:1rem;color:#1f3a5f}
.fcard{display:inline-flex;align-items:center;gap:8px;font-size:1.05rem}
.fcard.moved{background:#fff7e6;border-color:#f29d12}
.fcard .t{line-height:1.15}
.fcard .eq{font-size:1.8rem;gap:.25em}
.ann{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05}
.ann .ar{color:#c8102e;font-size:.7em;font-weight:900;line-height:.9}
.ann .al{color:#c8102e;font-size:.5em;font-weight:800;white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.eqwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;border:2px solid #e1e6ec;border-radius:14px;background:#fbfcfe;padding:10px 6px;overflow:hidden}
.eq{display:flex;align-items:center;justify-content:center;gap:.3em;font-size:2.3rem;font-weight:700;white-space:nowrap;max-width:100%}
.eqs{padding:0 .15em;color:#1f3a5f}
.side{display:inline-flex;align-items:center;gap:.18em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
.fn,.fd{display:flex;align-items:center;gap:.18em;padding:0 .2em}
.fn{border-bottom:.08em solid currentColor;padding-bottom:.08em}
.fd{padding-top:.08em}
.times{color:#5d6975;font-weight:600;font-size:.8em}
.tk{display:inline-flex;align-items:baseline;gap:.12em;transition:opacity .5s}
.tk small{font-size:.42em}
.tile{display:inline-flex;align-items:center;justify-content:center;min-width:1.25em;padding:0 .22em;height:1.3em;border-radius:.22em;background:#6a2fb0;color:#fff;font-weight:800;font-size:.92em}
.symtk{font-style:italic;font-weight:700;color:#26303a}
.cst{color:#1f3a5f}
.x{position:relative;opacity:.35}
.x::after{content:"";position:absolute;left:-4%;right:-4%;top:50%;border-top:.09em solid #b3261e;transform:rotate(-18deg)}
.nw{animation:pop .5s}
@keyframes pop{0%{transform:scale(1.5);color:#c56a00}100%{transform:scale(1)}}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:2.1em;min-height:1.45em;padding:0 .2em;border:.07em dashed #6a7682;border-radius:.2em;background:#fff;cursor:pointer;color:#7a8692;font-style:italic;font-size:.95em}
.slot.filled{border-style:solid;border-color:#2b6cb0;background:#eef5fd;color:#123;font-style:normal}
.slot.unk{border-color:#6a2fb0;background:#f5effc}
.slot.tgt{outline:.1em solid #f29d12}
.paren{color:#5d6975;font-weight:500}
.pw{display:inline-flex;align-items:flex-start}
.pw sup{font-size:.55em;display:inline-flex;align-items:center;gap:.1em;margin-top:-.2em}
.status.bad{color:#b3261e}
.status{font-size:1.15rem;font-weight:800;color:#1d7a35;text-align:center;min-height:1.6em}
.answer{font-size:1.9rem;font-weight:800;text-align:center;color:#0f4720;background:#e6f4ea;border:2px solid #1d7a35;border-radius:12px;padding:6px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.answer small{font-size:.55em;color:#2d5d3a}
.flipnote{font-size:.85rem;color:#5a6672;font-weight:600;margin-top:4px}
/* acid / base tag */
.abtag{display:inline-block;font-size:.95rem;font-weight:900;letter-spacing:.06em;padding:3px 10px;border-radius:8px;color:#fff;vertical-align:middle}
.abtag.acid{background:#d7261e}
.abtag.neut{background:#2e8b3d}
.abtag.base{background:#4b3fa8}
/* road map: [H+] <-> pH <-> pOH <-> [OH-] */
.road{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center;gap:4px}
.rbox{border:2px solid #b9c3ce;border-radius:10px;padding:4px 3px;text-align:center;background:#fff;min-width:0}
.rbox .nm{font-weight:800;font-size:1.08rem;color:#26303a}
.rbox .vv{font-size:.8rem;font-weight:800;color:#5a6672;min-height:1.25em;line-height:1.2}
.rbox .ty{font-size:.66rem;font-weight:700;color:#8a96a2;text-transform:uppercase;letter-spacing:.03em}
.rbox.give{border-color:#f29d12;background:#fff7e6;box-shadow:0 0 0 2px #f29d12}
.rbox.want{border-color:#6a2fb0;background:#f5effc;box-shadow:0 0 0 2px #6a2fb0}
.rbox.want .vv{color:#6a2fb0}
.rbox.mid{border-color:#2b6cb0;background:#eef5fd}
.rarr{display:flex;flex-direction:column;gap:3px;font-size:.72rem;font-weight:800;color:#8a96a2;text-align:center}
.rarr span{white-space:nowrap;padding:1px 5px;border-radius:6px;border:1px solid #d5dbe2;background:#fbfcfe}
.rarr span.on{background:#c8102e;border-color:#c8102e;color:#fff}
.roadnote{font-size:.8rem;color:#5a6672;font-weight:700;text-align:center;margin-top:3px}
.roadwrap{border:2px solid #e1e6ec;border-radius:14px;padding:6px 8px;background:#fbfcfe}
.roadwrap .t{font-size:.72rem;font-weight:800;letter-spacing:.05em;color:#5a6672;text-transform:uppercase;margin-bottom:4px}
/* pH scale */
.scalew{border:2px solid #e1e6ec;border-radius:14px;padding:6px 14px 6px 48px;background:#fbfcfe}
.scalew .t{font-size:.72rem;font-weight:800;letter-spacing:.05em;color:#5a6672;text-transform:uppercase;margin:0 0 0 -38px}
.sbar::before{content:"pH";position:absolute;left:-36px;top:5px;font-size:.8rem;font-weight:900;color:#26303a}
.scale{position:relative;margin:34px 0 4px}
.scale.lo{margin-bottom:40px}
.sbar{position:relative;height:28px;border-radius:8px;background:linear-gradient(90deg,#c81e1e 0%,#e8551f 14%,#f4a12a 28%,#f2d33b 40%,#8cc63f 50%,#2e9e4f 58%,#1f8f9a 70%,#2b6cb0 82%,#4b3fa8 92%,#6a2fb0 100%)}
.sn{position:absolute;top:5px;transform:translateX(-50%);font-size:.78rem;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.spoh{position:relative;height:16px;margin-top:2px}
.spoh span{position:absolute;transform:translateX(-50%);font-size:.66rem;font-weight:700;color:#7a8692}
.spoh b{position:absolute;left:-36px;font-size:.7rem;color:#7a8692}
.sabc{display:flex;justify-content:space-between;font-size:.72rem;font-weight:900;letter-spacing:.05em;margin-top:1px}
.sabc .a{color:#c81e1e}.sabc .n{color:#2e9e4f}.sabc .b{color:#4b3fa8}
.smk{position:absolute;top:-30px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.smk .c{background:#15191e;color:#fff;font-size:.74rem;font-weight:800;border-radius:6px;padding:1px 6px;white-space:nowrap}
.smk .ln{width:3px;height:36px;background:#15191e;margin-top:1px;border-radius:2px}
.smk.dn{top:auto;bottom:-48px;flex-direction:column-reverse}
.smk.dn .ln{height:30px;margin:0 0 1px;background:#4a5560}
.smk.dn .c{background:#4a5560}
.smk.main .c{background:#c8102e;font-size:.85rem}
.smk.main .ln{background:#c8102e;width:4px}
.smk.nw .c{animation:pop .5s}
/* calculator keys */
.keys{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;margin-top:4px}
.key{min-width:34px;height:36px;padding:0 6px;border-radius:7px;background:#3b4652;color:#fff;font-weight:800;font-size:.85rem;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 0 #1b2128}
.key i{font-style:normal;font-size:.62rem;color:#f6c343;margin-bottom:2px}
.key.kn{background:#f4f6f8;color:#15191e;box-shadow:0 2px 0 #9aa6b2;border:1px solid #b9c3ce}
.key.k2{background:#f6c343;color:#2b1a00;box-shadow:0 2px 0 #b98a14}
.key.ke{background:#1f3a5f}
.readout{font-family:ui-monospace,Consolas,monospace;font-weight:800;background:#d9e4d2;border:2px solid #8aa07c;border-radius:6px;padding:2px 8px;display:inline-block;margin-top:5px}
/* learn visuals */
.vis{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.vis .scalew,.vis .roadwrap{width:100%}
.vcard{border:2px solid #d5dbe2;border-radius:12px;padding:10px 16px;background:#fbfcfe;min-width:260px}
.vcard.ok{border-color:#1d7a35;background:#f1faf3}
.vcard.no{border-color:#b3261e;background:#fdf3f2}
.vcard .h{font-weight:800;margin-bottom:6px}
.vcard .eq{font-size:1.6rem}
.mtab{border-collapse:collapse;font-size:1rem;width:100%;max-width:620px}
.mtab td,.mtab th{border:1px solid #d5dbe2;padding:6px 8px;text-align:left;vertical-align:middle}
.mtab th{background:#eceff3;font-size:.85rem}
.mtab .w{color:#8c1d18;background:#fdf3f2}
.mtab .r{color:#145a27;background:#f1faf3}
.mini{display:inline-flex;vertical-align:middle}
.mini .eq{font-size:1rem;gap:.2em}
.mini .tk small{font-size:.6em}
.opt .eq{font-size:1.25rem}
.qtext .eq{font-size:1em;display:inline-flex}
.frame{font-size:.95rem;font-weight:800;color:#c56a00;min-height:1.4em}
.nline{position:relative;width:100%;max-width:520px;height:118px;margin:6px auto}
.nline .ax{position:absolute;left:4%;right:4%;top:58px;border-top:3px solid #1f3a5f}
.nline .tkm{position:absolute;top:50px;width:3px;height:18px;background:#1f3a5f;transform:translateX(-50%)}
.nline .lab{position:absolute;transform:translateX(-50%);font-weight:800;white-space:nowrap;font-size:.95rem}
.nline .up{top:24px}.nline .dn{top:74px;color:#5a6672;font-size:.85rem}
.nline .hit.up{top:0}.nline .hit.dn{top:96px}
.nline .hit{color:#c8102e}
/* modal + toast + keypad */
.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.mbox{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:96vh;overflow:auto;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mbox h3{margin:0 0 8px;color:#1f3a5f}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f3a5f;color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .6s}
.kp{max-width:360px}
.kpd{font-size:1.9rem;font-weight:800;border:2px solid #9aa6b2;border-radius:10px;padding:6px 10px;min-height:56px;text-align:right;background:#fbfcfe;overflow:auto;white-space:nowrap}
.kpd small{font-size:.5em;color:#66727e}
.kpg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.kpg button{min-height:56px;border-radius:10px;border:2px solid #b9c3ce;background:#f7f9fb;font-size:1.35rem;font-weight:800}
.kpg .ok{background:#1d7a35;color:#fff;border-color:#1d7a35}
.kperr{color:#8c1d18;font-weight:700;min-height:1.3em;margin-top:6px}
.card{border:3px solid #1f3a5f;border-radius:14px;padding:12px 16px}
.card table{border-collapse:collapse;width:100%}
.card td{padding:4px 6px;border-bottom:1px solid #e1e6ec}
.card td:last-child{text-align:right;font-weight:800}
.qpick{min-width:120px;min-height:64px;flex-direction:column;justify-content:center;gap:0;font-size:1.3rem}
.qpick small{font-size:.72rem;color:#5a6672;font-weight:700}
.qpick.sel{background:#fff7e6;border-color:#f29d12;box-shadow:0 0 0 2px #f29d12}
#print{display:none}
@media (max-width:900px){
  main{display:block;height:auto}
  .col{overflow:visible}
  #right{margin-top:10px}
  .eq{font-size:1.8rem}
}
@media print{
  header,main,.modal,.toast{display:none!important}
  #print{display:block;padding:20px;font-size:14pt}
  #print .eq{font-size:20pt;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header>
  <h1>pH Calculations<small>pH ⇄ [H⁺] · pH ⇄ pOH · pOH ⇄ [OH⁻]</small></h1>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <section class="col" id="left"></section>
  <section class="col" id="right"></section>
</main>
<div id="print"></div>
<script>
/* ===== EQUATION ENGINE (no DOM) — same engine as Solving for a Variable ===== */
var SYMS = {H:'[H⁺]', OH:'[OH⁻]'};
function sy(s){ return SYMS[s] || s; }
var SUPM = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':''};
function sup(s){ return String(s).split('').map(function(c){ return SUPM[c] !== undefined ? SUPM[c] : c; }).join(''); }
function fmt3(x){
  if (!isFinite(x) || isNaN(x)) return '—';
  if (x === 0) return '0';
  var a = Math.abs(x);
  if (a >= 1e5 || a < 1e-3){ var p = x.toExponential(2).split('e'); return p[0] + '×10' + sup(parseInt(p[1], 10)); }
  if (a >= 1000) return String(Math.round(Number(x.toPrecision(3))));
  var s = Number(x).toPrecision(3);
  if (s.indexOf('e') >= 0) s = String(Number(s));
  if (s.indexOf('.') < 0 && /0$/.test(s)) s += '.';
  return s;

/* ===================================================================
   SHARED EQUATION BOARD (Guided, Practice, Free Form)
   steps: Formula → Plug in → Solve → Acid or base?
   =================================================================== */
var STEPNAME = {formula:'Formula', plug:'Plug in', solve:'Solve', ab:'Acid or base?'};
function mkProb(conv, g, story){
  var C = CONV[conv], givens = {}; givens[C.give] = g;
  return {conv:conv, fid:C.fid, U:C.want, give:C.give, want:C.want, givens:givens, aunit:QOF[C.want] === 'conc' ? 'M' : '', story:story};
}
function newBoard(mode, p){
  var b = {mode:mode, p:p, steps: mode === 'free' ? ['plug','solve'] : ['formula','plug','solve','ab'], phase:'formula', fills:{}, sel:null, eq:null, eq0:null, hist:[], moves:[], locked:false, op:null, fb:null, miss:0, ans:null, flipped:false, shown:false, auto:false, fwrong:null, abWrong:null, abPick:null};
  if (mode === 'free') finishPlug(b);
  return b;
}
function curBoard(){ return S.tab === 'guided' ? S.guided.b : S.tab === 'prac' ? S.prac.b : S.tab === 'free' ? S.free.bs[S.free.ci] || null : null; }
function fo(b){ return FORMULAS[b.p.fid]; }
function uName(b){ return sy(b.p.U); }
function mistake(b, type){
  b.miss++;
  if (b.mode !== 'free') S.mis[type] = (S.mis[type] || 0) + 1;
  if (b.mode === 'prac') S.prac.streak[S.prac.lvl] = 0;
}
function gv(b){ return b.p.givens[b.p.give]; }
/* --- step: which formula --- */
function formulaWhy(p){
  if (p.fid === 'phpoh') return 'You have ' + sy(p.give) + ' and want ' + sy(p.want) + '. No concentration here, so use pH + pOH = 14.';
  var c = p.fid === 'ph' ? '[H⁺]' : '[OH⁻]', pp = p.fid === 'ph' ? 'pH' : 'pOH';
  return 'You have ' + sy(p.give) + ' and want ' + sy(p.want) + '. ' + c.slice(1, -1) + ' goes with ' + pp + ': ' + pp + ' = −log' + c + '.';
}
function pickFormula(b, id){

  else {
    b.fwrong = id;
    var p = b.p, why;
    if (want === 'phpoh') why = 'There’s no concentration in this problem. ' + sy(p.give) + ' and ' + sy(p.want) + ' connect with pH + pOH = 14.';
    else if (id === 'phpoh') why = 'pH + pOH = 14 connects pH and pOH. This problem has a concentration (' + (want === 'ph' ? '[H⁺]' : '[OH⁻]') + '), so you need a −log formula.';
    else if (want === 'poh') why = 'pH = −log[H⁺] is for H⁺. This problem has [OH⁻] and pOH. OH⁻ goes with pOH: pOH = −log[OH⁻].';
    else why = 'pOH = −log[OH⁻] is for OH⁻. This problem has [H⁺] and pH. H⁺ goes with pH: pH = −log[H⁺].';
    b.fb = {ok:false, title: want === 'phpoh' || id === 'phpoh' ? 'Mistake: wrong formula' : 'Mistake: mixed up H⁺ and OH⁻', why:why};
    mistake(b, 'formula');
  }
  save(); render();
}
/* --- step: plug in --- */
function slotReason(b, chip, slot){
  var U = b.p.U, u = sy(U), fq = fo(b).q;
  if (chip === 'U') return 'That slot gets a number. The ' + u + ' tile goes in ' + u + '’s slot: ' + u + ' is what you’re finding.';
  var g = b.p.givens[chip];
  if (slot === U) return u + ' is the unknown, so nothing is given for it. Put the purple ' + u + ' tile there.';
  if (g.unit) return g.unit + ' is a ' + QT[fq[chip]] + ' unit, so ' + T(g) + ' goes in ' + sy(chip) + '.';
  return T(g) + ' is the ' + QT[fq[chip]] + ', so it goes in ' + sy(chip) + '.';
}
function placeChip(b, chip, slot){
  if (b.phase !== 'plug' || (b.auto && !b.autoOK) || b.fills[slot]) return;
  var ok = chip === slot || (chip === 'U' && slot === b.p.U);
  if (!ok){
    b.fb = {ok:false, title:'Mistake: wrong slot', why:slotReason(b, chip, slot)};
    b.shake = slot; b.sel = null; mistake(b, 'slot');
  } else {
    b.fills[slot] = chip; b.sel = null; b.fb = null; b.shake = null;
    if (tmplSyms(b.p.fid).every(function(s){ return b.fills[s]; })) finishPlug(b);
  }
  save(); render();
  setTimeout(function(){ if (b.shake){ b.shake = null; } }, 450);
}
function finishPlug(b){
  b.eq = buildEq(b.p.fid, b.p.givens, b.p.U);
  b.eq0 = clone(b.eq); b.hist = []; b.moves = []; b.phase = 'solve'; b.op = null; b.locked = false;
  normalize(b);
}
function normalize(b){
  if (aloneSide(b.eq, b.p.U) === 'R'){ var t = b.eq.L; b.eq.L = b.eq.R; b.eq.R = t; b.flipped = true; }
}
/* --- step: solve --- */
function doMove(b, op, ids){
  if (b.locked || (b.auto && !b.autoOK) || b.phase !== 'solve') return;
  var before = b.eq, res = applyOp(before, op, ids), j = judge(before, op, ids, res, b.p.U);
  b.hist.push(before); b.flipHist = b.flipHist || []; b.flipHist.push(b.flipped);
  b.moves.push({op:op, label: op === 'p10' ? '' : chipLabel(before, ids), ok:j.ok, text:eqText(res.out)});
  b.anim = res.mid; b.eq = res.out; b.op = null;
  if (!j.ok){ b.locked = true; b.fb = {ok:false, title:j.title, why:j.why}; mistake(b, j.type); }
  else b.fb = null;
  save(); render();
  b.busy = true;
  setTimeout(function(){ b.anim = null; b.busy = false; normalize(b); save(); if (curBoard() === b) render(); }, b.mode === 'guided' ? 1500 : 800);
}
function undo(b){
  if (!b.hist.length || b.phase !== 'solve') return;
  b.eq = b.hist.pop(); b.moves.pop(); b.flipped = b.flipHist && b.flipHist.length ? b.flipHist.pop() : false;

}
function calc(b){
  if (b.phase !== 'solve' || b.locked || !aloneSide(b.eq, b.p.U)) return;

function ansText(b){ return uName(b) + ' = ' + fmtQ(b.ans, QOF[b.p.U]) + (b.p.aunit ? ' ' + b.p.aunit : ''); }
/* --- step: acid or base --- */
function phOf(b){

}
function abBasis(b){

  }
  if (k === 'neut') return 'pOH ' + B.txt + ' is exactly 7, so it’s neutral.';

function pickAB(b, k){

/* expected next action (Guided glow + Show me) */
function expect(b){
  if (b.phase === 'formula') return {kind:'formula', fid:b.p.fid, why:formulaWhy(b.p)};
  if (b.phase === 'plug'){
    var order = tmplSyms(b.p.fid);
    for (var i = 0; i < order.length; i++){
      var s = order[i];
      if (!b.fills[s]){
        var chip = s === b.p.U ? 'U' : s, why;
        if (chip === 'U') why = sy(s) + ' is what you’re finding, so its slot gets the purple ' + sy(s) + ' tile.';
        else { var g = b.p.givens[s]; why = T(g) + ' is the ' + QT[fo(b).q[s]] + ', so it goes in ' + sy(s) + '.'; }
        return {kind:'plug', chip:chip, slot:s, why:why};
      }
    }
    return null;
  }
  if (b.phase === 'solve'){
    if (b.locked) return {kind:'undo', why:'Tap ↶ Undo to take that move back.'};
    if (aloneSide(b.eq, b.p.U)) return {kind:'calc', why:uName(b) + ' is alone. Tap = Calculate and the app does the math.'};
    var mv = nextMove(b.eq, b.p.U);
    if (mv) return {kind:'move', op:mv.op, ids:mv.ids, why:mv.why};
  }
  if (b.phase === 'ab') return {kind:'ab', ab:classify(phOf(b)), why:abWhy(b)};

  ['stomach acid',1.2,2.0],['lemon juice',2.0,2.4],['vinegar',2.4,3.0],['a cola',2.5,3.2],['orange juice',3.3,4.0],['tomato juice',4.1,4.6],

var ASK = {pH:['Find its <b>pH</b>.','What is its <b>pH</b>?','Calculate the <b>pH</b>.'], pOH:['Find its <b>pOH</b>.','What is its <b>pOH</b>?','Calculate the <b>pOH</b>.'],
  H:['Find its <b>[H⁺]</b>.','What is the <b>H⁺ concentration</b>, [H⁺]?','Calculate <b>[H⁺]</b>.'], OH:['Find its <b>[OH⁻]</b>.','What is the <b>OH⁻ concentration</b>, [OH⁻]?','Calculate <b>[OH⁻]</b>.']};
function gen(conv){
  var c = pick(CTX), ph = R(c[1], c[2]), C = CONV[conv], g, has;
  if (C.give === 'H'){ g = cG(Math.pow(10, -ph), true); has = 'has [H⁺] = <b>' + T(g) + '</b>'; }
  else if (C.give === 'OH'){ g = cG(Math.pow(10, ph - 14), true); has = 'has [OH⁻] = <b>' + T(g) + '</b>'; }
  else if (C.give === 'pH'){ g = pG(ph); has = 'has a pH of <b>' + g.txt + '</b>'; }
  else { g = pG(14 - ph); has = 'has a pOH of <b>' + g.txt + '</b>'; }
  var lead = /^(a|an) /.test(c[0]) ? cap(c[0]) : cap(c[0]);
  if (Math.random() < 0.5 && !/^(a|an) /.test(c[0])) lead = 'A sample of ' + c[0];
  var p = mkProb(conv, g, lead + ' ' + has + '. ' + pick(ASK[C.want]));
  p.order = [C.give];

}

  var c = cardData();
  var rows = MISNAMES.map(function(m){ return '<tr><td>' + esc(m[1]) + '</td><td>' + (c.mis[m[0]] || 0) + '</td></tr>'; }).join('');
  modal('<div class="card"><h3>🏆 pH Calculations: Completion Card</h3><div>' + esc(c.when) + '</div>' +
    '<div class="row" style="margin:10px 0">' + [['Learn', c.learn], ['Guided', c.guided], ['Practice', c.prac]].map(function(r){ return '<span class="opt ' + (r[1] === 100 ? 'right' : '') + '">' + r[0] + ': ' + (r[1] === 100 ? '✓ 100%' : r[1] + '%') + '</span>'; }).join('') + '</div>' +
    '<b>Mistakes by type</b><table>' + rows + '</table></div><div id="cardmsg" class="qhint" style="min-height:1.3em;margin-top:6px"></div>' +
    '<div class="mbtns"><button class="big" data-act="cardcopy">📋 Copy</button><button class="big" data-act="cardpng">⬇ Save PNG</button><button class="big" data-act="cardmail">✉ Email using Google</button><button class="big ghost" data-act="close">Close</button></div>');
}
function cardMsg(t){ var el = document.getElementById('cardmsg'); if (el) el.textContent = t; }

/* ===================================================================
   PART 4: FREE FORM — have → want (one step or a chain), type value, solve
   =================================================================== */
function chainOf(have, want){
  var i = ORD.indexOf(have), j = ORD.indexOf(want), st = j > i ? 1 : -1, out = [];
  for (var k = i; k !== j; k += st) out.push(ORD[k] + '>' + ORD[k + st]);
  return out;
}
function freeReset(step){
  var f = S.free;
  if (step <= 1) f.have = null;
  if (step <= 2){ f.want = null; f.vals = {}; }
  if (step <= 3){ f.bs = []; f.ci = 0; }
  f.step = step;
}
function freeBoard(ci, given){
  var conv = chainOf(S.free.have, S.free.want)[ci];
  return newBoard('free', mkProb(conv, given, ''));
}
var KP = null;
function openKeypad(sym){
  var g = S.free.vals[sym];
  KP = {sym:sym, m:'', e:'', neg:false, eneg:false, em:false, err:''};
  if (g && g.raw){ KP.m = g.raw.m; KP.e = g.raw.e; KP.neg = g.raw.neg; KP.eneg = g.raw.eneg; KP.em = g.raw.em; }
  else if (QOF[sym] === 'conc'){ KP.em = false; }
  drawKeypad();
}
function kpStr(){ var s = (KP.neg ? '−' : '') + (KP.m || ''); if (KP.em) s += '×10' + sup((KP.eneg ? '-' : '') + (KP.e || '')) + (KP.e ? '' : '▯'); return s; }
function drawKeypad(){
  var u = QOF[KP.sym] === 'conc' ? 'M' : '';
  var keys = ['7','8','9','⌫','4','5','6','±','1','2','3','×10ⁿ','0','.','',''];
  modal('<div class="kp"><h3>Enter ' + esc(sy(KP.sym)) + (u ? ' (' + u + ')' : '') + '</h3><div class="kpd">' + esc(kpStr() || ' ') + (u ? ' <small>' + u + '</small>' : '') + '</div>' +
    '<div class="kpg">' + keys.map(function(k){ return k ? '<button data-act="kp" data-arg="' + k + '">' + k + '</button>' : ''; }).join('') +
    '<button class="ok" data-act="kp" data-arg="OK" style="grid-column:span 2">OK</button></div><div class="kperr">' + esc(KP.err) + '</div>' +
    (u ? '<div class="qhint">For 3.2×10⁻⁴: type 3.2, tap ×10ⁿ, type 4, tap ± to make it −4.</div>' : '') +
    '<div class="mbtns"><button class="big ghost" data-act="close">Cancel</button></div></div>');
}
function kpKey(k){
  KP.err = '';
  if (/^\d$/.test(k)){ if (KP.em){ if (KP.e.length < 3) KP.e += k; } else if (KP.m.replace('.', '').length < 10) KP.m += k; }
  else if (k === '.'){ if (!KP.em && KP.m.indexOf('.') < 0) KP.m = (KP.m || '0') + '.'; }
  else if (k === '±'){ if (KP.em) KP.eneg = !KP.eneg; else KP.neg = !KP.neg; }
  else if (k === '×10ⁿ'){ if (!KP.em){ if (!KP.m) KP.m = '1'; KP.em = true; } }
  else if (k === '⌫'){ if (KP.em){ if (KP.e) KP.e = KP.e.slice(0, -1); else if (KP.eneg) KP.eneg = false; else KP.em = false; } else if (KP.m) KP.m = KP.m.slice(0, -1); else KP.neg = false; }
  else if (k === 'OK'){
    var mv = parseFloat(KP.m);
    if (!KP.m || isNaN(mv)){ KP.err = 'Type a number first.'; drawKeypad(); return; }
    if (KP.em && !KP.e){ KP.err = 'Type the power of 10 (or tap ⌫).'; drawKeypad(); return; }
    var ex = KP.em ? (KP.eneg ? -1 : 1) * parseInt(KP.e, 10) : 0;
    var val = (KP.neg ? -1 : 1) * mv * Math.pow(10, ex);
    var conc = QOF[KP.sym] === 'conc';
    if (conc && !(val > 0)){ KP.err = 'A concentration must be more than 0.'; drawKeypad(); return; }
    var mtxt = KP.m.replace(/\.$/, '');
    var txt = (KP.neg ? '−' : '') + mtxt + (KP.em ? '×10' + sup((KP.eneg ? '-' : '') + KP.e) : '');
    S.free.vals[KP.sym] = {val:val, txt:txt, unit: conc ? 'M' : '', sci:KP.em, m:(KP.neg ? '-' : '') + mtxt, e:ex, raw:{m:KP.m, e:KP.e, neg:KP.neg, eneg:KP.eneg, em:KP.em}};
    KP = null; closeModal(); save(); render(); return;
  }
  drawKeypad();
}
function freeChainRoad(){
  var f = S.free, ch = chainOf(f.have, f.want), vals = {}, mids = [];
  if (f.vals[f.have]) vals[f.have] = f.vals[f.have].txt;
  f.bs.forEach(function(b){ if (b.ans !== null && b.phase === 'done') vals[b.p.want] = fmtQ(b.ans, QOF[b.p.want]); });
  ch.forEach(function(c, i){ if (i < ch.length - 1) mids.push(CONV[c].want); });
  return {give:f.have, want:f.want, arrows:ch, vals:vals, mids:mids};
}
function renderFree(){
  var f = S.free, h = '';
  var names = ['Have','Want','Value','Solve'];
  h += '<div class="pills"><span class="lbl">Step</span>' + names.map(function(n, k){
    var st = k + 1, en = st < f.step;
    return '<button class="pill' + (st === f.step ? ' cur' : '') + (st < f.step ? ' done' : '') + '" data-act="fstep" data-arg="' + st + '"' + (en ? '' : ' disabled') + '>' + (st < f.step ? '✓ ' : st + ' ') + n + '</button>';
  }).join('') + '</div>';
  var right = '', TYPEN = {H:'concentration (M)', OH:'concentration (M)', pH:'', pOH:''};
  function qbtn(s, act, sel){ return '<button class="opt qpick' + (sel ? ' sel' : '') + '" data-act="' + act + '" data-arg="' + s + '">' + esc(sy(s)) + (TYPEN[s] ? '<small>' + TYPEN[s] + '</small>' : '<small>&nbsp;</small>') + '</button>'; }
  if (f.step === 1){
    h += qbox('STEP 1 OF 4 — HAVE', 'What do you <span class="kw">have</span>?', 'For homework or lab calculations: pick what you know, pick what you want, type your number, then solve it step by step.', '<div class="row">' + ORD.map(function(s){ return qbtn(s, 'fhave'); }).join('') + '</div>', '');
    right = '<div class="panel"><div class="boardt"><h2>Equation board</h2></div>' + roadHTML({}) + '<div class="eqwrap"><div class="qhint" style="font-size:1.1rem">Pick what you have on the left.</div></div></div>';
  } else if (f.step === 2){
    h += '<div class="doneline">✓ Have: ' + esc(sy(f.have)) + '</div>';
    h += qbox('STEP 2 OF 4 — WANT', 'What do you <span class="kw">want</span> to find?', 'If it isn’t right next to ' + esc(sy(f.have)) + ' on the road map, you’ll solve it in more than one step.', '<div class="row">' + ORD.filter(function(s){ return s !== f.have; }).map(function(s){ return qbtn(s, 'fwant'); }).join('') + '</div>', '');
    right = '<div class="panel"><div class="boardt"><h2>Equation board</h2></div>' + roadHTML({give:f.have}) + '<div class="eqwrap"><div class="qhint" style="font-size:1.1rem">Pick what you want on the left.</div></div></div>';
  } else {
    var ch = chainOf(f.have, f.want);
    h += '<div class="doneline">✓ Have ' + esc(sy(f.have)) + ' → want ' + esc(sy(f.want)) + (ch.length > 1 ? ' · ' + ch.length + ' steps: ' + ch.map(function(c){ return CONV[c].name; }).join(', ') : ' · ' + esc(CONV[ch[0]].name)) + '</div>';
    if (f.step === 3){
      var g = f.vals[f.have], u = QOF[f.have] === 'conc' ? 'M' : '';
      var row = '<div class="row"><button class="opt" data-act="fslot" data-arg="' + f.have + '" style="font-size:1.25rem">' + esc(sy(f.have)) + ' = ' + (g ? '<b>' + esc(g.txt) + '</b>' : '<span style="color:#8a96a2">tap to type</span>') + (u ? ' <small style="color:#66727e">' + u + '</small>' : '') + '</button></div>';
      h += qbox('STEP 3 OF 4 — VALUE', 'Type the <span class="kw">' + esc(sy(f.have)) + '</span> you have.', 'Tap the box, then type the number on the keypad.', row, '');
      h += '<div class="nextrow"><button class="big" data-act="fgo"' + (g ? '' : ' disabled') + '>Next ▶</button></div>';
      right = '<div class="panel"><div class="boardt"><h2>Equation board</h2>' + fcardHTML(formulaHTML(CONV[ch[0]].fid, fUnits(CONV[ch[0]].fid))) + '</div>' + roadHTML(freeChainRoad()) + '<div class="eqwrap"><div class="qhint" style="font-size:1.1rem">Type your ' + esc(sy(f.have)) + ' on the left.</div></div></div>';
    } else {
      var b = f.bs[f.ci], last = f.ci === ch.length - 1;
      h += boardLeft(b, 'STEP 4 OF 4' + (ch.length > 1 ? ' (PART ' + (f.ci + 1) + ' OF ' + ch.length + ': ' + CONV[ch[f.ci]].name + ')' : ''));
      if (b.phase === 'done'){
        if (!last) h += '<div class="nextrow"><button class="big green" data-act="fnext">Next: ' + esc(CONV[ch[f.ci + 1]].name) + ' ▶</button></div>';
        else h += '<div class="nextrow"><button class="big" data-act="fcopy">📋 Copy</button><button class="big" data-act="fmail">✉ Email using Google</button><button class="big" data-act="fprint">🖨 Print</button></div>' +
          '<div class="nextrow"><button class="big ghost" data-act="fagain">↻ Same question, new number</button><button class="big ghost" data-act="fnew">New question</button></div><div id="fmsg" class="qhint"></div>';
      }
      right = boardRight(b, ch.length > 1 ? freeChainRoad() : null);
    }
  }
  LEFT.innerHTML = h;
  RIGHT.innerHTML = right;
}
function freeSummary(){
  var f = S.free, lines = [], ch = chainOf(f.have, f.want), g = f.vals[f.have];
  lines.push('pH Calculations — Free Form');
  lines.push('Have: ' + sy(f.have) + ' = ' + T(g) + '     Want: ' + sy(f.want));
  f.bs.forEach(function(b, i){
    if (ch.length > 1) lines.push('Part ' + (i + 1) + ': ' + CONV[ch[i]].name);
    lines.push('  Formula: ' + formulaText(b.p.fid));
    lines.push('  Plug in:  ' + eqText(b.eq0));
    b.moves.forEach(function(m){ lines.push('  ' + (m.op === 'p10' ? '10⁻ˣ' : m.op + ' ' + m.label) + ' on both sides:  ' + m.text); });
    lines.push('  ' + ansText(b));
  });
  var lb = f.bs[f.bs.length - 1];
  if (lb && lb.ans !== null){ var k = classify(phOf(lb)); lines.push('Answer: ' + ansText(lb) + '   (' + ABW[k].toLowerCase() + ')'); }
  lines.push(''); lines.push(PAGE);
  return lines.join('\n');
}
function freePrint(){
  var P = document.getElementById('print'), txt = freeSummary().split('\n');
  P.innerHTML = '<h2>pH Calculations: Free Form</h2><p>' + txt.slice(1).map(esc).join('<br>').replace(/ {2}/g, '&nbsp;&nbsp;') + '</p>';
  window.print();
}

/* ===================================================================
   RENDER + ACTIONS
   =================================================================== */
function render(){
  if (!unlocked(S.tab)) S.tab = 'learn';
  renderTabs();
  if (S.tab === 'learn') renderLearn();
  else if (S.tab === 'guided') renderGuided();
  else if (S.tab === 'prac') renderPractice();
  else renderFree();
  fitEqs();
}
function goTab(t){
  if (!unlocked(t)){ modal('<h3>🔒 ' + esc(LOCKMSG[t]) + '</h3><p>The parts unlock in order: Learn → Guided → Practice. Free Form is always open.</p><div class="mbtns"><button class="big" data-act="close">OK</button></div>'); return; }
  S.tab = t; LV.pick = null; LV.wrong = null; save(); render();
  if (t === 'learn') startStop();
  LEFT.scrollTop = 0;
}
function startStop(){ LV.pick = null; LV.wrong = null; render(); playFrames(); }

var ACT = {
  tab:function(a){ goTab(a); },
  close:function(){ closeModal(); KP = null; },
  /* learn */
  lstop:function(a){ S.learn.cur = +a; save(); startStop(); },
  lopt:function(a){
    var st = STOPS[S.learn.cur], o = st.opts[+a];
    if (o.ok){ LV.pick = +a; LV.wrong = null; S.learn.done[S.learn.cur] = 1; save(); }
    else { LV.wrong = +a; }
    render();
  },
  lnext:function(){ if (S.learn.cur < NSTOPS - 1){ S.learn.cur++; save(); startStop(); } else goTab('guided'); },
  /* board */
  fml:function(a){ var b = curBoard(); if (b && !b.auto) pickFormula(b, a); },
  ab:function(a){ var b = curBoard(); if (b && !b.auto) pickAB(b, a); },
  chip:function(a){ var b = curBoard(); if (!b || b.phase !== 'plug' || b.auto) return; b.sel = b.sel === a ? null : a; b.fb = null; render(); },
  slot:function(a){ var b = curBoard(); if (!b || b.phase !== 'plug' || b.auto) return; if (!b.sel){ if (!b.fills[a]){ b.fb = {ok:false, title:'', why:'Tap a value first, then tap its slot.'}; render(); } return; } placeChip(b, b.sel, a); },
  op:function(a){ var b = curBoard(); if (!b || b.locked || b.busy || b.auto) return; if (a === 'p10'){ doMove(b, 'p10', []); return; } b.op = b.op === a ? null : a; b.fb = null; render(); },
  schip:function(a){
    var b = curBoard(); if (!b || b.locked || b.busy || b.auto) return;
    var c = solveChips(b.eq, b.p.U)[+a]; if (!c) return;
    if (!b.op){ b.fb = {ok:false, title:'', why:'Tap an operation first (+ − × ÷), then a number. (10⁻ˣ works by itself.)'}; render(); return; }
    doMove(b, b.op, c.ids);
  },
  undo:function(){ var b = curBoard(); if (b && !b.busy && !b.auto) undo(b); },
  calc:function(){ var b = curBoard(); if (b && !b.busy && !b.auto) calc(b); },
  showme:function(){ var b = curBoard(); if (b) showMe(b); },
  /* guided */
  gprob:function(a){ S.guided.cur = +a; S.guided.b = null; save(); render(); },
  gnext:function(){ if (S.guided.cur < NGUIDED - 1){ S.guided.cur++; S.guided.b = null; save(); render(); } else goTab('prac'); },
  /* practice */
  plvl:function(a){ S.prac.lvl = +a; S.prac.b = null; save(); render(); },
  pnext:function(a){
    var pr = S.prac;
    if (a === 'lvl' && pr.lvl < NLVL - 1) pr.lvl++;
    newPracProblem(); save(); render();
    if (cnt(pr.done) === NLVL && !pr.cardShown){ pr.cardShown = 1; save(); openCard(); }
  },
  card:function(){ S.prac.cardShown = 1; save(); openCard(); },
  cardcopy:function(){
    var c = cardData(), text = cardText(c), cv = cardCanvas(c);
    try {
      if (navigator.clipboard && window.ClipboardItem){
        cv.toBlob(function(blob){
          navigator.clipboard.write([new ClipboardItem({'image/png':blob, 'text/plain':new Blob([text], {type:'text/plain'})})]).then(function(){ cardMsg('✓ Copied (picture + text). Paste it into Google Classroom or an email.'); },
            function(){ copyText(text, function(ok){ cardMsg(ok ? '✓ Copied the text (this browser blocked the picture; use ⬇ Save PNG for it).' : 'Copy was blocked. Use ⬇ Save PNG instead.'); }); });
        });
        return;
      }
    } catch(e){}
    copyText(text, function(ok){ cardMsg(ok ? '✓ Copied the text. Use ⬇ Save PNG for the picture.' : 'Copy was blocked. Use ⬇ Save PNG instead.'); });
  },
  cardpng:function(){
    var cv = cardCanvas(cardData());
    cv.toBlob(function(blob){ var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ph-calculations-card.png'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000); cardMsg('✓ Saved the PNG to your Downloads.'); });
  },
  cardmail:function(){ gmail('pH Calculations: Completion Card', cardText(cardData())); },
  /* free */
  fstep:function(a){ var st = +a, f = S.free; if (st >= f.step) return; freeReset(st); save(); render(); },
  fhave:function(a){ var f = S.free; f.have = a; f.want = null; f.vals = {}; f.bs = []; f.ci = 0; f.step = 2; save(); render(); },
  fwant:function(a){ var f = S.free; f.want = a; f.bs = []; f.ci = 0; f.step = 3; save(); render(); },
  fslot:function(a){ if (S.free.step !== 3) return; openKeypad(a); },
  kp:function(a){ if (KP) kpKey(a); },
  fgo:function(){
    var f = S.free, g = f.vals[f.have]; if (!g) return;
    f.bs = [freeBoard(0, {val:g.val, txt:g.txt, unit:g.unit, sci:g.sci, m:g.m, e:g.e})]; f.ci = 0; f.step = 4; save(); render();
  },
  fnext:function(){
    var f = S.free, b = f.bs[f.ci]; if (!b || b.phase !== 'done') return;
    f.ci++; f.bs.push(freeBoard(f.ci, carry(b.ans, QOF[b.p.want]))); save(); render();
  },
  fagain:function(){ var f = S.free; f.vals = {}; f.bs = []; f.ci = 0; f.step = 3; save(); render(); },
  fnew:function(){ freeReset(1); save(); render(); },
  fcopy:function(){ copyText(freeSummary(), function(ok){ var el = document.getElementById('fmsg'); if (el) el.textContent = ok ? '✓ Copied. Paste it into your lab or homework.' : 'Copy was blocked by this browser.'; }); },
  fmail:function(){ gmail('pH Calculations: ' + sy(S.free.have) + ' → ' + sy(S.free.want), freeSummary()); },
  fprint:function(){ freePrint(); }
};

var suppressClick = false;
document.addEventListener('click', function(e){
  if (suppressClick) return;
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var fn = ACT[el.dataset.act]; if (fn) fn(el.dataset.arg, el);
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.slot[data-act]')){ e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') ACT.close();
});
/* drag a chip onto a slot */
var drag = null;
document.addEventListener('pointerdown', function(e){
  var c = e.target.closest('.chip[data-act="chip"]'); if (!c || c.disabled) return;
  drag = {el:c, sym:c.dataset.arg, x:e.clientX, y:e.clientY, ghost:null};
});
document.addEventListener('pointermove', function(e){
  if (!drag) return;
  if (!drag.ghost){
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 10) return;
    var gh = drag.el.cloneNode(true); gh.classList.add('sel'); gh.classList.remove('glow');
    gh.style.cssText = 'position:fixed;pointer-events:none;z-index:80;opacity:.92;margin:0';
    document.body.appendChild(gh); drag.ghost = gh;
  }
  drag.ghost.style.left = (e.clientX - 30) + 'px'; drag.ghost.style.top = (e.clientY - 25) + 'px';
});
function endDrag(e, cancel){
  if (!drag) return; var d = drag; drag = null;
  if (!d.ghost) return;
  d.ghost.remove(); suppressClick = true; setTimeout(function(){ suppressClick = false; }, 60);
  if (cancel) return;
  var el = document.elementFromPoint(e.clientX, e.clientY), s = el && el.closest('[data-act="slot"]'), b = curBoard();
  if (s && b && b.phase === 'plug'){ b.sel = d.sym; placeChip(b, d.sym, s.dataset.arg); }
}
document.addEventListener('pointerup', function(e){ endDrag(e, false); });
document.addEventListener('pointercancel', function(e){ endDrag(e, true); });
window.addEventListener('resize', function(){ fitEqs(); });

/* ---------- start ---------- */
if (Q.get('mode') === 'free') S.tab = 'free';
render();
if (S.tab === 'learn') playFrames();
var anyProgress = cnt(S.learn.done) || cnt(S.guided.done) || cnt(S.prac.done) || S.prac.count.some(function(x){ return x; }) || S.free.have;
if (hadSave && anyProgress) setTimeout(function(){ toast('Welcome back — you’re right where you left off'); }, 300);
window.__S = function(){ return S; };
window.__T = {ACT:ACT, curBoard:curBoard, expect:expect, render:render, solveChips:solveChips};
})();
