<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History of Atomic Theory</title>
<style>
:root{--navy:#0f1b3d;--navy2:#1b2b5c;--bg:#eef2f8;--panel:#fff;--ink:#1a2238;--muted:#5b6478;--line:#d8deea;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
[hidden]{display:none!important}

/* ---------- header ---------- */
header.top{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap}
.brand h1{margin:0;font-size:1.35rem;letter-spacing:.2px}
.brand p{margin:0;font-size:.85rem;color:#b8c3e6}
.modeSwitch{display:flex;background:#0a1330;border-radius:999px;padding:4px;margin-left:auto;border:1px solid #2d3d70}
.modeSwitch button{border:0;background:transparent;color:#cbd5f5;padding:7px 20px;border-radius:999px;font-weight:700;display:flex;align-items:center;gap:6px}
.modeSwitch button.on{background:#fff;color:var(--navy)}
.modeSwitch button:disabled{opacity:.5;cursor:not-allowed}
.modeSwitch button.on:disabled{opacity:1}
.progress{display:flex;align-items:center;gap:8px;font-size:.85rem;color:#cbd5f5}
.dots{display:flex;gap:5px}
.dots span{width:12px;height:12px;border-radius:50%;border:2px solid #7d8bbd;display:block;transition:background .3s}
.dots span.v{background:#facc15;border-color:#facc15}

/* ---------- timeline ---------- */
.timebar{background:var(--navy2);padding:10px 12px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
@media (min-width:900px) and (min-height:700px){.timebar{position:sticky;top:0;z-index:20}}
.navbtn{background:#facc15;color:#0f1b3d;border:0;border-radius:12px;padding:12px 20px;font-weight:900;font-size:1.08rem;white-space:nowrap;box-shadow:0 4px 0 #b45309}
.navbtn:hover:not(:disabled){background:#fde047}
.navbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #b45309}
.navbtn:disabled{opacity:.3;cursor:default;box-shadow:none}
.nudge{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 4px 0 #b45309,0 0 0 0 rgba(250,204,21,.75)}50%{box-shadow:0 4px 0 #b45309,0 0 0 10px rgba(250,204,21,0)}}
.stopNav{display:flex;gap:10px;margin-top:16px}
.bnav{border:0;border-radius:12px;padding:13px 16px;font-weight:900;font-size:1.05rem;color:#0f1b3d}
.bnav.next{flex:1;background:#facc15;box-shadow:0 4px 0 #b45309}
.bnav.next:hover{background:#fde047}
.bnav.prev{background:#e2e8f0;box-shadow:0 4px 0 #94a3b8}
.bnav:disabled{opacity:.35;cursor:default;box-shadow:none}
@media (prefers-reduced-motion:reduce){.nudge{animation:none}}
.track{position:relative;flex:1;display:flex;align-items:flex-start;padding-top:2px;user-select:none;-webkit-user-select:none;touch-action:none;min-width:0;cursor:pointer}
.rail,.fill{position:absolute;top:15px;height:4px;border-radius:2px}
.rail{background:#3c4f8a}
.fill{background:#facc15;transition:width .35s ease}
.tick{position:relative;z-index:1;background:none;border:0;color:#dbe3ff;display:flex;flex-direction:column;align-items:center;padding:0 2px;min-width:0;flex:1 1 0}
.tick .dot{width:26px;height:26px;border-radius:50%;background:#1b2b5c;border:3px solid var(--c);display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#fff;transition:transform .2s,background .2s}
.tick.seen .dot{background:color-mix(in srgb,var(--c) 45%,#1b2b5c)}
.tick.cur .dot{background:var(--c);transform:scale(1.25);box-shadow:0 0 0 4px rgba(250,204,21,.5)}
.tick .yr{font-size:.72rem;margin-top:5px;color:#aebbe8;white-space:nowrap}
.tick .nm{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tick.cur .nm{color:#facc15}
.gap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;color:#facc15;font-size:.68rem;font-weight:800;flex:0 0 auto;padding:0 2px;line-height:1.15;text-align:center;pointer-events:none}
.gap svg{display:block}
@media (max-width:760px){.tick .nm{display:none}.gap span.long{display:none}}
@media (max-width:560px){.tick .yr{display:none}.navbtn .lbl{display:none}.navbtn{padding:10px 14px}}

/* ---------- layout ---------- */
main{max-width:1400px;margin:0 auto;padding:16px}
.learn{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border-radius:16px;box-shadow:0 2px 10px rgba(15,27,61,.08);padding:18px 20px}
.modelCard{position:sticky;top:96px;text-align:center}
@media (max-width:900px){.learn{grid-template-columns:1fr}.modelCard{order:-1;position:static}}
.era{display:inline-block;background:var(--c);color:#fff;font-size:.8rem;font-weight:700;padding:3px 12px;border-radius:999px;letter-spacing:.3px}
.disc h2{margin:6px 0 0;font-size:1.7rem;line-height:1.2}
.disc h3{margin:2px 0 12px;font-size:1.1rem;color:var(--muted);font-weight:600}
.expBox{background:#0b1020;border-radius:14px;padding:10px;margin-bottom:14px}
.expTitle{color:#e2e8f0;font-weight:700;font-size:.92rem;margin:0 2px 8px}
#expCanvas{width:100%;aspect-ratio:520/280;display:block;border-radius:10px;background:#fff}
.expCtl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.expCtl button{border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:.88rem;background:#e2e8f0;color:#0f172a}
.expCtl button.alt{background:#facc15}
.seg{display:inline-flex;align-items:center;background:#1e293b;border-radius:999px;padding:3px;gap:2px}
.seg .segLbl{color:#cbd5e1;font-size:.82rem;font-weight:700;padding:0 8px 0 10px}
.expCtl .seg button{background:transparent;color:#e2e8f0;border-radius:999px;padding:5px 16px;font-size:.95rem;font-weight:900}
.expCtl .seg button.on{background:#facc15;color:#0f172a}
.disc p{margin:0 0 10px}
.disc ul,.disc ol{margin:0 0 12px;padding-left:22px}
.disc li{margin-bottom:4px}
.callout{border-radius:12px;padding:10px 14px;margin:10px 0;border-left:6px solid}
.callout b.h{display:block;font-size:.8rem;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
.callout.key{background:#ecfdf5;border-color:#16a34a}.callout.key b.h{color:#15803d}
.callout.lim{background:#fffbeb;border-color:#f59e0b}.callout.lim b.h{color:#b45309}
.callout.why{background:#f5f3ff;border-color:#7c3aed}.callout.why b.h{color:#6d28d9}
.callout.fun{background:#eff6ff;border-color:#3b82f6}.callout.fun b.h{color:#1d4ed8}
table.cmp{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0 4px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.cmp th{background:#f1f5f9}
table.cmp td:first-child{font-weight:700;background:#fafbfd}

.modelStage{display:flex;align-items:center;justify-content:center;gap:8px;min-height:250px}
.modelStage .cur{flex:1 1 auto;max-width:330px}
.modelStage .ghostWrap{flex:0 1 150px;opacity:.6;filter:grayscale(.25)}
.modelStage .ghostWrap small{display:block;font-size:.75rem;color:var(--muted);font-weight:700;line-height:1.2}
.modelStage .arrow{font-size:1.6rem;color:#94a3b8}
.model-svg{width:100%;height:auto;display:block}
.modelName{font-size:1.45rem;font-weight:800;margin:8px 0 0;line-height:1.2}
.modelMeta{color:var(--muted);font-size:.88rem;font-weight:600;margin-bottom:8px}
.modelDesc{text-align:left;margin:8px 0}
.changed{text-align:left;background:#f1f5f9;border-radius:10px;padding:8px 12px;font-size:.93rem}
.mBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.mBtns button,.btn{border:1px solid #c7d0e2;background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;color:var(--navy)}
.mBtns button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.mBtns button:disabled{opacity:.4;cursor:default}

/* ---------- quiz ---------- */
.quizWrap{max-width:780px;margin:0 auto}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);padding:11px 22px;font-size:1.02rem}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent}
.qTop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.qTop .bar{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.qTop .bar i{display:block;height:100%;background:#facc15;transition:width .3s}
.qText{font-size:1.25rem;font-weight:700;margin:8px 0 12px}
.qPic{max-width:230px;margin:0 auto 10px;background:#f8fafc;border-radius:14px;padding:6px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid #d5dcea;background:#fff;border-radius:12px;padding:11px 14px;font-weight:600;color:var(--ink)}
.choice:hover{border-color:#94a3b8}
.choice .let{flex:0 0 30px;height:30px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-weight:800}
.choice.sel{border-color:#2563eb;background:#eff6ff}
.choice.sel .let{background:#2563eb;color:#fff}
.qFoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
.hintKeys{font-size:.8rem;color:var(--muted)}

/* ---------- score ---------- */
.scoreHead{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.bigScore{font-size:3.4rem;font-weight:900;color:var(--navy);line-height:1}
.bigScore small{font-size:1.3rem;color:var(--muted);font-weight:700;margin-left:8px}
.meta{color:var(--muted);font-weight:600;font-size:.95rem}
.share{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.share .btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.share .btn.primary{color:#fff}
.small{font-size:.85rem;color:var(--muted)}
.small a,.linkish{color:#1d4ed8;background:none;border:0;padding:0;text-decoration:underline;font-weight:600;font-size:inherit}
.shortcuts{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0 14px}
kbd{background:#fff;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.82rem;font-family:inherit}
.res{display:flex;gap:12px;border-top:1px solid var(--line);padding:12px 0;align-items:flex-start}
.res .mark{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.1rem}
.res .mark.ok{background:var(--good)}.res .mark.no{background:var(--bad)}
.res .body{flex:1;min-width:0}
.res .q{font-weight:700}
.res .ya.ok{color:var(--good)}.res .ya.no{color:var(--bad)}
.res .ca{color:var(--good)}
.res .ex{color:var(--muted);font-size:.92rem}
.res .th{flex:0 0 72px}
.endBtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(10,15,35,.7);display:grid;place-items:center;z-index:100;padding:16px}
.modal .box{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.modal img{width:100%;border:1px solid var(--line);border-radius:10px;display:block;margin:10px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.3s;z-index:120;max-width:92vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:6px 12px 22px}

/* ---------- model animations ---------- */
.spin{transform-origin:120px 120px;animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drift1{animation:d1 5s ease-in-out infinite alternate}
.drift2{animation:d2 6s ease-in-out infinite alternate}
.drift3{animation:d3 4.5s ease-in-out infinite alternate}
.drift4{animation:d4 5.5s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(7px,-5px)}}
@keyframes d2{to{transform:translate(-6px,6px)}}
@keyframes d3{to{transform:translate(5px,7px)}}
@keyframes d4{to{transform:translate(-7px,-4px)}}
.jig{animation:jig 1.5s ease-in-out infinite alternate}
@keyframes jig{to{transform:translate(2px,1.6px)}}
.bob{animation:bob 2.8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-7px)}}
.shim{animation:shim 2.2s ease-in-out infinite alternate}
@keyframes shim{from{opacity:1}to{opacity:.3}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{transform-origin:120px 120px;animation:pulse 3.5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){.model-svg *{animation:none!important}.fill,.tick .dot{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>History of Atomic Theory</h1>
    <p>Travel through time with the timeline. View all 8 stops to unlock the quiz.</p>
  </div>
  <div class="modeSwitch" role="group" aria-label="Mode">
    <button id="mLearn" class="on" aria-pressed="true">📘 Learn</button>
    <button id="mQuiz" aria-pressed="false" disabled title="View all 8 stops to unlock the quiz"><span id="lockIcon">🔒</span> Quiz</button>
  </div>
  <div class="progress" aria-live="polite"><span id="progTxt">Viewed 1/8</span><div class="dots" id="dots"></div></div>
</header>

<nav class="timebar" id="timebar" aria-label="Timeline">
  <button class="navbtn" id="prev">◄ <span class="lbl">Prev</span></button>
  <div class="track" id="track"><div class="rail" id="rail"></div><div class="fill" id="fill"></div></div>
  <button class="navbtn" id="next"><span class="lbl">Next</span> ►</button>
</nav>

<main>
  <!-- LEARN -->
  <section id="learnView" class="learn">
    <article class="card disc" id="disc">
      <div id="discHead"></div>
      <div class="expBox">
        <div class="expTitle" id="expTitle"></div>
        <canvas id="expCanvas" aria-label="Animated experiment"></canvas>
        <div class="expCtl" id="expCtl"></div>
      </div>
      <div id="discBody"></div>
    </article>
    <aside class="card modelCard" aria-live="polite">
      <div class="modelStage" id="modelStage"></div>
      <div class="modelName" id="modelName"></div>
      <div class="modelMeta" id="modelMeta"></div>
      <div class="modelDesc" id="modelDesc"></div>
      <div class="changed" id="modelChanged"></div>
      <div class="mBtns">
        <button id="btnCompare" aria-pressed="false">⇆ Compare to previous model</button>
      </div>
      <div class="stopNav"><button class="bnav prev" id="bPrev">◄ Back</button><button class="bnav next" id="bNext">Next ►</button></div>
    </aside>
  </section>

  <!-- QUIZ -->
  <section id="quizView" class="quizWrap" hidden><div class="card" id="quizCard"></div></section>

  <!-- SCORE -->
  <section id="scoreView" class="quizWrap" hidden><div class="card" id="scoreCard"></div></section>
</main>

<footer>No names or personal information are collected. Nothing is sent anywhere unless you choose to share your score.</footer>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="box">
    <h3 id="modalTitle" style="margin:0">Your score card</h3>
    <p class="small" id="modalMsg" style="margin:6px 0 0"></p>
    <img id="modalImg" alt="Quiz score card image">
    <div class="endBtns">
      <a class="btn" id="modalNewTab" href="#" target="_blank" rel="noopener">↗ Open this app in a new tab</a>
      <button class="btn primary" id="modalClose">Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0;while(!u)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return mem[k]??d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const mem={};

/* =====================================================================
   SVG MODELS  (self-contained: presentation attributes only, so they
   can also be drawn onto the score-card canvas)
   ===================================================================== */
let UID=0;
const FONT='font-family="Arial, Helvetica, sans-serif"';
function svg(label,inner,defs){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" class="model-svg" role="img" aria-label="${esc(label)}"><defs>${defs||''}</defs>${inner}</svg>`}
function radGrad(id,c1,c2,fx,fy){return `<radialGradient id="${id}" cx="50%" cy="50%" r="60%" fx="${fx||35}%" fy="${fy||30}%"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></radialGradient>`}
function plusSign(x,y,s,color){const t=s*0.24;return `<rect x="${x-s/2}" y="${y-t/2}" width="${s}" height="${t}" fill="${color}"/><rect x="${x-t/2}" y="${y-s/2}" width="${t}" height="${s}" fill="${color}"/>`}
function electron(x,y,r,spin){r=r||7;return `<circle cx="${x}" cy="${y}" r="${r}" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>`+(spin?`<circle cx="${x-r*0.3}" cy="${y-r*0.3}" r="${r*0.32}" fill="#bfdbfe"/>`:`<rect x="${x-r*0.5}" y="${y-r*0.13}" width="${r}" height="${r*0.26}" fill="#fff"/>`)}
function proton(x,y,r,gid){return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${gid})" stroke="#7f1d1d" stroke-width="1"/>`+plusSign(x,y,r*1.05,'#fff')}
function neutron(x,y,r,gid){return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${gid})" stroke="#374151" stroke-width="1"/><circle cx="${x}" cy="${y}" r="${r*0.36}" fill="none" stroke="#fff" stroke-width="${r*0.2}"/>`}
function lab(x,y,t,a,c,s){return `<text x="${x}" y="${y}" font-size="${s||11}" font-weight="700" text-anchor="${a||'middle'}" fill="${c||'#1e293b'}" ${FONT} paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">${esc(t)}</text>`}
function lead(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#334155" stroke-width="1.2"/>`}

const cloudCache={};
function cloudDots(key,n,sigma,seed,color,op,rad,clip){rad=rad||1.7;clip=clip||108;
  if(!cloudCache[key]){
    const r=rng(seed);const groups=['','',''];let k=0;
    while(k<n){const x=gauss(r)*sigma,y=gauss(r)*sigma;if(x*x+y*y>clip*clip)continue;groups[k%3]+=`<circle cx="${(120+x).toFixed(1)}" cy="${(120+y).toFixed(1)}" r="${rad}"/>`;k++}
    cloudCache[key]=groups.map((g,i)=>`<g class="shim" style="animation-delay:${-i*0.7}s" fill="${color}" fill-opacity="${op}">${g}</g>`).join('');
  }
  return cloudCache[key];
}

const MODELS={
  democritus(L){
    const u='u'+(++UID);
    const f=`fill="url(#${u}a)" stroke="#6b3d0c" stroke-width="1.2"`;
    const s=[
      `<g class="drift1"><circle cx="62" cy="70" r="20" ${f}/></g>`,
      `<g class="drift2"><rect x="138" y="44" width="34" height="34" rx="5" ${f} transform="rotate(15 155 61)"/></g>`,
      `<g class="drift3"><polygon points="190,100 214,142 166,142" ${f}/></g>`,
      `<g class="drift4"><circle cx="100" cy="150" r="13" ${f}/></g>`,
      `<g class="drift2"><polygon points="150,160 160,170 175,166 170,182 182,194 164,194 156,208 148,194 132,192 142,180 136,166" ${f}/></g>`,
      `<g class="drift1"><circle cx="208" cy="200" r="11" ${f}/></g>`,
      `<g class="drift3"><rect x="34" y="176" width="26" height="18" rx="4" ${f} transform="rotate(-20 47 185)"/></g>`,
      `<g class="drift4"><circle cx="118" cy="100" r="9" ${f}/></g>`,
      `<g class="drift1"><ellipse cx="60" cy="128" rx="16" ry="10" ${f}/></g>`
    ].join('');

{alwaysLabels:true,key:'democritus',era:'ancient',short:'400 BC',year:'c. 400 BC',who:'Democritus',title:'The idea of the “atomos”',exp:'cut',
 body:`<p>Democritus (c. 460–370 BC) was a Greek philosopher. He did <b>no experiments</b>. He used reasoning: if you keep cutting a piece of matter in half, eventually you must reach a piece so small it <b>cannot</b> be cut. He called it <b><i>atomos</i></b>, Greek for “uncuttable.”</p>
 <ul><li>All matter is made of tiny, solid, indivisible particles (atoms).</li><li>Atoms move through <b>empty space</b>, called the “void.”</li><li>Atoms come in different shapes and sizes, which explains why materials differ.</li></ul>`,
 find:'All matter is made of atoms with empty space between them.',
 lim:['Weakness','No experimental evidence. It was only an idea, and the famous philosopher Aristotle (next stop) argued against it.'],
 model:{name:'Indivisible Particles',date:'Democritus · c. 400 BC',desc:'Atoms are tiny, solid, uncuttable particles of many shapes and sizes, moving through empty space. They have no parts inside.',changed:'The first atomic idea. Before this, there was no concept of atoms.'}},
{alwaysLabels:true,key:'aristotle',era:'ancient',short:'350 BC',year:'c. 350 BC',who:'Aristotle',title:'Four elements — and no atoms',exp:'compare',
 body:`<p>Aristotle (384–322 BC) <b>rejected atoms and empty space</b>. He taught that matter is <b>continuous</b> (it can be divided forever) and is made of four elements: <b>earth, water, air, and fire</b>. Each element was a pair of qualities (hot or cold, wet or dry), and changing a quality could turn one element into another.</p>`,
 why:'Aristotle was one of the most respected thinkers in history. His four-element view was taught for roughly <b>2,000 years</b>, and the atom idea was largely set aside. Alchemists spent centuries trying to turn one substance into another based on it. The lesson: <b>science must rest on evidence, not on the fame or authority of the person making the claim.</b>',
 compare:[['Smallest piece of matter?','Atoms, which can’t be cut','None: matter can be divided forever'],['Empty space?','Yes, the void','No empty space'],['Everything is made of…','Atoms of different shapes','Earth, water, air, fire'],['Evidence used','Reasoning only','Reasoning and everyday observation'],['Who was believed?','Mostly ignored','Accepted for ~2,000 years']],
 find:'The four-element model replaced atoms in most people’s thinking until the 1800s.',
 lim:['Weakness','Like Democritus, Aristotle did no controlled experiments. His ideas were believed because of his reputation.'],
 model:{name:'Four Elements (Not an Atomic Model)',date:'Aristotle · c. 350 BC',desc:'Continuous matter with no atoms and no empty space. Fire = hot + dry, Air = hot + wet, Water = cold + wet, Earth = cold + dry.',changed:'A step away from atoms: particles and empty space were replaced by four continuous elements.'}},
{alwaysLabels:true,key:'dalton',era:'c1800',short:'1803',year:'1803–1808',who:'John Dalton',title:'Atomic theory backed by evidence',exp:'ratio',
 body:`<p>English chemist John Dalton brought atoms back, this time supported by measured laws: Lavoisier’s <b>law of conservation of mass</b> (1789), Proust’s <b>law of definite proportions</b> (1799), and Dalton’s own <b>law of multiple proportions</b>. Gases showed whole-number ratios too: in 1800, Nicholson and Carlisle used electricity to split water into hydrogen and oxygen in a <b>2 : 1</b> volume ratio, and in 1808 Gay-Lussac showed that gases combine in simple whole-number volume ratios. Dalton’s atomic theory stated:</p>
 <ol><li>All elements are made of tiny, indivisible particles called atoms.</li><li>Atoms of the same element are identical in mass and properties.</li><li>Atoms of different elements are different.</li><li>Atoms combine in simple, whole-number ratios to form compounds.</li><li>In a chemical reaction, atoms are rearranged. They are never created or destroyed.</li></ol>`,
 find:'Atoms explain why elements combine in fixed, whole-number ratios by mass.',
 lim:['Later shown wrong','Atoms <b>are</b> divisible: they contain electrons, protons, and neutrons. And <b>isotopes</b> mean atoms of the same element can have different masses.'],
 model:{name:'Solid Sphere (“Billiard Ball”) Model',date:'John Dalton · 1803',desc:'Each atom is a tiny, solid, indivisible sphere, like a billiard ball. Atoms of one element are identical; different elements have different atoms.',changed:'Back to atoms, and now supported by experimental laws instead of reasoning alone.'}},
{key:'thomson',era:'c1900',short:'1897',year:'1897 (model 1904)',who:'J.J. Thomson',title:'Cathode ray tube → the electron',exp:'cathode',
 body:`<p>Thomson studied <b>cathode rays</b>, beams that travel from the negative electrode (cathode) through a tube with almost all the air removed.</p>
 <ul><li>The beam bent <b>toward a positive plate</b> (and in a magnetic field), so it is made of <b>negatively charged particles</b>.</li><li>He measured their charge-to-mass ratio. The particles were more than 1,000 times lighter than a hydrogen atom.</li><li>The particles were the same no matter what metal the cathode was made of, so they must be in <b>all</b> atoms.</li></ul>`,
 find:'Atoms contain tiny negative particles: electrons. The atom is divisible!',
 lim:['What it couldn’t explain','Atoms are neutral, so Thomson assumed the positive charge was spread through the whole atom. He had no evidence for where the positive charge actually was.'],
 model:{name:'Plum Pudding Model',date:'J.J. Thomson · 1904',desc:'A sphere of spread-out positive charge with negative electrons scattered throughout, like plums in a pudding (or chocolate chips in a cookie). Overall the atom is neutral.',changed:'The first model with parts inside the atom: electrons.'}},
{key:'rutherford',era:'c1900',short:'1911',year:'1909–1911',who:'Ernest Rutherford',title:'Gold foil experiment → the nucleus',exp:'foil',
 body:`<p>Rutherford’s team (Hans Geiger and Ernest Marsden) fired positive <b>alpha (α) particles</b> at gold foil only a few hundred atoms thick. A zinc-sulfide screen flashed wherever a particle hit. If the plum pudding model were right, nearly every α particle should pass straight through.</p>
 <ul><li><b>Most passed straight through</b> → the atom is mostly <b>empty space</b>.</li><li><b>A few were deflected</b> at large angles → something small, dense, and positive repelled them.</li><li><b>About 1 in 8,000 bounced almost straight back</b> → nearly all the mass is packed into a tiny center: the <b>nucleus</b>.</li></ul>
 <p>Rutherford compared it to firing an artillery shell at tissue paper and having it bounce back at you.</p>`,
 find:'The atom has a small, dense, positive nucleus with electrons outside it, and is mostly empty space. Rutherford later identified the <b>proton</b> (1917–1919).',
 fun:'If an atom were the size of a football stadium, its nucleus would be about the size of a marble on the 50-yard line.',
 lim:['What it couldn’t explain','Why don’t the electrons spiral into the nucleus? And why do atoms give off only certain colors of light?'],
 model:{name:'Nuclear Model',date:'Ernest Rutherford · 1911',desc:'A tiny, dense, positively charged nucleus holds almost all of the atom’s mass. Electrons move around it through mostly empty space.',changed:'Positive charge moved from “spread out” to a tiny central nucleus.'}},
{key:'bohr',era:'c1900',short:'1913',year:'1913',who:'Niels Bohr',title:'Hydrogen’s line spectrum → energy levels',exp:'spectrum',
 body:`<p>When hydrogen gas is energized, it does <b>not</b> glow with a full rainbow. A prism splits its light into just a few sharp colored lines: its <b>line emission spectrum</b>.</p>
 <ul><li>Bohr proposed that electrons can only exist in certain fixed <b>energy levels</b> (n = 1, 2, 3…).</li><li>An electron <b>absorbs</b> energy to jump up to a higher level.</li><li>When it <b>falls</b> to a lower level, it releases a photon with exactly the energy difference, which is one specific color.</li></ul>`,
 find:'Electron energy is quantized: electrons occupy fixed energy levels, and each jump down gives off a specific color.',
 lim:['What it couldn’t explain','It worked for hydrogen (one electron) but failed for atoms with more electrons. Electrons don’t really travel in neat circular paths.'],
 model:{name:'Bohr (Planetary) Model',date:'Niels Bohr · 1913',desc:'Electrons orbit the nucleus in fixed circular paths called energy levels, like planets around the sun. Electrons absorb energy to jump up and give off light when they fall down.',changed:'Electrons are now placed in specific energy levels instead of anywhere around the nucleus.'}},
{key:'schrodinger',era:'quantum',short:'1926',year:'1926',who:'Erwin Schrödinger',title:'Electrons as waves → orbitals',exp:'cloud',
 body:`<p>Louis de Broglie (1924) proposed that electrons behave like <b>waves</b>. Erwin Schrödinger wrote a <b>wave equation</b> that describes an electron in an atom. Werner Heisenberg (1927) showed you cannot know both an electron’s exact position and its exact motion at the same time: the <b>uncertainty principle</b>.</p>
 <ul><li>The solutions to Schrödinger’s equation are <b>orbitals</b>: 3-D regions where an electron is most likely to be found.</li><li>Orbitals have different shapes: s orbitals are spheres, p orbitals are dumbbells.</li></ul>`,
 find:'We can’t know an electron’s exact path, only the probability of finding it in a region (an orbital).',
 lim:['Still a puzzle','Atoms were heavier than their protons alone could explain. Helium has 2 protons but about 4 times the mass of hydrogen. (Solved next!)'],
 model:{name:'Quantum Mechanical (Electron Cloud) Model',date:'Erwin Schrödinger · 1926',desc:'Electrons are not in fixed orbits. They exist in orbitals, which are fuzzy regions of probability. The denser the cloud, the more likely the electron is there.',changed:'Fixed orbits were replaced by probability clouds (orbitals).'}},
{key:'chadwick',era:'quantum',short:'1932',year:'1932',who:'James Chadwick',title:'Beryllium radiation → the neutron',exp:'neutron',
 body:`<p>James Chadwick aimed alpha particles at <b>beryllium</b>, which gave off a mysterious radiation with <b>no charge</b>: it wasn’t bent by electric or magnetic fields.</p>
 <ul><li>When this radiation hit <b>paraffin wax</b>, it knocked <b>protons</b> out of the wax.</li><li>By measuring those protons, Chadwick showed the radiation was a <b>neutral particle with about the same mass as a proton</b>: the <b>neutron</b>.</li></ul>`,
 find:'The nucleus contains protons (+) and neutrons (no charge). Neutrons explain the “extra” mass of atoms and why isotopes exist.',
 lim:['Today','This is the modern model taught in chemistry. (Physicists later found that protons and neutrons are made of even smaller particles called quarks.)'],
 model:{name:'Modern Model (Electron Cloud + Nucleus)',date:'James Chadwick · 1932',desc:'An electron cloud surrounds a tiny nucleus made of protons (+) and neutrons (0). The number of protons determines the element; neutrons add mass.',changed:'Neutrons were added to the nucleus.'}}
];

function wl2rgb(w){let r=0,g=0,b=0;if(w<440){r=-(w-440)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=-(w-510)/20}else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=-(w-645)/65}else{r=1}let f=1;if(w<420)f=.3+.7*(w-380)/40;else if(w>700)f=.3+.7*(780-w)/80;return `rgb(${Math.round(255*r*f)},${Math.round(255*g*f)},${Math.round(255*b*f)})`}

 },

  g.fillStyle='#fff';g.font='800 34px system-ui, Arial, sans-serif';g.textBaseline='alphabetic';g.fillText('History of Atomic Theory · Quiz Score Card',P,62);
  g.fillStyle='#facc15';g.font='900 78px system-ui, Arial, sans-serif';g.fillText(`${R.score} / ${R.total}`,P,158);
  const sw=g.measureText(`${R.score} / ${R.total}`).width;
  g.fillStyle='#e2e8f0';g.font='800 34px system-ui, Arial, sans-serif';g.fillText(R.pct+'%',P+sw+22,156);
  g.font='600 24px system-ui, Arial, sans-serif';g.fillStyle='#cbd5f5';g.textAlign='right';
  g.fillText('🕒 '+R.when,CW-P,116);g.fillText('Attempt #'+R.attempt,CW-P,152);g.textAlign='left';
  let y=headH;
  rows.forEach((r,i)=>{
    if(i>0){g.fillStyle='#e2e8f0';g.fillRect(P,y,CW-P*2,2)}
    const ok=r.it.ok,mx=P+24,my=y+40;
    g.fillStyle=ok?'#15803d':'#b91c1c';g.beginPath();g.arc(mx,my,22,0,Math.PI*2);g.fill();
    g.strokeStyle='#fff';g.lineWidth=5;g.lineCap='round';g.beginPath();
    if(ok){g.moveTo(mx-10,my+1);g.lineTo(mx-3,my+9);g.lineTo(mx+11,my-8)}else{g.moveTo(mx-8,my-8);g.lineTo(mx+8,my+8);g.moveTo(mx+8,my-8);g.lineTo(mx-8,my+8)}
    g.stroke();
    let ty=y+44;const tx=P+60;
    g.font=qF;g.fillStyle='#0f172a';r.ql.forEach(l=>{g.fillText(l,tx,ty);ty+=32});
    g.font=aF;g.fillStyle=ok?'#15803d':'#b91c1c';r.al.forEach(l=>{g.fillText(l,tx,ty);ty+=28});
    g.fillStyle='#15803d';r.cl.forEach(l=>{g.fillText(l,tx,ty);ty+=28});
    g.font=eF;g.fillStyle='#64748b';r.el.forEach(l=>{g.fillText(l,tx,ty);ty+=25});
    if(imgs[i]){const ix=CW-P-TH,iy=y+16;g.fillStyle='#f8fafc';g.fillRect(ix-4,iy-4,TH+8,TH+8);g.drawImage(imgs[i],ix,iy,TH,TH)}
    y+=r.h;
  });
  g.fillStyle='#e2e8f0';g.fillRect(0,CH-footH,CW,2);
  g.fillStyle='#64748b';g.font='500 18px system-ui, Arial, sans-serif';
  g.fillText('No names or personal information collected · Generated on this device',P,CH-footH+42);
  return c;
}

renderStop();renderProgress();requestAnimationFrame(loop);
