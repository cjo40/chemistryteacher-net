<title>Molarity &amp; Dilution Calculations Trainer (M = n/V, M₁V₁ = M₂V₂)</title>
<style>
*{box-sizing:border-box}

.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}

.tab small{font-weight:600;font-size:.74rem;opacity:.95;margin-top:2px}
.tab.on{background:#fff;color:#1f3a5f;border-color:#fff}
.tab.full{background:#1d7a35;border-color:#9fe0b0;color:#fff}

.tp-mol .tsw .s-mol{background:#f29d12;color:#2b1a00;box-shadow:0 2px 0 rgba(0,0,0,.3)}

.sm{color:#7a8692;font-weight:700;font-size:.85rem}
.garr{display:flex;flex-direction:column;align-items:center}
.garr small{font-size:.72rem;font-weight:900;color:#2b6cb0;letter-spacing:.02em}
.vcard .eq{font-size:1.4rem}
/* dimensional analysis: units shown full size so students see them cancel */
.du .u{font-size:.68em;font-weight:800;color:#2b6cb0;margin-left:.14em;position:relative;display:inline-block}
.du .u.cu{color:#b3261e}

.dabox{display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;min-height:2.2em;border:.07em dashed #f29d12;border-radius:.2em;background:#fff7e6;color:#c56a00;font-weight:900}
.daq{margin:6px 0}
.qtext .daq .eq{font-size:1.5rem;justify-content:flex-start;display:flex}
.kbtn .dab{font-size:1.15rem;display:inline-flex}

.mtab .eq.da{font-size:1rem}
/* layout */

.col{overflow:auto;min-height:0;padding-bottom:6px}
.panel{background:#fff;border:1px solid #d5dbe2;border-radius:14px;padding:12px}

.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}

/* question box */
.qbox{border:5px solid #f29d12;border-radius:14px;background:#fffdf7;overflow:hidden;margin-bottom:8px}

/* equation board */
.boardt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.boardt h2{margin:0;font-size:1rem;color:#1f3a5f}
.fcard{display:inline-flex;align-items:center;gap:8px;font-size:1.05rem}
.fcard.moved{background:#fff7e6;border-color:#f29d12}

.side{display:inline-flex;align-items:center;gap:.18em}

.symtk{font-style:italic;font-weight:700;color:#26303a}
.cst{color:#1f3a5f}
.x{position:relative;opacity:.35}

.slot.unk{border-color:#6a2fb0;background:#f5effc}

.paren{color:#5d6975;font-weight:500}
.status.bad{color:#b3261e}
.status{font-size:1.15rem;font-weight:800;color:#1d7a35;text-align:center;min-height:1.6em}
.answer{font-size:1.9rem;font-weight:800;text-align:center;color:#0f4720;background:#e6f4ea;border:2px solid #1d7a35;border-radius:12px;padding:6px}
.answer small{font-size:.55em;color:#2d5d3a}
.sense{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:#f1faf3;border:2px dashed #1d7a35;border-radius:12px;padding:6px 10px;color:#0f4720;font-weight:700}

.sense .arw i{font-style:normal;color:#b3141a}
.flipnote{font-size:.85rem;color:#5a6672;font-weight:600;margin-top:4px}
/* before -> after gas pictures */
.strip{display:flex;align-items:stretch;justify-content:center;gap:6px;flex-wrap:wrap}
.gs{flex:1 1 0;min-width:140px;max-width:250px;border:2px solid #d5dbe2;border-radius:12px;background:#fbfcfe;padding:4px 6px 6px;text-align:center;display:flex;flex-direction:column;align-items:center}
.gs.after{border-color:#c9b3e6;background:#fbf8ff}
.gst{font-size:.72rem;font-weight:900;letter-spacing:.06em;color:#5a6672;text-transform:uppercase}
.gl{font-size:.95rem;font-weight:800;line-height:1.3;color:#15191e}
.gl .sm{color:#7a8692;font-weight:700;font-size:.85rem}

.mtab{border-collapse:collapse;font-size:1rem;width:100%;max-width:600px}
.mtab td,.mtab th{border:1px solid #d5dbe2;padding:6px 8px;text-align:left;vertical-align:middle}
.mtab th{background:#eceff3;font-size:.85rem}

.kp{max-width:360px}

<body class="tp-mol">
<header>
  <h1>Molarity &amp; Dilution<small>Calculations Trainer</small></h1>
  <button class="tsw" id="topicSw" role="switch" aria-checked="false" aria-label="Topic: Molarity or Dilution" title="Switch topic: Molarity or Dilution">
    <span class="seg s-mol" data-topic="mol"><b>MOLARITY</b><small>M = n / V</small></span>
    <span class="seg s-dil" data-topic="dil"><b>DILUTION</b><small>M₁V₁ = M₂V₂</small></span>
  </button>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <section class="col" id="left"></section>
  <section class="col" id="right"></section>
</main>
<div id="print"></div>
<script>
/* ===== EQUATION ENGINE (no DOM) ===== */
var SYMS = {mm:'molar mass',M1:'M₁',M2:'M₂',V1:'V₁',V2:'V₂',T1:'T₁',T2:'T₂',P1:'P₁',P2:'P₂',dT:'ΔT',dH:'ΔH',H:'[H⁺]',OH:'[OH⁻]',PY:'% yield',act:'actual',theo:'theoretical'};
function sy(s){ return SYMS[s] || s; }
var SUPM = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':''};
function sup(s){ return String(s).split('').map(function(c){ return SUPM[c] !== undefined ? SUPM[c] : c; }).join(''); }
function fmt3(x){
  if (!isFinite(x) || isNaN(x)) return '—';

function gen(lvl, idx){
  var p, r = Math.random();
  if (S.topic === 'mol'){
    if (lvl === 'M') p = genMol('M', {ml:idx % 2 === 1 || r < .25});
    else if (lvl === 'n') p = genMol('n', {ml:r < .6});
    else if (lvl === 'V') p = genMol('V', {post:idx % 3 === 2 ? 'tomL' : null});
    else if (lvl === 'g'){ var k = idx % 3; p = k === 0 ? genMol('M', {g:1, ml:r < .5}) : k === 1 ? genMol('n', {post:'toG', ml:r < .6}) : genMol('V', {g:1, post:r < .3 ? 'tomL' : null}); }
    else {
      var U = pick(['M','n','V'].filter(function(x){ return x !== C.prac.last; })); C.prac.last = U;
      p = genMol(U, {ml:Math.random() < .5, g:U !== 'n' && Math.random() < .4, post:U === 'n' && Math.random() < .4 ? 'toG' : U === 'V' && Math.random() < .3 ? 'tomL' : null});
    }
  } else {
    if (lvl === 'M') p = genDil(idx % 3 === 2 ? 'M1' : 'M2', {});
    else if (lvl === 'V') p = genDil(idx % 3 === 2 ? 'V1' : 'V2', {water:r < .35});
    else if (lvl === 'stock') p = genDil('V1', {water:r < .5});
    else {
      var U2 = pick(['M1','M2','V1','V2'].filter(function(x){ return x !== C.prac.last; })); C.prac.last = U2;
      p = genDil(U2, {mix:Math.random() < .5, water:Math.random() < .35});
    }
  }
  p.order = shuffle(Object.keys(p.givens));
  return p;
}

/* ---------- progress ---------- */
function ids(list){ return list.map(function(x){ return x.id; }); }
function cntDone(list, done){ return list.reduce(function(n, x){ return n + (done[x.id] ? 1 : 0); }, 0); }
function pct(which, c, td){
  c = c || C; td = td || TD;
  if (which === 'learn') return Math.round(cntDone(td.stops, c.learn.done) / td.stops.length * 100);
  if (which === 'guided') return Math.round(cntDone(td.gp, c.guided.done) / td.gp.length * 100);
  if (which === 'prac') return Math.round(cntDone(td.levels, c.prac.done) / td.levels.length * 100);

function unlocked(t){

/* “does it make sense?” */

  if (!has(b.ans)) return '';
  var sp = boardSpec(b);
  if (b.p.fid === 'molarity'){
    var m = molVals(sp);
    return '<div class="sense"><span>Check: moles ÷ liters = ' + esc(fmt3(m.n)) + ' mol ÷ ' + esc(fmt3(m.V)) + ' L = ' + esc(fmt3(m.n / m.V)) + ' M ✓</span></div>';
  }
  var v = dilVals(sp), dM = v.M2 < v.M1 * .9995 ? -1 : v.M2 > v.M1 * 1.0005 ? 1 : 0, dV = v.V2 > v.V1 * 1.0005 ? 1 : v.V2 < v.V1 * .9995 ? -1 : 0;
  function ar(n){ return n > 0 ? '↑' : n < 0 ? '↓' : '='; }
  var ok = dM < 0 && dV > 0;
  return '<div class="sense"><span class="arw">M <i>' + ar(dM) + '</i></span><span class="arw">V <i>' + ar(dV) + '</i></span><span>' + (ok ? 'Diluted: M went down, V went up. ✓ Makes sense!' : 'Diluting should make M go down and V go up. Check your numbers.') + '</span></div>';
}
function senseText(b){
  if (b.p.fid !== 'dilution') return '';
  var v = dilVals(boardSpec(b));
  return 'M went ' + (v.M2 < v.M1 ? 'down' : 'up') + ' and V went ' + (v.V2 > v.V1 ? 'up' : 'down') + ' (diluting: M ↓, V ↑).';
}

/* expected next action (Guided glow + Show me) */
function expect(b){
  if (isPP(b.phase)){ var d = ppDef(b); return {kind:'pp', key:d.right, why:d.why}; }
  if (b.phase === 'plug'){
    var order = tmplSyms(b.p.fid), fq = FORMULAS[b.p.fid].q;
    for (var i = 0; i < order.length; i++){
      var s = order[i];
      if (!b.fills[s]){
        var chip = s === b.p.U ? 'U' : s, why;
        if (chip === 'U') why = sy(s) + ' is what you’re finding, so its slot gets the purple ' + sy(s) + ' tile.';
        else { var gg = b.p.givens[s]; why = b.p.fid === 'dilution' ? T(gg) + ' is the ' + gg.role + (gg.clue ? ' (“' + gg.clue + '”)' : '') + ', so it goes in ' + sy(s) + '.' : T(gg) + ' is the ' + QT[fq[s]] + ', so it goes in ' + sy(s) + '.'; }
        return {kind:'plug', chip:chip, slot:s, why:why};
      }
    }
    return null;
  }
  if (b.phase === 'solve'){
    if (b.locked) return {kind:'undo', why:'Tap ↶ Undo to take that move back.'};
    if (aloneSide(b.eq, b.p.U)) return {kind:'calc', why:uName(b) + ' is alone. Tap = Calculate and the app does the math.'};
    var mv = nextMove(b.eq, b.p.U);
    if (mv) return {kind:'move', op:mv.op, ids:mv.ids, why:mv.why};
  }
  return null;
}

/* ----- board left (question box) ----- */
function doneLines(b){
  var parts = [];
  if (b.kdone.length) parts.push('✓ ' + b.kdone.join(' · '));
  if (b.eq0 && b.mode !== 'free') parts.push('<span>✓ Plugged in: <span class="mini">' + eqHTML(b.eq0) + '</span></span>');
  var okm = (b.moves || []).filter(function(m){ return m.ok; });
  if (okm.length) parts.push('✓ ' + okm.map(function(m, k){ return 'Move ' + (k + 1) + ': ' + m.op + '&nbsp;' + esc(m.label); }).join(' · '));
  if (has(b.ans) && (POST[b.phase] || (b.phase === 'done' && b.p.post))) parts.push('✓ Calculated: ' + esc(uName(b) + ' = ' + fmt3(b.ans) + ' ' + b.p.aunit));
  return parts.length ? '<div class="doneline dl2">' + parts.map(function(p){ return '<span>' + p + '</span>'; }).join('') + '</div>' : '';
}
function boardLeft(b){
  var u = uName(b), ex = b.mode === 'guided' ? expect(b) : null, h = '';
  var ci = b.phase === 'done' ? b.steps.length : b.steps.indexOf(b.phase);
  if (b.mode !== 'free') h += '<div class="pills"><span class="lbl">Step</span>' + b.steps.map(function(s, k){
    var dn = k < ci;
    return '<button class="pill' + (k === ci ? ' cur' : '') + (dn ? ' done' : '') + '" disabled>' + (dn ? '✓ ' : (k + 1) + ' ') + STEPNAME[s] + '</button>';
  }).join('') + '</div>';
  h += doneLines(b);
  var head = stepNo(b);
  if (isPP(b.phase)){
    var d = ppDef(b), btns = d.btns.slice();
    if (d.swap && b.ppSwap){ var t0 = btns[0]; btns[0] = btns[1]; btns[1] = t0; }
    var kb = '<div class="row">' + btns.map(function(k){
      return '<button class="kbtn' + (b.pwrong === k[0] ? ' wrong' : '') + (ex && ex.key === k[0] ? ' glow' : '') + '" data-act="pp" data-arg="' + k[0] + '"' + (b.auto ? ' disabled' : '') + '>' + k[1] + '</button>';
    }).join('') + '</div>';
    return h + qbox(head, d.q, ex ? '👉 ' + esc(ex.why) : esc(d.hint), kb, fbHTML(b.fb), showMeBtn(b));
  }
  if (b.phase === 'plug'){
    var order = b.mode === 'guided' ? tmplSyms(b.p.fid).filter(function(x){ return x !== b.p.U; }) : (b.p.order || Object.keys(b.p.givens));
    var list = order.concat(['U']);
    var row = '<div class="row">' + list.map(function(c){
      var used = c === 'U' ? b.fills[b.p.U] : b.fills[c];
      var cls = 'chip' + (used ? ' used' : '') + (b.sel === c ? ' sel' : '') + (ex && ex.chip === c && b.sel !== c ? ' glow' : '');
      var inner = c === 'U' ? '<span class="tile" style="font-size:1rem;height:1.6em">' + esc(u) + '</span><small>unknown</small>' : chipHTML(b.p.givens[c], b.mode === 'guided' && roleOf(c) ? '<em class="role">' + roleOf(c) + '</em>' : '');
      return '<button class="' + cls + '" data-act="chip" data-arg="' + c + '"' + (used || b.auto ? ' disabled' : '') + '>' + inner + '</button>';
    }).join('') + '</div>';
    var hint = ex ? '👉 ' + esc(b.sel === ex.chip ? 'Now tap the ' + sy(ex.slot) + ' slot in the formula. ' + ex.why : 'Tap the glowing chip. ' + ex.why) :
      (b.sel ? 'Now tap its slot in the formula (or drag it there).' : b.p.fid === 'dilution' ? 'Tap a value, then tap its slot. 1 = stock (before water), 2 = diluted (after).' : 'Tap a value, then tap its slot. Match the units: M, mol, L.');
    return h + qbox(head, 'Put each value in its <span class="kw">slot</span>.', hint, row, fbHTML(b.fb), showMeBtn(b));
  }
  if (b.phase === 'done'){
    var gp = b.mode === 'guided' ? gpById(C.guided.cur) : null;
    var msg = b.mode === 'prac' ? b.pmsg : gp ? gp.done : '';
    return h + qbox(head, '<span class="kw">Done!</span>', 'The app did the arithmetic for you, rounded to 3 significant figures.', '', fbHTML({ok:true, title:ansText(b), why:msg || ''}));
  }
  var alone = aloneSide(b.eq, b.p.U) && !b.anim, qt, hint2, ans = '';
  var dis = b.locked || b.auto || b.busy;
  if (alone && !b.locked){
    qt = '<span class="kw">' + esc(u) + ' is alone!</span> ✓';
    hint2 = ex ? '👉 ' + esc(ex.why) : 'Tap = Calculate. The app does the math.';
    ans = '<div class="row"><button class="big green' + (ex && ex.kind === 'calc' ? ' glow' : '') + '" data-act="calc"' + (b.auto ? ' disabled' : '') + '>= Calculate</button>' +
      '<button class="undo" data-act="undo"' + (b.hist.length && !b.auto ? '' : ' disabled') + '>↶ Undo</button></div>';
  } else {
    qt = 'Get <span class="kw">' + esc(u) + '</span> alone. Do the same thing to <span class="kw">BOTH sides</span>.';
    hint2 = ex ? '👉 ' + esc(ex.why) : (b.locked ? 'Tap ↶ Undo to take that move back.' : b.op ? 'Now tap a number to ' + opName(b.op) + ' both sides by.' : 'Tap an operation, then a number.');
    var row1 = '<div class="row">' + ['+','−','×','÷'].map(function(o){
      var gl = ex && ex.kind === 'move' && ex.op === o && b.op !== o;
      return '<button class="opbtn' + (b.op === o ? ' sel' : '') + (gl ? ' glow' : '') + '" data-act="op" data-arg="' + o + '"' + (dis ? ' disabled' : '') + ' aria-label="' + opName(o) + '">' + o + '</button>';
    }).join('') + '<button class="undo' + (b.locked ? ' glow' : '') + '" data-act="undo"' + (b.hist.length && !b.auto ? '' : ' disabled') + '>↶ Undo</button></div>';
    var chips2 = solveChips(b.eq, b.p.U);
    var row2 = '<div class="row">' + chips2.map(function(c, k){
      var fac = c.group ? null : findFactor(b.eq, c.ids[0]);
      var inner = c.group ? '<b>' + esc(chipLabel(b.eq, c.ids)) + '</b><small>both</small>' : fac.v ? '<span class="tile" style="font-size:1rem;height:1.6em">' + esc(sy(fac.sym)) + '</span>' : chipHTML(fac);
      var gl = ex && ex.kind === 'move' && b.op === ex.op && ex.ids.join() === c.ids.join();
      return '<button class="chip' + (c.group ? ' grp' : '') + (gl ? ' glow' : '') + '" data-act="schip" data-arg="' + k + '"' + (dis ? ' disabled' : '') + '>' + inner + '</button>';
    }).join('') + '</div>';
    ans = row1 + row2;
  }
  return h + qbox(head, qt, hint2, ans, fbHTML(b.fb), showMeBtn(b));
}
function opName(o){ return {'+':'add','−':'subtract','×':'multiply','÷':'divide'}[o]; }
function showMeBtn(b){
  if (b.mode !== 'prac' || b.miss < 2 || b.phase === 'done' || b.auto) return '';
  return '<div class="row" style="margin-top:8px"><button class="big ghost" data-act="showme">👀 Show me</button><span class="qhint">Two misses: watch the solution step by step.</span></div>';
}

/* ----- board right ----- */
function boardSpec(b, show){ return {fid:b.p.fid, U:b.p.U, givens:b.p.givens, ans:has(b.ans) ? b.ans : null, aunit:b.p.aunit, sol:b.p.sol, mm:b.p.mm, fin:b.fin, show:show}; }
function boardRight(b){
  var mol = b.p.fid === 'molarity', sp = boardSpec(b), pre = !!PRE[b.phase];
  var h = '<div class="panel"><div class="boardt"><h2>' + (mol ? 'The solution' : 'Stock → Diluted') + '</h2></div>' + (mol ? solCard(sp, pre ? 150 : 118) : stripD(sp, pre ? 130 : 104)) + senseHTML(b);
  if (b.phase === 'toL') return h + '<div class="vis">' + literScale(b.p.givens.V.val, 250) + '<div class="gray" style="font-weight:800">1 L = 1000 mL · a unit on top cancels the same unit on the bottom</div></div></div>';
  if (b.phase === 'toMol') return h + '<div class="vis">' + molBags(b.p.givens.n.val, b.p.mm, solF(b.p), true) + '<div class="gray" style="font-weight:800">A unit on top cancels the same unit on the bottom.</div></div></div>';
  if (b.phase === 'match') return h + '<div class="vis">' + literScale(b.p.givens[b.p.mSym].val * 1000, 250) + '<div class="gray" style="font-weight:800">1 L = 1000 mL · a unit on top cancels the same unit on the bottom</div></div></div>';
  var fEq = null, okMoves = (b.moves || []).filter(function(m){ return m.ok; }).length;
  if (b.phase !== 'plug' && okMoves) fEq = b.locked ? b.hist[b.hist.length - 1] : (b.anim || b.eq);
  var fInner = fEq ? eqHTML(fEq, {sym:true, units:boardUnits(b)}) : formulaHTML(b.p.fid, boardUnits(b));
  var u = uName(b);
  h += '<div class="boardt"><h2>Equation board</h2>' + fcardHTML(fInner, !!fEq, b.mode === 'free' && b.phase === 'done' ? 'Rearranged<br>formula<br>(for your notes)' : '') + '</div>';
  var main;
  if (b.phase === 'plug'){
    var ex = b.mode === 'guided' ? expect(b) : null;
    main = templateHTML(b.p.fid, {U:b.p.U, fills:b.fills, vals:b.p.givens, sel:b.sel, glow:ex && b.sel === ex.chip ? ex.slot : null, shake:b.shake});
  } else main = eqHTML(b.anim || b.eq);
  h += '<div class="eqwrap">' + main + (b.flipped && !b.anim && b.phase !== 'plug' ? '<div class="flipnote">(same thing, just flipped so ' + esc(u) + ' is on the left)</div>' : '') + '</div>';
  var alone = b.phase !== 'plug' && !b.anim && aloneSide(b.eq, b.p.U) && !b.locked;
  if (!has(b.ans)) h += '<div class="status' + (b.locked && !alone ? ' bad' : '') + '">' + (alone ? esc(u) + ' is alone! ✓' : b.phase === 'plug' ? (mol ? 'Plug in: M, n (mol), V (L)' : 'Plug in: 1 = stock, 2 = diluted') : b.locked ? '✗ Tap ↶ Undo' : '') + '</div>';
  else {
    var fin = b.fin && b.phase === 'done' ? b.fin : null;
    h += '<div class="answer">' + esc(u) + ' = ' + esc(fmt3(b.ans)) + (b.p.aunit ? ' <small>' + esc(b.p.aunit) + '</small>' : '') +
      (fin && !fin.water ? ' = ' + esc(fmt3(fin.val)) + ' <small>' + esc(fin.unit) + '</small>' : '') +
      (fin && fin.water ? '<div style="font-size:.7em">water added = ' + esc(fmt3(fin.val)) + ' <small>' + esc(fin.unit) + '</small></div>' : '') + '</div>';
    if (b.phase === 'done' && b.fin && b.fin.da) h += '<div class="vcard ok" style="align-self:center"><div class="h">' + b.fin.daT + '</div>' + daEq.apply(null, b.fin.da) + '</div>';
    if (b.phase === 'toG' || (b.phase === 'done' && b.fin && b.fin.unit === 'g' && b.mode !== 'free')) h += '<div class="vis" style="flex:0 0 auto">' + molBags(b.ans * b.p.mm, b.p.mm, solF(b.p), b.phase !== 'done') + '</div>';
    if (b.phase === 'tomL') h += '<div class="vis" style="flex:0 0 auto">' + literScale(b.ans * 1000, 210) + '</div>';
    if (b.phase === 'water'){ var vp = volPair(b); h += '<div class="vis" style="flex:0 0 auto">' + waterVis(vp[0], vp[1], vp[2], b.p.sol, 150) + '</div>'; }
  }
  return h + '</div>';
}

/* ===================================================================
   PART 2: GUIDED
   =================================================================== */
function gpById(id){ var L = TD.gp; for (var i = 0; i < L.length; i++) if (L[i].id === id) return L[i]; return L[0]; }
function guidedBoard(){
  var g = C.guided;
  if (!g.b || g.b.gi !== g.cur || g.b.dead){ g.b = newBoard('guided', clone(gpById(g.cur))); g.b.gi = g.cur; }
  return g.b;
}
function renderGuided(){
  var g = C.guided, list = TD.gp, i = ids(list).indexOf(g.cur), gp = list[i], b = guidedBoard();
  var pills = '<div class="pills"><span class="lbl">Problem</span>' + list.map(function(p, k){
    var en = UNLOCK || k === 0 || g.done[list[k - 1].id] || g.done[p.id];
    return '<button class="pill' + (k === i ? ' cur' : '') + (g.done[p.id] ? ' done' : '') + '" data-act="gprob" data-arg="' + p.id + '"' + (en ? '' : ' disabled') + '>' + (g.done[p.id] ? '✓ ' : '') + (k + 1) + ' ' + esc(p.short) + '</button>';
  }).join('') + '</div>';
  var story = '<div class="gray story showclue"><div class="t">Problem ' + (i + 1) + ' of ' + list.length + ' · We do it together</div>' + gp.story + '<div class="qhint" style="margin-top:4px">💡 ' + esc(gp.tip) + '</div></div>';
  var next = b.phase === 'done' ? '<div class="nextrow"><button class="big" data-act="gnext">' + (i < list.length - 1 ? 'Next problem ▶' : 'Go to Practice ▶') + '</button></div>' : '';
  LEFT.innerHTML = pills + story + boardLeft(b) + next;
  RIGHT.innerHTML = boardRight(b);
}

/* ===================================================================
   PART 3: PRACTICE
   =================================================================== */
function lvlName(id){ var L = TD.levels; for (var i = 0; i < L.length; i++) if (L[i].id === id) return L[i].name; return ''; }
function newPracProblem(){
  var pr = C.prac, idx = num(pr.count, pr.lvl); pr.count[pr.lvl] = idx + 1;
  pr.b = newBoard('prac', gen(pr.lvl, idx)); pr.b.lvl = pr.lvl;
}
function pracScore(b){
  var pr = C.prac, l = pr.lvl;
  if (b.shown){ b.pmsg = 'That one was a demo, so it doesn’t count. Try a new one.'; return; }
  if (b.miss === 0){
    pr.streak[l] = Math.min(3, num(pr.streak, l) + 1);
    if (pr.streak[l] >= 3 && !pr.done[l]){ pr.done[l] = 1; b.pmsg = 'No mistakes! Level complete ✓'; b.lvlDone = 1; }
    else b.pmsg = pr.done[l] ? 'No mistakes! (This level is already complete.)' : 'No mistakes! Streak: ' + pr.streak[l] + ' of 3.';
  } else b.pmsg = 'Solved, but there was a mistake, so the streak starts over. You need 3 in a row with no mistakes.';
  var s = senseText(b); if (s) b.pmsg += ' Check: ' + s;
}
function renderPractice(){
  var pr = C.prac;
  if (!pr.b || pr.b.lvl !== pr.lvl || pr.b.dead) newPracProblem();
  var b = pr.b, l = pr.lvl, list = TD.levels, li = ids(list).indexOf(l), sk = num(pr.streak, l);
  var pills = '<div class="pills"><span class="lbl">Level</span>' + list.map(function(n, k){
    var en = UNLOCK || k === 0 || pr.done[list[k - 1].id] || pr.done[n.id];
    return '<button class="pill' + (k === li ? ' cur' : '') + (pr.done[n.id] ? ' done' : '') + '" data-act="plvl" data-arg="' + n.id + '"' + (en ? '' : ' disabled') + ' title="' + esc(n.name) + '">' + (pr.done[n.id] ? '✓' : 'L' + (k + 1)) + '</button>';
  }).join('') + '<span class="streak" aria-label="streak ' + sk + ' of 3">' + (pr.done[l] ? '✓ done' : 'Streak') + [0,1,2].map(function(i){ return '<span class="dot' + (i < sk ? ' on' : '') + '">' + (i < sk ? '✓' : '') + '</span>'; }).join('') + '</span></div>';
  var story = '<div class="gray story"><div class="t">Level ' + (li + 1) + ' of ' + list.length + ' · ' + esc(lvlName(l)) + '</div>' + b.p.story + '</div>';
  var next = '', allDone = cntDone(list, pr.done) === list.length;
  if (b.phase === 'done'){
    if (b.lvlDone && li < list.length - 1) next = '<button class="big green" data-act="pnext" data-arg="lvl">Next level ▶</button>';
    else if (b.lvlDone && allDone) next = '<button class="big green" data-act="card">🏆 See completion card</button>';
    else next = '<button class="big" data-act="pnext">Next problem ▶</button>';
    next = '<div class="nextrow">' + next + (allDone && !b.lvlDone ? '<button class="big ghost" data-act="card">🏆 Completion card</button>' : '') + '</div>';
  } else if (allDone) next = '<div class="nextrow"><button class="big ghost" data-act="card">🏆 Completion card</button></div>';
  LEFT.innerHTML = pills + story + boardLeft(b) + next;
  RIGHT.innerHTML = boardRight(b);
}
async function showMe(b){
  var me = C;
  me.mis.showme = (me.mis.showme || 0) + 1; b.shown = true; b.auto = true; b.autoOK = true;
  b.p.givens = clone(b.p.g0); b.kdone = []; b.pwrong = null; b.ans = null; b.fin = null;
  b.phase = b.steps[0]; b.fills = {}; b.sel = null; b.eq = null; b.eq0 = null; b.hist = []; b.moves = []; b.locked = false; b.op = null; b.flipped = false;
  b.fb = {ok:true, title:'Watch', why:'Here is the solution, one step at a time.'};
  render();
  function gone(){ return me.prac.b !== b || C !== me || me.tab !== 'prac'; }
  while (PRE[b.phase]){
    await wait(1500); if (gone()) return;
    var d = ppDef(b); doPP(b, d.right); b.fb = {ok:true, title:'Watch', why:d.why}; render();
  }
  await wait(900); if (gone()) return;
  b.fb = {ok:true, title:'Watch', why:b.p.fid === 'dilution' ? 'Plug in: 1 = stock (before water), 2 = diluted (after).' : 'Plug in: M in M, moles in n, liters in V.'}; render();
  var order = tmplSyms(b.p.fid);
  for (var i = 0; i < order.length; i++){
    await wait(700); if (gone()) return;
    var s = order[i]; b.sel = s === b.p.U ? 'U' : s; render(); await wait(500); if (gone()) return;
    b.fills[s] = b.sel; b.sel = null; render();
  }
  await wait(600); if (gone()) return;
  finishPlug(b); b.fb = {ok:true, title:'Watch', why:'Now get ' + uName(b) + ' alone.'}; render();
  var guard = 0;
  while (!aloneSide(b.eq, b.p.U) && guard++ < 8){
    await wait(1300); if (gone()) return;
    var mv = nextMove(b.eq, b.p.U); if (!mv) break;
    doMove(b, mv.op, mv.ids);
    b.fb = {ok:true, title:mv.op + ' ' + b.moves[b.moves.length - 1].label + ' on both sides', why:mv.why}; render();
    await wait(900);
  }
  await wait(1000); if (gone()) return;
  calc(b);
  if (POST[b.phase]){
    b.fb = {ok:true, title:'Watch', why:'Last step: finish the units.'}; render();
    await wait(1600); if (gone()) return;
    var d2 = ppDef(b); doPP(b, d2.right);
  }
  b.auto = false; b.autoOK = false; render();
}

function freeReset(step){ var f = C.free; if (step <= 1){ f.U = null; f.vals = {}; } f.b = null; f.step = step; }

  if (sym === 'mm') return 'g/mol';

var KP = null;
function openKeypad(sym){
  var g = C.free.vals[sym];

  if (g && g.raw){ KP.m = g.raw.m; KP.e = g.raw.e; KP.neg = g.raw.neg; KP.eneg = g.raw.eneg; KP.em = g.raw.em; }
  drawKeypad();
}
function kpStr(){ var s = (KP.neg ? '−' : '') + (KP.m || ''); if (KP.em) s += '×10' + sup((KP.eneg ? '-' : '') + (KP.e || '')) + (KP.e ? '' : '▯'); return s; }
function drawKeypad(){
  var u = fUnit(KP.sym);
  var keys = ['7','8','9','⌫','4','5','6','±','1','2','3','×10ⁿ','0','.','',''];
  modal('<div class="kp"><h3>Enter ' + esc(symName(KP.sym)) + ' (' + esc(u) + ')</h3><div class="kpd">' + esc(kpStr() || ' ') + ' <small>' + esc(u) + '</small></div>' +
    '<div class="kpg">' + keys.map(function(k){ return k ? '<button data-act="kp" data-arg="' + k + '">' + k + '</button>' : ''; }).join('') +
    '<button class="ok" data-act="kp" data-arg="OK" style="grid-column:span 2">OK</button></div><div class="kperr">' + esc(KP.err) + '</div>' +
    '<div class="mbtns"><button class="big ghost" data-act="close">Cancel</button></div></div>');
}
function kpKey(k){
  KP.err = '';
  if (/^\d$/.test(k)){ if (KP.em){ if (KP.e.length < 3) KP.e += k; } else if (KP.m.replace('.', '').length < 10) KP.m += k; }
  else if (k === '.'){ if (!KP.em && KP.m.indexOf('.') < 0) KP.m = (KP.m || '0') + '.'; }
  else if (k === '±'){ if (KP.em) KP.eneg = !KP.eneg; else KP.neg = !KP.neg; }
  else if (k === '×10ⁿ'){ if (!KP.em){ if (!KP.m) KP.m = '1'; KP.em = true; } }
  else if (k === '⌫'){ if (KP.em){ if (KP.e) KP.e = KP.e.slice(0, -1); else if (KP.eneg) KP.eneg = false; else KP.em = false; } else if (KP.m) KP.m = KP.m.slice(0, -1); else KP.neg = false; }
  else if (k === 'OK'){
    var mv = parseFloat(KP.m);
    if (!KP.m || isNaN(mv)){ KP.err = 'Type a number first.'; drawKeypad(); return; }
    if (KP.em && !KP.e){ KP.err = 'Type the power of 10 (or tap ⌫).'; drawKeypad(); return; }
    var val = (KP.neg ? -1 : 1) * mv * Math.pow(10, KP.em ? (KP.eneg ? -1 : 1) * parseInt(KP.e, 10) : 0);
    if (val <= 0){ KP.err = 'This value must be above 0.'; drawKeypad(); return; }
    var txt = (KP.neg ? '−' : '') + KP.m + (KP.em ? '×10' + sup((KP.eneg ? '-' : '') + KP.e) : '');
    C.free.vals[KP.sym] = {val:val, txt:txt, unit:fUnit(KP.sym), raw:{m:KP.m, e:KP.e, neg:KP.neg, eneg:KP.eneg, em:KP.em}};
    KP = null; closeModal(); save(); render(); return;
  }
  drawKeypad();
}
