<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name ⇄ Formula Trainer</title>
<style>
/* =========================================================
   1. THEME & BASE
   ========================================================= */
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#1a1f2b; --muted:#5a6375; --line:#d5dae4;
  --accent:#1f56d6; --accent-ink:#fff; --accent-soft:#e7eefc;
  --good:#0f6e33; --good-bg:#e3f5e9; --bad:#a82219; --bad-bg:#fde9e7; --warn:#7a4f00; --warn-bg:#fff2d6;
  --metal:#cfe1ff; --nonmetal:#fff0a8; --metalloid:#ffd3b0; --pat:rgba(0,0,0,.18);
  --hl:#e05a00; --chip:#eef1f7; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
}
[data-theme="dark"]{
  --bg:#12151c; --panel:#1b2030; --ink:#eef1f7; --muted:#a6afc2; --line:#343b4f;
  --accent:#6f9bff; --accent-ink:#0d1220; --accent-soft:#25304a;
  --good:#7fe0a2; --good-bg:#173323; --bad:#ff9d94; --bad-bg:#3a1c1a; --warn:#ffd27a; --warn-bg:#3a2f14;
  --metal:#29436e; --nonmetal:#5b5220; --metalloid:#6a4026; --pat:rgba(255,255,255,.22);
  --hl:#ffae5c; --chip:#262d40; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
sub{font-size:.7em;vertical-align:-.35em;line-height:0}
.bdisplay sub,.slot.sym sub,.given sub{vertical-align:-.45em}
.fx{display:inline;line-height:1.2}
sup{font-size:.7em;vertical-align:.55em;line-height:0}
.small{font-size:.82rem;color:var(--muted)}
.muted{color:var(--muted)}

/* =========================================================
   2. TOP BAR
   ========================================================= */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:1.1rem;white-space:nowrap}
.brand span{color:var(--accent)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--chip)}
.seg button{border:0;background:transparent;padding:8px 11px;min-height:40px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seglbl{display:flex;align-items:center;padding:0 8px;font-size:.8rem;color:var(--muted);border-right:1px solid var(--line)}
.tools{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;min-height:44px;min-width:44px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.big{font-size:1.05rem;padding:10px 20px;font-weight:700}
#storageBanner{background:var(--warn-bg);color:var(--warn);padding:8px 14px;border-bottom:1px solid var(--line);font-weight:600}

/* =========================================================
   3. MAIN LAYOUT
   ========================================================= */
main{display:grid;grid-template-columns:minmax(380px,1fr) minmax(500px,650px);gap:14px;padding:14px;max-width:1400px;margin:0 auto;align-items:start}
main.noTable{grid-template-columns:minmax(0,780px);justify-content:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
@media (max-width:980px){main,main.noTable{grid-template-columns:1fr}}
@media (max-width:700px){#ptPanel{overflow-x:auto}#pt{min-width:600px}.given{font-size:1.7rem}}

/* question card */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qsec{font-weight:700;color:var(--muted);font-size:.9rem}
.qnum{font-weight:700}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0 10px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prompt{font-size:.95rem;color:var(--muted);margin-top:4px}
.given{font-size:2.1rem;font-weight:700;margin:2px 0 10px;letter-spacing:.3px;word-break:break-word}
.step{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.steplbl{font-weight:700;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clsbtn{min-width:140px}
input.answer{flex:1;min-width:220px;font:inherit;font-size:1.15rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
input.answer:focus{border-color:var(--accent);outline:none}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid transparent}
.fb.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.fb.info{background:var(--accent-soft);border-color:var(--accent)}
.fb b{color:inherit}
.work{margin-top:8px;background:var(--chip);border-radius:10px;padding:8px 12px}
.work summary{cursor:pointer;font-weight:700;min-height:28px}
.work ol{margin:6px 0 4px;padding-left:22px}
.work li{margin:3px 0}
.ans{font-size:1.15rem;font-weight:700}

/* formula builder */
.bdisplay{min-height:56px;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:1.8rem;font-weight:700;display:flex;align-items:center;background:var(--bg);flex-wrap:wrap}
.bdisplay .ph{font-size:1rem;font-weight:400;color:var(--muted)}
.bdisplay .tk-poly{background:var(--accent-soft);border-radius:6px;padding:0 3px;margin:0 1px}
.bdisplay .caret{display:inline-block;width:2px;height:1.2em;background:var(--accent);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 8px;min-height:44px;min-width:56px;font-weight:700;font-size:1.05rem}
.chip:hover:not(:disabled){border-color:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.key{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-width:44px;min-height:44px;font-weight:700}
.key.sub{font-size:.95rem}
.lbl{font-size:.78rem;color:var(--muted);margin-top:8px}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.ionpair{flex:1;min-width:190px}
.slotlbl{display:block;font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:2px}
.pairrow{display:flex;align-items:flex-start;gap:5px}
.slot{border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:4px 10px;text-align:center;position:relative}
.slot[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slot .tag{position:absolute;bottom:1px;left:0;right:0;font-size:.6rem;color:var(--muted);font-weight:600}
.slot.sym{flex:1;min-height:66px;margin-top:18px;font-size:1.7rem;font-weight:700;padding-bottom:12px}
.slot.chgbox{width:58px;min-height:44px;font-size:1.15rem;font-weight:800;color:var(--accent);padding-bottom:10px}
.key.pos,.key.neg{min-width:52px;font-size:1.05rem}
.ionshow{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:6px 14px;border-radius:10px;border:1px solid var(--line)}
.ionshow.good{background:var(--good-bg);border-color:var(--good)}
.ionshow.bad{background:var(--bad-bg);border-color:var(--bad)}
.ionbig{font-size:2.2rem;font-weight:800;color:var(--ink)}
.ionbig sup{font-size:.6em;vertical-align:.7em;color:var(--accent)}
.ionmsg{font-weight:700}
.ionshow.good .ionmsg{color:var(--good)} .ionshow.bad .ionmsg{color:var(--bad);font-weight:600}

/* =========================================================
   4. PERIODIC TABLE
   ========================================================= */
#ptPanel h2{font-size:1rem;margin:0 0 6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;margin-bottom:6px;align-items:center}
.legend i{display:inline-block;width:18px;height:14px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px;border-radius:3px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:2px}
.pt .chg{text-align:center;font-size:.72rem;font-weight:800;color:var(--accent);min-height:16px}
.el{position:relative;border:1px solid var(--line);border-radius:4px;padding:0;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:30px;color:#111}
[data-theme="dark"] .el{color:#f2f4f8}
.el .z{position:absolute;top:1px;left:2px;font-size:.5rem;opacity:.75}
.el .s{font-weight:800;font-size:.86rem}
.el.metal{background:var(--metal)}
.el.nonmetal{background-color:var(--nonmetal);background-image:radial-gradient(var(--pat) 1px,transparent 1.3px);background-size:5px 5px}
.el.metalloid{background-color:var(--metalloid);background-image:repeating-linear-gradient(45deg,var(--pat) 0 1.5px,transparent 1.5px 5px)}
.el.hl{outline:3px solid var(--hl);outline-offset:-1px;z-index:2;transform:scale(1.08)}
.el:hover{filter:brightness(.93)}
.pt.build .el{cursor:copy}
.fph{border:1px dashed var(--line);border-radius:4px;font-size:.55rem;display:flex;align-items:center;justify-content:center;color:var(--muted);background:transparent;padding:0}
.frow-gap{grid-column:1/-1;height:6px}
.elinfo{margin-top:6px;font-size:.88rem;min-height:1.3em}

/* =========================================================
   5. DRAWER, OVERLAY, MODAL
   ========================================================= */
#refDrawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:40;overflow:auto;padding:14px 16px;box-shadow:-6px 0 20px rgba(0,0,0,.15)}
#refDrawer h2{margin:0 0 8px}
#refDrawer h3{margin:14px 0 6px;font-size:1rem}
table.simple{border-collapse:collapse;width:100%;font-size:.92rem}
table.simple th,table.simple td{border:1px solid var(--line);padding:4px 7px;text-align:left}
table.simple th{background:var(--chip)}
.flow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--chip)}
.flow .q{font-weight:700}
.flow .y{margin-left:14px}

#scoreOverlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto}
.sc{max-width:1320px;margin:0 auto;padding:10px 16px}
.schead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.schead h1{margin:0;font-size:1.35rem}
.clock{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
table.grid{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed}
table.grid th{text-align:left;font-size:.85rem;color:var(--muted);padding:2px 6px}
table.grid th.rowh{width:190px;color:var(--ink)}
table.grid td{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;vertical-align:top;font-size:.82rem;line-height:1.25}
table.grid td.mastered{border:2px solid var(--good);background:var(--good-bg)}
.score{font-size:1.05rem;font-weight:800}
.badge{display:inline-block;background:var(--good);color:var(--panel);border-radius:6px;padding:0 6px;font-weight:800;font-size:.75rem;margin-left:4px}
.retake{border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:2px 8px;font-size:.78rem;min-height:28px;margin-top:3px}
.logwrap{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.log{border-collapse:collapse;width:100%;font-size:.82rem}
table.log th,table.log td{padding:3px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.log th{position:sticky;top:0;background:var(--chip)}
table.log td.secs{white-space:normal}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--panel);border-radius:14px;padding:18px 20px;max-width:520px;width:100%;border:1px solid var(--line)}
#modal h2{margin:0 0 8px;font-size:1.2rem}
#modal .row{justify-content:flex-end;margin-top:14px}
.setrow{display:flex;gap:10px;align-items:center;margin:10px 0}
.setrow input[type=checkbox]{width:22px;height:22px}

/* round summary */
.sumbig{font-size:2.2rem;font-weight:800}
table.res{border-collapse:collapse;width:100%;font-size:.92rem;margin-top:8px}
table.res td{border-bottom:1px solid var(--line);padding:4px 6px}

@media print{
  body>*:not(#scoreOverlay){display:none!important}
  #scoreOverlay{position:static;overflow:visible}
  .noprint{display:none!important}
  .logwrap{max-height:none;overflow:visible}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Name <span>⇄</span> Formula Trainer</div>
  <div class="ctrls">
    <div class="seg" role="group" aria-label="Compound type">
      <button data-act="type" data-v="ionic">Ionic</button>
      <button data-act="type" data-v="covalent">Covalent</button>
      <button data-act="type" data-v="ionorcov" title="Ionic and covalent mixed — classify first">Mixed</button>
    </div>
    <div class="seg" id="levelSeg" role="group" aria-label="Ionic level">
      <span class="seglbl">Level</span>
      <button data-act="level" data-v="1" title="Known charges">1 · Known</button>
      <button data-act="level" data-v="2" title="Transition metals">2 · Transition</button>
      <button data-act="level" data-v="3" title="Polyatomic ions">3 · Polyatomic</button>
      <button data-act="level" data-v="4" title="Mix of Levels 1–3">4 · Mixed</button>
    </div>
    <div class="seg" role="group" aria-label="Direction">
      <button data-act="dir" data-v="f2n">Formula → Name</button>
      <button data-act="dir" data-v="n2f">Name → Formula</button>
    </div>
  </div>
  <div class="tools">
    <button class="btn" data-act="ref" id="refBtn" aria-label="Open reference">📖 Reference</button>
    <button class="btn primary" data-act="score" aria-label="Open score card">🏆 Score Card</button>
    <button class="btn" data-act="sound" id="soundBtn" aria-label="Sound on or off" title="Sound on / off">🔊</button>
    <button class="btn" data-act="theme" aria-label="Toggle light or dark theme" title="Light / dark">🌓</button>
    <button class="btn" data-act="settings" aria-label="Teacher settings" title="Settings">⚙</button>
  </div>
</header>
<div id="storageBanner" role="alert" hidden>⚠ Progress can't be saved in this window — open the full-page link.</div>

<main id="main">
  <section id="qcard" class="card" aria-live="polite"></section>
  <section id="ptPanel" class="card" aria-label="Periodic table">
    <h2>Periodic Table</h2>
    <div class="legend">
      <span><i class="el metal" style="min-height:0;aspect-ratio:auto"></i>Metal</span>
      <span><i class="el nonmetal" style="min-height:0;aspect-ratio:auto"></i>Nonmetal (dots)</span>
      <span><i class="el metalloid" style="min-height:0;aspect-ratio:auto"></i>Metalloid (stripes)</span>
      <span class="small">Blue numbers = group charge</span>
    </div>
    <div id="pt" class="pt"></div>
    <div id="elInfo" class="elinfo muted"></div>
  </section>
</main>

<aside id="refDrawer" hidden aria-label="Reference"></aside>
<div id="scoreOverlay" hidden></div>
<div id="modal" hidden role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>

<script>
'use strict';
/* =========================================================
   1. EDITABLE DATA  (teachers: change pools here)
   ========================================================= */

// All elements in atomic-number order: "Symbol Name|..."
const EL_LIST = 'H Hydrogen|He Helium|Li Lithium|Be Beryllium|B Boron|C Carbon|N Nitrogen|O Oxygen|F Fluorine|Ne Neon|Na Sodium|Mg Magnesium|Al Aluminum|Si Silicon|P Phosphorus|S Sulfur|Cl Chlorine|Ar Argon|K Potassium|Ca Calcium|Sc Scandium|Ti Titanium|V Vanadium|Cr Chromium|Mn Manganese|Fe Iron|Co Cobalt|Ni Nickel|Cu Copper|Zn Zinc|Ga Gallium|Ge Germanium|As Arsenic|Se Selenium|Br Bromine|Kr Krypton|Rb Rubidium|Sr Strontium|Y Yttrium|Zr Zirconium|Nb Niobium|Mo Molybdenum|Tc Technetium|Ru Ruthenium|Rh Rhodium|Pd Palladium|Ag Silver|Cd Cadmium|In Indium|Sn Tin|Sb Antimony|Te Tellurium|I Iodine|Xe Xenon|Cs Cesium|Ba Barium|La Lanthanum|Ce Cerium|Pr Praseodymium|Nd Neodymium|Pm Promethium|Sm Samarium|Eu Europium|Gd Gadolinium|Tb Terbium|Dy Dysprosium|Ho Holmium|Er Erbium|Tm Thulium|Yb Ytterbium|Lu Lutetium|Hf Hafnium|Ta Tantalum|W Tungsten|Re Rhenium|Os Osmium|Ir Iridium|Pt Platinum|Au Gold|Hg Mercury|Tl Thallium|Pb Lead|Bi Bismuth|Po Polonium|At Astatine|Rn Radon|Fr Francium|Ra Radium|Ac Actinium|Th Thorium|Pa Protactinium|U Uranium|Np Neptunium|Pu Plutonium|Am Americium|Cm Curium|Bk Berkelium|Cf Californium|Es Einsteinium|Fm Fermium|Md Mendelevium|No Nobelium|Lr Lawrencium|Rf Rutherfordium|Db Dubnium|Sg Seaborgium|Bh Bohrium|Hs Hassium|Mt Meitnerium|Ds Darmstadtium|Rg Roentgenium|Cn Copernicium|Nh Nihonium|Fl Flerovium|Mc Moscovium|Lv Livermorium|Ts Tennessine|Og Oganesson';
const METALLOIDS = ['B','Si','Ge','As','Sb','Te','At','Ts'];
const NONMETALS  = ['H','He','C','N','O','F','Ne','P','S','Cl','Ar','Se','Br','Kr','I','Xe','Rn','Og'];
// Charge printed above each group with a definite charge
const GROUP_CHARGE = {1:'+1',2:'+2',13:'+3',15:'−3',16:'−2',17:'−1'};

// LEVEL 1 cations: [symbol, name, charge]. Ag, Zn and Cd are intentionally NOT used.
const L1_CATIONS = [['Li','lithium',1],['Na','sodium',1],['K','potassium',1],['Rb','rubidium',1],['Cs','cesium',1],
  ['Be','beryllium',2],['Mg','magnesium',2],['Ca','calcium',2],['Sr','strontium',2],['Ba','barium',2],
  ['Al','aluminum',3],['Ga','gallium',3]];
const FIXED_TM = []; // fixed-charge transition metals (none used)

// LEVEL 2 multivalent metals (every one gets a Roman numeral). Mercury(I) = Hg2 2+ is added separately.
const TM_CHARGES = {Sc:[3],Ti:[2,3,4],V:[2,3,4,5],Cr:[2,3],Mn:[2,3,4],Fe:[2,3],Co:[2,3],Ni:[2,3],Cu:[1,2],
  Au:[1,3],Pt:[2,4],Pd:[2,4],Hg:[2],Sn:[2,4],Pb:[2,4]};

// Monatomic anions: [symbol, name, charge]
const MONO_ANIONS = [['N','nitride',-3],['P','phosphide',-3],['O','oxide',-2],['S','sulfide',-2],['Se','selenide',-2],
  ['F','fluoride',-1],['Cl','chloride',-1],['Br','bromide',-1],['I','iodide',-1]];

// Core 12 polyatomic ions: [formula, name, charge, alternate names]
const POLY_IONS = [['NH4','ammonium',1],['OH','hydroxide',-1],['NO3','nitrate',-1],['NO2','nitrite',-1],
  ['SO4','sulfate',-2],['SO3','sulfite',-2],['PO4','phosphate',-3],['CO3','carbonate',-2],
  ['HCO3','hydrogen carbonate',-1,['bicarbonate']],['C2H3O2','acetate',-1],['CN','cyanide',-1],['ClO3','chlorate',-1]];

// Covalent pool (real compounds; names are generated by the prefix rules). Diatomic elements included.
const COVALENT = ['CO','CO2','NO','NO2','N2O','N2O3','N2O4','N2O5','NF3','NCl3','PCl3','PCl5','PBr3','P4O10','P2O5',
  'SO2','SO3','SF4','SF6','SCl2','S2Cl2','CCl4','CBr4','CS2','SiO2','SiCl4','SiF4','BF3','BCl3','OF2','Cl2O','Cl2O7',
  'ClF3','BrF5','IF5','IF7','XeF2','XeF4','XeF6','SeO2','AsCl3',
  'H2','N2','O2','F2','Cl2','Br2','I2'];
// "-ide" roots for the second element of a covalent name
const COV_ROOT = {O:'ox',F:'fluor',Cl:'chlor',Br:'brom',I:'iod',S:'sulf',Se:'selen',N:'nitr',P:'phosph'};

const PFX = ['','mono','di','tri','tetra','penta','hexa','hepta','octa','nona','deca'];
const ROMAN = ['','I','II','III','IV','V','VI','VII'];
const ROUND_LEN = 10, MASTERY = 8;            // 10 questions, 8.0 points = mastered
const IDLE_MS = 5*60*1000;                     // idle > 5 min is not counted as active time
const STORE_KEY = 'nameFormulaTrainer.v1';

/* =========================================================
   2. DERIVED DATA: elements, ions, pools
   ========================================================= */
const ELEMENTS = {}; const EL_BY_Z = [null];
EL_LIST.split('|').forEach((s,i)=>{
  const [sym,name]=s.split(' '); const Z=i+1;
  const cat = METALLOIDS.includes(sym)?'metalloid':NONMETALS.includes(sym)?'nonmetal':'metal';

function diagCovF(q,str){

  if(/(^|[^0-9])1(?![0-9])/.test(str)) return {ok:false,hint:'Don’t write a subscript of 1 — it’s understood.'};
  const sp=parseSimple(str), ep=q.parts; const sEls=sp.map(x=>x[0]), eEls=ep.map(x=>x[0]);
  if(q.diatomic){
    if(sEls.length===1&&sEls[0]===eEls[0]) return {ok:false,hint:'This element is diatomic — it exists as molecules of two bonded atoms.'};
    return {ok:false,hint:'Find this element’s symbol on the periodic table (and remember it is diatomic).'};
  }
  if(sEls.length===2&&sEls[0]===eEls[1]&&sEls[1]===eEls[0]) return {ok:false,hint:'Write the elements in the same order as the name.'};
  if(sEls.length===2&&sEls[0]===eEls[0]&&sEls[1]===eEls[1]){
    const [s1,s2]=[sp[0][1],sp[1][1]],[x1,x2]=[ep[0][1],ep[1][1]];
    if(s1*x2===s2*x1 && s1<x1) return {ok:false,hint:'Don’t reduce covalent formulas — the prefixes give the exact number of each atom.'};
    if(s1!==x1) return {ok:false,hint:x1===1?`No prefix on the first element means just one ${eEls[0]} atom.`:`Check the subscript on ${eEls[0]}: what number does the prefix “${PFX[x1]}” mean?`};
    if(s2!==x2) return {ok:false,hint:`Check the subscript on ${eEls[1]}: what number does the prefix “${PFX[x2]}” mean?`};
  }
  return {ok:false,hint:'One of your element symbols doesn’t match the name. Find each element on the periodic table, in the same order as the name.'};
}

/* =========================================================
   7. EXPLANATIONS & WORKED SOLUTIONS
   ========================================================= */
function clsExplain(q){
  if(q.ionic){
    if(q.c.kind==='nh4') return 'It contains the ammonium ion NH₄⁺. Every element in it is a nonmetal, but ammonium compounds are still <b>ionic</b>.';
    return `${ELEMENTS[q.c.metal].name} is a <b>metal</b> bonded to nonmetal(s) → metal + nonmetal = <b>ionic</b> (electrons transferred).`;
  }
  if(q.diatomic) return `${fHTML(q.formula)} is two atoms of the same nonmetal → <b>covalent</b> (electrons shared).`;
  const ml=q.els.filter(e=>ELEMENTS[e].cat==='metalloid').map(e=>ELEMENTS[e].name);
  return `No metal: ${q.els.map(e=>ELEMENTS[e].name).join(' and ')} → <b>covalent</b> (electrons shared).`+(ml.length?` (${ml.join(', ')} is a metalloid, which bonds covalently with nonmetals.)`:'');
}
function workedHTML(q,dir){
  const steps=[];
  if(q.ionic){
    const c=q.c,a=q.a;
    steps.push(`Ions: ${ionHTML(c)} = ${esc(cationName(c))} and ${ionHTML(a)} = ${a.name}.`);
    if(c.roman){
      const tot=-a.q*q.ac, atoms=q.cc*c.atoms;
      if(dir==='f2n') steps.push(`Metal charge from the anion: ${q.ac} × (${sq(a.q)}) = −${tot}, shared by ${atoms} ${c.metal} atom${atoms>1?'s':''} → +${tot/atoms} each → (${c.roman}).`);
      else steps.push(`(${c.roman}) means each ${c.metal} ion is +${c.perAtom}`+(c.kind==='hg2'?'; mercury(I) exists as Hg₂²⁺.':'.'));
    }
    steps.push(`Balance charges: ${q.cc} × (${sq(c.q)}) + ${q.ac} × (${sq(a.q)}) = 0 → ratio ${q.cc} : ${q.ac}.`);
    if(q.parens) steps.push('More than one polyatomic ion → put it in parentheses.');
    steps.push('Ionic names never use prefixes.');
  } else if(q.diatomic){
    steps.push(`${fHTML(q.formula)} is a diatomic element: two bonded ${elName(q.parts[0][0])} atoms.`);
    steps.push('Its name is just the element’s name.');
  } else {
    const [[e1,n1],[e2,n2]]=q.parts;
    steps.push(`Count atoms: ${n1} ${e1} → ${n1===1?'no prefix (never “mono” on the first element)':'“'+PFX[n1]+'”'}; ${n2} ${e2} → “${PFX[n2]}”.`);
    steps.push(`Second element ends in -ide: ${elName(e2)} → ${COV_ROOT[e2]}ide.`);
    if(COV_ROOT[e2]==='ox' && /[ao]$/.test(PFX[n2])) steps.push(`Drop the prefix’s final vowel before “oxide”: ${PFX[n2]} + oxide → ${PFX[n2].slice(0,-1)}oxide.`);
    if(dir==='n2f') steps.push('Covalent formulas are never reduced.');
  }
  return `<details class="work" open><summary>Show work</summary><ol>${steps.map(s=>'<li>'+s+'</li>').join('')}</ol>
    <div class="ans">${fHTML(q.formula)} = ${esc(q.name)}</div></details>`;
}

let AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(AC.state==='suspended') AC.resume(); return AC; }
function tone(freq,start,dur,type,vol,endFreq){
  const a=audio(); if(!a) return; const t=a.currentTime+start; const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(endFreq) o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.03);
}

function getSec(key){ return S.sections[key]||(S.sections[key]={best:0,bestCls:null,attempts:0,incomplete:0,bestAt:null,mastered:false,masteredAt:null}); }

  const c=S.current, now=Date.now(), ioc=c.row==='ionorcov';

  const better = sec.bestAt===null || c.pts>sec.best || (c.pts===sec.best && ioc && c.cls>(sec.bestCls??-1));
  if(better){ sec.best=c.pts; sec.bestCls=ioc?c.cls:null; sec.bestAt=now; sec.bestIon=c.ionN?c.ion:null; sec.bestIonN=c.ionN||0; sec.bestDur=c.active||0; }

const curQ=()=>{ const c=S.current; return {c,d:c.qs[c.i],q:expandQ(c.qs[c.i]),st:c.st}; };
function builderStr(tokens){ return tokens.map(t=>t.t==='el'||t.t==='poly'?t.v:t.t==='num'?String(t.v):t.t==='lp'?'(':')').join(''); }
function builderHTML(tokens,caret=true){
  if(!tokens.length) return caret?'<span class="ph">'+(S.current&&S.current.row==='covalent'?'Tap elements on the periodic table…':'Tap elements on the periodic table or the ion chips below…')+'</span>':'—';
  return '<span class="fx">'+tokens.map(t=>t.t==='el'?esc(t.v):t.t==='poly'?'<span class="tk-poly">'+fHTML(t.v)+'</span>':t.t==='num'?'<sub>'+t.v+'</sub>':t.t==='lp'?'(':')').join('')+(caret?'<span class="caret"></span>':'')+'</span>';
}
function doClassify(ans){
  const {c,q,st}=curQ(); if(st.phase!=='classify') return;
  st.clsAns=ans; st.clsOK=(ans==='ionic')===q.ionic; c.clsN++; if(st.clsOK) c.cls++; play(st.clsOK?'correct':'wrong');
  st.phase=needsIons(curQ().d,q)?'ions':'answer'; save(); renderAll(); focusInput();
}
function doCheck(){
  const {c,d,q,st}=curQ(); if(st.phase!=='answer') return;
  const answer = d.d==='f2n' ? st.typed : builderStr(st.tokens);
  const r = d.d==='f2n' ? diagnoseName(q,answer) : diagnoseFormula(q,answer);
  if(r.ok){ play('correct');
    st.earned=st.attempt===1?1:0.5;
    st.fbType='good'; st.fb=(st.attempt===1?'✓ <b>Correct!</b> +1':'✓ <b>Correct on your retry.</b> +½')+(r.note?'<br>'+r.note:'');
    return endQuestion(answer);
  }
  if(r.noRetry){ st.fbType='info'; st.fb='ℹ '+r.hint; save(); renderQ(); focusInput(); return; }
  if(st.attempt===1){ play('wrong'); st.attempt=2; st.fbType='warn'; st.fb='⚠ '+r.hint+'<br><b>One more try</b> for half credit.'; save(); renderQ(); focusInput(); return; }
  play('wrong'); st.earned=0; st.fbType='bad'; st.fb='✗ <b>Not quite.</b> '+r.hint+'<br>Answer: <b>'+(d.d==='f2n'?esc(q.name):fHTML(q.formula))+'</b>  · +0';
  endQuestion(answer);
}
function endQuestion(answer){
  const {c,d,q,st}=curQ();
  st.phase='done'; st.final=answer; c.pts+=st.earned;
  c.results.push({f:q.formula,n:q.name,d:d.d,e:st.earned,cls:c.row==='ionorcov'?st.clsOK:null,ion:st.ionDone?st.ionEarned:null});
  sess.q++; if(!sess.secs.includes(c.key)) sess.secs.push(c.key);
  save(); renderQ(); setTimeout(()=>{const b=$('#nextBtn'); if(b) b.focus();},30);
}
function doNext(){
  const c=S.current; if(!c||c.st.phase!=='done') return;
  c.i++;
  if(c.i>=ROUND_LEN){ finishRound(); renderAll(); return; }
  initQ(c);
  save(); renderAll(); focusInput();
}
function diagIons(q,cS,cQ,aS,aQ){
  const c=q.c,a=q.a;
  if(!cS||cQ===null||!aS||aQ===null) return {ok:false,noRetry:true,hint:'Fill in both ions <b>and</b> both charges (tap a box, build the ion, then tap its charge).'};
  if(cS===c.f&&cQ===c.q&&aS===a.f&&aQ===a.q) return {ok:true};
  if(cS===a.f&&aS===c.f) return {ok:false,noRetry:true,hint:'The ions are in the wrong boxes. The <b>cation</b> (metal or ammonium, positive) goes first; the <b>anion</b> (negative) goes second.'};
  const h=[];
  if(cS!==c.f){
    if(c.kind==='hg2'&&cS==='Hg') h.push('Mercury(I) is the Hg₂ ion — two bonded Hg atoms (add a subscript 2).');
    else if(c.kind==='nh4') h.push('Check the formula of the ammonium ion.');
    else h.push(`Check the cation symbol for <b>${c.name}</b>.`);
  } else if(cQ!==c.q){
    if(cQ<0) h.push('A cation is a <b>positive</b> ion.');
    else if(c.kind==='hg2') h.push('The (I) means each Hg is +1, and Hg₂ has two Hg atoms — so what is the charge of the whole ion?');
    else if(c.roman) h.push(`The Roman numeral (${c.roman}) tells you the cation’s charge.`);
    else if(c.kind==='fixed') h.push('Cadmium has only one charge (2+), so its name has no Roman numeral.');
    else if(c.kind==='nh4') h.push('Check ammonium’s charge on the polyatomic ion chart.');
    else h.push('Check the cation’s charge: use the group charge shown above the periodic table.');
  }
  if(aS!==a.f){
    const other=[...MONO,...POLY_ANIONS].find(x=>x.f===aS);
    if(other&&a.poly&&other.poly) h.push(`${fHTML(aS)} is ${other.name}. The name asks for <b>${a.name}</b>.`);
    else h.push(a.kind==='mono'?`Check the anion symbol: <b>${a.name}</b> comes from ${elName(a.el)}.`:`Check the formula of <b>${a.name}</b>.`);
  } else if(aQ!==a.q){
    if(aQ>0) h.push('An anion is a <b>negative</b> ion.');
    else h.push(a.kind==='mono'?'Check the anion’s charge: use the group charge shown above the periodic table.':`Check the charge of the ${a.name} ion (polyatomic ion chart).`);
  }
  return {ok:false,hint:h.join('<br>')||'Check both ions.'};
}
function ionAct(act,val){
  const {st}=curQ(); if(st.phase!=='ions') return;
  // ionSlot: 'c' cation symbol, 'cq' cation charge, 'a' anion symbol, 'aq' anion charge
  const ion=(st.ionSlot||'c')[0], inCharge=/q$/.test(st.ionSlot);
  const T=ion==='c'?st.ionC:st.ionA, last=T[T.length-1];
  const setQ=v=>{ if(ion==='c') st.ionCq=v; else st.ionAq=v; };
  if(act==='el'||act==='poly'||act==='num'){
    st.ionSlot=ion;                                   // building goes into this ion's symbol box
    if(act==='el'||act==='poly'){ T.length=0; T.push({t:act,v:val}); }   // an ion box holds ONE element or ion: a new tap replaces it
    else { if(!last) return; if(last.t==='num') last.v=+val; else T.push({t:'num',v:+val}); }
  }
  else if(act==='back'){ if(inCharge) setQ(null); else T.pop(); }
  else if(act==='clear'){ if(inCharge) setQ(null); else T.length=0; }
  else if(act==='charge'){ setQ(+val); st.ionSlot = ion==='c' ? 'a' : 'aq'; }   // after cation charge → anion symbol
  else if(act==='slot') st.ionSlot=val;
  else return;
  if(st.ionFbType==='info'){ st.ionFb=''; st.ionFbType=''; }
  saveSoon(); renderQ();
}
function checkIons(){
  const {q,st}=curQ(); if(st.phase!=='ions') return;
  const r=diagIons(q,builderStr(st.ionC),st.ionCq,builderStr(st.ionA),st.ionAq);
  if(r.ok){ play('correct'); st.ionEarned=st.ionAttempt===1?1:0.5; st.ionFbType='good'; st.ionFb=st.ionAttempt===1?'✓ Correct':'✓ Correct on retry (½)'; return finishIons(); }
  if(r.noRetry){ st.ionFbType='info'; st.ionFb='ℹ '+r.hint; save(); renderQ(); return; }
  if(st.ionAttempt===1){ play('wrong'); st.ionAttempt=2; st.ionFbType='warn'; st.ionFb='⚠ '+r.hint+'<br><b>One more try</b> for half credit.'; save(); renderQ(); return; }
  play('wrong'); st.ionEarned=0; st.ionFbType='bad'; st.ionFb='✗ '+r.hint+'<br>These are the correct ions — use them below.'; finishIons();
}
function finishIons(){ const {c,st}=curQ(); st.ionDone=true; c.ionN=(c.ionN||0)+1; c.ion=(c.ion||0)+st.ionEarned; st.phase='answer'; save(); renderAll(); }
function builderAct(act,val){
  const {d,st}=curQ(); if(st.phase!=='answer'||d.d!=='n2f') return;
  const T=st.tokens, last=T[T.length-1];
  if(act==='el') T.push({t:'el',v:val});
  else if(act==='poly') T.push({t:'poly',v:val});
  else if(act==='num'){ if(!last||last.t==='lp') return; if(last.t==='num') last.v=+val; else T.push({t:'num',v:+val}); }
  else if(act==='lp') T.push({t:'lp'});
  else if(act==='rp'){ const open=T.filter(t=>t.t==='lp').length-T.filter(t=>t.t==='rp').length; if(open<=0||!last||last.t==='lp') return; T.push({t:'rp'}); }
  else if(act==='back') T.pop();
  else if(act==='clear') T.length=0;
  if(st.fbType==='info'){ st.fb=''; st.fbType=''; }
  saveSoon(); renderBuilderOnly();
}

/* =========================================================
   13. SELF-TEST  (open the console and run: selfTest())
   ========================================================= */
window.selfTest=function(){
  const fails=[], summary=[];
  const ck=(cond,msg)=>{ if(!cond) fails.push(msg); };
  for(const row of ['ionic1','ionic2','ionic3','ionic4','covalent','ionorcov']){
    let n=0;
    for(let i=0;i<500;i++){
      const d=pickDesc(row); const q=expandQ(d); n++;
      ck(diagnoseName(q,q.name).ok, row+': name key rejected '+q.name);
      ck(diagnoseFormula(q,q.formula).ok, row+': formula key rejected '+q.formula);
      if(q.ionic) ck(diagIons(q,q.c.f,q.c.q,q.a.f,q.a.q).ok, row+': ion key rejected '+q.formula);
      if(q.ionic){
        const {c,a,cc,ac}=q;
        ck(c.q*cc+a.q*ac===0, 'not charge-balanced '+q.formula);
        ck(gcd(cc,ac)===1, 'not reduced '+q.formula);
        ck(/\(/.test(q.formula)===((c.poly&&cc>1)||(a.poly&&ac>1)), 'parentheses wrong '+q.formula);
        if(c.kind==='tm'||c.kind==='hg2'){ ck(q.name.includes('('+ROMAN[c.perAtom]+')'),'Roman numeral missing '+q.name); ck(c.perAtom*c.atoms===c.q,'Roman value wrong '+q.name); }
        else ck(!/\(/.test(q.name),'unexpected Roman numeral '+q.name);
        if(row==='ionic1') ck(c.kind==='main'||c.kind==='fixed','L1 has wrong cation '+q.formula);
        if(row==='ionic3') ck(c.kind==='nh4'||a.poly,'L3 without a polyatomic '+q.formula);
      } else {
        ck(!/(aoxide|ooxide)/.test(q.name),'vowel not dropped '+q.name);
        ck(!/^mono/.test(q.name),'mono on first element '+q.name);
        if(!q.diatomic){ const words=q.name.split(' '); ck(words.length===2&&/ide$/.test(words[1]),'covalent name form '+q.name);
          ck(stripPfx(words[1])&&stripPfx(words[1]).n===q.parts[1][1],'second prefix wrong '+q.name);
          const p1=stripPfx(words[0]); ck((p1?p1.n:1)===q.parts[0][1],'first prefix wrong '+q.name); }
      }
    }
    summary.push({row,questions:n});
  }
  // the lenient matcher must never accept chemically different words
  const fake=(name)=>({ionic:true,names:[name],name,c:IONS.Na,a:IONS.p_NO3,cc:1,ac:1});
  const pairs=[['sodium sulfate','sodium sulfite'],['sodium sulfite','sodium sulfate'],['sodium nitrate','sodium nitrite'],['sodium nitrite','sodium nitrate'],
    ['sodium chlorate','sodium chloride'],['sodium chloride','sodium chlorate'],['sodium sulfide','sodium sulfite'],['sodium iodide','sodium iodine']];
  for(const [exp,stud] of pairs) ck(!diagnoseName(fake(exp),stud).ok,'matcher accepted '+stud+' for '+exp);
  const fe=expandQ({k:'i',c:'Fe3',a:'a_Cl'}); ck(!diagnoseName(fe,'iron(II) chloride').ok,'accepted wrong Roman numeral');
  ck(diagnoseName(expandQ({k:'i',c:'K',a:'a_Cl'}),'potasium chloride').ok,'1-letter typo should be accepted');
  ck(diagnoseName(expandQ({k:'i',c:'Pt2',a:'a_Se'}),'platnium (II) selenide').ok,'swapped-letter typo should be accepted');
  ck(!diagnoseName(expandQ({k:'i',c:'Pt2',a:'a_Se'}),'platnium (IV) selenide').ok,'wrong Roman numeral must still fail');
  ck(diagnoseName(expandQ({k:'c',f:'CO'}),'carbon monooxide').ok,'monooxide should be accepted with a warning');
  ck(diagnoseName(expandQ({k:'c',f:'P2O5'}),'diphosphorus pentaoxide').ok,'pentaoxide should be accepted with a warning');
  ck(!diagnoseName(expandQ({k:'c',f:'P2O5'}),'diphosphorus tetraoxide').ok,'wrong prefix must still fail');
  ck(!diagnoseFormula(expandQ({k:'i',c:'Ca',a:'p_OH'}),'CaOH2').ok,'CaOH2 should be rejected');
  for(let i=0;i<3000;i++){ const q=expandQ(pickDesc(rnd(['ionic1','ionic2','ionic3','ionorcov']))); ck(!q.ionic||!['Ag','Zn','Cd'].includes(q.c.metal),'Ag, Zn or Cd appeared: '+q.formula); }
  console.table(summary);
  if(fails.length){ console.error('SELF-TEST FAILED ('+fails.length+')',[...new Set(fails)].slice(0,40)); }
  else console.log('%cSELF-TEST PASSED — all answer keys and matcher checks OK','color:green;font-weight:bold');
  return {passed:!fails.length,failures:[...new Set(fails)]};
};

/* =========================================================
   14. START
   ========================================================= */
initSession(); buildTable();
if(S.current&&!S.current.complete){ // replace any saved question whose ions were removed from the pools
  const c=S.current; let fixCur=false;
  c.qs=c.qs.map((d,i)=>{ if(d.k!=='i'||(IONS[d.c]&&IONS[d.a])) return d; if(i===c.i) fixCur=true; let n; do{ n=pickDesc(c.row); }while(n.k==='i'&&c.qs.some(x=>x.c===n.c&&x.a===n.a)); n.d=d.d; return n; });
  if(fixCur){ initQ(c); }
}
if(!S.current) startRound(); else { save(); renderAll(); focusInput(); }
</script>
