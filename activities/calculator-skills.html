<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator Skills for Chemistry</title>
<meta name="description" content="Dimensional analysis work → simplified fraction → calculator. Learn two ways to type it on a scientific calculator laid out like the TI-30XIIS: parentheses, or multiply every top number and divide by every bottom number.">
<style>
:root{
  --bg:#f3f5f9;--card:#fff;--ink:#1c2333;--muted:#5d6779;--line:#dde2ea;
  --accent:#1f6feb;--good:#2b8a3e;--goodbg:#ebfbee;--bad:#d63939;--badbg:#fff0f0;--yl:#ffd400;
  --lcd:#c7d3bd;--lcdInk:#18210f;--blue2nd:#3b7ddd;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
button{font-family:inherit}
sup{font-size:.7em;line-height:0}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1180px;margin:0 auto;padding:10px 16px 4px 72px}
h1{font-size:1.3rem;margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.tabs{max-width:1180px;margin:0 auto;padding:6px 16px 0 72px;display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);border-bottom:none;background:#f1f3f7;color:var(--ink);padding:8px 14px;border-radius:10px 10px 0 0;font-weight:700;font-size:.95rem;cursor:pointer;display:flex;align-items:center;gap:7px;min-height:44px}
.tab .tn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#dfe4ec;font-size:.8rem}
.tab.on{background:#fff;box-shadow:0 -3px 0 var(--accent) inset}
.tab.on .tn{background:var(--accent);color:#fff}
.tab.done .tn{background:var(--good);color:#fff}
.tab.locked{color:#9aa3b2;cursor:not-allowed}
.prog{height:5px;background:#e6e9ef}
.pbar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .4s}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.intro h2{margin:0 0 4px;font-size:1.25rem}
.intro p{margin:0 0 10px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.hwrap,.tabs{padding-left:64px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 6px rgba(20,30,50,.05);min-width:0}
.calccol{position:sticky;top:130px}
@media (max-width:900px){.calccol{position:static}}
.calchint{display:none;max-width:330px;margin:8px auto 0;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:.92rem;min-height:20px}
.calchint:empty{display:none!important}
.calchint .x{color:var(--bad);font-weight:900}
@media (max-width:900px){.calchint{display:block}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.btn{border:1px solid #c9d0db;background:#fff;color:var(--ink);border-radius:9px;padding:9px 14px;font-weight:700;font-size:.95rem;cursor:pointer;min-height:44px}
.btn:hover{background:#f4f6fa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:#f0a8a8;color:#b42323;background:#fff6f6}
.btn.sm{padding:6px 10px;min-height:40px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tab:focus-visible,.opt:focus-visible,.dot:focus-visible,.mtab:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.ptitle{font-weight:800;font-size:1.05rem;margin:12px 0 2px}
.ptext{margin:0 0 10px}
.lbl{font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px}
.muted{color:var(--muted)}
.tiny{font-size:.82rem;color:var(--muted);margin-top:4px}
/* stages */
.stages{display:grid;gap:8px}
.sl{font-weight:800;font-size:.92rem;margin:6px 0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sl .muted{font-weight:600;font-size:.82rem}
.sn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:.78rem;flex:none}
.arrow{color:var(--muted);font-weight:800;text-align:center;line-height:1}
/* rules box */
details.rules{background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 14px;padding:4px 14px}
details.rules summary{cursor:pointer;font-weight:800;padding:8px 0;min-height:36px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;font-size:.88rem}
@media (max-width:900px){.rgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.rgrid{grid-template-columns:1fr}}
.rc{background:#f6f8fb;border-radius:8px;padding:6px 8px}
.rc.warn{background:#fff4e6}
.rl{font-weight:800;font-size:.8rem;color:var(--muted)}
.code{font-family:ui-monospace,Consolas,"Courier New",monospace;font-weight:700;background:#eef1f6;border-radius:5px;padding:0 5px;white-space:nowrap}
/* DA grid */
.da{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;font-size:1.05rem}
.da.simp{background:#fffdf3;border-color:#f1e3a6}
.frac{display:inline-flex;flex-direction:column;align-items:center;text-align:center}
.frac .bar{height:2px;background:var(--ink);align-self:stretch;margin:3px 0}
.frac .t,.frac .b{padding:2px 6px;border-radius:6px;white-space:nowrap;transition:background .2s}
.sfrac .t,.sfrac .b{white-space:normal}
.simp .num{padding:1px 4px;border-radius:5px;transition:background .2s}
.da .on{background:#fff3bf;box-shadow:0 0 0 2px var(--yl)}
.num{font-weight:800}
.u.x{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px;color:var(--muted)}
.times,.eq{font-size:1.2rem;color:var(--muted);font-weight:800}
.op{color:var(--muted);font-weight:800}
.q{font-weight:800;color:var(--accent)}
.eqn{display:inline-block;background:#eef4ff;border-radius:6px;padding:1px 8px;font-weight:700}
/* method tabs */
.mtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 2px}
@media (max-width:520px){.mtabs{grid-template-columns:1fr}}
.mtab{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;min-height:48px;font-weight:800;font-size:.95rem;color:var(--ink)}
.mtab small{display:block;font-weight:600;color:var(--muted);font-size:.8rem;margin-top:2px}
.mtab.on{border-color:var(--accent);background:#eef4ff}
.mtab .ck{color:var(--good);float:right}
.mnote{font-size:.88rem;color:var(--muted);margin:6px 0 0}
/* chips */
.chiprow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start}
.chiprow.flat{gap:4px 4px}
.cg{display:inline-flex;flex-direction:column;align-items:flex-start}
.cgk{display:flex;gap:4px;padding-bottom:5px;border-bottom:4px solid var(--c);flex-wrap:wrap}
.cgl{font-size:.75rem;font-weight:800;color:var(--c);margin-top:2px;white-space:nowrap}
.chip{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:34px;height:40px;padding:0 6px;border-radius:7px;font-weight:700;font-size:.95rem;box-shadow:0 2px 0 rgba(0,0,0,.35);margin-top:14px;line-height:1}
.chiprow.flat .chip{margin-top:0;height:36px;min-width:30px;font-size:.88rem}
.chip i{position:absolute;top:-15px;left:0;right:0;text-align:center;font-style:normal;font-size:.68rem;color:var(--muted);font-weight:700}
.chip b.alt{font-size:.6rem;color:#9cc6ff;height:9px;line-height:9px;margin-bottom:2px}
.chip.knum b.alt{color:#2563c9}
.chip.cur{outline:3px solid var(--yl);outline-offset:2px;box-shadow:0 0 12px 3px rgba(255,212,0,.8)}
.chip.done{opacity:.55}
.chip.done::after{content:"✓";position:absolute;bottom:-3px;right:-3px;background:var(--good);color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;display:grid;place-items:center}
.chip.diff{outline:3px solid var(--bad);outline-offset:2px;border-radius:50%}
.chip.sm{height:30px;min-width:26px;font-size:.82rem;margin:0 1px;vertical-align:middle;display:inline-flex;padding:0 5px}
.caption{min-height:48px;margin-top:12px;padding:10px 12px;border-radius:10px;background:#f6f8fb;border-left:4px solid var(--accent)}
.caption.bad{background:var(--badbg);border-left-color:var(--bad)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.spd{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:6px}
.spd select{min-height:40px;border-radius:8px;border:1px solid #c9d0db;padding:0 8px;font-size:.95rem}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid #c9d0db;background:#fff;font-weight:800;cursor:pointer}
.dot.on{border-color:var(--accent);color:var(--accent)}
.dot.half{background:linear-gradient(90deg,#b2f2bb 50%,#fff 50%)}
.dot.ok{background:var(--good);border-color:var(--good);color:#fff}
.mistake-lbl{color:var(--bad)}
.banner{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--goodbg);border:1px solid #b2f2bb;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.hint{min-height:28px;margin-top:10px;font-size:1rem}
.hint .x{color:var(--bad);font-weight:900}
.yl{background:#fff3bf;box-shadow:0 0 0 2px var(--yl);border-radius:4px;padding:0 4px}
.lvl{display:inline-block;font-size:.75rem;font-weight:800;border-radius:20px;padding:2px 9px;background:#eef1f6;color:var(--muted)}
.lvl.l1{background:#ebfbee;color:#2b8a3e}.lvl.l2{background:#fff4e6;color:#c2410c}.lvl.l3{background:#fff0f6;color:#a61e4d}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px}
.fb.good{background:var(--goodbg);border:1px solid #b2f2bb}
.fb.bad{background:var(--badbg);border:1px solid #ffc9c9}
.cmp{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.cmpbox{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.cmpbox.good{border-color:#8ce99a}
.cmpbox .lbl{margin-top:0}
.cmpbox.good .lbl{color:var(--good)}
.shows{margin-top:8px;font-size:.95rem}
.streak{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;color:var(--muted)}
.sd{width:16px;height:16px;border-radius:50%;border:2px solid var(--good);display:inline-block}
.sd.on{background:var(--good)}
.ansrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:14px;font-weight:700}
.ansrow input{font-size:1.1rem;padding:8px 10px;border:2px solid #c9d0db;border-radius:8px;min-height:44px}
.ansrow .ain{width:150px}
.ansrow .ein{width:68px;font-size:.95rem;padding:6px 8px;min-height:38px}
.ansrow .x10{font-size:1.1rem}
.expwrap{position:relative;top:-12px}
.unit{color:var(--muted)}
.mlcd{display:inline-block;background:var(--lcd);color:var(--lcdInk);font-family:ui-monospace,Consolas,"Courier New",monospace;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap}
.mlcd sup{font-size:.7em;margin-left:2px;position:relative;top:-.2em}
.mlcd.err{color:#8a1010}
.qprompt{font-weight:800;margin:12px 0 8px;font-size:1.05rem}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:520px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px;cursor:pointer;min-height:48px}
.opt:hover{border-color:#9fb6e0}
.opt .ol{flex:none;width:28px;height:28px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;font-weight:800}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.foot{max-width:1180px;margin:10px auto 30px;padding:0 16px;text-align:right}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;min-height:36px}
.kbd{font-size:.78rem;color:var(--muted);text-align:center;margin-top:8px}
/* calculator */
.calc{background:linear-gradient(160deg,#3a4150 0%,#262b34 55%,#1e222a 100%);border-radius:18px 18px 34px 34px;padding:12px 12px 18px;width:100%;max-width:330px;margin:0 auto;box-shadow:0 10px 22px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.15),inset 0 0 0 2px #4b5464;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.brand{color:#cfd5de;font-size:.66rem;letter-spacing:.16em;display:flex;justify-content:space-between;align-items:center;margin:0 6px 7px;font-weight:800}
.solar{width:92px;height:16px;border-radius:3px;background:repeating-linear-gradient(90deg,#3d2a2a 0 22px,#1c1414 22px 23px);box-shadow:inset 0 0 0 1px #000}
.lcd{background:var(--lcd);border-radius:6px;padding:4px 10px 6px;height:88px;box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 0 0 3px #11151b;font-family:ui-monospace,Consolas,"Courier New",monospace;color:var(--lcdInk);position:relative;overflow:hidden;margin:0 4px 12px}
.lcd .ind{font-size:.65rem;font-weight:800;height:13px;letter-spacing:.05em}
.lcd .entry{display:flex;white-space:nowrap;overflow:hidden;font-size:1.05rem;height:26px;align-items:center}
.lcd .entry.ovf{justify-content:flex-end}
.lcd .res{text-align:right;font-size:1.55rem;font-weight:700;height:40px;line-height:46px;white-space:nowrap;overflow:hidden}
.lcd .res sup{font-size:.95rem;position:relative;top:-.15em;margin-left:3px;vertical-align:super}
.lcd .res.err{font-size:1.15rem;color:#7a0d0d;line-height:40px}
.lcd .cur{animation:blink 1s steps(1) infinite}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:1px 7px;align-items:end}
.kc{display:flex;flex-direction:column}
.kc .alt{color:#7fb6ff;font-size:.56rem;font-weight:800;text-align:center;height:12px;line-height:12px;white-space:nowrap;overflow:visible;letter-spacing:-.01em}
.key{height:31px;border-radius:12px/10px;border:0;font-weight:700;font-size:.78rem;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.55);transition:transform .06s,filter .06s;padding:0;-webkit-tap-highlight-color:transparent;width:100%}
.key small{font-size:.6em}
.key.ksm{font-size:.6rem;letter-spacing:-.02em}
.key.press{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.55);filter:brightness(1.3)}
.knum{background:#e9ecf1;color:#1c2333;font-size:1.15rem;height:38px;border-radius:9px}
.kfn{background:#515a68;color:#fff}
.kop{background:#e9ecf1;color:#1c2333;font-size:1.25rem;height:38px;border-radius:9px}
.k2nd{background:var(--blue2nd);color:#fff}
.kenter{background:#e9ecf1;color:#1c2333;height:38px;border-radius:9px;font-size:.72rem;letter-spacing:.03em}
.kdead{filter:saturate(.7)}
.pad{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;align-self:center;justify-self:center;width:96px;height:72px;background:#151920;border-radius:50%;padding:4px;gap:1px;box-shadow:inset 0 0 0 2px #3c4452}
.karrow{background:#3c4452;color:#cfd5de;height:auto;font-size:.6rem;border-radius:6px;box-shadow:none}
.key.next{box-shadow:0 0 0 4px var(--yl),0 0 18px 7px rgba(255,212,0,.8);animation:pulse 1s ease-in-out infinite;position:relative;z-index:2}
.key.bad{background:var(--bad)!important;color:#fff!important}
.calc.shake{animation:shake .35s}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--yl),0 0 26px 10px rgba(255,212,0,.95)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* score card */
.scorecard{border:2px solid var(--ink);border-radius:14px;padding:18px;background:#fff}
.sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sc-act{font-size:1.3rem;font-weight:900}
.sc-site{color:var(--muted);font-size:.85rem}
.sc-score{text-align:right}
.sc-score b{font-size:2.2rem;display:block;line-height:1}
.sc-score span{font-weight:800;color:var(--muted)}
.sc-name{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-weight:800;flex-wrap:wrap}
.sc-name input{font-size:1.05rem;padding:8px 10px;border:2px solid #c9d0db;border-radius:8px;min-width:220px;min-height:44px}
.sc-tab{width:100%;border-collapse:collapse;margin:12px 0;font-size:.9rem}
.sc-tab th,.sc-tab td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.sc-tab th{background:#f3f5f9}
.okm{color:var(--good);font-weight:900}.nom{color:var(--bad);font-weight:900}
/* progress badge */
.hright{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.pp{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.85rem;color:var(--muted)}
.pp b{color:var(--ink);font-size:.95rem}
.pp .sm{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pbar2{display:block;width:100%;max-width:260px;height:10px;background:#e6e9ef;border-radius:6px;overflow:hidden}
.pbar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good))}
.pp.full{background:var(--good);color:#fff;padding:8px 16px;border-radius:14px;box-shadow:0 3px 10px rgba(43,138,62,.35);align-items:center}
.pp.full .big{font-size:1.25rem;font-weight:900;letter-spacing:.02em}
.pp.full .sm{color:#e6fcf5}
@media (max-width:640px){.hright{width:100%}.pbar2{max-width:none}}
/* topic slider, try box, phases */
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.modesw{display:inline-flex;background:#e9edf3;border-radius:999px;padding:4px;gap:4px}
.modesw button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-weight:800;font-size:.92rem;cursor:pointer;color:var(--muted);min-height:44px;line-height:1.15;transition:background .2s,color .2s}
.modesw button small{display:block;font-weight:600;font-size:.7rem}
.modesw button.on{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(31,111,235,.35)}
.modesw button:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.trybox{max-width:330px;margin:10px auto 0;padding:10px 12px;border-radius:12px;background:#fff;border:2px dashed #9fb6e0}
.trybox .tt{font-weight:800;margin-bottom:2px}
.trybox.got{border-style:solid;border-color:var(--good);background:var(--goodbg)}
.trybox .mlcd{font-size:1.15rem}
.phases{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap;align-items:center}
.ph{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer;min-height:42px;font-size:.95rem;color:var(--ink)}
.ph.on{border-color:var(--accent);background:#eef4ff;color:var(--accent)}
.ph.locked{color:#9aa3b2;cursor:not-allowed}
.ph.done::after{content:" ✓";color:var(--good)}
.dot:disabled{opacity:.4;cursor:not-allowed}
@media (max-height:860px){header.top{position:static}.calccol{top:8px}}
@media (max-height:760px){.knum,.kop,.kenter{height:34px}.key{height:29px}.lcd{height:80px}.lcd .res{height:36px;line-height:42px}.kbd{display:none}}
@media (max-width:640px){
  .modesw{width:100%}.modesw button{flex:1;padding:6px 8px;font-size:.85rem}
  header.top{position:static}
  .sub{display:none}
  h1{font-size:1.1rem}
  .tabs{flex-wrap:nowrap;overflow-x:auto;gap:4px;padding-right:8px;-webkit-overflow-scrolling:touch}
  .tab{padding:6px 10px;font-size:.85rem;white-space:nowrap;flex:none}
  .wrap{padding:12px 10px}

function tokFor(l){
  if(/^[0-9.]$/.test(l)) return {t:'d',v:l};

    case 'EE':return {t:'EE'};case 'neg':return {t:'neg'};

}
function dispTok(t){
  switch(t.t){
    case 'd':return t.v;case 'EE':return 'E';case 'neg':return '⁻';

    case 'lp':return '(';case 'rp':return ')';case 'ans':return 'Ans';

/* ---------- lexer + parser (TI-style order of operations) ---------- */
function lex(toks){
  const out=[];let i=0;
  while(i<toks.length){
    const t=toks[i];
    if(t.t==='d'){
      let s='';
      while(i<toks.length&&toks[i].t==='d'){s+=toks[i].v;i++;}
      if(s==='.'||(s.match(/\./g)||[]).length>1) throw 'SYN ERROR';
      let e=0,hasE=false;
      if(i<toks.length&&toks[i].t==='EE'){
        hasE=true;i++;let sign='';
        if(i<toks.length&&toks[i].t==='neg'){sign='-';i++;}
        let es='';
        while(i<toks.length&&toks[i].t==='d'){if(toks[i].v==='.') throw 'SYN ERROR';es+=toks[i].v;i++;}
        if(!es) throw 'SYN ERROR';
        e=sign+es;
      }
      out.push({k:'num',v:Number(s+(hasE?'e'+e:''))});
      continue;
    }
    if(t.t==='EE') throw 'SYN ERROR';
    if(t.t==='op') out.push({k:'op',v:t.v});
    else if(t.t==='fn') out.push({k:'fn',v:t.v});
    else out.push({k:t.t});
    i++;
  }
  return out;
}
function evaluate(tokens,ans){
  let L;
  try{L=lex(tokens);}catch(e){return {err:'SYN ERROR'};}
  let p=0;
  const peek=()=>L[p],next=()=>L[p++];
  const E=c=>{throw c;};
  const chk=v=>{if(!isFinite(v)||Math.abs(v)>=1e100) E('OVERFLOW');return v;};
  function expr(){let v=term();while(peek()&&peek().k==='op'&&(peek().v==='+'||peek().v==='-')){const o=next().v;const r=term();v=chk(o==='+'?v+r:v-r);}return v;}
  function term(){
    let v=unary();
    for(;;){
      const t=peek();if(!t) break;
      if(t.k==='op'&&(t.v==='*'||t.v==='/')){next();const r=unary();if(t.v==='/'){if(r===0) E('DIVIDE BY 0');v=chk(v/r);}else v=chk(v*r);}
      else if(t.k==='num'||t.k==='lp'||t.k==='fn'||t.k==='ans'){const r=unary();v=chk(v*r);}
      else break;
    }
    return v;
  }
  function unary(){const t=peek();if(t&&t.k==='neg'){next();return -unary();}return power();}
  function power(){
    const b=postfix();const t=peek();
    if(t&&t.k==='pow'){next();const x=unary();if(b===0&&x<0) E('DIVIDE BY 0');if(b<0&&!Number.isInteger(x)) E('DOMAIN ERROR');return chk(Math.pow(b,x));}
    return b;
  }
  function postfix(){
    let v=primary();
    for(;;){const t=peek();
      if(t&&t.k==='sq'){next();v=chk(v*v);}
      else if(t&&t.k==='inv'){next();if(v===0) E('DIVIDE BY 0');v=chk(1/v);}
      else break;}
    return v;
  }
  function closeP(){const t=peek();if(!t) return;if(t.k==='rp'){next();return;}E('SYN ERROR');}
  function primary(){
    const t=next();if(!t) E('SYN ERROR');
    if(t.k==='num') return t.v;
    if(t.k==='ans') return ans;
    if(t.k==='lp'){const v=expr();closeP();return v;}
    if(t.k==='fn'){const v=expr();closeP();

      if(t.v==='ln'){if(v<=0) E('DOMAIN ERROR');return Math.log(v);}
      if(t.v==='tenx') return chk(Math.pow(10,v));
      return chk(Math.exp(v));}

  }
  try{
    const v=expr();
    if(p<L.length) E('SYN ERROR');
    return {v:chk(v)};
  }catch(e){return {err:typeof e==='string'?e:'SYN ERROR'};}
}

/* ---------- calculator state machine ---------- */
class CalcCore{
  constructor(){this.reset();}
  reset(){this.tokens=[];this.shift=false;this.result=null;this.lastResult=null;this.justEval=false;this.ans=0;this.units=[];this.tape=[];}
  press(id){
    this.tape.push(id);
    if(id==='2nd'){this.shift=!this.shift;return;}
    if(KEYDEF[id]&&KEYDEF[id].dead){this.shift=false;return;}
    let l=id,phys=[id];
    if(this.shift){this.shift=false;if(SHIFT_MAP[id]){l=SHIFT_MAP[id];phys=['2nd',id];}}
    if(this.result&&this.result.err){
      this.result=null;this.tokens=[];this.justEval=false;
      if(l==='clear'){this.units=[];return;}
      if(l==='del') return;
    }
    if(l==='clear'){this.tokens=[];this.result=null;this.justEval=false;this.units=[];return;}
    if(l==='del'){if(this.justEval) return;const tk=this.tokens.pop();if(tk&&tk.ph) this.units.pop();return;}
    if(l==='enter'){
      if(!this.tokens.length) return;
      this.units.push(['enter']);
      const r=evaluate(this.tokens,this.ans);
      this.result=r;this.lastResult=r;
      if(r.v!==undefined){this.ans=r.v;this.justEval=true;}
      return;
    }
    if(this.justEval){this.justEval=false;this.tokens=OPS_CONT.includes(l)?[{t:'ans'}]:[];this.result=null;}
    else if(!this.tokens.length&&OPS_CONT.includes(l)) this.tokens=[{t:'ans'}];
    const tk=tokFor(l);tk.ph=phys;
    this.tokens.push(tk);this.units.push(phys);
  }
}
function runKeys(keys){const c=new CalcCore();keys.forEach(k=>c.press(k));return c.lastResult||{err:'NO RESULT'};}

/* ---------- number formatting ---------- */
function strip0(s){if(s.indexOf('.')<0) return s;s=s.replace(/0+$/,'');return s.replace(/\.$/,'');}
function fmtNum(v){
  if(v===0) return {m:'0',e:null};

  if(a>=1e10||a<1e-9){const parts=v.toExponential(9).split('e');return {m:strip0(parts[0]),e:parseInt(parts[1],10)};}
  const intD=a>=1?Math.floor(Math.log10(a))+1:1;
  const dec=Math.min(9,Math.max(0,10-intD));
  return {m:strip0(v.toFixed(dec)),e:null};
}
function expStr(e){return e<0?'−'+(-e):String(e);}
function lcdKey(r){if(r.err) return r.err;const f=fmtNum(r.v);return f.m+'e'+f.e;}
function lcdHTML(r){
  if(!r) return '<span class="mlcd">&nbsp;</span>';
  if(r.err) return `<span class="mlcd err">${r.err}</span>`;
  const f=fmtNum(r.v);
  return `<span class="mlcd">${f.m}${f.e!==null?`<sup>${expStr(f.e)}</sup>`:''}</span>`;
}
function readHTML(v){const f=fmtNum(v);return f.e!==null?`${f.m} × 10<sup>${expStr(f.e)}</sup>`:f.m;}
function prettySig(v,sig){
  sig=sig||3;if(v===0) return '0';
  const a=Math.abs(v);
  if(a>=1e4||a<1e-3){const parts=v.toExponential(sig-1).split('e');return `${parts[0]} × 10<sup>${expStr(parseInt(parts[1],10))}</sup>`;}
  let s=v.toPrecision(sig);
  if(s.indexOf('e')>=0){const parts=s.split('e');return `${parts[0]} × 10<sup>${expStr(parseInt(parts[1],10))}</sup>`;}
  return s;
}
function close(a,b,tol){if(a===null||a===undefined||b===null||b===undefined||isNaN(a)) return false;if(b===0) return Math.abs(a)<=tol;return Math.abs(a-b)<=tol*Math.abs(b);}

/* ---------- problem model: Work → Simplify → Calculator ---------- */
const COLORS=['#e8590c','#1c7ed6','#2b8a3e','#ae3ec9','#c92a2a','#0b7285','#5f3dc4','#a86100'];
const GRAY='#868e96';
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function nice3(){const n=rnd(100,999);return Math.random()<.5?(n/100).toFixed(2):(n/10).toFixed(1);}
function niceMol(){const n=rnd(100,999);return Math.random()<.5?(n/1000).toFixed(3):(n/100).toFixed(2);}
function sciN(lo,hi){let e;do{e=rnd(lo,hi);}while(Math.abs(e)<2);return {m:(rnd(101,999)/100).toFixed(2),e:e};}
function sciHTML(m,e){return `${m} × 10<sup>${expStr(e)}</sup>`;}
function numHTML(t){return t.e!==null&&t.e!==undefined?sciHTML(t.m,t.e):t.m;}
function numTxt(t){return t.e!==null&&t.e!==undefined?`${t.m}×10^${t.e}`:t.m;}
const I=(m,u,c,e)=>({m:m,u:u||'',c:!!c,e:(e===undefined?null:e)});
const C=(top,bottom)=>({top:top,bottom:bottom||null});
const G=(m,u,e)=>C(I(m,u,1,e),I('1','',0));   // given written as "amount / 1"
const AVO='6.02';

function numKeys(m,e,mode){
  const k=m.split('');
  if(e===null||e===undefined) return k;
  const ek=String(Math.abs(e)).split('');
  const ng=e<0;
  switch(mode){
    case 'x10':return k.concat(['mul','1','0','pow'],ng?['neg']:[],ek);
    case 'tenEE':return k.concat(['mul','1','0','2nd','inv'],ng?['neg']:[],ek);
    case 'minus':return k.concat(['2nd','inv'],ng?['sub']:[],ek);
    case 'econ':return k.concat(['mul','2nd','ln'],ng?['neg']:[],ek,['rp']);
    default:return k.concat(['2nd','inv'],ng?['neg']:[],ek);
  }
}
/* captions shown while a key is pressed (Show Me) */
function capKey(k,j,g,t,ctx){
  const nh=t?numHTML(t):'',u=t&&t.u?' '+t.u:'';
  if(k==='2nd'){if(g[j+1]==='ln') return '<b>2nd → LN = eˣ</b>. Uh-oh: eˣ is e (2.718…) to a power, not × 10.';return '<b>2nd</b>: use the blue function printed above the next key.';}
  if(k==='inv'&&g[j-1]==='2nd') return '<b>2nd → x⁻¹ = EE</b>. EE means “× 10 to the…”, so do NOT type × 10.';
  if(k==='ln'&&g[j-1]==='2nd') return '<b>eˣ</b> is e (2.718…) raised to a power. That is NOT × 10.';
  if(k==='neg') return '<b>(−)</b> makes the exponent negative. Use (−), not the minus key.';
  if(k==='sub') return '<b>−</b> is the MINUS key (subtract), not (−) for a negative number.';
  if(k==='pow') return '<b>^</b> raises only the 10 to a power, not the whole number!';
  if(ctx.method==='A'){
    if(k==='lp'&&ctx.role==='top') return '<b>(</b> Open parentheses. Everything on <b>top</b> goes inside.';
    if(k==='lp') return '<b>(</b> Open parentheses for the <b>bottom</b> numbers.';
    if(k==='rp'&&ctx.role==='bot'&&j===0) return '<b>)</b> Close the top. All the top numbers are in.';
    if(k==='rp'&&ctx.role==='close') return ctx.noBottom?'<b>)</b> Close the parentheses. Nothing on the bottom to divide by.':'<b>)</b> Close the bottom. Now the calculator divides by the <b>whole bottom</b> at once.';
    if(k==='div'&&ctx.role==='bot'&&ctx.first) return ctx.wrong&&!ctx.paren?'<b>÷</b> (no parentheses on the bottom…)':'<b>÷</b> Divide by the <b>whole bottom</b>.';
    if(k==='mul'&&ctx.role==='bot') return ctx.wrong?'<b>×</b> '+nh:'<b>×</b> Bottom numbers multiply together inside the parentheses.';
    if(k==='div'&&ctx.role==='bot') return '<b>÷</b> '+nh+' (inside the bottom parentheses…)';
    if(k==='mul'&&ctx.role==='top') return `<b>×</b> ${nh}${u} is on top, so multiply.`;
  }else{
    if(j===0&&(k==='mul'||k==='div')){
      if(ctx.wrong) return `<b>${k==='mul'?'×':'÷'}</b> ${nh}${u}`;
      return k==='mul'?`<b>×</b> ${nh}${u} is on <b>top</b>, so multiply.`:`<b>÷</b> ${nh}${u} is on the <b>bottom</b>, so divide. Divide by <b>each</b> bottom number.`;
    }
  }
  if(ctx.role==='top'&&ctx.first) return `Start with the given: <b>${nh}${u}</b>.`;
  if(ctx.role==='bot') return `Type the bottom number <b>${nh}</b>.`;
  return `Type <b>${nh}</b>.`;
}
function buildKeys(p,method,mods){
  mods=mods||{};
  const keys=[],groups=[],meta=[];
  const wrong=!!mods.any;
  const tm=t=>(mods.t&&mods.t[t.ti])||{};
  const nk=t=>numKeys(t.m,t.e,tm(t).num);
  const add=(gk,color,label,t,ctx)=>{
    const gi=groups.length;
    groups.push({keys:gk,color:color,label:label,ti:t?t.ti:null});
    ctx.method=method;ctx.wrong=wrong;
    gk.forEach((k,j)=>{keys.push(k);meta.push({g:gi,ti:t?t.ti:null,role:ctx.role,cap:capKey(k,j,gk,t,ctx)});});
  };
  if(method==='B'){
    p.tops.forEach((t,i)=>{
      let op=i===0?null:'mul';
      if(op&&tm(t).flip) op='div';
      const gk=op?[op].concat(nk(t)):nk(t);
      add(gk,t.color,i===0?'start':(op==='mul'?'× ':'÷ ')+numHTML(t),t,{role:'top',first:i===0});
    });
    p.bots.forEach((t,i)=>{
      let op='div';
      if(tm(t).flip) op='mul';
      if(mods.divOnce&&i>0) op='mul';
      add([op].concat(nk(t)),t.color,(op==='mul'?'× ':'÷ ')+numHTML(t),t,{role:'bot',first:i===0});
    });
  }else{
    p.tops.forEach((t,i)=>{
      let op='mul';if(tm(t).flip) op='div';
      const gk=i===0?['lp'].concat(nk(t)):[op].concat(nk(t));
      add(gk,t.color,(i===0?'( ':(op==='mul'?'× ':'÷ '))+numHTML(t),t,{role:'top',first:i===0});
    });
    if(p.bots.length){
      p.bots.forEach((t,i)=>{
        let gk;
        if(i===0) gk=mods.noParen?['rp','div'].concat(nk(t)):['rp','div','lp'].concat(nk(t));
        else gk=[mods.divInside?'div':'mul'].concat(nk(t));
        const lab=i===0?(mods.noParen?') ÷ ':') ÷ ( ')+numHTML(t):(gk[0]==='div'?'÷ ':'× ')+numHTML(t);
        add(gk,t.color,lab,t,{role:'bot',first:i===0,paren:!mods.noParen});
      });
      if(!mods.noParen) add(['rp'],GRAY,')',null,{role:'close'});
    }else add(['rp'],GRAY,')',null,{role:'close',noBottom:true});

  add(['enter'],GRAY,'=',null,{role:'enter'});

}
const PRIORITY=['divOnce','noParen','divInside','ratio','flipCol','x10','tenEE','econ','flipB','flipT','minus'];
function botList(p,sep){return p.bots.map(numHTML).join(sep);}
function fbFor(w,p){
  const t=w.ti!==undefined?p.terms[w.ti]:null;
  const nh=t?numHTML(t):'',u=t&&t.u?' '+t.u:'';
  switch(w.kind){
    case 'divOnce':return `<b>You pressed ÷ only once.</b> There are ${p.bots.length} numbers on the bottom (${botList(p,', ')}), so the calculator divided by the first one and then <b>multiplied</b> by the rest. Fix it either way:<br>• Method B: divide by <b>each</b> one: ÷ ${botList(p,' ÷ ')}<br>• Method A: put the whole bottom in parentheses: ÷ ( ${botList(p,' × ')} )`;
    case 'noParen':return `<b>The bottom needs parentheses too.</b> Without them, the calculator divides by ${numHTML(p.bots[0])} only and then <b>multiplies</b> by the rest. Type <b>) ÷ ( ${botList(p,' × ')} )</b>.`;
    case 'divInside':return `<b>Inside the bottom parentheses, multiply.</b> Bottom numbers multiply together: ( ${botList(p,' × ')} ), not ( ${botList(p,' ÷ ')} ).`;
    case 'x10':return `<b>The “× 10 ^” trap.</b> You typed × 10 ^ for ${nh}. Because it is on the bottom, the calculator divides by only ${t.m} and then <b>multiplies</b> by 10<sup>${expStr(t.e)}</sup>. Use <b>2nd → x⁻¹ (EE)</b>, which keeps the whole number together (or use Method A's parentheses).`;
    case 'tenEE':return `<b>Extra “× 10”.</b> EE already means “× 10 to the…”, so don't type × 10 before it. Type <b>${t.m} EE ${t.e}</b>, not ${t.m} × 10 EE ${t.e}.`;
    case 'minus':return `<b>SYN ERROR.</b> For a negative exponent use the <b>(−)</b> key (bottom row), not the minus key <b>−</b>.`;
    case 'econ':return `<b>eˣ is not EE.</b> eˣ means e (2.718…) to a power. For × 10ⁿ use <b>2nd → x⁻¹ (EE)</b>.`;
    case 'flipB':return `<b>${nh}${u}</b> is on the <b>bottom</b>, so divide (÷) by it. Don't multiply.`;
    case 'flipT':return `<b>${nh}${u}</b> is on <b>top</b>, so multiply (×) by it. Don't divide.`;
    case 'ratio':return `<b>Mole ratio upside down.</b> Moles you WANT go on top and moles you HAVE go on the bottom. Get the numbers from the coefficients in the balanced equation.`;
    case 'flipCol':{const col=p.cols[w.col];return `<b>A conversion factor got flipped.</b> Look at ${numHTML(col.top)} ${col.top.u} / ${numHTML(col.bottom)} ${col.bottom.u}. The top number multiplies and the bottom number divides.`;}
  }
  return 'Compare your keys to the correct order.';
}
function buildWrongs(p){
  const T=p.terms,W=[];
  if(p.bots.length>=2){
    W.push({kind:'divOnce',method:'B',mods:{divOnce:true}});
    W.push({kind:'noParen',method:'A',mods:{noParen:true}});
    W.push({kind:'divInside',method:'A',mods:{divInside:true}});
  }
  p.cols.forEach((col,k)=>{
    if(k===0) return;
    const ids=T.filter(t=>t.col===k).map(t=>t.ti);
    if(!ids.length) return;
    const tmods={};ids.forEach(i=>tmods[i]={flip:true});
    if(p.ratioCol===k) W.push({kind:'ratio',method:'B',ti:ids[0],col:k,mods:{t:tmods}});
    else if(ids.length===2) W.push({kind:'flipCol',method:'B',ti:ids[0],col:k,mods:{t:tmods}});
  });
  T.forEach(t=>{
    const i=t.ti;
    if(t.e!==null){
      if(t.pos==='bottom') W.push({kind:'x10',method:'B',ti:i,mods:{t:{[i]:{num:'x10'}}}});
      W.push({kind:'tenEE',method:'B',ti:i,mods:{t:{[i]:{num:'tenEE'}}}});
      if(t.e<0) W.push({kind:'minus',method:'B',ti:i,mods:{t:{[i]:{num:'minus'}}}});
      if(t.pos==='top') W.push({kind:'econ',method:'B',ti:i,mods:{t:{[i]:{num:'econ'}}}});
    }
    if(t.pos==='bottom') W.push({kind:'flipB',method:'B',ti:i,mods:{t:{[i]:{flip:true}}}});
    if(t.pos==='top'&&t!==p.tops[0]) W.push({kind:'flipT',method:'B',ti:i,mods:{t:{[i]:{flip:true}}}});
  });
  const seen=new Set([p.A.keys.join(','),p.B.keys.join(',')]),out=[];
  W.forEach(w=>{
    w.mods.any=true;
    const b=buildKeys(p,w.method,w.mods);
    const s=b.keys.join(',');
    if(seen.has(s)) return;
    const r=runKeys(b.keys);
    if(r.v!==undefined&&close(r.v,p.answer,1e-9)) return;
    seen.add(s);
    w.K=b;w.keys=b.keys;w.r=r;w.v=r.v;w.err=r.err;
    w.fb=fbFor(w,p);
    out.push(w);
  });
  out.sort((a,b)=>PRIORITY.indexOf(a.kind)-PRIORITY.indexOf(b.kind));
  return out;
}
function makeProblem(spec){
  const p=Object.assign({},spec);
  let ci=0;const terms=[];
  p.cols.forEach((col,k)=>['top','bottom'].forEach(pos=>{
    const it=col[pos];if(!it) return;
    it.pos=pos;it.col=k;
    if(it.m==='1'&&it.e===null&&!(k===0&&pos==='top')){it.skip=true;it.color=GRAY;return;}
    it.color=COLORS[ci++%COLORS.length];it.ti=terms.length;terms.push(it);
  }));
  p.terms=terms;
  p.tops=terms.filter(t=>t.pos==='top');
  p.bots=terms.filter(t=>t.pos==='bottom');
  p.A=buildKeys(p,'A');p.B=buildKeys(p,'B');
  p.answer=runKeys(p.B.keys).v;
  p.answerA=runKeys(p.A.keys).v;
  p.wrongs=buildWrongs(p);
  return p;
}
function methodOf(keys){return keys.indexOf('lp')>=0?'A':'B';}
function diagnose(p,typed,calcRes,typedKeys){
  if(close(typed,p.answer,0.01)) return {ok:true};
  const tm=methodOf(typedKeys||[]);
  const calcV=calcRes&&calcRes.v!==undefined?calcRes.v:null;
  if(calcV!==null&&close(calcV,p.answer,1e-6)){
    const f=fmtNum(calcV);
    let msg='<b>Your calculator had the right answer, but it was copied wrong.</b> ';
    if(f.e!==null) msg+=`The display showed ${lcdHTML({v:calcV})}. The small ${expStr(f.e)} at the right is the power of 10, so it means ${f.m} × 10<sup>${expStr(f.e)}</sup>.`;
    else msg+=`The display showed ${lcdHTML({v:calcV})}.`;
    return {ok:false,msg:msg};
  }
  const hits=p.wrongs.filter(w=>!w.err&&(close(typed,w.v,0.006)||(calcV!==null&&close(calcV,w.v,1e-6))));
  if(hits.length){const w=hits.find(h=>h.method===tm)||hits[0];return {ok:false,msg:w.fb,w:w};}
  if(calcRes&&calcRes.err){
    const w=p.wrongs.find(x=>x.kind==='minus');
    if(w&&calcRes.err==='SYN ERROR') return {ok:false,msg:w.fb,w:w};
    return {ok:false,msg:`Your calculator showed <b>${calcRes.err}</b>. Compare your keys with the correct order below. (Check that every ( has a matching ).)`};
  }
  if(typed!==0&&p.answer!==0){
    const r=typed/p.answer;
    if(r>0){
      const lg=Math.log10(r),n=Math.round(lg);
      if(n!==0&&Math.abs(lg-n)<0.0045) return {ok:false,msg:`Your digits are right, but the power of 10 is off by a factor of 10<sup>${Math.abs(n)}</sup> (${n>0?'too big':'too small'}). Check the EE entries and the sign of each exponent.`};
    }else return {ok:false,msg:'Your answer has the wrong sign (+/−). Check the (−) and minus keys.'};
  }
  if(close(typed,p.answer,0.05)) return {ok:false,msg:'<b>Very close!</b> Did you round in the middle or mistype a digit? Keep every digit until the end.'};
  return {ok:false,msg:'Compare the keys you pressed with the correct order below.'};
}

class Player{
  constructor(calc){this.calc=calc;this.speed=1;this.playing=false;this.timer=null;this.o=null;this.onState=null;}
  load(o){this.stopT();this.o=o;this.i=0;this.playing=false;this.calc.reset();this.chips=[...o.chipsEl.querySelectorAll('.chip')];this.paint();this.state();}
  stopT(){clearTimeout(this.timer);this.timer=null;}
  toggle(){this.playing?this.pause():this.play();}
  play(){if(this.i>=this.o.keys.length) this.rewind();this.playing=true;this.state();this.tick();}
  pause(){this.playing=false;this.stopT();this.state();}
  rewind(){this.stopT();this.i=0;this.calc.reset();this.paint();}
  replay(){this.pause();this.rewind();this.play();}
  stepOnce(){this.pause();if(this.i>=this.o.keys.length) this.rewind();this.step();}
  tick(){
    if(!this.playing) return;
    this.step();
    if(this.i<this.o.keys.length) this.timer=setTimeout(()=>this.tick(),900/this.speed);
    else{this.playing=false;this.state();}
  }
  step(){
    const o=this.o;if(this.i>=o.keys.length) return;
    const k=o.keys[this.i];
    this.calc.press(k);this.calc.lit(k);
    o.capEl.innerHTML=o.meta[this.i].cap;
    o.capEl.classList.toggle('bad',!!o.wrong);
    this.i++;this.paint();
    if(this.i>=o.keys.length&&o.onDone) o.onDone();
  }
  paint(){
    const n=this.o.keys.length,i=this.i;
    this.chips.forEach((c,j)=>{c.classList.toggle('cur',j===i-1&&i<n);c.classList.toggle('done',(j<i-1)||(i>=n&&j<n));});
    highlightDA(this.o.daEl,i>0&&i<=n?this.o.meta[i-1].ti:null);
  }
  state(){if(this.onState) this.onState(this.playing);}
}

/* ---- guided runner (yellow ring) ---- */
function guidedHint(p,K,pos,pressed){
  const exp=K.keys[pos],m=K.meta[pos],t=m&&m.ti!==null?p.terms[m.ti]:null;
  const nh=t?numHTML(t):'',prev=K.keys[pos-1],next=K.keys[pos+1];
  if(pressed==='del'||pressed==='clear') return 'No need to erase. Just press the key with the <span class="yl">yellow ring</span>.';
  if(exp==='lp'&&pos===0) return 'Method A starts with <b>(</b>. All the top numbers go inside the parentheses.';
  if(exp==='lp') return 'Open <b>(</b> for the bottom numbers. The whole bottom goes inside.';
  if(exp==='rp'&&next==='div') return 'All the top numbers are in. Close the top with <b>)</b>.';
  if(exp==='rp') return m.role==='close'&&!p.bots.length?'Close the parentheses with <b>)</b>.':'All the bottom numbers are in. Close the bottom with <b>)</b>.';
  if(exp==='div'&&prev==='rp') return pressed==='mul'?'Top is done. Now <b>÷</b> to divide by the whole bottom.':'Now press <b>÷</b> to divide by the whole bottom.';
  if(exp==='mul'&&m.role==='bot'){
    if(pressed==='div') return 'Inside the bottom parentheses, <b>multiply</b> (×) the bottom numbers together.';
    if(pressed==='rp') return `Not yet! ${nh} is also on the bottom. It goes inside the parentheses: press <b>×</b>.`;
    return `Next bottom number: ${nh}. Bottom numbers multiply together inside the parentheses (×).`;
  }
  if(exp==='div'&&pressed==='mul') return `That's ×. ${nh} is on the <b>bottom</b>, so divide (÷). With no parentheses, divide by <b>EACH</b> bottom number.`;
  if(exp==='mul'&&pressed==='div') return `That's ÷. ${nh} is on <b>top</b>, so multiply (×).`;
  if(exp==='2nd'&&next==='inv'){
    if(['mul','pow','1','0'].includes(pressed)) return `Don't type “× 10”. For × 10ⁿ use <b>EE</b>: press <b>2nd</b> first, then <b>x⁻¹</b>.`;
    if(pressed==='inv') return 'Press <b>2nd</b> first. EE is the blue function printed above x⁻¹.';
    return 'Next is <b>EE</b> (“× 10 to the…”). Press <b>2nd</b> first.';
  }
  if(exp==='inv'&&prev==='2nd') return 'Now press <b>x⁻¹</b>. EE is printed above it in blue.';
  if(exp==='neg'&&pressed==='sub') return 'Negative exponents use the <b>(−)</b> key (bottom row), not the minus key.';
  if(exp==='neg') return 'The exponent is negative. Press <b>(−)</b> next.';
  if(exp==='enter') return pressed==='rp'?'The parentheses are already closed. Press <b>ENTER</b>.':'Every number is in. Press <b>ENTER</b>.';
  if(/^[0-9.]$/.test(exp)){
    if(/^[0-9.]$/.test(pressed)) return `Check the number ${nh}. The next key is <b>${exp}</b>.`;
    if(pressed==='mul'||pressed==='div') return `Finish typing ${nh} first.`;
    return `Keep typing ${nh}. Next is <b>${exp}</b>.`;
  }
  if(exp==='mul'||exp==='div') return `Next comes ${nh}. It's on the ${t&&t.pos==='top'?'<b>top</b>, so multiply (×)':'<b>bottom</b>, so divide (÷)'}.`;
  return 'Not that key. Look for the <span class="yl">yellow ring</span>.';
}
function runGuided(calc,p,K,els,onComplete){
  let pos=0;
  calc.reset();
  els.chips.innerHTML=chipsHTML(K.groups);
  const chips=[...els.chips.querySelectorAll('.chip')];
  const setH=h=>{els.hint.innerHTML=h;calc.setHint(h);};
  const upd=()=>{
    chips.forEach((c,i)=>{c.classList.toggle('done',i<pos);c.classList.toggle('cur',i===pos);});
    calc.setNext(pos<K.keys.length?K.keys[pos]:null);
    highlightDA(els.da,pos<K.keys.length?K.meta[pos].ti:null);
  };
  setH('Press the key with the <span class="yl">yellow ring</span> on the calculator.');
  upd();
  calc.guard=id=>{
    if(pos>=K.keys.length) return false;
    if(id===K.keys[pos]){pos++;setH('<span class="muted">Good. Keep going…</span>');return true;}
    calc.bad(id);
    setH('<span class="x">✗</span> '+guidedHint(p,K,pos,id));
    return false;
  };
  calc.after=()=>{
    upd();
    if(pos>=K.keys.length){calc.guard=()=>false;calc.after=null;calc.setHint('<b style="color:var(--good)">✓ Done! See the answer above.</b>');onComplete();}
  };
}
function readingHTML(p,r){
  if(!r||r.err) return '';
  const f=fmtNum(r.v),unit=p.unit?' '+p.unit:'';
  let s=`The display shows ${lcdHTML(r)}`;
  if(f.e!==null) s+=`. The small ${expStr(f.e)} at the right is the power of 10, so the answer is <b>${readHTML(r.v)}${unit}</b> ≈ <b>${prettySig(r.v)}${unit}</b>.`;
  else s+=`, so the answer is <b>${f.m}${unit}</b> ≈ <b>${prettySig(r.v)}${unit}</b>.`;
  return s;
}

function parseAns(ms,es){
  let m=(ms||'').trim().replace(/,/g,'').replace(/[−–]/g,'-').replace(/\s/g,'');
  let e=(es||'').trim().replace(/[−–]/g,'-').replace(/\s/g,'');
  m=m.replace(/[×x*]10\^?/i,'e');
  if(m==='') return null;
  if(e!==''){if(!/^[-+]?\d+$/.test(e)) return null;if(/e/i.test(m)) return null;const v=Number(m+'e'+e);return isNaN(v)?null:v;}
  const v=Number(m);return isNaN(v)?null:v;
}
function typedHTML(ms,es){const m=esc(ms.trim()),e=esc(es.trim().replace(/-/g,'−'));return e?`${m} × 10<sup>${e}</sup>`:m;}
function firstDiff(a,b){let d=0;while(d<a.length&&d<b.length&&a[d]===b[d]) d++;return d;}
function typedKeysOf(core){return [].concat(...core.units);}
function compareHTML(p,core){
  const typed=typedKeysOf(core);
  const M=methodOf(typed),K=p[M];
  const d=firstDiff(typed,K.keys);
  const other=M==='A'?'B':'A';
  return `<div class="cmp">
    <div class="cmpbox"><div class="lbl">You typed</div>${typed.length?flatChips(typed,d<typed.length?d:-1):'<div class="muted">(no keys pressed)</div>'}
      <div class="shows">Your display: ${core.lastResult?lcdHTML(core.lastResult):'<span class="muted">nothing yet (no ENTER)</span>'}</div></div>
    <div class="cmpbox good"><div class="lbl">You should have typed: Method ${METHOD_INFO[M].name}</div>${flatChips(K.keys,typed.length&&d<K.keys.length?d:-1)}
      <div class="shows">Display: ${lcdHTML(runKeys(K.keys))} → <b>${prettySig(p.answer)}</b> ${p.unit}</div>
      <div class="lbl">Or Method ${METHOD_INFO[other].name}</div>${flatChips(p[other].keys)}</div>
  </div>${typed.length&&d<Math.max(typed.length,K.keys.length)?'<div class="tiny">The red circle marks the first key that is different.</div>':''}`;
}

/* =================== sections =================== */

/* ---- 1. Learn: Show Me → Your Turn, one example at a time ---- */
let LS={idx:0,phase:'show',method:'A',gm:null,sets:[],turnP:null},player=null;
function watched(i,m){return S.watched.indexOf(i+m)>=0;}

function initLearn(){

function renderLearn(){if(LS.phase==='show') renderLearnShow();else renderLearnTurn();}

function renderLearnShow(){
  const p=LS.sets[LS.idx].show,calc=CALCS.learn;

let showMode='right';
function mistakeFor(p,method){
  const order=method==='A'?['noParen','divInside','x10','minus','tenEE','ratio','flipB']:['divOnce','x10','minus','tenEE','ratio','flipB'];

/* ---- 2. On Your Own ---- */
let ownP=null,ownLastGen=null;
function genOwn(){
  const lv=MODES[mode].levels;
  const lvl=S.mastered?rnd(1,3):Math.min(S.streak,2)+1;
  let p,tries=0;do{p=pick(lv[lvl])();tries++;}while(p.gen===ownLastGen&&tries<20);
  ownLastGen=p.gen;return p;
}
function initOwn(){
  shell('own',`<h2>2 · On Your Own</h2><p>No highlights now. Type it on the calculator with Method A or B, press ENTER, then click <b>Check</b>. Get <b>3 in a row</b> to finish this topic (100% complete). Each correct answer moves you up a level: ${MODES[mode].lvlDesc}. If you miss one, you'll see exactly what you should have typed.</p>`,false);
  ownNew();
}
function streakHTML(){let s='';for(let i=0;i<MASTERY;i++) s+=`<span class="sd${i<Math.min(S.streak,MASTERY)?' on':''}"></span>`;return `<div class="streak" aria-label="Streak ${Math.min(S.streak,MASTERY)} of ${MASTERY}">${s}<span>${S.mastered?'Done ✓ 100% complete':'3 in a row finishes this topic'}</span></div>`;}
function ownNew(){
  ownP=genOwn();
  const calc=CALCS.own;calc.reset();calc.guard=null;calc.after=null;
  const p=ownP;
  $('#own-card').innerHTML=`
    <div class="row between"><b>On Your Own</b><span id="own-streak">${streakHTML()}</span></div>
    ${problemHTML(p,'own')}
    <div class="mnote">Type it on the calculator with Method A <span class="code">( top ) ÷ ( bottom )</span> or Method B <span class="code">× top, ÷ each bottom</span>.</div>
    <div id="own-ans">${checkRowHTML('own')}</div>
    <div id="own-fb" aria-live="polite"></div>
    <div id="own-guide" hidden><div class="lbl" id="own-glbl">Buttons to press, in order</div><div class="chiprow" id="own-chips"></div><div class="hint" id="own-hint" aria-live="polite"></div><div id="own-gres"></div></div>`;
  $('#own-check').addEventListener('click',ownCheck);
}
function ownCheck(){
  const calc=CALCS.own,p=ownP;
  const a=calcAnswer(calc,$('#own-fb'));if(!a) return;
  const d=diagnose(p,a.v,a.res,typedKeysOf(calc.core));
  $('#own-ans').querySelectorAll('input,button').forEach(x=>x.disabled=true);
  calc.guard=()=>false;
  if(d.ok){
    S.streak++;S.bestStreak=Math.max(S.bestStreak||0,S.streak);const justMastered=!S.mastered&&S.streak>=MASTERY;
    if(justMastered){S.mastered=true;S.doneAt=Date.now();}
    save();renderTabs();$('#own-streak').innerHTML=streakHTML();
    const nextLvl=S.mastered?'':` Next up: <span class="lvl l${Math.min(S.streak,2)+1}">Level ${Math.min(S.streak,2)+1}</span>`;
    $('#own-fb').innerHTML=`<div class="fb good"><b>✓ Correct!</b> ${readingHTML(p,a.res)}${justMastered?'':'<br>'+nextLvl}</div>`+
      (justMastered?`<div class="banner"><span>🎉 3 in a row! ${MODES[mode].name} is <b>100% complete</b>. Show your teacher the green badge at the top of the screen.</span></div><div class="row end" style="margin-top:8px"><button type="button" class="btn" id="own-next">Keep practicing</button></div>`:
      `<div class="row end" style="margin-top:10px"><button type="button" class="btn primary" id="own-next">Next problem →</button></div>`);
    if(justMastered) window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
  }else{
    S.streak=0;save();$('#own-streak').innerHTML=streakHTML();
    $('#own-fb').innerHTML=`<div class="fb bad"><b>✗ Not quite.</b> ${d.msg}<div style="margin-top:6px">Correct answer: <b>${prettySig(p.answer)} ${p.unit}</b></div></div>${compareHTML(p,calc.core)}
      <div class="row end" style="margin-top:10px"><button type="button" class="btn" id="own-try">Try it with highlights</button><button type="button" class="btn primary" id="own-next">New problem →</button></div>`;
    $('#own-try').addEventListener('click',()=>ownTryGuided(methodOf(typedKeysOf(calc.core))));
  }
  const nx=$('#own-next');nx.addEventListener('click',ownNew);nx.focus({preventScroll:true});
}
function ownTryGuided(M){
  const p=ownP,calc=CALCS.own;
  $('#own-fb').innerHTML='';
  $('#own-guide').hidden=false;
  $('#own-glbl').textContent=`Buttons to press, in order (Method ${M})`;
  runGuided(calc,p,p[M],{chips:$('#own-chips'),da:$('#own-st'),hint:$('#own-hint')},()=>{
    $('#own-hint').innerHTML='<b style="color:var(--good)">✓ That\'s the right order.</b>';
    $('#own-gres').innerHTML=`<div class="caption">${readingHTML(p,calc.core.lastResult)}</div><div class="row end" style="margin-top:10px"><button type="button" class="btn primary" id="own-next2">Now try a new one on your own →</button></div>`;
    const b=$('#own-next2');b.addEventListener('click',ownNew);b.focus({preventScroll:true});
  });
}

/* ---- keyboard ---- */
document.addEventListener('keydown',e=>{
  const tg=e.target;
  if(tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA')) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const calc=CALCS[cur];if(!calc) return;
  const k=e.key;
  if((k==='Enter'||k===' ')&&tg&&tg.tagName==='BUTTON') return;
  // typing calculator keys moves focus off page buttons, so the next Enter goes to the calculator
  if(tg&&tg.tagName==='BUTTON'&&!tg.closest('.calc')&&k.length===1) tg.blur();
  if(/^[0-9]$/.test(k)){e.preventDefault();calc.user(k);return;}
  if(k==='e'||k==='E'){e.preventDefault();calc.user('2nd');calc.user('inv');return;}
  const map={'+':'add','-':'sub','*':'mul','x':'mul','X':'mul','/':'div','^':'pow','(':'lp',')':'rp','.':'.','Enter':'enter','=':'enter','Backspace':'del','Delete':'del','Escape':'clear','n':'neg','N':'neg'};
  if(map[k]){e.preventDefault();calc.user(map[k]);}
});

/* ---- reset ---- */
let resetArmed=false;
$('#resetBtn').addEventListener('click',()=>{
  if(!resetArmed){resetArmed=true;$('#resetBtn').textContent='Click again to erase all progress';setTimeout(()=>{resetArmed=false;$('#resetBtn').textContent='Reset my progress';},4000);return;}
  try{localStorage.removeItem(SKEY);}catch(e){}
  location.reload();
});

/* ---- start ---- */
buildAll();
SECS.forEach(x=>{$('#sec-'+x.id).hidden=(x.id!==cur);});
})();
</script>
